    const dateRaw = r[headerMap['receipt issue date']] ?? r[headerMap['invoice date']] ?? r[headerMap['date']];
    const dateStr = parseImportedDate(dateRaw);
    const receiptKey = headerMap['receipt number'] ? 'receipt number' : (headerMap['invoice number'] ? 'invoice number' : null);
    const receiptNo = receiptKey ? String(r[headerMap[receiptKey]]||'').trim() : '';
    const natureKey = headerMap['nature of goods'] ? 'nature of goods' : (headerMap['description'] ? 'description' : null);
    const nature = natureKey ? String(r[headerMap[natureKey]]||'').trim() : '';
    const customerTin = customerTinKey ? String(r[customerTinKey]||'').trim() : '';
    const total = amountNoVat + vat;

    // Real Customer + Invoice records — not just raw GL lines — so this
    // shows up properly in Accounts Receivable with Record Payment
    // available, exactly like an invoice created by hand.
    const customer = findOrCreateCustomerInList(state.customers, customerName, customerTin);
    const invoiceNo = receiptNo || ('SALE-'+uid().slice(0,5));
    const entryRef = invoiceNo;
    const dueDate = addDays(dateStr, 30);

    state.gl.push({id:uid(), date:dateStr, entry:entryRef, account:'1100', memo:`${customerName}${nature?` — ${nature}`:''}${receiptNo?` (Receipt ${receiptNo})`:''}`, debit:total, credit:0});
    state.gl.push({id:uid(), date:dateStr, entry:entryRef, account:revenueAcct.code, memo:`${revenueAcct.name} — ${customerName}`, debit:0, credit:amountNoVat});
    if(vat>0){
      state.gl.push({id:uid(), date:dateStr, entry:entryRef, account:'2100', memo:`Output VAT — ${customerName}`, debit:0, credit:vat});
    }

    state.invoices = state.invoices || [];
    state.invoices.push({
      id:uid(), invoiceNo, customerId:customer.id, date:dateStr, dueDate,
      lines:[{description: nature||'Sale', qty:1, unitPrice:amountNoVat, account:revenueAcct.code}],
      subtotal:amountNoVat, vat, total, paid:0, entryRef
    });
    customer.invoiced = (Number(customer.invoiced)||0) + total;

    imported++;
  });
  return {imported, skipped, created};
}

// Finds the first header key present in headerMap out of a list of accepted
// synonyms — lets us tolerate slightly different column names/wording
// across different exports of the same underlying report.
function findHeaderKey(headerMap, candidates){
  for(const c of candidates){ if(headerMap[c]) return headerMap[c]; }
  return null;
}

/* ---- Bank Statement Import ----
   Parses an uploaded bank statement export (any bank's own column naming
   is tolerated via findHeaderKey) into staged, reviewable transactions —
   nothing is posted to the GL until the user explicitly does so. Each
   transaction is given a suggested account from the user's own saved
   keyword rules where one matches; unmatched transactions are left for
   manual assignment, never guessed at silently. */
function parseBankStatementFile(rows, headerMap){
  const dateKey = findHeaderKey(headerMap, ['transaction date','date','value date']);
  const descKey = findHeaderKey(headerMap, ['description','narration','details','particulars']);
  const debitKey = findHeaderKey(headerMap, ['debit','withdrawal','withdrawals']);
  const creditKey = findHeaderKey(headerMap, ['credit','deposit','deposits']);
  if(!dateKey || !descKey || (!debitKey && !creditKey)){
    return {error: 'Missing required column(s). Expected a Date, a Description (or Narration/Details), and Debit and/or Credit columns.'};
  }
  const staged = [];
  rows.forEach(row=>{
    const rawDate = row[dateKey];
    const date = parseImportedDate(rawDate);
    const description = String(row[descKey]||'').trim();
    const debit = parseFloat(String(row[debitKey]||'0').replace(/,/g,'')) || 0;
    const credit = parseFloat(String(row[creditKey]||'0').replace(/,/g,'')) || 0;
    if(!date || (!debit && !credit) || !description) return; // skip blank/subtotal rows
    const direction = credit > 0 ? 'credit' : 'debit';
    const amount = credit > 0 ? credit : debit;
    staged.push({id: uid(), date, description, amount, direction, accountCode: suggestBankRuleAccount(description)});
  });
  return {staged};
}

// PDF path for Bank Statement Import — separate from the CSV/Excel path
// above, and deliberately NOT sharing code with the existing PDF
// extraction used by Bank Reconciliation (extractBankStatementFromPDF),
// so this can't ever regress that already-working feature. Wraps its own
// pdf.js text extraction (extractPdfRowsForBankImport, further below)
// with a genuine check for scanned/image PDFs (rejected outright, since
// guessing at those would silently produce garbage) and tags every
// resulting row as PDF-extracted, since text pulled from a PDF's visual
// layout is inherently less reliable than a real CSV/Excel column and
// deserves closer review before posting.

// Text-only fallback for Bank Statement Import PDFs — used only when
// parseBankStatementRowsForImport (below) can't find a Debit/Credit
// header on the page to anchor column positions to. Collects every
// numeric token on the line and always treats the LAST one as the
// running Balance (virtually every real statement layout ends each line
// with one) before interpreting whatever comes before it: two numbers
// left over means separate Debit/Credit columns (whichever is nonzero is
// the real transaction); one number left over means a single signed
// Amount column, where a leading "-" or parentheses says debit vs
// credit. This is a last resort — parseBankStatementRowsForImport's
// column-position matching is far more reliable whenever a header row is
// present, since it reads the actual Debit/Credit column each figure sits
// under instead of guessing from how many numbers appear on the line.
function parseBankStatementTextForImport(rawText){
  const lines = String(rawText||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const dateRegex = /^(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})/;
  const amountRegex = /\(?-?\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?\)?|\(?-?\d+\.\d{1,2}\)?/g;
  const transactions = [];
  lines.forEach(line=>{
    const dateMatch = line.match(dateRegex);
    if(!dateMatch) return;
    const dateStr = parseImportedDate(dateMatch[1]);
    if(!dateStr) return;
    let rest = line.slice(dateMatch[0].length).trim();
    // Many statements repeat a second "Value Date" column right after
    // the transaction date — strip it too if present, so it doesn't end
    // up embedded redundantly in the description text.
    const valueDateMatch = rest.match(dateRegex);
    if(valueDateMatch) rest = rest.slice(valueDateMatch[0].length).trim();
    const amountMatches = [...rest.matchAll(amountRegex)];
    if(amountMatches.length < 2) return; // need at least an Amount and a running Balance to tell them apart
    const nums = amountMatches.map(m=>parseAmountToken(m[0]));
    // Drop the trailing running-Balance figure — always the last number —
    // and interpret whatever's left.
    const remaining = nums.slice(0, -1);
    const description = (rest.indexOf(amountMatches[0][0])>0 ? rest.slice(0, rest.indexOf(amountMatches[0][0])) : '').trim() || 'Transaction';
    if(remaining.length>=2){
      // Separate Debit/Credit columns (take the last two before Balance,
      // in case an extra number slipped in earlier on the line).
      const [debit, credit] = remaining.slice(-2);
      if(credit > 0) transactions.push({id:uid(), date:dateStr, description, amount:credit, direction:'credit'});
      else if(debit > 0) transactions.push({id:uid(), date:dateStr, description, amount:Math.abs(debit), direction:'debit'});
    } else if(remaining.length===1){
      // A single signed Amount column — its sign says the direction, not
      // its position, and never the Balance that follows it.
      const amt = remaining[0];
      if(amt===0) return;
      transactions.push({id:uid(), date:dateStr, description, amount:Math.abs(amt), direction: amt>0 ? 'credit' : 'debit'});
    }
  });
  return transactions;
}

// Primary parser for Bank Statement Import PDFs — works from the actual
// per-page rows (each row: text fragments with their x position on the
// page, as pdf.js reports them) rather than flattened text, so it can
// read a genuine Debit column and a genuine Credit column exactly like a
// human would: by WHERE each figure sits on the page, never by counting
// how many numbers appear on the line or guessing from a plus/minus sign.
// This is what makes a statement whose unused Debit/Credit cell is left
// truly blank (common on RWF bank statements) behave exactly like one
// that prints an explicit "0.00" there (common on USD statements): either
// way, whichever figure sits under the Debit header is money out, and
// whichever sits under the Credit header is money in — the running
// Balance column is identified and ignored the same way, by position,
// never mistaken for a transaction amount.
// Each fragment pdf.js hands back already carries its own on-page x
// position, so figures are matched one fragment at a time against the
// Debit/Credit/Balance column positions — never by scanning a shared
// block of row text — which is what lets a small, plainly-printed figure
// like a 50 RWF bank charge (no comma grouping, no decimal point) be
// recognized as a real amount: it's still told apart from an unrelated
// bare-integer reference number (a Tran Id or Cheque ID) because that
// number sits in a different column, further from every known amount
// column than the tolerance below allows.
// Falls back to the text-only heuristic above only when no row on the
// page names both a Debit/Withdrawal and a Credit/Deposit column, since
// then there's no column position to anchor to.
function parseBankStatementRowsForImport(pageRows){
  const dateRegex = /^(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})$/;
  // A figure can be comma-grouped and/or carry a decimal (12,000.00) or
  // be a completely bare integer (50) — accepting the bare form is safe
  // here because it's checked against its OWN fragment and x position,
  // not against a shared line of text where a bare number could be
  // anything.
  const amountTokenRegex = /^\(?-?\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?\)?$/;

  let debitX=null, creditX=null, balanceX=null;
  for(const row of pageRows){
    let fd=null, fc=null, fb=null;
    row.forEach(tok=>{
      const s = String(tok.str).toLowerCase();
      if(fd==null && /\b(debit|withdrawal|withdrawals)\b/.test(s)) fd = tok.x;
      if(fc==null && /\b(credit|deposit|deposits)\b/.test(s)) fc = tok.x;
      if(fb==null && /\bbalance\b/.test(s)) fb = tok.x;
    });
    if(fd!=null && fc!=null){ debitX=fd; creditX=fc; balanceX=fb; break; }
  }

  if(debitX==null || creditX==null){
    const flatText = pageRows.map(row=>row.map(f=>f.str).join(' ')).join('\n');
    return parseBankStatementTextForImport(flatText);
  }

  // How close a numeric fragment must sit to a known amount column to be
  // trusted as belonging to it — half the gap between the known columns
  // themselves, so a reference number in some other column (Tran Id,
  // Cheque ID, ...) sitting a full column-width away is never close
  // enough to be pulled in, while ordinary column-alignment jitter in a
  // real Debit/Credit/Balance figure still is.
  const knownX = [debitX, creditX, balanceX].filter(x=>x!=null).sort((a,b)=>a-b);
  let minGap = Infinity;
  for(let i=1;i<knownX.length;i++) minGap = Math.min(minGap, knownX[i]-knownX[i-1]);
  const TOLERANCE = (isFinite(minGap) && minGap>0) ? minGap/2 : 40;

  const transactions = [];
  pageRows.forEach(row=>{
    if(!row.length) return;
    const dateMatch = String(row[0].str).trim().match(dateRegex);
    if(!dateMatch) return;
    const dateStr = parseImportedDate(dateMatch[1]);
    if(!dateStr) return;

    let idx = 1;
    // Skip an optional second date column (Value Date) immediately after.
    if(row[idx] && dateRegex.test(String(row[idx].str).trim())) idx++;

    const descParts = [];
    let debit=0, credit=0;
    for(; idx<row.length; idx++){
      const s = String(row[idx].str).trim();
      if(!s) continue;
      if(amountTokenRegex.test(s)){
        const x = row[idx].x;
        const dDebit = Math.abs(x-debitX), dCredit = Math.abs(x-creditX);
        const dBalance = balanceX!=null ? Math.abs(x-balanceX) : Infinity;
        const nearest = Math.min(dDebit, dCredit, dBalance);
        // Not close enough to any known amount column at all — most
        // likely a reference number (Tran Id, Cheque ID) in its own
        // column. Leave it out of both the amounts and the description.
        if(nearest > TOLERANCE) continue;
        if(dBalance<=dDebit && dBalance<=dCredit) continue; // the running Balance — ignore
        const val = Math.abs(parseAmountToken(s));
        if(val===0) continue; // an explicit 0.00 in the unused cell
        if(dDebit<=dCredit) debit=val; else credit=val;
      } else {
        descParts.push(s);
      }
    }
    const description = descParts.join(' ').trim() || 'Transaction';
    if(credit>0) transactions.push({id:uid(), date:dateStr, description, amount:credit, direction:'credit'});
    else if(debit>0) transactions.push({id:uid(), date:dateStr, description, amount:debit, direction:'debit'});
  });
  return transactions;
}

// Reads a statement PDF's text AND each fragment's page position (pdf.js
// reports both), grouped into rows by y-coordinate and sorted left to
// right — feeds parseBankStatementRowsForImport, which needs the real
// column positions, and (flattened to plain text) the scanned/image-PDF
// check in parseBankStatementPdf below.
async function extractPdfRowsForBankImport(file){
  if(typeof pdfjsLib === 'undefined'){
    throw new Error('PDF library did not load — check your internet connection and reload the page.');
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const allRows = [];
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const rowsByY = {};
    content.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      if(!rowsByY[y]) rowsByY[y] = [];
      rowsByY[y].push({x:item.transform[4], str:item.str});
    });
    const sortedY = Object.keys(rowsByY).map(Number).sort((a,b)=>b-a);
    sortedY.forEach(y=>{
      allRows.push(rowsByY[y].sort((a,b)=>a.x-b.x));
    });
  }
  return allRows;
}

async function parseBankStatementPdf(file){
  const rows = await extractPdfRowsForBankImport(file);
  const fullText = rows.map(row=>row.map(f=>f.str).join(' ')).join('\n');
  // A digitally-generated statement PDF yields a substantial amount of
  // real text; a scanned/photographed one yields little to nothing,
  // since there's no actual text layer to extract — just an image. This
  // threshold is deliberately generous (a real one-page statement is
  // thousands of characters) so it only catches genuinely empty results,
  // not just a short statement.
  if(fullText.trim().length < 100){
    return {error: 'This looks like a scanned or photographed PDF — there\'s no readable text in it to extract. Only digitally-generated statement PDFs (the kind your bank emails or exports directly, not a scan of a printed copy) can be read automatically. Please upload the original digital PDF, or export as CSV/Excel from your bank instead.'};
  }
  const parsed = parseBankStatementRowsForImport(rows);
  const staged = parsed.map(t=>({
    id: t.id, date: t.date, description: t.description,
    amount: t.amount, direction: t.direction,
    accountCode: suggestBankRuleAccount(t.description),
    fromPdf: true
  }));
  if(staged.length===0){
    return {error: 'Found readable text in this PDF, but couldn\'t identify any transaction lines in it — the layout may be too different from what this can parse. Try exporting as CSV or Excel from your bank instead, if that\'s available.'};
  }
  return {staged};
}

// Finds the client's own "Funds Held for a Client" account by name (case-
// insensitive) if one exists in their Chart of Accounts. This business
// holds bank funds on behalf of clients rather than treating every deposit
// as its own income, so by agreed policy that's the default counterpart
// account for a bank-imported transaction — pre-filled, never forced: any
// row can still be reassigned before posting (a genuine bank charge, for
// instance, should be moved to its own expense account).
function fundsHeldAccountCode(){
  const acct = state.accounts.find(a=>/funds\s*held/i.test(a.name));
  return acct ? acct.code : null;
}

// Checks the client's own saved rules (built up over time as they correct
// imports) for a keyword that appears in this transaction's description —
// case-insensitive substring match, first rule that matches wins. Falls
// back to "Funds Held for a Client" (see above) when no rule matches and
// that account exists; otherwise returns null, same as before, so it's
// obvious on the review screen which transactions still need a human
// decision.
function suggestBankRuleAccount(description){
  const d = description.toLowerCase();
  const rule = (state.bankRules||[]).find(r=> r.keyword && d.includes(r.keyword.toLowerCase()));
  if(rule) return rule.accountCode;
  return fundsHeldAccountCode();
}

// True when a bank/cash account's own name is consistent with the given
// transaction currency — a foreign-currency import (e.g. "USD") should
// name-match an account like "Bank Account (USD)", while a base-currency
// import should NOT match an account named after any OTHER configured
// foreign currency. Used only to warn on an apparent mismatch before
// posting (e.g. picking "Bank Account (RWF)" while the currency dropdown
// is still set to USD) — never to block a deliberate, correctly-named
// account choice this can't anticipate.
function accountMatchesCurrency(acct, currencyCode){
  if(!acct) return true;
  const name = acct.name.toLowerCase();
  const foreignCodes = (state.currencies||[]).filter(c=>!c.base).map(c=>c.code.toLowerCase());
  if(currencyCode) return name.includes(String(currencyCode).toLowerCase());
  return !foreignCodes.some(code=>name.includes(code));
}

// Posts one staged transaction as a proper double-entry GL line: the bank
// account on one side, the user-assigned (or rule-suggested) account on
// the other. Handles foreign currency the same way the rest of the app
// does — original amount/currency/rate stored alongside the converted RWF
// figure — so a USD statement import shows up correctly everywhere,
// including the Balance Sheet's native-currency display.
function postBankStagingEntry(stagingRow){
  const bankAcct = state.accounts.find(a=>a.code===stagingRow.bankAccountCode);
  const otherAcct = state.accounts.find(a=>a.code===stagingRow.accountCode);
  if(!bankAcct || !otherAcct) return false;
  const isBase = !stagingRow.currency || stagingRow.currency===baseCurrencyCode();
  const rwfAmount = isBase ? stagingRow.amount : stagingRow.amount * (Number(stagingRow.fxRate)||1);
  const ref = 'BANKIMP-' + stagingRow.id.slice(0,8);
  // "direction" is the bank statement's own Debit/Credit column (money
  // out vs in) — money OUT credits the bank account (an asset decreasing)
  // and debits the other side; money IN does the reverse. originalDebit/
  // originalCredit must follow each LINE's own actual debit/credit side,
  // not the statement direction directly — getting that backwards was
  // the actual bug: it put the USD figure on the wrong side of the bank
  // line, so the edit screen showed both the USD and RWF amounts
  // scrambled onto one line instead of the real, balanced pair.
  const bankIsCredited = stagingRow.direction==='debit'; // money left the bank
  const bankLine = {
    id:uid(), date:stagingRow.date, account:bankAcct.code,
    debit: bankIsCredited ? 0 : rwfAmount,
    credit: bankIsCredited ? rwfAmount : 0,
    memo:stagingRow.description, entry:ref,
    ...(isBase ? {} : {
      currency: stagingRow.currency, fxRate: stagingRow.fxRate,
      originalDebit: bankIsCredited ? undefined : stagingRow.amount,
      originalCredit: bankIsCredited ? stagingRow.amount : undefined
    })
  };
  const otherLine = {
    id:uid(), date:stagingRow.date, account:otherAcct.code,
    debit: bankIsCredited ? rwfAmount : 0,
    credit: bankIsCredited ? 0 : rwfAmount,
    memo:stagingRow.description, entry:ref,
    ...(isBase ? {} : {
      currency: stagingRow.currency, fxRate: stagingRow.fxRate,
      originalDebit: bankIsCredited ? stagingRow.amount : undefined,
      originalCredit: bankIsCredited ? undefined : stagingRow.amount
    })
  };
  state.gl.push(bankLine, otherLine);
  return true;
}

// One-time repair for any bank-import GL lines (entry starts with
// "BANKIMP-") posted before the originalDebit/originalCredit fix. Two
// distinct problems from that earlier code, both repaired here: the
// bank line's reference amount was tagged to the wrong side (e.g.
// originalCredit set on a line whose real debit/credit is actually
// debited), and the counterpart line (the other account in the pair)
// was missing currency/fxRate/original amounts entirely. Neither
// affected the real, underlying debit/credit RWF figures the Income
// Statement, Balance Sheet, and Trial Balance actually use — only what
// showed up when opening the entry to edit it. Grouped by entry ref so
// a line missing its own currency/fxRate can borrow it from its sibling
// line in the same transaction.
function repairBankImportCurrencyFields(dryRun){
  let fixed = 0;
  const groups = {};
  state.gl.forEach(l=>{
    if(!l.entry || !l.entry.startsWith('BANKIMP-')) return;
    (groups[l.entry] = groups[l.entry]||[]).push(l);
  });
  Object.values(groups).forEach(lines=>{
    const withCurrency = lines.find(l=>l.currency && l.fxRate);
    if(!withCurrency) return; // a base-currency (RWF) import — nothing to repair
    lines.forEach(l=>{
      let changed = false;
      const currency = l.currency || withCurrency.currency;
      const rate = Number(l.fxRate || withCurrency.fxRate)||1;
      if(!l.currency) changed = true;
      if(l.debit>0){
        const correctOriginal = Math.round((l.debit/rate)*100)/100;
        if(l.originalDebit!==correctOriginal || l.originalCredit!=null) changed = true;
      } else if(l.credit>0){
        const correctOriginal = Math.round((l.credit/rate)*100)/100;
        if(l.originalCredit!==correctOriginal || l.originalDebit!=null) changed = true;
      }
      if(changed){
        fixed++;
        if(!dryRun){
          l.currency = currency; l.fxRate = rate;
          if(l.debit>0){ l.originalDebit = Math.round((l.debit/rate)*100)/100; l.originalCredit = undefined; }
          else if(l.credit>0){ l.originalCredit = Math.round((l.credit/rate)*100)/100; l.originalDebit = undefined; }
        }
      }
    });
  });
  if(!dryRun && fixed>0) saveState();
  return fixed;
}

function baseCurrencyCode(){
  const base = (state.currencies||[]).find(c=>c.base);
  return base ? base.code : 'RWF';
}

/* ---- BNR Exchange Rate History ----
   A per-date table of the official AVERAGE (mid) rate, uploaded from
   BNR's own published export — deliberately never the buying or selling
   rate, per how this was asked to work. Any foreign-currency transaction
   looks its own date up here, rather than one flat rate being applied
   across a whole batch regardless of when each transaction actually
   happened. */
function parseExchangeRateHistoryFile(rows, headerMap, currency){
  const dateKey = findHeaderKey(headerMap, ['date']);
  let avgKey = findHeaderKey(headerMap, ['average','average rate','mid','mid rate','average(mid)']);
  // Fall back to a loose match — any header containing "aver" or "mid"
  // but not "buy"/"sell" — so a real-world typo like BNR's own "Averate
  // rate" (missing a letter) is still recognized, rather than requiring
  // an exact spelling this format was never guaranteed to have.
  if(!avgKey){
    const loose = Object.keys(headerMap).find(h=> (h.includes('aver') || h.includes('mid')) && !h.includes('buy') && !h.includes('sell'));
    if(loose) avgKey = headerMap[loose];
  }
  if(!dateKey || !avgKey){
    return {error: 'Missing required column(s). Expected a Date column and an Average (or Mid) column — Buying and Selling columns, if present, are simply ignored.'};
  }
  const entries = [];
  rows.forEach(row=>{
    const date = parseImportedDate(row[dateKey]);
    const rate = parseAmountToken(String(row[avgKey]||''));
    if(!date || !(rate>0)) return;
    entries.push({date, currency, rate});
  });
  return {entries};
}

// Exact date match if one exists; otherwise carries forward the most
// recent earlier date's rate — matching BNR's own convention for
// weekends and holidays, when no new rate is published. Returns null
// (never a guess) only when there's genuinely no rate on or before the
// requested date at all.
function lookupExchangeRate(currency, date){
  const rows = (state.exchangeRateHistory||[]).filter(r=>r.currency===currency && r.date<=date);
  if(rows.length===0) return null;
  rows.sort((a,b)=> b.date.localeCompare(a.date));
  return rows[0].rate;
}

/* ---- Other Expenses (Unsupported): Rwanda RRA's "non-EBM purchase"
   declaration format, for expenses paid to suppliers who didn't issue a
   proper EBM receipt — Transaction Reference, TIN, Date of Purchase, Date
   of Payment, Nature of Goods/Services, Category, Supplier's Name, Country
   of Origin, Value of Goods/Services, Internal Reference, Payment
   Mode/Reference, Supplier's Phone Number, Supplier's Email. Since there's
   no compliant tax invoice, no VAT input is claimed — the full value posts
   straight to an expense account, paid directly (no Accounts Payable). ---- */
function importFormatUnsupportedExpenses(rows, headerMap){
  const kSupplier = findHeaderKey(headerMap, ["supplier's name","supplier name"]);
  const kValue = findHeaderKey(headerMap, ['value of goods/services','value of goods/service','amount','value']);
  const kDatePay = findHeaderKey(headerMap, ['date of payment','payment date']);
  const kDatePurchase = findHeaderKey(headerMap, ['date of purchase','purchase date','date']);
  const kNature = findHeaderKey(headerMap, ['nature of goods/services','nature of goods/service','nature of goods','description']);
  const kCategory = findHeaderKey(headerMap, ['category']);
  const kTxnRef = findHeaderKey(headerMap, ['transaction reference','transaction ref','reference']);
  const kPayMode = findHeaderKey(headerMap, ['payment mode/reference','payment mode','payment reference']);

  let imported=0, skipped=0;
  const created=[];
  rows.forEach(r=>{
    const supplier = kSupplier ? String(r[kSupplier]||'').trim() : '';
    const amount = kValue ? parseNum(r[kValue]) : 0;
    if(!supplier || !amount){ skipped++; return; }
    const dateRaw = (kDatePay && r[kDatePay]) || (kDatePurchase && r[kDatePurchase]);
    const dateStr = parseImportedDate(dateRaw);
    const category = kCategory ? String(r[kCategory]||'').trim() : '';
    const nature = kNature ? String(r[kNature]||'').trim() : '';
    const acctName = category || nature || 'Unsupported Expenses';
    const expenseAcct = findOrCreateAccountByName(acctName, created);
    const txnRef = kTxnRef ? String(r[kTxnRef]||'').trim() : '';
    const entryRef = txnRef || ('EXP-'+uid().slice(0,5));
    const payMode = kPayMode ? String(r[kPayMode]||'').trim() : '';
    const memo = [supplier, nature].filter(Boolean).join(' — ') + (txnRef?` (Ref ${txnRef})`:'');

    state.gl.push({id:uid(), date:dateStr, entry:entryRef, account:expenseAcct.code, memo, debit:amount, credit:0});
    state.gl.push({id:uid(), date:dateStr, entry:entryRef, account:'1010', memo:`Payment to ${supplier}${payMode?': '+payMode:''}`, debit:0, credit:amount});

    const vendor = findOrCreateVendorInList(state.vendors, supplier);
    vendor.invoiced = (Number(vendor.invoiced)||0) + amount;
    vendor.paid = (Number(vendor.paid)||0) + amount; // paid immediately, not left on Accounts Payable

    imported++;
  });
  return {imported, skipped, created};
}

// Splits a flat run of GL lines back into separate balanced transactions
// — walks through in order, accumulating a running group, and closes it
// the moment its debit total equals its credit total (the same natural
// boundary every real transaction has, one debit matched by one or more
// credits or vice versa). Used both to repair data that got merged into
// one oversized group by mistake, and as a safety net inside the import
// itself when no explicit "Total for" marker rows are found in the
// source file to split on.
function splitIntoBalancedTransactions(lines){
  const groups = [];
  let current = [], runDebit = 0, runCredit = 0;
  lines.forEach(l=>{
    current.push(l);
    runDebit += Number(l.debit)||0;
    runCredit += Number(l.credit)||0;
    if(current.length>0 && (runDebit>0||runCredit>0) && Math.abs(runDebit-runCredit)<0.01){
      groups.push(current);
      current = []; runDebit = 0; runCredit = 0;
    }
  });
  if(current.length>0) groups.push(current); // leftover that never balanced — kept, not dropped, so nothing goes missing
  return groups;
}

// One-time repair for entries that got merged into one oversized group by
// the bug above (or any similarly-misgrouped import) — re-splits them
// using the same balanced-transaction logic and gives each resulting
// transaction its own unique entry reference. Never touches entries that
// are already a normal size.
function repairOversizedGLGroups(threshold){
  threshold = threshold || 6;
  const byRef = {};
  state.gl.forEach(l=>{ (byRef[l.entry] = byRef[l.entry]||[]).push(l); });
  let fixedGroups = 0, newTransactions = 0;
  Object.keys(byRef).forEach(ref=>{
    const lines = byRef[ref];
    if(lines.length <= threshold) return;
    const sorted = [...lines].sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));
    const groups = splitIntoBalancedTransactions(sorted);
    if(groups.length <= 1) return; // couldn't find natural boundaries — leave it alone rather than guess
    groups.forEach((g, i)=>{
      const newRef = `${ref}-${String(i+1).padStart(4,'0')}`;
      g.forEach(l=>{ l.entry = newRef; });
    });
    fixedGroups++;
    newTransactions += groups.length;
  });
  if(fixedGroups>0) saveState();
  return {fixedGroups, newTransactions};
}

/* ---- Format C: grouped journal export (Transaction date, Transaction type,
   Name, Description, Account Name, Debit, Credit) with "Total for N" rows
   separating each journal entry's lines — same shape as many QuickBooks-style
   general ledger exports. ---- */
function importFormatGroupedJournal(rows, headerMap){
  let imported=0, skipped=0;
  const created=[];
  let groupNum=0, buffer=[];
  let foundExplicitMarker = false;

  function flush(linesOverride){
    const lines = linesOverride || buffer;
    if(lines.length===0) return;
    groupNum++;
    const ref = 'JE-IMP-'+groupNum;
    lines.forEach(line=>{
      const acct = findOrCreateAccountByName(line.acctName, created);
      if(!acct){ skipped++; return; }
      state.gl.push({id:uid(), date:line.date, entry:ref, account:acct.code, memo:line.memo, debit:line.debit, credit:line.credit});
      imported++;
    });
    if(!linesOverride) buffer=[];
  }

  rows.forEach(r=>{
    const isTotalRow = Object.values(r).some(v=>String(v).toLowerCase().includes('total for'));
    if(isTotalRow){ foundExplicitMarker = true; flush(); return; }
    const dateRaw = r[headerMap['transaction date']];
    const acctName = String(r[headerMap['account name']]||'').trim();
    const debit = parseNum(r[headerMap['debit']]);
    const credit = parseNum(r[headerMap['credit']]);
    const isRealRow = dateRaw && acctName && (debit||credit);
    if(!isRealRow) return; // structural row (group-number-only line, blank spacer) — skip without flushing
    const memo = String(r[headerMap['description']] || r[headerMap['name']] || '').trim();
    buffer.push({date: parseImportedDate(dateRaw), acctName, memo, debit, credit});
  });

  if(!foundExplicitMarker && buffer.length>0){
    // No "Total for" rows were found anywhere in the file — rather than
    // dump the entire import into one oversized group (which is exactly
    // what used to happen here), fall back to detecting each
    // transaction's natural boundary from where debits and credits
    // actually balance, one transaction at a time.
    splitIntoBalancedTransactions(buffer).forEach(g=> flush(g));
    buffer = [];
  } else {
    flush(); // trailing group with no following "Total for" row
  }

  return {imported, skipped, created};
}

function detectImportFormat(headerMap){
  if(headerMap['account name'] && headerMap['transaction date']) return 'grouped';
  if(headerMap['supplier name'] && headerMap['amount without vat']) return 'purchase';
  if(headerMap['date'] && headerMap['account'] && headerMap['debit'] && headerMap['credit']) return 'journal';
  return null;
}

function handleGLImportFile(file, mode){
  mode = mode || 'journal';
  if(typeof XLSX === 'undefined'){ alert('Import library did not load — check your internet connection and reload the page.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      // cellDates deliberately NOT enabled, and raw:true is set: without
      // this, SheetJS auto-detects date-like text (even plain CSV text, or
      // a TEXT-formatted column in an .xlsx file) and silently converts it
      // to a serial number using its own MM/DD/YYYY heuristic — corrupting
      // a DD/MM/YYYY date like "01/02/2026" (1 February) into January 2nd
      // before our own DD/MM/YYYY-aware parseImportedDate() ever runs.
      // raw:true keeps text cells as plain strings, and genuine Excel-native
      // date cells still come through correctly as their (unambiguous)
      // serial number, which parseImportedDate()'s numeric branch handles.
      const wb = XLSX.read(data, {type:'array', raw:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(rows.length===0){ alert('No rows found in that file.'); return; }

      const headerMap = buildHeaderMap(rows[0]);
      let result, formatLabel;

      if(mode==='sales'){
        const missing = ['customer name','amount without vat'].filter(r=>!headerMap[r]);
        if(missing.length){
          alert('Missing required column(s) for Sales import: ' + missing.join(', ') + '.\n\n'
            + 'Expected columns (any order, case-insensitive): Customer TIN, Customer name, Nature of Goods, Receipt number (or Invoice number), Receipt issue date (or Invoice date), Amount without VAT, VAT.');
          return;
        }
        result = importFormatSalesReceipts(rows, headerMap);
        formatLabel = 'Sales';
      } else if(mode==='purchases'){
        const missing = ['supplier name','amount without vat'].filter(r=>!headerMap[r]);
        if(missing.length){
          alert('Missing required column(s) for Purchases import: ' + missing.join(', ') + '.\n\n'
            + 'Expected columns (any order, case-insensitive): Supplier TIN, Supplier name, Nature of Goods, Receipt number, Receipt issue date, Amount without VAT, VAT.');
          return;
        }
        result = importFormatPurchaseReceipts(rows, headerMap);
        formatLabel = 'Purchases';
      } else if(mode==='unsupported'){
        const hasSupplier = !!findHeaderKey(headerMap, ["supplier's name","supplier name"]);
        const hasValue = !!findHeaderKey(headerMap, ['value of goods/services','value of goods/service','amount','value']);
        const missing = [];
        if(!hasSupplier) missing.push("Supplier's Name");
        if(!hasValue) missing.push('Value of Goods/Services');
        if(missing.length){
          alert('Missing required column(s) for Other Expenses import: ' + missing.join(', ') + '.\n\n'
            + 'Expected columns (any order, case-insensitive): Transaction Reference, TIN, Date of Purchase, Date of Payment, Nature of Goods/Services, Category, Supplier\'s Name, Country of Origin, Value of Goods/Services, Internal Reference, Payment Mode/Reference, Supplier\'s Phone Number, Supplier\'s Email.');
          return;
        }
        result = importFormatUnsupportedExpenses(rows, headerMap);
        formatLabel = 'Other Expenses (Unsupported)';
      } else {
        const format = detectImportFormat(headerMap);
        if(!format){
          alert('Could not recognize this file\'s columns. Supported formats:\n\n'
            + '1) Journal: Date, Account, Memo, Debit, Credit, Entry (optional)\n'
            + '2) Purchase Receipts: Supplier TIN, Supplier name, Nature of Goods, Receipt number, Receipt issue date, Amount without VAT, VAT\n'
            + '3) Grouped Journal: Transaction date, Transaction type, Name, Description, Account Name, Debit, Credit (with "Total for N" rows between entries)\n\n'
            + 'Tip: if this is a sales or purchases file, choose "Sales" or "Purchases" from the Import As dropdown instead of Journal Entry.');
          return;
        }
        if(format==='journal'){ result = importFormatJournal(rows, headerMap); formatLabel = 'Journal'; }
        else if(format==='purchase'){ result = importFormatPurchaseReceipts(rows, headerMap); formatLabel = 'Purchase Receipts'; }
        else { result = importFormatGroupedJournal(rows, headerMap); formatLabel = 'Grouped Journal'; }
      }

      saveState();
      renderMain();
      let msg = `Imported ${result.imported} line(s) (format: ${formatLabel}).`;
      if(result.skipped){
        if(result.skippedBlank !== undefined){
          const noAmount = result.skippedNoAmount || [];
          if(result.skippedBlank) msg += `\nIgnored ${result.skippedBlank} subtotal/blank row(s) between entries — expected, not a problem.`;
          if(noAmount.length){
            msg += `\n\n${noAmount.length} row(s) named an account but had no Debit or Credit amount, so they were skipped:`;
            noAmount.slice(0,10).forEach(x=> msg += `\n  • Row ${x.row}: "${x.account}"${x.date?` (${x.date})`:''}${x.name?` — ${x.name}`:''}`);
            if(noAmount.length>10) msg += `\n  …and ${noAmount.length-10} more.`;
            msg += `\n\nCheck whether these should have an amount and re-enter them if so.`;
          }
        } else {
          msg += `\nSkipped ${result.skipped} row(s) — missing data or an account that couldn't be matched.`;
        }
      }
      if(result.created.length) msg += `\n\nAuto-created ${result.created.length} new account(s) not found in your Chart of Accounts (codes ${result.created.map(a=>a.code).join(', ')}) — please review their Type in Chart of Accounts, since it was guessed from the account name.`;
      alert(msg);
    }catch(err){
      console.error(err);
      alert("Could not read that file. Make sure it's a valid CSV or Excel file in one of the supported formats.");
    }
  };
  reader.onerror = ()=> alert('Could not read that file.');
  reader.readAsArrayBuffer(file);
}

function recalcJETotals(){
  const totalDebit = glEntryDraft.lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
  const totalCredit = glEntryDraft.lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  const diff = totalDebit - totalCredit;
  const balanced = Math.abs(diff) < 0.005 && totalDebit > 0;
  const dEl = document.getElementById('jeTotalDebit'); if(dEl) dEl.textContent = fmt(totalDebit);
  const cEl = document.getElementById('jeTotalCredit'); if(cEl) cEl.textContent = fmt(totalCredit);
  const statusEl = document.getElementById('jeBalanceStatus');
  if(statusEl){
    statusEl.style.color = balanced ? 'var(--ledger-green-dk)' : 'var(--ink-red)';
    statusEl.textContent = balanced ? '✓ Balanced' : (totalDebit===0 && totalCredit===0 ? 'Enter amounts to begin' : '⚠ Out of balance by '+fmt(Math.abs(diff)));
  }
  const saveBtn = document.getElementById('jeSaveBtn');
  if(saveBtn) saveBtn.disabled = !balanced;
}

function wireGLEvents(){
  const glRepairGroupsBtn = document.getElementById('glRepairGroupsBtn');
  if(glRepairGroupsBtn) glRepairGroupsBtn.onclick = ()=>{
    if(!confirm('Split these merged entries back into separate transactions wherever debits and credits naturally balance? Each resulting transaction gets its own reference. No amounts, accounts, or dates change — only how the lines are grouped. This cannot be undone.')) return;
    const result = repairOversizedGLGroups(6);
    renderMain();
    if(result.fixedGroups===0){ alert("Couldn't find clean balance points to split on — nothing was changed. This can happen if the merged lines don't cleanly divide into balanced transactions."); return; }
    alert(`Done — ${result.fixedGroups} merged entr${result.fixedGroups===1?'y was':'ies were'} split into ${result.newTransactions} separate transaction${result.newTransactions===1?'':'s'}.`);
  };
  const glMoveAcctBtn = document.getElementById('glMoveAcctBtn');
  if(glMoveAcctBtn) glMoveAcctBtn.onclick = ()=>{
    const fromCode = document.getElementById('glMoveFromAcct').value;
    const toCode = document.getElementById('glMoveToAcct').value;
    if(!fromCode || !toCode){ alert('Select both a "From" and a "To" account.'); return; }
    if(fromCode===toCode){ alert('Pick two different accounts — this one is already the same on both sides.'); return; }
    const stats = accountLineStats(fromCode);
    if(stats.count===0){ alert(`${acctName(fromCode)} has no transactions to move.`); return; }
    if(!confirm(`Move all ${stats.count} transaction line(s) currently posted to "${acctName(fromCode)}" (net ${fmt(stats.net)}) over to "${acctName(toCode)}"?\n\nDates, memos, and amounts are unchanged — only the account each line hits will change. This cannot be undone.`)) return;
    const moved = reassignAccountLines(fromCode, toCode);
    renderMain();
    alert(`Moved ${moved} transaction line(s) from "${acctName(fromCode)}" to "${acctName(toCode)}".`);
  };
  const glApply = document.getElementById('glApplyDates');
  if(glApply) glApply.onclick = ()=>{
    glFrom = document.getElementById('glFromInput').value;
    glTo = document.getElementById('glToInput').value;
    glPreset = 'custom';
    renderMain();
  };
  const glClear = document.getElementById('glClearDates');
  if(glClear) glClear.onclick = ()=>{
    glFrom = ''; glTo = ''; glPreset = 'all_time';
    renderMain();
  };
  const glViewByAccountBtn = document.getElementById('glViewByAccountBtn');
  if(glViewByAccountBtn) glViewByAccountBtn.onclick = ()=>{ glViewMode = 'byAccount'; renderMain(); };
  const glViewListBtn = document.getElementById('glViewListBtn');
  if(glViewListBtn) glViewListBtn.onclick = ()=>{ glViewMode = 'list'; renderMain(); };
  const glAccountSearchInput = document.getElementById('glAccountSearchInput');
  if(glAccountSearchInput) glAccountSearchInput.oninput = ()=>{
    const q = glAccountSearchInput.value.trim().toLowerCase();
    const emptyMsg = document.getElementById('glAccountSearchEmpty');
    let visibleCount = 0;
    document.querySelectorAll('#glByAccountScroll table[data-account-search]').forEach(tbl=>{
      const match = !q || tbl.getAttribute('data-account-search').includes(q);
      tbl.style.display = match ? '' : 'none';
      if(match) visibleCount++;
    });
    if(emptyMsg) emptyMsg.style.display = (q && visibleCount===0) ? 'block' : 'none';
  };
  document.querySelectorAll('[data-gl-open]').forEach(row=>{
    row.onclick = ()=>{
      startGLGroupEdit(row.getAttribute('data-gl-open'));
      const box = document.getElementById('mainArea') || document.querySelector('.view.active') || document.body;
      box.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });

  const taxReconFromInput = document.getElementById('taxReconFrom');
  const taxReconToInput = document.getElementById('taxReconTo');
  const taxReconFilterSelect = document.getElementById('taxReconFilter');
  const taxReconDownloadBtn = document.getElementById('taxReconDownloadBtn');
  if(taxReconDownloadBtn) taxReconDownloadBtn.onclick = ()=>{
    taxReconFrom = taxReconFromInput ? taxReconFromInput.value : '';
    taxReconTo = taxReconToInput ? taxReconToInput.value : '';
    taxReconFilter = taxReconFilterSelect ? taxReconFilterSelect.value : 'with';
    exportTaxReconciliation(taxReconFrom, taxReconTo, taxReconFilter==='with');
  };

  const importBtn = document.getElementById('glImportBtn');
  const importFile = document.getElementById('glImportFile');
  if(importBtn) importBtn.onclick = ()=> importFile.click();
  if(importFile) importFile.onchange = (e)=>{
    const file = e.target.files[0];
    const modeEl = document.getElementById('glImportMode');
    const mode = modeEl ? modeEl.value : 'journal';
    if(file) handleGLImportFile(file, mode);
    importFile.value = '';
  };

  if(glEditId){
    // ---- Edit mode: single-row form ----
    const updateBtn = document.getElementById('glUpdateBtn');
    if(updateBtn) updateBtn.onclick = ()=>{
      const date = document.getElementById('glDate').value || todayISO();
      const entry = document.getElementById('glEntry').value;
      const account = document.getElementById('glAccount').value;
      const memo = document.getElementById('glMemo').value;
      const originalDebit = parseFloat(document.getElementById('glDebit').value)||0;
      const originalCredit = parseFloat(document.getElementById('glCredit').value)||0;
      const currency = document.getElementById('glCurrency').value;
      const fxRate = parseFloat(document.getElementById('glFxRate').value) || currencyRate(currency);
      const isBase = (state.currencies.find(c=>c.code===currency)||{}).base;
      const debit = isBase ? originalDebit : originalDebit * fxRate;
      const credit = isBase ? originalCredit : originalCredit * fxRate;
      if(!account){ alert('Please select an account.'); return; }
      if(!originalDebit && !originalCredit){ alert('Enter a debit or credit amount.'); return; }
      const currencyFields = isBase ? {currency:undefined, fxRate:undefined, originalDebit:undefined, originalCredit:undefined}
        : {currency, fxRate, originalDebit: originalDebit||undefined, originalCredit: originalCredit||undefined};
      const row = state.gl.find(l=>l.id===glEditId);
      if(row){
        delete row.currency; delete row.fxRate; delete row.originalDebit; delete row.originalCredit;
        Object.assign(row, {date, entry, account, memo, debit, credit}, currencyFields);
      }
      glEditId = null;
      saveState();
      renderMain();
    };
    const cancelBtn = document.getElementById('glCancelEditBtn');
    if(cancelBtn) cancelBtn.onclick = ()=>{ glEditId = null; renderMain(); };
  } else {
    // ---- Add mode: multi-line double-entry builder ----
    const dateEl = document.getElementById('jeDate');
    if(dateEl) dateEl.onchange = ()=>{ glEntryDraft.date = dateEl.value; };
    const entryEl = document.getElementById('jeEntry');
    if(entryEl) entryEl.onchange = ()=>{ glEntryDraft.entry = entryEl.value; };
    const curEl = document.getElementById('jeCurrency');
    if(curEl) curEl.onchange = ()=>{ glEntryDraft.currency = curEl.value; };
    const fxEl = document.getElementById('jeFxRate');
    if(fxEl) fxEl.oninput = ()=>{ glEntryDraft.fxRate = parseFloat(fxEl.value)||1; };

    document.querySelectorAll('[data-jeline]').forEach(el=>{
      const [i, field] = el.getAttribute('data-jeline').split('|');
      const idx = parseInt(i,10);
      const handler = ()=>{
        glEntryDraft.lines[idx][field] = el.value;
        if(field==='debit' || field==='credit') recalcJETotals();
      };
      el.oninput = handler;
      el.onchange = handler;
    });
    document.querySelectorAll('[data-jermline]').forEach(btn=>{
      btn.onclick = ()=>{
        glEntryDraft.lines.splice(parseInt(btn.getAttribute('data-jermline'),10),1);
        renderMain();
      };
    });
    const addLineBtn = document.getElementById('jeAddLineBtn');
    if(addLineBtn) addLineBtn.onclick = ()=>{
      glEntryDraft.lines.push({account:'',memo:'',debit:'',credit:''});
      renderMain();
    };

    const saveBtn = document.getElementById('jeSaveBtn');
    if(saveBtn) saveBtn.onclick = ()=>{
      const totalDebit = glEntryDraft.lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
      const totalCredit = glEntryDraft.lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
      if(Math.abs(totalDebit-totalCredit) >= 0.005 || totalDebit<=0){ alert('Total debits must equal total credits before saving.'); return; }
      const validLines = glEntryDraft.lines.filter(l=> l.account && ((Number(l.debit)||0)>0 || (Number(l.credit)||0)>0));
      if(validLines.length<2){ alert('Add at least two lines, each with an account and an amount.'); return; }
      const currency = glEntryDraft.currency;
      const fxRate = glEntryDraft.fxRate || currencyRate(currency);
      const isBase = (state.currencies.find(c=>c.code===currency)||{}).base;
      const date = glEntryDraft.date || todayISO();
      const entry = glEntryDraft.entry || ('JE-'+uid().slice(0,5));

      if(glGroupEditRef){
        if(!confirm(`Repost "${glGroupEditRef}"? This deletes all ${state.gl.filter(l=>l.entry===glGroupEditRef).length} original lines under this entry ref and replaces them with the ${validLines.length} line(s) shown above.`)) return;
        state.gl = state.gl.filter(l=>l.entry!==glGroupEditRef);
      }

      validLines.forEach(l=>{
        const originalDebit = Number(l.debit)||0, originalCredit = Number(l.credit)||0;
        const debit = isBase ? originalDebit : originalDebit*fxRate;
        const credit = isBase ? originalCredit : originalCredit*fxRate;
        const currencyFields = isBase ? {} : {currency, fxRate, originalDebit: originalDebit||undefined, originalCredit: originalCredit||undefined};
        state.gl.push(Object.assign({id:uid(), date, entry, account:l.account, memo:l.memo, debit, credit}, currencyFields));
      });
      saveState();
      const wasGroupEdit = !!glGroupEditRef;
      glGroupEditRef = null;
      glEntryDraft = defaultGLEntryDraft();
      renderMain();
      if(wasGroupEdit) alert(`Reposted. ${validLines.length} line(s) now on record under "${entry}".`);
    };
    const cancelGroupBtn = document.getElementById('jeCancelGroupBtn');
    if(cancelGroupBtn) cancelGroupBtn.onclick = cancelGLGroupEdit;
    const deleteGroupBtn = document.getElementById('jeDeleteGroupBtn');
    if(deleteGroupBtn) deleteGroupBtn.onclick = ()=>{
      const entryRef = glGroupEditRef;
      const lineCount = state.gl.filter(l=>l.entry===entryRef).length;
      if(!confirm(`Permanently delete this entire journal entry ("${entryRef}", ${lineCount} line(s))? This cannot be undone.`)) return;
      state.gl = state.gl.filter(l=>l.entry!==entryRef);
      glGroupEditRef = null;
      saveState();
      renderMain();
      alert(`Deleted "${entryRef}" (${lineCount} line(s)).`);
    };
  }

  document.querySelectorAll('[data-editgroup-gl]').forEach(btn=>{
    btn.onclick = ()=> startGLGroupEdit(btn.getAttribute('data-editgroup-gl'));
  });

  document.querySelectorAll('[data-edit-gl]').forEach(btn=>{
    btn.onclick = ()=>{ glEditId = btn.getAttribute('data-edit-gl'); glGroupEditRef = null; renderMain(); };
  });
  document.querySelectorAll('[data-del-gl]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-del-gl');
      state.gl = state.gl.filter(l=>l.id!==id);
      if(glEditId===id) glEditId = null;
      saveState(); renderMain();
    };
  });
  document.querySelectorAll('[data-attach-trigger]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-attach-trigger');
      const input = document.getElementById('glAttachInput-'+id);
      if(input) input.click();
    };
  });
  document.querySelectorAll('[data-attach-input]').forEach(input=>{
    input.onchange = (e)=>{
      const id = input.getAttribute('data-attach-input');
      const file = e.target.files[0];
      if(!file) return;
      if(file.size > 2*1024*1024){
        if(!confirm(`"${file.name}" is ${(file.size/1024/1024).toFixed(1)}MB — large attachments slow the app down and use more storage. Attach anyway?`)) { input.value=''; return; }
      }
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const row = state.gl.find(l=>l.id===id);
        if(row){
          row.attachment = {name: file.name, type: file.type, size: file.size, dataUrl: ev.target.result};
          saveState(); renderMain();
        }
      };
      reader.onerror = ()=> alert('Could not read that file.');
      reader.readAsDataURL(file);
    };
  });
  document.querySelectorAll('[data-rm-attach]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-rm-attach');
      const row = state.gl.find(l=>l.id===id);
      if(row && confirm(`Remove attachment "${row.attachment.name}"?`)){
        delete row.attachment;
        saveState(); renderMain();
      }
    };
  });

  const clearFromInput = document.getElementById('glClearFrom');
  const clearToInput = document.getElementById('glClearTo');
  if(clearFromInput) clearFromInput.onchange = ()=>{ glClearFrom = clearFromInput.value; renderMain(); };
  if(clearToInput) clearToInput.onchange = ()=>{ glClearTo = clearToInput.value; renderMain(); };

  const clearBtn = document.getElementById('glClearAllBtn');
  if(clearBtn){
    clearBtn.onclick = ()=>{
      const scoped = !!(glClearFrom || glClearTo);
      const toDelete = scoped ? state.gl.filter(l=>inRange(l.date, glClearFrom||null, glClearTo||null)) : state.gl;
      if(toDelete.length===0){ alert('No journal lines fall in that date range.'); return; }
      const rangeLabel = scoped ? ` dated ${glClearFrom||'the beginning'} to ${glClearTo||'today'}` : '';
      if(confirm(`Delete ${toDelete.length} journal line(s)${rangeLabel}? This cannot be undone.${scoped?' Entries outside this range are left untouched.':''}`)){
        if(scoped){
          const idsToDelete = new Set(toDelete.map(l=>l.id));
          state.gl = state.gl.filter(l=>!idsToDelete.has(l.id));
        } else {
          state.gl = [];
        }
        glEditId = null;
        glGroupEditRef = null;
        glEntryDraft = defaultGLEntryDraft();
        saveState(); renderMain();
      }
    };
  }
}

          <tr class="total-row"><td>Total Other Expenses</td><td class="num-col num">${fmt(pl.totalOtherExpense)}</td></tr>` : ''}

          <tr style="height:8px;"><td colspan="2"></td></tr>

}

function renderBS(){

  const bsLine = (a)=>{
    const linkTab = a.code==='1100' ? 'ar' : (a.code==='2000' ? 'ap' : null);

          <tr class="total-row"><td>Total Current Assets</td><td class="num-col num">${fmt(bs.totalCurrentAssets)}</td></tr>
          <tr><td colspan="2" style="font-weight:700;padding-top:12px;">Non-Current Assets</td></tr>
          ${f(bs.nonCurrentAssets).map(bsLine).join('')}
          <tr class="total-row"><td>Total Non-Current Assets</td><td class="num-col num">${fmt(bs.totalNonCurrentAssets)}</td></tr>
          <tr class="total-row" style="background:var(--ink-navy);"><td style="color:white;">TOTAL ASSETS</td><td class="num-col num" style="color:white;">${fmt(bs.totalAssets)}</td></tr>

          ${f(bs.nonCurrentLiab).map(bsLine).join('')}
          <tr class="total-row"><td>Total Non-Current Liabilities</td><td class="num-col num">${fmt(bs.totalNonCurrentLiab)}</td></tr>

let payrollEditId = null;
let payrollTargetNet = '';
let payrollRunMonth = '';
let attExportFrom = null; // export date-range pickers for the attendance download — 'YYYY-MM-DD'
let attExportTo = null;
let attExportFormat = 'excel'; // 'excel' | 'pdf'

function renderPayroll(){
  if(!payrollRunMonth) payrollRunMonth = todayISO().slice(0,7);
  const activeRssbRates = getRssbRatesFor(payrollRunMonth+'-01');
  const thisMonth = payrollRunMonth;
  const alreadyRun = (state.payrollRuns||[]).find(r=>r.month===thisMonth);

  // An archived run has had its per-employee detail deliberately cleared
  // to save space — there's nothing left to build the usual employee
  // table, disbursement breakdown, or GL preview from, and trying to
  // would either error out or silently fall back to today's roster and
  // show the wrong historical numbers. Show just the preserved totals
  // instead, and stop here rather than risk either of those.
  if(alreadyRun && alreadyRun.archived){
    return `
      <h1 class="page-title">${t('nav_payroll')}</h1>
      <div class="field-row" style="margin-bottom:16px;">
        <div class="field"><label>Run payroll for:</label><input type="month" id="pRunMonth" value="${payrollRunMonth}"></div>
      </div>
      <div class="ledger-panel">
        <div style="background:rgba(192,138,40,0.1);border:1px solid var(--amber);border-radius:4px;padding:12px 16px;margin-bottom:16px;">
          📦 <strong>${esc(monthLabel(thisMonth+'-01'))} has been archived.</strong> Employee-level detail (names, bank accounts, individual breakdowns) was cleared to save local storage space — the totals below are preserved exactly as they were when this payroll was run, and the full accounting entries remain in the General Ledger untouched.
        </div>
        <table class="led">
          <tbody>
            <tr><td>Employees Paid</td><td class="num-col num">${alreadyRun.employeeCount||0}</td></tr>
            <tr><td>Gross Salary</td><td class="num-col num">${fmt(alreadyRun.gross)}</td></tr>
            <tr><td>PAYE</td><td class="num-col num">${fmt(alreadyRun.paye)}</td></tr>
            <tr><td>Pension</td><td class="num-col num">${fmt(alreadyRun.pension)}</td></tr>
            <tr><td>Maternity</td><td class="num-col num">${fmt(alreadyRun.maternity)}</td></tr>
            <tr><td>CBHI</td><td class="num-col num">${fmt(alreadyRun.cbhi)}</td></tr>
            <tr><td>Net Salary</td><td class="num-col num">${fmt(alreadyRun.net)}</td></tr>
            <tr><td>Meal Reimb.</td><td class="num-col num">${fmt(alreadyRun.mealReimb)}</td></tr>
            <tr><td>Transport Reimb.</td><td class="num-col num">${fmt(alreadyRun.transportReimb)}</td></tr>
            <tr><td>Consultancy Fee</td><td class="num-col num">${fmt(alreadyRun.consultFee)}</td></tr>
            <tr style="font-weight:700;"><td>Total Paid Up</td><td class="num-col num">${fmt((alreadyRun.net||0)+(alreadyRun.totalReimb||0)+(alreadyRun.consultFee||0))}</td></tr>
          </tbody>
        </table>
      </div>
    `;
  }

  // A month with a saved snapshot shows THAT frozen data, independent of
  // whatever the live employee roster looks like now — so future edits or
  // deletions never rewrite payroll history. Older runs saved before this
  // feature existed have no .employees snapshot, so they fall back to a
  // live (best-effort) recompute, same as before.
  const isLocked = !!(alreadyRun && alreadyRun.employees && alreadyRun.employees.length);
  const rows = isLocked
    ? alreadyRun.employees.map(e=>({...e}))
    : state.payroll.map(e=>({...e, calc: effectivePayrollCalc(e, payrollRunMonth+'-01')}));
  const totals = rows.reduce((s,r)=>({
    gross:s.gross+r.calc.gross, paye:s.paye+r.calc.paye, pension:s.pension+r.calc.pension,
    maternity:s.maternity+r.calc.maternity, cbhi:s.cbhi+r.calc.cbhi, net:s.net+r.calc.net
  }),{gross:0,paye:0,pension:0,maternity:0,cbhi:0,net:0});

  const ticked = isLocked ? rows : rows.filter(r=>r.workedThisMonth!==false);
  const monthTotals = ticked.reduce((s,r)=>({
    gross:s.gross+r.calc.gross, paye:s.paye+r.calc.paye,
    pensionPayable:s.pensionPayable+r.calc.pensionPayable, maternityPayable:s.maternityPayable+r.calc.maternityPayable,
    cbhi:s.cbhi+r.calc.cbhi, erTotal:s.erTotal+r.calc.erTotal, net:s.net+r.calc.net,
    mealReimb:s.mealReimb+r.calc.mealReimb, transportReimb:s.transportReimb+r.calc.transportReimb, totalReimb:s.totalReimb+r.calc.totalReimb,
    consultFee:s.consultFee+r.calc.consultFee
  }),{gross:0,paye:0,pensionPayable:0,maternityPayable:0,cbhi:0,erTotal:0,net:0,mealReimb:0,transportReimb:0,totalReimb:0,consultFee:0});

  // Bank Distribution — Net Pay grouped by bank, for verifying the total

  const bankGroupKeys = Object.keys(bankGroups).sort((a,b)=> a==='(Not Assigned)' ? 1 : (b==='(Not Assigned)' ? -1 : a.localeCompare(b)));
  const bankDistTotal = bankGroupKeys.reduce((s,k)=>s+bankGroups[k],0);
  const bankDistValid = Math.abs(bankDistTotal - monthTotals.net) < 0.5;

  const editing = payrollEditId ? state.payroll.find(e=>e.id===payrollEditId) : null;
  const f = editing || {name:'', familyName:'', otherNames:'', position:'', branch:'', basic:'', transport:'', meal:'', mealReimb:'', transportReimb:'', consultFee:'', rssbNumber:'', bankAccount:'', bankName:'', idType:'national_id', idNumber:'', startDate:''};

  const c = state.settings.company;

  const trVal = v => (v!=null && v!=='') ? v : '';
  const netCharge = parseFloat(tr.netCharge)||0;
  const payeCharge = parseFloat(tr.payeCharge)||0;
  const pensionCharge = parseFloat(tr.pensionCharge)||0;
  const maternityCharge = parseFloat(tr.maternityCharge)||0;
  const cbhiCharge = parseFloat(tr.cbhiCharge)||0;
  const trStatus = tr.status || 'PENDING';
  const totalPayrollTax = monthTotals.paye + monthTotals.pensionPayable + monthTotals.maternityPayable + monthTotals.cbhi;
  const totalPayrollTaxCharge = payeCharge + pensionCharge + maternityCharge + cbhiCharge;
  const totalTransferAmount = monthTotals.net + totalPayrollTax;
  const totalTransferCharge = netCharge + totalPayrollTaxCharge;
  const cashNeeded = totalTransferAmount + totalTransferCharge;
  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:18px;">
      <div>
        <div style="font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--ink-navy);">${esc(c.name||'Company Name')}</div>
        <div style="font-size:11.5px;color:var(--text-soft);margin-bottom:12px;letter-spacing:0.2px;">TIN: ${esc(c.tin||'—')}${c.address ? ' &nbsp;•&nbsp; ' + esc(c.address) : ''}</div>
        <h1 class="page-title">${t('nav_payroll')}</h1>
        <p class="page-sub">${t('sub_payroll')}</p>
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div id="payrollSummaryBox" style="background:var(--parchment-2);border:1px solid var(--rule-dk);border-top:4px solid var(--ledger-green-dk);border-radius:6px;padding:14px 18px;min-width:340px;">
        <div id="payrollRecordingPanel">
          <div style="font-family:'Fraunces',serif;font-weight:700;font-size:14px;color:var(--ink-navy);">${esc(c.name||'Company Name')}</div>
          <div style="font-size:10.5px;color:var(--text-soft);margin-bottom:6px;">TIN: ${esc(c.tin||'—')}${c.address ? ' &nbsp;•&nbsp; ' + esc(c.address) : ''}</div>
          <div style="font-weight:700;font-size:12px;color:var(--ink-navy);margin-bottom:2px;">Payroll Accounts Recording</div>
          <div style="font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-soft);margin-bottom:8px;">${monthLabel(thisMonth+'-01')} (${ticked.length} employee${ticked.length===1?'':'s'} ticked)</div>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
          <thead>
            <tr style="border-bottom:1.5px solid var(--ledger-green-dk);background:rgba(35,79,58,0.10);">
              <th style="text-align:left;padding:3px 4px;">Account</th>
              <th style="text-align:right;padding:3px 4px;">Debit</th>
              <th style="text-align:right;padding:3px 4px;">Credit</th>
            </tr>
          </thead>
          <tbody>
            <tr><td style="padding:3px 4px;">Gross Salary <span style="color:var(--text-soft);">(Expense)</span></td><td class="num" style="text-align:right;padding:3px 4px;">${fmt(monthTotals.gross)}</td><td></td></tr>
            <tr><td style="padding:3px 4px;">Employer Contribution <span style="color:var(--text-soft);">(Expense)</span></td><td class="num" style="text-align:right;padding:3px 4px;">${fmt(monthTotals.erTotal)}</td><td></td></tr>
            ${monthTotals.totalReimb>0?`<tr><td style="padding:3px 4px;">Transport &amp; Meal Reimbursement <span style="color:var(--text-soft);">(Expense)</span></td><td class="num" style="text-align:right;padding:3px 4px;">${fmt(monthTotals.totalReimb)}</td><td></td></tr>`:''}

            ${monthTotals.totalReimb>0?`<tr><td style="padding:3px 4px;">Reimbursements Payable <span style="color:var(--text-soft);">(Liability)</span></td><td></td><td class="num" style="text-align:right;padding:3px 4px;">${fmt(monthTotals.totalReimb)}</td></tr>`:''}
            <tr><td style="padding:3px 4px;">PAYE Payable <span style="color:var(--text-soft);">(Liability)</span></td><td></td><td class="num" style="text-align:right;padding:3px 4px;">${fmt(monthTotals.paye)}</td></tr>
            <tr><td style="padding:3px 4px;">Pension Payable <span style="color:var(--text-soft);">(Liability)</span></td><td></td><td class="num" style="text-align:right;padding:3px 4px;">${fmt(monthTotals.pensionPayable)}</td></tr>

// Employee-level payroll + non-taxable reimbursement summary, grouped by
// Branch when employees have one set (e.g. Ikoro House's Rebero/Kanombe
// branches) — with a subtotal per branch and a grand total, plus a
// Prepared/Verified/Approved sign-off block. Sits alongside the Payroll
// Accounts Recording table and both print together as one PDF.
function renderPayrollBranchReport(ticked, thisMonth, opts){
  opts = opts || {};
  const c = state.settings.company;
  const so = state.settings.payrollSignoff || {};
  const groups = {};
  ticked.forEach(r=>{
    const key = (r.branch||'').trim() || '—';
    (groups[key] = groups[key]||[]).push(r);
  });
  const branchKeys = Object.keys(groups);
  const showBranches = branchKeys.length>1 || (branchKeys.length===1 && branchKeys[0]!=='—');

  const sumRows = rows => rows.reduce((a,r)=>({
    net:a.net+r.calc.net, meal:a.meal+r.calc.mealReimb, transport:a.transport+r.calc.transportReimb,
    totalReimb:a.totalReimb+r.calc.totalReimb, consultFee:a.consultFee+r.calc.consultFee, totalPaidUp:a.totalPaidUp+r.calc.totalPaidUp
  }),{net:0,meal:0,transport:0,totalReimb:0,consultFee:0,totalPaidUp:0});
  const grand = sumRows(ticked);

  // When printing/saving, a column nobody actually used this month (e.g.
  // no one has a Consultancy Fee, or Meal/Transport reimbursements aren't
  // used at all) just adds visual clutter — hide it so the printed table
  // only shows columns that actually have figures in them this month. The
  // on-screen table (opts.hideEmptyCols not set) always shows every
  // column, since that's where these amounts are entered/edited.
  const showMeal = !opts.hideEmptyCols || grand.meal !== 0;
  const showTransport = !opts.hideEmptyCols || grand.transport !== 0;
  const showTotalReimb = !opts.hideEmptyCols || grand.totalReimb !== 0;
  const showConsultFee = !opts.hideEmptyCols || grand.consultFee !== 0;
  const totalCols = 4 + 1 + (showMeal?1:0) + (showTransport?1:0) + (showTotalReimb?1:0) + (showConsultFee?1:0) + 1;

  const empRow = r => `<tr>
      <td style="font-size:11.5px;">${esc(r.idNumber||'—')}</td>
      <td>${esc(r.familyName||r.name||'—')}</td>
      <td style="font-size:11.5px;">${esc(r.bankName||'—')}</td>
      <td style="font-size:11.5px;">${esc(r.bankAccount||'—')}</td>
      <td class="num-col num">${fmt(r.calc.net)}</td>
      ${showMeal?`<td class="num-col num">${fmt(r.calc.mealReimb)}</td>`:''}
      ${showTransport?`<td class="num-col num">${fmt(r.calc.transportReimb)}</td>`:''}
      ${showTotalReimb?`<td class="num-col num" style="font-weight:700;">${fmt(r.calc.totalReimb)}</td>`:''}
      ${showConsultFee?`<td class="num-col num">${fmt(r.calc.consultFee)}</td>`:''}
      <td class="num-col num" style="font-weight:700;">${fmt(r.calc.totalPaidUp)}</td>
    </tr>`;
  const subtotalRow = (label, rows) => {
    const s = sumRows(rows);
    return `<tr style="font-weight:700;background:rgba(35,79,58,0.10);">
      <td colspan="4" style="text-align:center;">${esc(label)}</td>
      <td class="num-col num">${fmt(s.net)}</td>
      ${showMeal?`<td class="num-col num">${fmt(s.meal)}</td>`:''}
      ${showTransport?`<td class="num-col num">${fmt(s.transport)}</td>`:''}
      ${showTotalReimb?`<td class="num-col num">${fmt(s.totalReimb)}</td>`:''}
      ${showConsultFee?`<td class="num-col num">${fmt(s.consultFee)}</td>`:''}
      <td class="num-col num">${fmt(s.totalPaidUp)}</td>
    </tr>`;
  };

  let bodyRows;
  if(showBranches){
    bodyRows = branchKeys.map(k=>
      `<tr><td colspan="${totalCols}" style="text-align:center;font-weight:700;background:var(--ink-navy);color:#fff;padding:5px;">${esc(k.toUpperCase())} BRANCH</td></tr>`
      + groups[k].map(empRow).join('')
      + subtotalRow(`${k.toUpperCase()} SUBTOTAL`, groups[k])
    ).join('');
  } else {
    bodyRows = ticked.map(empRow).join('');
  }

  return `
    <div class="section-label" style="margin-top:22px;">Employee Payroll &amp; Reimbursement Summary${showBranches?' — By Branch':''} (${ticked.length} employee${ticked.length===1?'':'s'})</div>
    <div class="ledger-panel" id="payrollBranchReportBox">
      <div style="font-family:'Fraunces',serif;font-weight:700;font-size:14px;color:var(--ink-navy);">${esc(c.name||'Company Name')}</div>
      <div style="font-size:10.5px;color:var(--text-soft);margin-bottom:10px;">TIN: ${esc(c.tin||'—')}${c.address ? ' &nbsp;•&nbsp; ' + esc(c.address) : ''} &nbsp;•&nbsp; ${monthLabel(thisMonth+'-01')}</div>
      <div style="overflow-x:auto;">
      <table class="led" style="font-size:12px;">
        <thead>
          <tr>
            <th>Employee ID/Passport</th><th>Family Name / Full Name</th><th>Bank Name</th><th>Bank Account</th>
            <th class="num-col">Net Salary<br>(Take-Home)</th>
            ${showMeal?`<th class="num-col">Meal<br>Reimb.</th>`:''}
            ${showTransport?`<th class="num-col">Transport<br>Reimb.</th>`:''}
            ${showTotalReimb?`<th class="num-col">Total<br>Reimb.</th>`:''}
            ${showConsultFee?`<th class="num-col">Consult.<br>Fee</th>`:''}
            <th class="num-col">Total<br>Paid Up</th>
          </tr>
        </thead>
        <tbody>
          ${bodyRows||''}
          ${ticked.length===0?`<tr><td colspan="${totalCols}" style="text-align:center;color:var(--text-soft);padding:16px;">No employees ticked as worked this month.</td></tr>`:''}
          <tr class="total-row">
            <td colspan="4">GRAND TOTAL — ALL${showBranches?' BRANCHES':''}</td>
            <td class="num-col num">${fmt(grand.net)}</td>
            ${showMeal?`<td class="num-col num">${fmt(grand.meal)}</td>`:''}
            ${showTransport?`<td class="num-col num">${fmt(grand.transport)}</td>`:''}
            ${showTotalReimb?`<td class="num-col num">${fmt(grand.totalReimb)}</td>`:''}
            ${showConsultFee?`<td class="num-col num">${fmt(grand.consultFee)}</td>`:''}
            <td class="num-col num">${fmt(grand.totalPaidUp)}</td>
          </tr>
        </tbody>
      </table>
      </div>
      <div class="field-row" style="margin-top:16px;">
        <div class="field"><label>Prepared By</label><input type="text" id="pfSignPrepared" placeholder="Name" value="${esc(so.preparedBy||'')}"></div>
        <div class="field"><label>Verified By</label><input type="text" id="pfSignVerified" placeholder="Name" value="${esc(so.verifiedBy||'')}"></div>
        <div class="field"><label>Approved By</label><input type="text" id="pfSignApproved" placeholder="Name" value="${esc(so.approvedBy||'')}"></div>
      </div>
      <button class="btn btn-ghost btn-sm" id="pPrintFullReportBtn" style="margin-top:10px;">🖨 Print / Save as PDF — Employee Summary + Accounts Recording</button>
    </div>

    ${opts.hideEmptyCols ? '' : renderAttendanceSection()}
  `;
}

function renderAttendanceSection(){
  const month = payrollRunMonth;
  const rates = state.settings.reimbRates || {food:2000, transport:3000, maxDays:30};
  const totalDays = daysInMonth(month);
  const calcDays = Math.min(totalDays, rates.maxDays||30);
  const employees = state.payroll;
  const monthName = new Date(month+'-01T00:00:00').toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const meta = getAttendanceMeta(month);
  const closed = meta.closed;
  const weeks = attendanceWeekRanges(month);
  const WEEK_COLORS = ['rgba(47,107,79,0.85)','rgba(192,138,40,0.85)','rgba(22,35,61,0.85)','rgba(162,59,46,0.75)'];
  const weekIndexForDay = d => weeks.findIndex(w=> d>=w.from && d<=w.to);
  const weekHeaderBg = d => { const i=weekIndexForDay(d); return i>=0 ? WEEK_COLORS[i%WEEK_COLORS.length] : 'var(--ledger-green-dk)'; };
  const weekCellTint = d => { const i=weekIndexForDay(d); const c=['rgba(47,107,79,0.10)','rgba(192,138,40,0.12)','rgba(22,35,61,0.08)','rgba(162,59,46,0.08)']; return i>=0 ? c[i%c.length] : 'transparent'; };
  const monthFirstDate = month+'-01';
  const monthLastDate = month+'-'+String(totalDays).padStart(2,'0');
  // Preserve a chosen export range across re-renders, but snap back to
  // the full month the moment it's no longer valid for whichever month
  // is currently selected (e.g. after switching months).
  if(!attExportFrom || attExportFrom<monthFirstDate || attExportFrom>monthLastDate) attExportFrom = monthFirstDate;
  if(!attExportTo || attExportTo<monthFirstDate || attExportTo>monthLastDate) attExportTo = monthLastDate;
  const fmtDayRange = (from,to)=>{
    const f = new Date(month+'-'+String(from).padStart(2,'0')+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const t = new Date(month+'-'+String(to).padStart(2,'0')+'T00:00:00').toLocaleDateString('en-US',{day:'numeric'});
    return `${f}–${t}`;
  };

  const dayHeaders = [];
  for(let d=1; d<=totalDays; d++){
    const dow = new Date(month+'-'+String(d).padStart(2,'0')+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'});
    const excluded = d>calcDays;
    dayHeaders.push(`<th style="min-width:26px;padding:3px 2px;font-size:9.5px;text-align:center;background:${weekHeaderBg(d)};color:#fff;${excluded?'opacity:0.4;':''}" title="${excluded?'Excluded — beyond the '+calcDays+'-day calculation cap':dow}">${dow[0]}<br>${d}</th>`);
  }

  const empRows = employees.map(emp=>{
    const calc = computeAttendanceForEmployee(emp, month);
    const cells = [];
    for(let d=1; d<=totalDays; d++){
      const excluded = d>calcDays;
      const locked = excluded || closed;
      const mark = getAttendanceMark(emp.id, month, d);
      const bg = mark==='P' ? 'rgba(35,79,58,0.22)' : mark==='A' ? 'rgba(162,59,46,0.18)' : weekCellTint(d);
      const color = mark==='P' ? 'var(--ledger-green-dk)' : mark==='A' ? 'var(--ink-red)' : 'var(--rule-dk)';
      cells.push(`<td style="padding:0;text-align:center;${excluded?'opacity:0.35;':''}">
        <button class="att-cell" data-emp="${emp.id}" data-day="${d}" ${locked?'disabled':''} style="width:100%;min-width:26px;height:26px;border:none;background:${bg};color:${color};font-weight:700;font-size:11px;cursor:${locked?'default':'pointer'};">${mark||'·'}</button>
      </td>`);
    }
    return `<tr>

   INVOICES — a billing-focused view: create, tick payment status,
   save, and print a customer-ready invoice. (Accounts Receivable,
   further down, gives the full aging/collections view of the same
   invoices — this tab is the fast day-to-day "send this to my
   client" workflow.)

function invoicePaymentTier(inv){
  const paid = Number(inv.paid)||0;
  const total = Number(inv.total)||0;
  if(paid<=0.005) return 'Unpaid';
  if(paid+0.005 >= total) return 'Fully Paid';
  return 'Partially Paid';
}

// Deletes an invoice and reverses everything it touched: its own GL entries,
// the customer's balance, and — if this invoice was cross-entity mirrored
// in either direction (a linked-customer sale, or the revenue side of a
// Professional Fee bill recorded in another client's own books) — cleans
// up the matching entries there too, so both sides stay in sync.
function deleteInvoiceEverywhere(invoiceId){
  const inv = state.invoices.find(i=>i.id===invoiceId);
  if(!inv) return false;

  state.gl = state.gl.filter(l=>l.entry!==inv.entryRef);

  const customer = state.customers.find(c=>c.id===inv.customerId);
  if(customer) customer.invoiced = Math.max(0, (Number(customer.invoiced)||0) - (Number(inv.total)||0));

  // Case A: this invoice's customer is linked to another managed client
  // (New Sales Invoice mirroring) — clean up the mirrored expense there.
  if(customer && customer.linkedClientId && appData.clients[customer.linkedClientId]){
    const recipient = appData.clients[customer.linkedClientId];
    const mirrorRef = inv.invoiceNo + '-IN';
    recipient.gl = recipient.gl.filter(l=>l.entry!==mirrorRef);
    const vend = recipient.vendors.find(v=>v.name===state.settings.company.name);
    if(vend) vend.invoiced = Math.max(0, (Number(vend.invoiced)||0) - (Number(inv.total)||0));
  }

  // Case B: this invoice IS the mirrored revenue side of a Professional Fee
  // bill recorded in another client's own books — clean up that bill too.
  appData.clientOrder.forEach(cid=>{
    if(cid===appData.activeClientId) return;
    const other = appData.clients[cid];
    const bill = (other.bills||[]).find(b=>b.mirroredInvoiceId===invoiceId);
    if(bill){
      other.gl = other.gl.filter(l=>l.entry!==bill.entryRef);
      const vend = other.vendors.find(v=>v.id===bill.vendorId);
      if(vend) vend.invoiced = Math.max(0, (Number(vend.invoiced)||0) - (Number(bill.netPay)||0));
      other.bills = other.bills.filter(b=>b.id!==bill.id);
    }
  });

  state.invoices = state.invoices.filter(i=>i.id!==invoiceId);
  saveState();
  return true;
}

        </div>
        <div class="field" style="min-width:260px;"><label>Description</label><input type="text" id="pfDesc" value="Tax and Accounting Consultancy Service — Professional Fee — ${new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'})}"></div>
        <div class="field"><label>Amount</label><input type="number" class="num-in" id="pfAmount" placeholder="0"></div>
        <div class="field" style="min-width:190px;"><label>Tax Type</label>
          <select id="pfTaxType">
            <option value="VAT">${pfTaxLabel('VAT')}</option>
            <option value="WHT">${pfTaxLabel('WHT')}</option>

      </div>
      <div class="note">Posts here as Dr Professional &amp; Accounting Fees / Cr Accounts Payable — this company's own bill to settle. VAT adds to the amount owed; WHT is withheld from it instead (net payable = amount − WHT); OR Tax A and OR Tax C post the amount with no VAT/WHT applied. Automatically records the matching revenue (and, for WHT, a tax credit) in the service provider's own separate books.</div>
