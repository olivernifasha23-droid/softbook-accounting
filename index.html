    <div class="section-label">Professional Fee Bills (${bills.length})</div>
    <div class="ledger-panel">
      <table class="led">
        <thead><tr><th>Ref</th><th>Service Provider</th><th>Description</th><th>Date</th><th>Due Date</th><th class="num-col">Base</th><th>Tax</th><th class="num-col">Net Payable</th><th class="num-col">Paid</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${bills.map(b=>{
            const provider = b.providerClientId ? appData.clients[b.providerClientId] : null;
            const vendor = state.vendors.find(v=>v.id===b.vendorId);
            const providerDisplayName = provider ? provider.settings.company.name : (vendor ? vendor.name : '—');
            const tier = billPaymentTier(b);
            const overdue = b.dueDate && b.dueDate<asOfDate && tier!=='Fully Paid';
            const taxAmt = (b.vat>0) ? b.vat : (b.wht>0) ? b.wht : 0;
            const taxDisplay = b.taxType ? `${PF_TAX_TYPES[b.taxType]?PF_TAX_TYPES[b.taxType].label:b.taxType}${taxAmt>0?` (${(b.wht>0?'−':'+')}${fmt(taxAmt)})`:''}` : '—';

              <td>${esc(b.invoiceNo||b.entryRef)}</td>
              <td>${esc(providerDisplayName)}</td>
              <td>${esc(b.description)}</td>
              <td>${b.date}</td><td>${b.dueDate||''}</td>
              <td class="num-col num">${fmt(b.base!=null?b.base:b.netPay)}</td>
              <td style="font-size:12px;color:var(--text-soft);white-space:nowrap;">${esc(taxDisplay)}</td>
              <td class="num-col num">${fmt(b.netPay)}</td>
              <td class="num-col num">${fmt(b.paid)}</td>
              <td>
                <select data-pf-status="${b.id}" style="font-size:12px;padding:4px 6px;">
                  <option value="Unpaid" ${tier==='Unpaid'?'selected':''}>◻ Unpaid</option>
                  <option value="Partially Paid" ${tier==='Partially Paid'?'selected':''}>◑ Partially Paid</option>
                  <option value="Fully Paid" ${tier==='Fully Paid'?'selected':''}>✓ Fully Paid</option>
                </select>
                ${tier!=='Fully Paid' ? payAccountSelectHtml('data-pf-payacct', b.id) : ''}
                ${overdue?'<span class="badge bad" style="margin-left:6px;">Overdue</span>':''}
              </td>
              <td style="white-space:nowrap;">
                <button class="btn btn-ghost btn-sm" data-pf-status-save="${b.id}">Save</button>
                <button class="btn btn-ghost btn-sm" data-pf-print="${b.id}">🖨 Print</button>
                <button class="icon-x" data-pf-delete="${b.id}" title="Delete">✕</button>
              </td>
            </tr>`;
          }).join('')}
          ${bills.length===0?'<tr><td colspan="10" style="text-align:center;color:var(--text-soft);padding:20px;">No professional fee bills recorded yet.</td></tr>':''}
        </tbody>
      </table>
      <div class="note">Deleting a bill also removes the matching entries and invoice from the service provider's own books, keeping both sides in sync.</div>
    </div>
  `;
}

function renderAR(){
  const customerNameOf = (inv)=> { const c = state.customers.find(x=>x.id===inv.customerId); return c ? c.name : ''; };
  const invoices = [...(state.invoices||[])].sort((a,b)=> customerNameOf(a).localeCompare(customerNameOf(b)) || (b.date||'').localeCompare(a.date||''));
  const open = invoices.filter(i=>invoicePaymentTier(i)!=='Fully Paid');
  const totalOutstanding = open.reduce((s,i)=>s+invoiceOutstanding(i),0);
  const overdueAmt = open.filter(i=>i.dueDate && i.dueDate<asOfDate).reduce((s,i)=>s+invoiceOutstanding(i),0);

  return `
    ${reportHeader(t('title_ar'), t('sub_ar'))}

    <div class="kpi-tiles">
      <div class="kpi-card"><div class="k-label">${t('kpi_total_outstanding')}</div><div class="k-val">${fmt(totalOutstanding)}</div></div>
      <div class="kpi-card ${overdueAmt>0?'warn':''}"><div class="k-label">${t('kpi_overdue')}</div><div class="k-val">${fmt(overdueAmt)}</div></div>
      <div class="kpi-card"><div class="k-label">${t('kpi_open_invoices')}</div><div class="k-val">${open.length}</div></div>
      <div class="kpi-card"><div class="k-label">${t('kpi_total_invoiced')}</div><div class="k-val">${fmt(invoices.reduce((s,i)=>s+(Number(i.total)||0),0))}</div></div>
    </div>

    <div class="ledger-panel">
      ${arShowUnlinkedOnly ? `<div class="note" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span>Showing only invoices with no customer linked.</span>
        <a href="#" id="arClearUnlinkedBtn">Clear filter</a>
      </div>` : ''}
      <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
        <input type="text" id="arSearchInput" value="${esc(arSearchQuery)}" placeholder="🔎 Search by customer or invoice #…" style="flex:1;min-width:220px;padding:7px 9px;border:1px solid var(--rule-dk);border-radius:3px;font-family:'Inter';font-size:13px;">
        ${invoices.length>0?`<div style="display:flex;gap:8px;">
          ${open.length>0?`<button class="btn btn-primary btn-sm" id="arSaveAllBtn">💾 ${t('btn_saveall')}</button>`:''}
          ${invoices.some(i=>Number(i.paid)>0)?`<button class="btn btn-ghost btn-sm" id="arFixPayDatesBtn" title="Re-dates every recorded payment to match its own invoice's date, undoing any that were posted using today's date instead">🗓 Fix Payment Dates</button>`:''}
          <button class="btn btn-danger btn-sm" id="arClearAllBtn">Clear All Invoices</button>
        </div>`:''}
      </div>
      <table class="led">
        <thead><tr><th>${t('col_invoice_no')}</th><th>${t('col_customer')}</th><th>${t('col_date')}</th><th>${t('col_due_date')}</th><th class="num-col">${t('col_total')}</th><th class="num-col">${t('col_paid')}</th><th class="num-col">${t('col_outstanding')}</th><th>${t('col_status')}</th><th>${t('col_record_payment')}</th></tr></thead>
        <tbody>
          ${invoices.map(inv=>{
            const customer = state.customers.find(c=>c.id===inv.customerId);
            const tier = invoicePaymentTier(inv);
            const tierLabel = tier==='Fully Paid'?t('status_paid'):(tier==='Partially Paid'?t('status_partial'):t('status_unpaid'));
            const badgeClass = tier==='Fully Paid' ? 'ok' : (tier==='Partially Paid' ? 'pending' : 'bad');
            const overdue = inv.dueDate && inv.dueDate<asOfDate && tier!=='Fully Paid';
            const outstanding = invoiceOutstanding(inv);
            return `<tr data-row-search="${esc(((customer?customer.name:'')+' '+inv.invoiceNo).toLowerCase())}" ${!customer?'data-no-link="1"':''}>
              <td>${inv.entryRef ? `<a href="#" data-open-gl-entry="${esc(inv.entryRef)}" title="See this transaction in the General Ledger">${esc(inv.invoiceNo)}</a>` : esc(inv.invoiceNo)}</td>
              <td>${esc(customer?customer.name:'—')}</td>
              <td>${inv.date}</td><td>${inv.dueDate}</td>
              <td class="num-col num">${fmt(inv.total)}</td>
              <td class="num-col num">${fmt(inv.paid)}</td>
              <td class="num-col num" style="font-weight:700;">${fmt(outstanding)}</td>
              <td><span class="badge ${badgeClass}">${tierLabel}</span>${overdue?` <span class="badge bad">${t('status_overdue')}</span>`:''}</td>
              <td style="white-space:nowrap;">
                ${outstanding>0.01?`
                  <input type="number" class="num-in" step="0.01" min="0.01" max="${outstanding}" value="${outstanding}" data-pay-amt-inv="${inv.id}" style="width:110px;display:inline-block;">
                  ${payAccountSelectHtml('data-pay-acct-inv', inv.id)}

/* ============================================================
   ACCOUNTS PAYABLE
   ============================================================ */
function renderAP(){
  const vendorNameOf = (b)=> { const v = state.vendors.find(x=>x.id===b.vendorId); return v ? v.name : ''; };
  const bills = [...(state.bills||[])].filter(b=>b.payFrom==='2000').sort((a,b)=> vendorNameOf(a).localeCompare(vendorNameOf(b)) || (b.date||'').localeCompare(a.date||''));
  const open = bills.filter(b=>billOutstanding(b)>0.01);
  const totalOutstanding = open.reduce((s,b)=>s+billOutstanding(b),0);
  const recon = computeAPReconciliation();
  const mismatched = Math.abs(recon.unexplainedTotal) > 0.5;

  return `
    ${reportHeader(t('title_ap'), t('sub_ap'))}

    <div class="kpi-tiles">
      <div class="kpi-card"><div class="k-label">${t('kpi_total_outstanding')}</div><div class="k-val">${fmt(totalOutstanding)}</div></div>
      <div class="kpi-card"><div class="k-label">${t('kpi_open_bills')}</div><div class="k-val">${open.length}</div></div>
      <div class="kpi-card"><div class="k-label">${t('kpi_total_billed')}</div><div class="k-val">${fmt(bills.reduce((s,b)=>s+(Number(b.netPay)||0),0))}</div></div>
    </div>

    ${mismatched ? `
    <div class="ledger-panel" style="border-left:3px solid var(--ink-red,#a33);margin-bottom:22px;">
      <div class="section-label" style="color:var(--ink-red,#a33);">⚠ Accounts Payable Doesn't Match the Balance Sheet</div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">
        The Balance Sheet shows Accounts Payable (account 2000) at <strong>${fmt(recon.glBalance)}</strong>, but every bill above is fully accounted for —
        the gap of <strong>${fmt(recon.unexplainedTotal)}</strong> comes from General Ledger postings to account 2000 that were never linked to a tracked bill
        (a manual journal entry, an import, or an edited entry). These are listed below — review each one, and delete it if it shouldn't be there.
      </p>
      <table class="led">
        <thead><tr><th>Entry Ref</th><th>Date</th><th>Lines</th><th class="num-col">Net Effect on AP</th><th></th></tr></thead>
        <tbody>
          ${recon.unexplained.map(g=>`
            <tr>
              <td>${esc(g.entry)}</td>
              <td>${g.date||''}</td>
              <td style="font-size:12.5px;">${g.lines.map(l=>`${esc(acctName(l.account))}: ${l.debit?'Dr '+fmt(l.debit):'Cr '+fmt(l.credit)}`).join('<br>')}</td>
              <td class="num-col num" style="font-weight:700;">${fmt(g.net)}</td>
              <td><button class="btn btn-danger btn-sm" data-del-ap-orphan="${esc(g.entry)}">Delete Entry</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>` : ''}

    <div class="ledger-panel">
      ${apShowUnlinkedOnly ? `<div class="note" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span>Showing only bills with no supplier linked.</span>
        <a href="#" id="apClearUnlinkedBtn">Clear filter</a>
      </div>` : ''}
      <input type="text" id="apSearchInput" value="${esc(apSearchQuery)}" placeholder="🔎 Search by supplier or description…" style="width:100%;padding:7px 9px;margin-bottom:10px;border:1px solid var(--rule-dk);border-radius:3px;font-family:'Inter';font-size:13px;">
      ${bills.length>0?`<div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
        ${open.length>0?`<button class="btn btn-primary btn-sm" id="apSaveAllBtn">💾 ${t('btn_saveall')}</button>`:''}
        ${bills.some(b=>Number(b.paid)>0)?`<button class="btn btn-ghost btn-sm" id="apFixPayDatesBtn" title="Re-dates every recorded payment to match its own bill's date, undoing any that were posted using today's date instead">🗓 Fix Payment Dates</button>`:''}
        <label style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-soft);font-weight:600;">Clear from</label>
        <input type="date" id="apClearFrom" value="${apClearFrom}" style="border:1px solid var(--rule-dk);border-radius:3px;padding:5px 7px;font-family:'Inter';font-size:12.5px;">
        <label style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-soft);font-weight:600;">to</label>
        <input type="date" id="apClearTo" value="${apClearTo}" style="border:1px solid var(--rule-dk);border-radius:3px;padding:5px 7px;font-family:'Inter';font-size:12.5px;">
        <button class="btn btn-danger btn-sm" id="apClearAllBtn">${(apClearFrom||apClearTo) ? `Clear ${bills.filter(b=>inRange(b.date, apClearFrom||null, apClearTo||null)).length} Bills in Range` : `Clear All ${bills.length} Bills`}</button>
      </div>`:''}
      <table class="led">
        <thead><tr><th>${t('col_supplier')}</th><th>${t('col_date')}</th><th>${t('col_description')}</th><th class="num-col">${t('col_amount')}</th><th class="num-col">${t('col_paid')}</th><th class="num-col">${t('col_outstanding')}</th><th>${t('col_status')}</th><th>${t('col_record_payment')}</th></tr></thead>
        <tbody>
          ${bills.map(b=>{
            const vendor = state.vendors.find(v=>v.id===b.vendorId);
            const outstanding = billOutstanding(b);
            const status = outstanding<=0.01 ? 'Paid' : 'Open';
            return `<tr data-row-search="${esc(((vendor?vendor.name:'')+' '+(b.description||'')).toLowerCase())}" ${!vendor?'data-no-link="1"':''}>
              <td>${esc(vendor?vendor.name:'—')}</td>
              <td>${b.date}</td><td>${b.entryRef ? `<a href="#" data-open-gl-entry="${esc(b.entryRef)}" title="See this transaction in the General Ledger">${esc(b.description)}</a>` : esc(b.description)}</td>
              <td class="num-col num">${fmt(b.netPay)}</td>
              <td class="num-col num">${fmt(b.paid)}</td>
              <td class="num-col num" style="font-weight:700;">${fmt(outstanding)}</td>
              <td><span class="badge ${status==='Paid'?'ok':'pending'}">${status==='Paid'?t('status_paid'):t('status_open')}</span></td>
              <td style="white-space:nowrap;">${outstanding>0.01?`
                <input type="number" class="num-in" step="0.01" min="0.01" max="${outstanding}" value="${outstanding}" data-pay-amt-bill="${b.id}" style="width:110px;display:inline-block;">
                ${payAccountSelectHtml('data-pay-acct-bill', b.id)}
                <button class="btn btn-primary btn-sm" data-save-pay-bill="${b.id}">${t('btn_save')}</button>
              `:''}
              <button class="icon-x" data-del-bill="${b.id}" title="Delete this bill">✕</button></td>
            </tr>`;
          }).join('')}
          ${bills.length===0?`<tr><td colspan="8" style="text-align:center;color:var(--text-soft);padding:20px;">${t('empty_ap')}</td></tr>`:''}
        </tbody>
      </table>
    </div>
  `;
}

    <thead><tr><th>Description</th><th style="text-align:center;">Qty</th><th style="text-align:right;">Unit Price</th><th style="text-align:right;">Amount</th></tr></thead>

// These compact "card" boxes are sized to sit neatly in a sidebar on
// screen — small headings, tight padding — so printing their HTML verbatim
// used to come out as a small block of text lost in the middle of an
// otherwise blank printed page. Since a card's own text uses fixed inline
// pixel font-sizes (not something an external stylesheet in the popup
// window can override), this walks the cloned content and scales every
// inline font-size up by a fixed factor before printing, while the popup's
// own CSS widens the printable area — together making the printout fill a
// large, legible majority of the page instead of a tiny corner of it.
function scalePrintClone(clone, factor){
  [clone, ...clone.querySelectorAll('*')].forEach(el=>{
    const fs = el.style && el.style.fontSize;
    if(fs && fs.endsWith('px')){
      const n = parseFloat(fs);
      if(!isNaN(n)) el.style.fontSize = Math.round(n*factor*10)/10 + 'px';
    }
  });
}

function excelSafeSheetName(name){

// Exports every visible table in the current financial statement tab to an
// .xlsx file — for Balance Sheet's two side-by-side tables (Assets /
// Liabilities & Equity), each becomes its own sheet in the same workbook.
/* ============================================================
   TAX RECONCILIATION EXPORT — split General Ledger transactions into
   those with VAT applied (any line touching VAT Input 1300 or VAT
   Output 2100) vs. those with none, within a chosen date range, and
   download either group as a clean Excel file for reconciliation.
   ============================================================ */
function getTaxReconciliationLines(from, to, hasTax){
  const inRangeLines = state.gl.filter(l=> inRange(l.date, from||null, to||null));
  const entriesMap = {};
  inRangeLines.forEach(l=>{
    const ref = l.entry || '(no ref)';
    if(!entriesMap[ref]) entriesMap[ref] = [];
    entriesMap[ref].push(l);
  });
  const matchingRefs = Object.keys(entriesMap).filter(ref=>{
    const hasVatLine = entriesMap[ref].some(l=> (l.account==='1300' || l.account==='2100') && ((Number(l.debit)||0)>0 || (Number(l.credit)||0)>0));
    return hasTax ? hasVatLine : !hasVatLine;
  });
  const matchingLines = [];
  matchingRefs.forEach(ref=> matchingLines.push(...entriesMap[ref]));
  return matchingLines.sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (a.entry||'').localeCompare(b.entry||''));
}

function exportTaxReconciliation(from, to, hasTax){

/* ============================================================
   BANK RECONCILIATION — upload a bank statement PDF, auto-extract
   its transactions, auto-match them against the ledger, and work
   through what's left in a two-panel view (Bank Statement | General
   Ledger), same pattern used by QuickBooks/Xero/Sage:
     🟢 Cleared     — exists on both sides, matched
     🟡 Outstanding — in the ledger, not yet on the bank statement
     🔵 Bank Only   — on the statement, not yet in the ledger
   ============================================================ */
let bankRecAccount = null;
let bankRecDate = todayISO();
let bankRecStatementBalance = '';
let bankStatementLines = []; // working set for the CURRENT reconciliation session: {id, date, description, amount, matchedGlId}
let brSelectedBankLine = null;
let brSelectedGlLine = null;

function cashBankAccounts(){
  return state.accounts.filter(a=>a.type==='Asset' && (a.code==='1000' || a.code==='1010' || /cash|bank/i.test(a.name)));
}

// A small inline <select> of cash/bank accounts for "which account did this
// actually move through" — used anywhere a Record Payment action would
// otherwise silently assume a single default bank account.
function payAccountSelectHtml(attr, id, selectedCode){
  const accts = cashBankAccounts();
  const fallback = (accts[0]||{}).code || '1010';
  const sel = selectedCode || fallback;
  return `<select ${attr}="${id}" title="Which account did this money move through?" style="font-size:12px;padding:4px 6px;">
    ${accts.map(a=>`<option value="${a.code}" ${a.code===sel?'selected':''}>${esc(tAccountName(a.code,a.name))}</option>`).join('')}
  </select>`;
}
function selectedPayAccount(attr, id){
  const el = document.querySelector(`[${attr}="${id}"]`);
  const accts = cashBankAccounts();
  return (el && el.value) || (accts[0]||{}).code || '1010';
}

// Turns one raw amount token ("5,000,000.00", "(2,000,000.00)", "-15,000.00")
// into a signed number. Parentheses and a leading minus both mean negative
// (money out), matching common bank statement conventions.
function parseAmountToken(tok){
  let negative = false;
  let clean = String(tok||'').trim();
  if(clean.startsWith('(') && clean.endsWith(')')){ negative = true; clean = clean.slice(1,-1); }
  if(clean.startsWith('-')){ negative = true; clean = clean.slice(1); }
  clean = clean.replace(/,/g,'').replace(/\s/g,'');
  const val = parseFloat(clean)||0;
  return negative ? -val : val;
}

// Best-effort line-based parser: works on the raw TEXT already extracted
// from a bank statement PDF (by pdf.js). Every line that starts with a
// recognizable date and contains at least one currency-looking amount is
// treated as a transaction. Bank statement layouts vary a lot, so this is
// deliberately forgiving — the parsed result is always shown for review
// and correction before being used in the reconciliation, never applied
// blindly.
function parseBankStatementText(rawText){
  const lines = String(rawText||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const dateRegex = /^(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})/;
  // Requires either comma-thousands grouping (5,000,000) or explicit cents
  // (402.00) — real monetary amounts on a bank statement always have one or
  // the other. This deliberately does NOT match bare small integers like a
  // cheque number ("4021" in "Supplier Cheque 4021"), which would otherwise
  // get misread as an amount.
  const amountRegex = /\(?-?\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?\)?|\(?-?\d+\.\d{1,2}\)?/g;
  const transactions = [];

  lines.forEach(line=>{
    const dateMatch = line.match(dateRegex);
    if(!dateMatch) return; // not a transaction line (header, footer, page number, etc.)
    const dateStr = parseImportedDate(dateMatch[1]);
    const rest = line.slice(dateMatch[0].length).trim();
    const amounts = rest.match(amountRegex);
    if(!amounts || amounts.length===0) return;

    // Description is everything before the first matched amount.
    const firstIdx = rest.indexOf(amounts[0]);
    const description = (firstIdx>0 ? rest.slice(0, firstIdx) : '').trim() || 'Transaction';

    // If the line has 2+ numbers (e.g. "amount ... running balance"), the
    // LAST one is usually the running balance — use the first as the
    // actual transaction amount. With exactly one number, use it directly.
    const amt = parseAmountToken(amounts[0]);
    if(amt===0) return;
    transactions.push({id:uid(), date:dateStr, description, amount:amt, matchedGlId:null});
  });
  return transactions;
}

// Wrapper that actually reads the PDF file via pdf.js, extracts all text
// across every page, then hands it to the pure text parser above.
async function extractBankStatementFromPDF(file){
  if(typeof pdfjsLib === 'undefined'){
    throw new Error('PDF library did not load — check your internet connection and reload the page.');
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let fullText = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // pdf.js gives individual text fragments with x/y positions but no
    // reliable line breaks — group fragments by their y-coordinate (rounded)
    // to reconstruct rows before parsing.
    const rows = {};
    content.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      if(!rows[y]) rows[y] = [];
      rows[y].push({x:item.transform[4], str:item.str});
    });
    const sortedY = Object.keys(rows).map(Number).sort((a,b)=>b-a);
    sortedY.forEach(y=>{
      const rowText = rows[y].sort((a,b)=>a.x-b.x).map(f=>f.str).join(' ');
      fullText += rowText + '\n';
    });
  }
  return parseBankStatementText(fullText);
}

// Auto-matches bank statement lines against unreconciled ledger lines for
// the selected account, by amount (exact) and date (within a window, since
// clearing delays are normal). Matched pairs are marked Cleared on both
// sides; nothing already matched is touched again.
function autoMatchBankStatement(dateWindowDays){
  dateWindowDays = dateWindowDays || 10;
  const glLines = state.gl.filter(l=>l.account===bankRecAccount && (!bankRecDate || (l.date||'')<=bankRecDate) && !l.excludeFromRecon);
  const claimedGlIds = new Set(bankStatementLines.filter(b=>b.matchedGlId).map(b=>b.matchedGlId));
  let matchedCount = 0;
  bankStatementLines.forEach(bl=>{
    if(bl.matchedGlId) return;
    const candidate = glLines.find(gl=>{
      if(claimedGlIds.has(gl.id)) return false;
      const glNet = (Number(gl.debit)||0) - (Number(gl.credit)||0);
      if(Math.abs(glNet - bl.amount) > 0.01) return false;
      const dayDiff = Math.abs((new Date(gl.date+'T00:00:00') - new Date(bl.date+'T00:00:00')) / 86400000);
      return dayDiff <= dateWindowDays;
    });
    if(candidate){
      bl.matchedGlId = candidate.id;
      candidate.reconciled = true;
      claimedGlIds.add(candidate.id);
      matchedCount++;
    }
  });
  return matchedCount;
}

// Guesses which account to offset a "Bank Only" item against, from its
// description — e.g. bank charges, interest. Purely a lookup against
// EXISTING accounts (both are seeded as defaults) — never creates
// anything, since this runs during render and must have no side effects.
function guessOffsetAccount(description){
  const d = String(description||'').toLowerCase();
  if(/charge|fee|commission|maintenance/.test(d)){
    const acct = state.accounts.find(a=>a.name.toLowerCase()==='bank charges');
    return acct ? acct.code : null;
  }
  if(/interest/.test(d)){
    const acct = state.accounts.find(a=>a.name.toLowerCase()==='interest income');
    return acct ? acct.code : null;
  }
  return null;
}

// Records a "Bank Only" statement line into the ledger (money the bank
// already processed but that hasn't been recorded yet — bank charges,
// interest, etc.), then marks it Cleared since it's now in both places.
function addBankOnlyToLedger(bankLineId, offsetAccountCode){
  const bl = bankStatementLines.find(b=>b.id===bankLineId);
  if(!bl || !offsetAccountCode) return false;
  const amt = bl.amount;
  const entryRef = 'BANKSTMT-'+bl.id.slice(0,6);
  let bankSideLine;
  if(amt >= 0){
    bankSideLine = {id:uid(), date:bl.date, entry:entryRef, account:bankRecAccount, memo:bl.description, debit:amt, credit:0, reconciled:true};
    state.gl.push(bankSideLine);
    state.gl.push({id:uid(), date:bl.date, entry:entryRef, account:offsetAccountCode, memo:bl.description, debit:0, credit:amt});
  } else {
    bankSideLine = {id:uid(), date:bl.date, entry:entryRef, account:bankRecAccount, memo:bl.description, debit:0, credit:-amt, reconciled:true};
    state.gl.push(bankSideLine);
    state.gl.push({id:uid(), date:bl.date, entry:entryRef, account:offsetAccountCode, memo:bl.description, debit:-amt, credit:0});
  }
  bl.matchedGlId = bankSideLine.id;
  saveState();
  return true;
}

  const claimedGlIds = new Set(bankStatementLines.filter(b=>b.matchedGlId).map(b=>b.matchedGlId));
  const clearedTotal = glLines.filter(l=>claimedGlIds.has(l.id) || l.reconciled).reduce((s,l)=>s+(Number(l.debit)||0)-(Number(l.credit)||0),0);

  const statementBal = parseFloat(bankRecStatementBalance)||0;
  const bankOnlyLines = bankStatementLines.filter(b=>!b.matchedGlId);
  const bankOnlyTotal = bankOnlyLines.reduce((s,b)=>s+b.amount,0);
  const difference = statementEntered ? (statementBal - clearedTotal - bankOnlyTotal) : null;
  const balanced = statementEntered && Math.abs(difference) < 0.005 && bankOnlyLines.length===0;

  const glStatus = (l)=> (claimedGlIds.has(l.id) || l.reconciled) ? 'cleared' : 'outstanding';

      <div class="grand" style="color:${balanced?'var(--ledger-green-dk)':'var(--ink-red)'};">${!statementEntered?'Enter the statement balance to begin':(balanced?'✓ Reconciled — difference is zero':(bankOnlyLines.length>0 ? '🔵 '+bankOnlyLines.length+' bank-only item(s) still need recording' : '⚠ Difference: '+fmt(Math.abs(difference))))}</div>
    </div>

    <div class="grid-2">
      <div class="ledger-panel">
        <div class="section-label">Bank Statement (${bankStatementLines.length})</div>
        <div style="max-height:380px;overflow:auto;">
        <table class="led">
          <thead><tr><th></th><th>Date</th><th>Description</th><th class="num-col">Amount</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${bankStatementLines.map(bl=>{
              const cleared = !!bl.matchedGlId;
              const guessedAcct = cleared ? null : guessOffsetAccount(bl.description);
              return `<tr ${brSelectedBankLine===bl.id?'style="background:rgba(192,138,40,0.12);"':''}>
                <td style="text-align:center;">${cleared?'':`<input type="radio" name="brBankSel" data-bank-select="${bl.id}" ${brSelectedBankLine===bl.id?'checked':''}>`}</td>
                <td>${bl.date}</td><td>${esc(bl.description)}</td>
                <td class="num-col num">${fmt(bl.amount)}</td>
                <td>${cleared?'<span class="badge ok">🟢 Cleared</span>':'<span class="badge pending">🔵 Bank Only</span>'}</td>
                <td style="white-space:nowrap;">
                  ${!cleared ? `
                    <select data-bank-offset="${bl.id}" style="font-size:11px;padding:3px 4px;max-width:110px;">
                      <option value="">Account…</option>
                      ${state.accounts.filter(a=>a.type==='Expense'||a.type==='Income').map(a=>`<option value="${a.code}" ${guessedAcct===a.code?'selected':''}>${esc(tAccountName(a.code,a.name))}</option>`).join('')}
                    </select>
                    <button class="btn btn-ghost btn-sm" data-add-to-ledger="${bl.id}" title="Record this in the ledger">+ Add</button>
                    <button class="icon-x" data-del-bank-line="${bl.id}" title="Remove">✕</button>
                  ` : ''}
                </td>
              </tr>`;
            }).join('')}
            ${bankStatementLines.length===0?'<tr><td colspan="6" style="text-align:center;color:var(--text-soft);padding:16px;">Upload a statement, or add lines manually.</td></tr>':''}
          </tbody>
        </table>
        </div>
      </div>
      <div class="ledger-panel">
        <div class="section-label">Accounting Records — General Ledger (${glLines.length})</div>
        <div style="max-height:380px;overflow:auto;">
        <table class="led">
          <thead><tr><th></th><th>Date</th><th>Memo</th><th class="num-col">Debit</th><th class="num-col">Credit</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${glLines.map(l=>{
              const status = glStatus(l);
              return `<tr ${brSelectedGlLine===l.id?'style="background:rgba(192,138,40,0.12);"':''}>
                <td style="text-align:center;">${status==='cleared'?'':`<input type="radio" name="brGlSel" data-gl-select="${l.id}" ${brSelectedGlLine===l.id?'checked':''}>`}</td>
                <td>${l.date||''}</td><td>${esc(l.memo)}</td>
                <td class="num-col num">${l.debit?fmt(l.debit):''}</td>
                <td class="num-col num">${l.credit?fmt(l.credit):''}</td>
                <td>${status==='cleared'?'<span class="badge ok">🟢 Cleared</span>':'<span class="badge pending">🟡 Outstanding</span>'}</td>
                <td><button class="icon-x" data-hide-gl-entry="${esc(l.entry)}" title="Remove from this reconciliation view only — does not change the actual General Ledger entry">✕</button></td>
              </tr>`;
            }).join('')}
            ${glLines.length===0?'<tr><td colspan="7" style="text-align:center;color:var(--text-soft);padding:16px;">No transactions posted to this account yet.</td></tr>':''}
          </tbody>
        </table>
        </div>
      </div>
    </div>

    <div class="ledger-panel" style="margin-top:18px;">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button class="btn btn-ghost" id="brMatchSelectedBtn" ${(!brSelectedBankLine || !brSelectedGlLine)?'disabled':''}>🔗 Match Selected Pair</button>
        <button class="btn btn-primary" id="brSaveBtn" ${!balanced?'disabled':''}>Save Reconciliation</button>
      </div>
      <div class="note">🟢 Cleared — matched on both sides. 🟡 Outstanding — recorded in your books, hasn't shown on the bank statement yet (e.g. an unpresented cheque) — this is normal and doesn't block saving. 🔵 Bank Only — the bank already processed it but it isn't in your books yet — pick an account and click Add to record it. Select one line from each panel and click Match Selected Pair to link them manually if Auto-Match missed a valid pair.</div>
    </div>
    ${renderBankRecHistory()}
  `;
}

/* ============================================================
   BANK STATEMENT IMPORT
   ============================================================ */
let bankImportAccount = null;      // which Cash/Bank account this statement belongs to
let bankImportCurrency = null;     // null = base currency (RWF)
let bankImportFxRate = '';         // default rate applied to every row on import; editable per row after

function renderBankImport(){
  const bankAccounts = cashBankAccounts();
  if(!bankImportAccount || !bankAccounts.some(a=>a.code===bankImportAccount)){
    bankImportAccount = bankAccounts.length ? bankAccounts[0].code : null;
  }
  const foreignCurrencies = (state.currencies||[]).filter(c=>!c.base);
  // Auto-fill the rate field from the currency's own saved default the
  // moment a currency is picked, rather than leaving it blank each time —
  // "Update Today's Rate" below is what keeps that saved default current.
  if(bankImportCurrency && !bankImportFxRate){
    const cur = foreignCurrencies.find(c=>c.code===bankImportCurrency);
    if(cur) bankImportFxRate = String(cur.rate);
  }
  const postableAccounts = state.accounts.filter(a=>['Asset','Liability','Equity','Income','Expense'].includes(a.type));
  if(purgePostedBankStaging(state) > 0 && !isViewOnly()) saveState();
  const staging = state.bankStaging||[];
  const rules = state.bankRules||[];
  const needsRepairCount = repairBankImportCurrencyFields(true);

  return `
    ${reportHeader(t('nav_bankimport'), 'Upload a bank statement export and record its transactions — each one is staged for your review first, and nothing posts to the ledger until you confirm it.')}

    ${needsRepairCount>0 ? `
    <div class="ledger-panel" style="margin-bottom:22px;border-left:3px solid var(--amber,#c08a28);">
      <div class="section-label" style="color:#8a611c;">⚠ ${needsRepairCount} Previously-Posted Entr${needsRepairCount===1?'y':'ies'} Need Repair</div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">These were posted before a fix to how the original foreign-currency amount was tagged for editing — the real RWF debit/credit used by the Income Statement and Balance Sheet was always correct, only the figure shown when you open the entry to edit it was scrambled. This repairs that reference field only; no amounts, accounts, or totals change.</p>
      <button class="btn btn-primary btn-sm" id="bankImportRepairBtn">Repair ${needsRepairCount} Entr${needsRepairCount===1?'y':'ies'}</button>
    </div>
    ` : ''}

    <div class="ledger-panel" style="margin-bottom:22px;">
      <div class="section-label">Upload a Statement</div>
      <div class="field-row">
        <div class="field" style="min-width:200px;"><label>Bank Account</label>
          <select id="bankImportAccountSelect">${bankAccounts.map(a=>`<option value="${a.code}" ${bankImportAccount===a.code?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
        </div>
        <div class="field" style="min-width:160px;"><label>Statement Currency</label>
          <select id="bankImportCurrencySelect">
            <option value="" ${!bankImportCurrency?'selected':''}>${esc(baseCurrencyCode())} (base)</option>
            ${foreignCurrencies.map(c=>`<option value="${c.code}" ${bankImportCurrency===c.code?'selected':''}>${esc(c.code)}</option>`).join('')}
          </select>
        </div>
        ${bankImportCurrency ? `<div class="field" style="min-width:220px;"><label>Default Rate (1 ${esc(bankImportCurrency)} = ? ${esc(baseCurrencyCode())})</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="number" step="0.01" id="bankImportFxRateInput" value="${esc(bankImportFxRate)}" placeholder="e.g. 1300" style="flex:1;">
            <button class="btn btn-ghost btn-sm" id="bankImportUpdateRateBtn" title="Save this as the new standing default rate for ${esc(bankImportCurrency)}">✎ Update Today's Rate</button>
          </div>
        </div>` : ''}
        <div class="field"><label>Statement File</label>
          <button class="btn btn-ghost" id="bankImportUploadBtn">📤 Upload CSV / Excel / PDF</button>
          <input type="file" id="bankImportFile" accept=".csv,.xlsx,.xls,.pdf" style="display:none;">
        </div>
      </div>
      <p style="font-size:12px;color:var(--text-soft);margin:8px 0 0;">CSV/Excel expects a Date column, a Description/Narration column, and Debit and/or Credit columns — any bank's own naming and column order is fine, and extra columns (Value Date, Transaction ID, Balance, etc.) are simply ignored. PDF statements work too, but only digitally-generated ones (the kind your bank emails or exports directly) — a scanned or photographed PDF has no real text to read and will be rejected rather than guessed at. PDF-extracted rows are flagged below for extra review, since reading a visual layout is inherently less exact than a real spreadsheet column.</p>
      ${bankImportCurrency ? `<p style="font-size:12px;color:var(--text-soft);margin:6px 0 0;">Check the official rate at <a href="https://www.bnr.rw/avgexchangerate" target="_blank" rel="noopener">bnr.rw/avgexchangerate</a>, then click "Update Today's Rate" to save it — every future import defaults to whatever you last saved here, until you update it again.</p>` : ''}
    </div>

    <div class="ledger-panel" style="margin-bottom:22px;">
      <div class="section-label">Classification Rules</div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">Whenever a transaction's description contains one of these keywords, it's automatically suggested for that account on future imports — the review table below still lets you change it per transaction, this just saves you the repeat work. Add a rule any time by ticking "Remember this" on a row below.</p>
      ${rules.length ? `
      <table class="led">
        <thead><tr><th>Keyword</th><th>Suggested Account</th><th></th></tr></thead>
        <tbody>
          ${rules.map(r=>{ const acct = state.accounts.find(a=>a.code===r.accountCode); return `<tr>
            <td>${esc(r.keyword)}</td>
            <td>${acct?esc(acct.code+' — '+acct.name):'—'}</td>
            <td><button class="icon-x" data-del-bankrule="${r.id}" title="Delete rule">✕</button></td>
          </tr>`; }).join('')}
        </tbody>
      </table>
      ` : `<p style="font-size:13px;color:var(--text-soft);">No rules yet — they'll build up as you review and confirm imports below.</p>`}
    </div>

    ${staging.length ? `
    <div class="ledger-panel">
      <div class="section-label">Review Before Posting (${staging.length} transaction${staging.length===1?'':'s'})</div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">Nothing here has been recorded yet. Assign an account to every row, then post — rows without an account assigned are skipped when you post, so you can leave a few for later without losing your place.${staging.some(s=>s.fromPdf) ? ' Rows marked <strong>⚠ PDF</strong> were extracted from a PDF\'s visual layout rather than a real spreadsheet column — double-check the date, description, and amount on those before posting.' : ''}</p>
      <table class="led">
        <thead><tr><th>Date</th><th>Description</th><th class="num-col">Amount</th><th>Direction</th>${staging.some(s=>s.currency)?`<th class="num-col">Rate</th>`:''}<th>Account</th><th>Remember</th><th></th></tr></thead>
        <tbody>
          ${staging.map(s=>`<tr${s.fromPdf?' style="background:rgba(200,140,40,0.06);"':''}>
            <td style="white-space:nowrap;">${esc(s.date)}${s.fromPdf?' <span class="badge pending" title="Extracted from a PDF\'s visual layout — verify this row carefully before posting.">⚠ PDF</span>':''}</td>
            <td>${esc(s.description)}</td>
            <td class="num-col num">${fmt(s.amount)}${s.currency?' '+esc(s.currency):''}</td>
            <td>${s.direction==='credit' ? 'Money In' : 'Money Out'}</td>
            ${staging.some(x=>x.currency)?`<td class="num-col">${s.currency?`<input type="number" step="0.01" class="num-in" data-staging-rate="${s.id}" value="${s.fxRate||''}" style="width:90px;" title="${s.currency+' → '+baseCurrencyCode()}">`:''}</td>`:''}
            <td><select data-staging-acct="${s.id}" style="min-width:200px;">
              <option value="">— choose account —</option>
              ${postableAccounts.map(a=>`<option value="${a.code}" ${s.accountCode===a.code?'selected':''}>${esc(a.code+' — '+a.name)}</option>`).join('')}
            </select></td>
            <td style="text-align:center;"><input type="checkbox" data-staging-remember="${s.id}"></td>
            <td><button class="icon-x" data-staging-discard="${s.id}" title="Discard this row without posting">✕</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;">
        <button class="btn btn-ghost" id="bankImportDiscardAllBtn">Discard All</button>
        <button class="btn btn-primary" id="bankImportPostBtn">Post Assigned Transactions to the Ledger</button>
      </div>
    </div>
    ` : ''}
  `;
}


let pettyCashEntryType = 'disbursement'; // 'disbursement' | 'replenishment' | 'float_setup'
let pcExportFrom = null;
let pcExportTo = null;
let pcExportFormat = 'excel';

function renderPettyCash(){
  if(!pettyCashMonth) pettyCashMonth = todayISO().slice(0,7);
  const month = pettyCashMonth;
  const monthName = new Date(month+'-01T00:00:00').toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const meta = getPettyCashMeta(month);
  const closed = meta.closed;
  const floatEstablished = state.pettyCash.entries.some(e=>e.type==='float_setup');
  const balance = pettyCashBalance(todayISO());
  const sinceRepl = pettyCashSinceLastReplenishment();
  const belowFloat = floatEstablished && balance < state.pettyCash.floatTarget;

  const monthStart = month+'-01';
  const monthEnd = month+'-'+String(daysInMonth(month)).padStart(2,'0');
  const openingBalance = pettyCashBalance(addDays(monthStart,-1));
  const monthEntries = state.pettyCash.entries
    .filter(e=> e.date>=monthStart && e.date<=monthEnd)
    .sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));

  let running = openingBalance;
  const logRows = monthEntries.map(e=>{
    const isIn = e.type==='replenishment' || e.type==='float_setup';
    running += isIn ? Number(e.amount) : -Number(e.amount);
    const cat = e.categoryId ? state.pettyCash.categories.find(c=>c.id===e.categoryId) : null;
    const typeLabel = e.type==='float_setup' ? 'Float Setup' : e.type==='replenishment' ? 'Replenishment' : (cat?cat.name:'—');
    return `<tr>
      <td style="font-size:12px;color:var(--text-soft);">${e.date}</td>
      <td class="mono" style="font-size:11.5px;color:var(--text-soft);">${esc(e.voucherNo)}</td>
      <td>${esc(e.description)}</td>
      <td style="font-size:12px;">${esc(typeLabel)}</td>
      <td class="num-col num" style="color:var(--ledger-green-dk);">${isIn?fmt(e.amount):''}</td>
      <td class="num-col num" style="color:var(--ink-red);">${!isIn?fmt(e.amount):''}</td>
      <td class="num-col num" style="font-weight:700;">${fmt(running)}</td>
    </tr>`;
  }).join('');

  return `
    <h1 class="page-title">${t('title_pettycash')}</h1>
    <p class="page-sub">${t('sub_pettycash')}</p>

    <div class="kpi-tiles">
      <div class="kpi-card"><div class="k-label">Current Balance</div><div class="k-val" style="${belowFloat?'color:var(--ink-red);':''}">${fmt(balance)}</div></div>
      <div class="kpi-card"><div class="k-label">Float Target</div><div class="k-val">${fmt(state.pettyCash.floatTarget)}</div></div>
      <div class="kpi-card"><div class="k-label">Spent Since Last Top-Up</div><div class="k-val">${fmt(sinceRepl.total)}</div></div>
    </div>

    ${!floatEstablished ? `
    <div class="section-label">Set Up the Float</div>
    <div class="ledger-panel" style="margin-bottom:22px;">
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">Before logging any spending, establish the starting cash float — this is the fixed amount you'll keep replenishing back up to as it gets spent down.</p>
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="pcSetupDate" value="${todayISO()}"></div>
        <div class="field"><label>Float Amount (RWF)</label><input type="number" class="num-in" id="pcSetupAmount" value="${state.pettyCash.floatTarget}"></div>
        <div class="field"><label>Funded From</label><select id="pcSetupSource">${state.accounts.filter(a=>a.type==='Asset').map(a=>`<option value="${a.code}" ${a.code==='1010'?'selected':''}>${a.code} — ${esc(a.name)}</option>`).join('')}</select></div>
        <button class="btn btn-primary btn-sm" id="pcSetupBtn">Establish Float</button>
      </div>
    </div>
    ` : `
    ${belowFloat ? `
    <div style="background:rgba(192,138,40,0.1);border:1px solid var(--amber);border-radius:4px;padding:10px 14px;margin-bottom:18px;font-size:13px;">
      <strong style="color:#8a611c;">⚠ Below float.</strong> ${fmt(sinceRepl.total)} spent across ${sinceRepl.count} disbursement${sinceRepl.count===1?'':'s'} since the last top-up. Replenishing that amount restores the float to ${fmt(state.pettyCash.floatTarget)}.
      <button class="btn btn-primary btn-sm" id="pcQuickReplenishBtn" style="margin-left:8px;">Replenish ${fmt(sinceRepl.total)} Now</button>
    </div>
    ` : ''}

    <div class="section-label">Log an Entry</div>
    <div class="ledger-panel" style="margin-bottom:22px;">
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button class="btn ${pettyCashEntryType==='disbursement'?'btn-primary':'btn-ghost'} btn-sm" data-pc-type="disbursement">Disbursement (spend)</button>
        <button class="btn ${pettyCashEntryType==='replenishment'?'btn-primary':'btn-ghost'} btn-sm" data-pc-type="replenishment">Replenishment (top-up)</button>
      </div>
      ${!closed ? (pettyCashEntryType==='disbursement' ? `
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="pcDate" value="${todayISO()}"></div>
        <div class="field" style="min-width:200px;"><label>Description / Payee</label><input type="text" id="pcDescription" placeholder="e.g. Taxi to bank, printer paper"></div>
        <div class="field"><label>Category</label><select id="pcCategory">${state.pettyCash.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Amount (RWF)</label><input type="number" class="num-in" id="pcAmount" placeholder="0"></div>
        <button class="btn btn-primary btn-sm" id="pcAddDisbursementBtn">Add</button>
      </div>
      ` : `
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="pcReplDate" value="${todayISO()}"></div>
        <div class="field"><label>Amount (RWF)</label><input type="number" class="num-in" id="pcReplAmount" value="${sinceRepl.total||''}" placeholder="${sinceRepl.total}"></div>
        <div class="field"><label>From</label><select id="pcReplSource">${state.accounts.filter(a=>a.type==='Asset').map(a=>`<option value="${a.code}" ${a.code==='1010'?'selected':''}>${a.code} — ${esc(a.name)}</option>`).join('')}</select></div>
        <button class="btn btn-primary btn-sm" id="pcAddReplenishmentBtn">Add</button>
      </div>
      `) : `<p class="note" style="margin:0;">${esc(monthName)} is closed — switch to a different month to log new entries.</p>`}
    </div>

    <div class="section-label">Spend Categories</div>
    <div class="ledger-panel" style="margin-bottom:22px;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
        ${state.pettyCash.categories.map(c=>`<span class="badge pending">${esc(c.name)}</span>`).join('')}
      </div>
      <div class="field-row">
        <div class="field"><label>Add Category</label><input type="text" id="pcNewCategoryName" placeholder="e.g. Airtime & Data"></div>
        <button class="btn btn-ghost btn-sm" id="pcAddCategoryBtn">Add Category</button>
      </div>
    </div>

    <div class="section-label">Log — ${esc(monthName)}</div>
    <div class="ledger-panel" style="margin-bottom:22px;">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
        <label style="font-size:12px;color:var(--text-soft);font-weight:600;">Month:</label>
        <input type="month" id="pcMonthInput" value="${month}">
        ${closed ? `<span class="badge ok">🔒 Closed ${new Date(meta.closedAt).toLocaleDateString()}</span>` : ''}
      </div>
      <div style="overflow-x:auto;">
      <table class="led" id="pettyCashTable">
        <thead><tr><th>Date</th><th>Voucher</th><th>Description</th><th>Category / Type</th><th class="num-col">Received</th><th class="num-col">Paid Out</th><th class="num-col">Balance</th></tr></thead>
        <tbody>
          <tr style="font-style:italic;color:var(--text-soft);"><td colspan="6">Opening balance (${esc(monthName)})</td><td class="num-col num">${fmt(openingBalance)}</td></tr>
          ${logRows || '<tr><td colspan="7" style="text-align:center;color:var(--text-soft);padding:16px;">No entries this month.</td></tr>'}
        </tbody>
      </table>
      </div>
    </div>

    <div class="section-label">Export</div>
    <div class="ledger-panel" style="margin-bottom:22px;">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <span style="font-size:11.5px;color:var(--text-soft);font-weight:600;">Range:</span>
        <input type="date" id="pcExportFromInput" value="${pcExportFrom||monthStart}" style="padding:5px 7px;font-size:12px;border:1px solid var(--rule-dk);border-radius:3px;">
        <span style="font-size:11.5px;color:var(--text-soft);">to</span>
        <input type="date" id="pcExportToInput" value="${pcExportTo||monthEnd}" style="padding:5px 7px;font-size:12px;border:1px solid var(--rule-dk);border-radius:3px;">
        <select id="pcExportFormatInput" style="padding:5px 7px;font-size:12px;border:1px solid var(--rule-dk);border-radius:3px;">
          <option value="excel" ${pcExportFormat==='excel'?'selected':''}>Excel (.xlsx)</option>
          <option value="pdf" ${pcExportFormat==='pdf'?'selected':''}>PDF</option>
        </select>
        <button class="btn btn-primary btn-sm" id="pcExportBtn">⬇ Download</button>
      </div>
    </div>

    <div class="section-label">Sign-Off &amp; Close ${esc(monthName)}</div>
    <div class="ledger-panel">
      <div class="field-row">
        <div class="field"><label>Prepared By</label><input type="text" id="pcPreparedBy" value="${esc(meta.preparedBy)}" placeholder="Name" ${closed?'disabled':''}></div>
        <div class="field"><label>Verified By</label><input type="text" id="pcVerifiedBy" value="${esc(meta.verifiedBy)}" placeholder="Name" ${closed?'disabled':''}></div>
        <div class="field"><label>Approved By</label><input type="text" id="pcApprovedBy" value="${esc(meta.approvedBy)}" placeholder="Name" ${closed?'disabled':''}></div>
      </div>
      ${closed ? '' : `<button class="btn btn-primary btn-sm" id="pcCloseBtn" style="margin-top:8px;">🔒 Close ${esc(monthName)}</button>
      <div class="note" style="margin-top:8px;">Once closed, no new entries can be logged for this month — Prepared By, Verified By, and Approved By must all be filled in first.</div>`}
    </div>
    `}
  `;
}

        <div class="field" style="min-width:220px;"><label>${t('col_name')}</label><input type="text" id="coaName" placeholder="Account name" value="${editing?esc(editing.name):''}"></div>
        <div class="field"><label>${t('col_type')}</label>

          <select id="mergeKeepAcct">${state.accounts.map(a=>`<option value="${a.code}">${a.code} — ${esc(tAccountName(a.code, a.name))}</option>`).join('')}</select>
        </div>
        <div class="field" style="min-width:260px;"><label>${t('coa_remove_account')}</label>
          <select id="mergeRemoveAcct">${state.accounts.map(a=>`<option value="${a.code}">${a.code} — ${esc(tAccountName(a.code, a.name))}</option>`).join('')}</select>

        <button class="btn btn-primary" id="mergeAcctsBtn">${t('coa_merge_btn')}</button>

    <div class="ledger-panel">
      <div class="field-row" style="margin-bottom:14px;">
        <div class="field" style="min-width:280px;flex:1;">

          <input type="text" id="coaSearchInput" placeholder="Search by code or name, e.g. Gross Salary" autocomplete="off">

        <tbody id="coaTableBody">
          ${state.accounts.map(a=>{
            const displayName = tAccountName(a.code, a.name);
            const searchText = `${a.code} ${displayName} ${a.name}`.toLowerCase();
            return `
            <tr data-coa-row data-search-text="${esc(searchText)}" ${coaEditCode===a.code?'style="background:rgba(192,138,40,0.08);"':''}>

function renderTax(){
  const showTourism = isTourismTaxClient();
  if((taxSubTab==='tourism' || taxSubTab==='ebm') && !showTourism) taxSubTab = 'vat';
  const sub = {
    types: renderTaxTypes,
    vat: renderVATReport,
    ebm: renderEBMSplit,
    tourism: renderTourismReport,
    cit: renderCITTracker,
    tracker: renderTaxTracker
  };
  return `
    ${reportHeader(t('title_tax'), t('sub_tax'))}
    <div class="subnav" id="taxSubnav">
      <button data-taxsub="types" class="${taxSubTab==='types'?'active':''}">Tax Types</button>
      <button data-taxsub="vat" class="${taxSubTab==='vat'?'active':''}">VAT Report</button>

            <tr>
              <td>${esc(t.name)}</td>
              <td class="num-col num">${t.rate!==null ? (t.rate*100).toFixed(1)+'%' : '—'}</td>

              <td>${esc(t.deadline)}</td>
              <td>${esc(t.basis)}</td>
              <td style="font-size:12px;color:var(--text-soft);font-style:italic;">${esc(t.notes)}</td>
            </tr>`).join('')}

      </table>
      <div class="note">VAT, CIT, Tourism Tax and RSSB rates here mirror the live rates in Settings — update them there and this table and all reports follow automatically.</div>

}

function renderVATReport(){
  const v = computeVATReport(vatPeriodFrom, vatPeriodTo);
  const settlement = getVatSettlementForPeriod(vatPeriodTo);
  const monthLabel = monthLabelOf(vatPeriodTo);
  const payableBal = vatPayableBalance(vatPeriodTo);
  const claimedBal = vatClaimedBalance(vatPeriodTo);
  const inputBal = inputVATBalance(vatPeriodTo);
  const vatDupes = findDuplicateVatAccounts().map(d=>({...d, stats:accountLineStats(d.code)})).filter(d=>d.stats.count>0);
  return `
    ${vatDupes.length>0 ? `
    <div class="ledger-panel" style="margin-bottom:18px;border-left:3px solid var(--ink-red,#a33);">
      <div class="section-label" style="color:var(--ink-red,#a33);">⚠ VAT Is Sitting On The Wrong Account(s)</div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">
        ${vatDupes.map(d=>`<strong>${esc(d.code)} — ${esc(d.name)}</strong> (${d.stats.count} line${d.stats.count===1?'':'s'}, ${fmt(Math.abs(d.stats.net))})`).join(', ')}
        ${vatDupes.length===1?'looks like':'look like'} ${vatDupes.length===1?"it's":"they're"} really ${esc(acctName(vatDupes[0].canonicalCode))} under a different name — most likely from an import whose account name didn't exactly match what's already in your Chart of Accounts. The VAT Report only reads ${vatDupes.some(d=>d.canonicalCode==='1300')?'1300 (Input)':''}${vatDupes.some(d=>d.canonicalCode==='1300')&&vatDupes.some(d=>d.canonicalCode==='2100')?' and ':''}${vatDupes.some(d=>d.canonicalCode==='2100')?'2100 (Output)':''}, so this VAT is real, on your Balance Sheet, but invisible here until it's moved onto the right account.
      </p>
      <button class="btn btn-primary btn-sm" id="vatFixDupesBtn">🔧 Move to the Correct VAT Account</button>
    </div>
    ` : ''}
    <div class="field-row">
      <div class="field"><label>From</label><input type="date" id="vatFrom" value="${vatPeriodFrom}"></div>
      <div class="field"><label>To</label><input type="date" id="vatTo" value="${vatPeriodTo}"></div>
      <button class="btn btn-ghost" id="vatApply">Apply</button>
      <button class="btn btn-ghost" id="printReportBtn">🖨 Print / Save as PDF</button>
      <button class="btn btn-ghost" id="exportExcelBtn" data-report-title="VAT Report">📊 Export to Excel</button>
    </div>
    <div class="report-hero">
      <div>
        <div class="hero-label">${v.net>=0 ? 'Net VAT Payable' : 'Net VAT Claimed'}</div>
        <div class="hero-num ${v.net<0?'neg':''}">${fmt(Math.abs(v.net))} Frw</div>
      </div>
      <span class="badge ${v.net>=0?'pending':'ok'}">${v.net>=0 ? 'Payable' : 'Claimed (Asset)'}</span>
    </div>
    <div class="grid-2">
      <div class="ledger-panel">
        <div class="section-label">Output VAT (on Sales)</div>
        <table class="led"><tbody>
          <tr><td>VAT Output — ${esc(acctName('2100'))}</td><td class="num-col num">${fmt(v.outputVAT)}</td></tr>
          <tr class="total-row"><td>Total Output VAT</td><td class="num-col num">${fmt(v.outputVAT)}</td></tr>
        </tbody></table>
      </div>
      <div class="ledger-panel">
        <div class="section-label">Input VAT (on Purchases)</div>
        <table class="led"><tbody>
          <tr><td>VAT Input — ${esc(acctName('1300'))}</td><td class="num-col num">${fmt(v.inputVAT)}</td></tr>
          <tr class="total-row"><td>Total Input VAT</td><td class="num-col num">${fmt(v.inputVAT)}</td></tr>
        </tbody></table>
      </div>
    </div>
    <div class="ledger-panel" style="margin-top:18px;">
      <table class="led"><tbody>
        <tr><td>Output VAT</td><td class="num-col num">${fmt(v.outputVAT)}</td></tr>
        <tr><td>Less: Input VAT</td><td class="num-col num">(${fmt(v.inputVAT)})</td></tr>
        <tr class="total-row"><td>${v.net>=0 ? 'Net VAT Payable' : 'Net VAT Claimed'}</td><td class="num-col num ${v.net<0?'neg':''}">${fmt(Math.abs(v.net))}</td></tr>
      </tbody></table>
      <div class="note">Net VAT is calculated automatically as Output VAT (postings to account 2100) minus Input VAT (postings to account 1300) within the selected period. When Input exceeds Output, that's a VAT Claimed asset (a receivable from RRA); when Output exceeds Input, it's VAT Payable, a liability. File and pay by the 15th of the following month.</div>
    </div>

    <div class="ledger-panel" style="margin-top:18px;">
      <div class="section-label">Month-End VAT Closing — ${esc(monthLabel)}</div>
      ${settlement ? `
        <p style="font-size:13px;color:var(--text-soft);margin:0 0 8px;">Closed on ${settlement.date}: Output VAT ${fmt(settlement.outputVAT)} − Input VAT ${fmt(settlement.inputVAT)} = ${settlement.net>=0?'Net Payable':(settlement.nonRecoverable?'Net Claimed (not claimed)':'Net Claimed')} of ${fmt(Math.abs(settlement.net))} Frw, moved to ${settlement.nonRecoverable?'Non-Recoverable VAT Expense (5990)':(settlement.net>=0?'VAT Payable (2105)':'VAT Claimed (1310)')}.</p>
        <span class="badge ok">✓ Closed for ${esc(monthLabel)}</span>
      ` : `
        <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">Posts Dr Output VAT (2100) / Cr Input VAT (1300), with the net difference moved out to close the period. Can only be posted once per month.</p>
        ${v.net<0 ? `
          <div class="tax-toggle-row">
            <label><input type="radio" name="vatCloseTreatment" id="vatCloseTreatmentClaim" checked> Claim this refund from RRA (Dr VAT Claimed, 1310)</label>
            <label><input type="radio" name="vatCloseTreatment" id="vatCloseTreatmentNonRecov"> Not claiming it — non-recoverable (Dr Non-Recoverable VAT Expense, 5990)</label>
          </div>
        ` : ''}
        <div class="field-row">
          <button class="btn btn-primary" id="vatCloseBtn">Post Month-End VAT Closing</button>
        </div>
        ${!isLastDayOfMonth(vatPeriodTo) ? `<div class="note" style="margin-top:8px;">The "To" date isn't the last day of a month — set it to month-end before closing so the period matches a full filing month.</div>` : ''}
      `}
    </div>

    ${(()=>{
      const legacyCount = state.gl.filter(l=> l.account==='2105' && Number(l.debit)>0 && String(l.entry||'').startsWith('VAT-SETTLE-')).length;
      return legacyCount>0 ? `
      <div class="ledger-panel" style="margin-top:18px;border-left:3px solid var(--amber,#c08a28);">
        <div class="section-label" style="color:#8a611c;">⚠ ${legacyCount} Old VAT Closing Entr${legacyCount===1?'y':'ies'} Sitting in the Wrong Account</div>
        <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">
          These were posted before VAT Claimed (1310) and VAT Payable (2105) existed as separate accounts — a refundable position from those months got left as a debit in VAT Payable instead, which is why it shows as a negative liability on the Balance Sheet. This moves that debit to VAT Claimed instead, where it belongs. Nothing about VAT amounts, Output VAT, or Input VAT changes — only which account holds the balance.
        </p>
        <button class="btn btn-primary btn-sm" id="vatFixLegacyBtn">🔧 Move ${legacyCount} Entr${legacyCount===1?'y':'ies'} to VAT Claimed</button>
      </div>` : '';
    })()}

    ${payableBal>0.005 ? `
    <div class="ledger-panel" style="margin-top:18px;">
      <div class="section-label">VAT Payable — Balance as of ${esc(vatPeriodTo)} (Liability)</div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">You owe RRA <strong>${fmt(payableBal)} Frw</strong>.</p>
      <div class="field-row">
        <div class="field"><label>Amount</label><input type="number" class="num-in" id="vatPayAmt" value="${payableBal}"></div>
        <div class="field"><label>Pay From</label>
          <select id="vatPayAccount">${cashBankAccounts().map(a=>`<option value="${a.code}">${a.code} — ${esc(tAccountName(a.code,a.name))}</option>`).join('')}</select>
        </div>
        <button class="btn btn-primary" id="vatPayBtn">Declare &amp; Pay to RRA</button>
      </div>
      <div class="note">Posts Dr VAT Payable (2105) / Cr your selected account.</div>
    </div>
    ` : ''}

    ${claimedBal>0.005 ? `
    <div class="ledger-panel" style="margin-top:18px;">
      <div class="section-label">VAT Claimed — Balance as of ${esc(vatPeriodTo)} (Asset)</div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">RRA owes you a refund of <strong>${fmt(claimedBal)} Frw</strong>.</p>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <div style="font-weight:600; font-size:13px; color:var(--ink-navy); margin-bottom:6px;">Option A — Claimed and received from RRA</div>
          <div class="field-row">
            <div class="field"><label>Amount</label><input type="number" class="num-in" id="vatRefundAmt" value="${claimedBal}"></div>
            <div class="field"><label>Received Into</label>
              <select id="vatRefundAccount">${cashBankAccounts().map(a=>`<option value="${a.code}" ${a.code==='1010'?'selected':''}>${a.code} — ${esc(tAccountName(a.code,a.name))}</option>`).join('')}</select>
            </div>
            <button class="btn btn-primary" id="vatReceiveBtn">Record Refund Received</button>
          </div>
          <div class="note">RRA pays refunds in RWF — select the Bank Account (RWF), not a USD or other-currency account. Posts Dr Bank Account (RWF) / Cr VAT Claimed (1310).</div>
        </div>
        <div>
          <div style="font-weight:600; font-size:13px; color:var(--ink-navy); margin-bottom:6px;">Option B — Not claimed / not recoverable</div>
          <div class="field-row">
            <div class="field"><label>Amount</label><input type="number" class="num-in" id="vatOffsetAmt" value="${claimedBal}"></div>
            <div class="field" style="min-width:220px;"><label>Reason (optional)</label><input type="text" id="vatOffsetNote" placeholder="e.g. Voluntarily not claimed"></div>
            <button class="btn btn-ghost" id="vatWriteOffPayableBtn">Offset Against Non-Recoverable VAT Expense</button>
          </div>
          <div class="note">Use this when the refund was voluntarily not claimed, or RRA rejected it. Posts Dr Non-Recoverable VAT Expense (5990) / Cr VAT Claimed (1310) — it clears the balance without any cash movement, and shows up as an expense on the P&amp;L instead.</div>
        </div>
      </div>
    </div>
    ` : ''}

    ${(!settlement && inputBal>0.005) ? `
    <div class="ledger-panel" style="margin-top:18px;">
      <div class="section-label">Offset Unclaimed Input VAT — Non-Recoverable</div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">
        Input VAT credit on the books as of ${esc(vatPeriodTo)}: <strong>${fmt(inputBal)} Frw</strong>. If you're voluntarily not claiming some or all of it (or it's been rejected by RRA), offset it here before closing the month — it won't be included in the net VAT calculation once removed, and shows up as an expense on the P&amp;L instead.
      </p>
      <div class="field-row">
        <div class="field"><label>Amount to Offset</label><input type="number" class="num-in" id="vatWriteOffInputAmt" value="${inputBal}"></div>
        <div class="field" style="min-width:220px;"><label>Reason (optional)</label><input type="text" id="vatWriteOffInputNote" placeholder="e.g. Voluntarily not claimed"></div>
        <button class="btn btn-ghost" id="vatWriteOffInputBtn">Offset Against Non-Recoverable VAT Expense</button>
      </div>
      <div class="note">Posts Dr Non-Recoverable VAT Expense (5990) / Cr VAT Input (1300).</div>
    </div>
    ` : ''}
  `;
}

function renderEBMSplit(){
  const summary = computeEBMSplitSummary(ebmSplitFrom, ebmSplitTo);
  const rows = (state.ebmSales||[])
    .filter(r=> (!ebmSplitFrom || r.date>=ebmSplitFrom) && (!ebmSplitTo || r.date<=ebmSplitTo))
    .sort((a,b)=> a.date.localeCompare(b.date) || a.invoiceNo.localeCompare(b.invoiceNo));
  const unvalidatedCount = rows.filter(r=>!isEBMSaleValidated(r)).length;

  return `
    <div class="field-row">
      <div class="field"><label>From</label><input type="date" id="ebmFrom" value="${ebmSplitFrom}"></div>
      <div class="field"><label>To</label><input type="date" id="ebmTo" value="${ebmSplitTo}"></div>
      <button class="btn btn-ghost" id="ebmApply">Apply</button>
      <button class="btn btn-ghost" id="printReportBtn">🖨 Print / Save as PDF</button>
      <button class="btn btn-ghost" id="exportExcelBtn" data-report-title="EBM Sales Split - Tourism Tax">📊 Export to Excel</button>
      <button class="btn btn-ghost" id="ebmImportBtn" title="Import a file with columns matching this register's own export: Invoice #, Date, Buyer, Room, Accommodation (Excl.), Restaurant (Excl.), Other (Excl.). Invoice numbers already in this register are skipped.">📥 Import Invoices (Excel/CSV)</button>
      <input type="file" id="ebmImportFile" accept=".csv,.xlsx,.xls" style="display:none;">
    </div>

    <div class="ledger-panel">
      <div class="section-label">Record New EBM Invoice</div>
      <p class="note" style="margin:0 0 12px;">Type each amount VAT-inclusive, exactly as printed on the receipt (e.g. the "ROOM ..." line for Accommodation; everything else for Restaurant/Room Service) — except "Other," which is VAT-exempt and should be entered as its final amount directly. VAT-exclusive revenue, VAT (18%, on Accommodation and Restaurant only), and Tourism Tax (3%, Accommodation only) are calculated automatically and posted straight to the General Ledger.</p>
      <div class="field-row">
        <div class="field"><label>Invoice Number</label><input type="text" id="ebmInvNo" placeholder="SDC014000948/1704"></div>
        <div class="field"><label>Date</label><input type="date" id="ebmDate" value="${todayISO()}"></div>
        <div class="field"><label>Buyer TIN</label><input type="text" id="ebmTin" placeholder="Optional"></div>
        <div class="field"><label>Buyer Name</label><input type="text" id="ebmBuyer" placeholder="Cash Client"></div>
        <div class="field"><label>Room Number</label><input type="text" id="ebmRoom" placeholder="e.g. B"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Accommodation (VAT Incl.)</label><input type="number" class="num-in" id="ebmAccom" placeholder="0"></div>
        <div class="field"><label>Restaurant / Room Service (VAT Incl.)</label><input type="number" class="num-in" id="ebmRest" placeholder="0"></div>
        <div class="field"><label>Other (Tax Exempt)</label><input type="number" class="num-in" id="ebmOther" placeholder="0" title="No VAT is applied to this amount — it's added to the invoice total as-is."></div>
        <div class="field"><label>Received Into</label>
          <select id="ebmCashAccount">${cashBankAccounts().map(a=>`<option value="${a.code}">${a.code} — ${esc(tAccountName(a.code,a.name))}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field-row">
        <button class="btn btn-primary" id="ebmAddBtn">Record Invoice</button>
      </div>
    </div>

    <div class="report-hero">
      <div>
        <div class="hero-label">Tourism Tax Due on Recorded Accommodation (${(state.settings.tourismTax*100).toFixed(0)}%)</div>
        <div class="hero-num">${fmt(summary.tourismTax)} Frw</div>
      </div>
      <span class="badge ok">${summary.count} invoice${summary.count===1?'':'s'} in period</span>
    </div>

    ${unvalidatedCount>0?`
    <div class="ledger-panel" style="border-left:3px solid var(--ink-red,#a33);">

function renderCITTracker(){
  if(!citFiscalYear) citFiscalYear = Number(todayISO().slice(0,4));
  const instalments = getCitInstalments(citFiscalYear);
  const totalDue = instalments.reduce((s,i)=>s+(Number(i.amountDue)||0),0);
  const totalPaid = instalments.reduce((s,i)=>s+(Number(i.amountPaid)||0),0);
  const estimatedAnnual = computeAnnualEstimatedCIT(citFiscalYear);
  const diff = estimatedAnnual - totalPaid;
  const cashAccounts = cashBankAccounts();
  const priorRef = getCitPriorYearRef(citFiscalYear);
  const statusBadge = (status)=>{
    const cls = status==='Paid'?'ok':(status==='Overdue'?'bad':(status==='Partially Paid'?'pending':''));
    return `<span class="badge ${cls}">${status}</span>`;
  };

  return `
    <div class="field-row">
      <div class="field"><label>Fiscal Year</label>
        <select id="citYearSelect">
          ${[citFiscalYear-1, citFiscalYear, citFiscalYear+1].map(y=>`<option value="${y}" ${y===citFiscalYear?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-ghost" id="printReportBtn">🖨 Print / Save as PDF</button>
      <button class="btn btn-ghost" id="exportExcelBtn" data-report-title="CIT Prepayments">📊 Export to Excel</button>
    </div>

    <div class="ledger-panel" style="margin-bottom:22px;">
      <div class="section-label" style="margin:0 0 10px;">IQP Formula — Prior Year Reference (${citFiscalYear-1})</div>
      <p style="font-size:12.5px;color:var(--text-soft);margin:0 0 12px;">IQP = (Tax Paid ${citFiscalYear-1} ÷ Turnover ${citFiscalYear-1}) × Current Quarter's Turnover. Enter these two figures from your ${citFiscalYear-1} filed return once, and each instalment below fills in automatically from your actual ledger turnover for that quarter.</p>
      <div class="field-row">
        <div class="field"><label>Tax Paid in ${citFiscalYear-1}</label><input type="number" class="num-in" id="citPriorTaxInput" value="${priorRef.tax||''}" placeholder="0"></div>
        <div class="field"><label>Turnover in ${citFiscalYear-1}</label><input type="number" class="num-in" id="citPriorTurnoverInput" value="${priorRef.turnover||''}" placeholder="0"></div>
        <button class="btn btn-primary btn-sm" id="citApplyFormulaBtn">Calculate All 3 Instalments</button>
      </div>
    </div>

    <div class="report-hero">
      <div>
        <div class="hero-label">Estimated Annual CIT (${(state.settings.cit*100).toFixed(0)}% of ${citFiscalYear} taxable profit)</div>
        <div class="hero-num">${fmt(estimatedAnnual)} Frw</div>
      </div>
      <span class="badge ${Math.abs(diff)<1?'ok':'pending'}">${Math.abs(diff)<1 ? 'Fully prepaid' : (diff>0 ? 'Underpaid by '+fmt(diff) : 'Overpaid by '+fmt(Math.abs(diff)))}</span>
    </div>

    <div class="ledger-panel" style="margin-bottom:22px;">
      <table class="led">
        <thead><tr><th>Quarter</th><th>Period Covered</th><th>Due Date</th><th class="num-col">Quarter Turnover</th><th class="num-col">Amount Due</th><th class="num-col">Amount Paid</th><th>Date Paid</th><th>Status</th><th>Record Payment</th></tr></thead>
        <tbody>
          ${instalments.map(inst=>{
            const status = citInstalmentStatus(inst, todayISO());
            const remaining = Math.max((Number(inst.amountDue)||0) - (Number(inst.amountPaid)||0), 0);
            const qTurnover = computeQuarterTurnover(inst.periodFrom, inst.periodTo);
            return `<tr>
              <td>${inst.quarter} ${inst.fiscalYear}</td>
              <td style="font-size:12px;color:var(--text-soft);">${inst.periodFrom} to ${inst.periodTo}</td>
              <td>${inst.dueDate}</td>
              <td class="num-col num" style="font-size:12px;color:var(--text-soft);">${fmt(qTurnover)}</td>
              <td class="num-col">
                ${inst.iqpNotApplicable ? `<div style="text-align:right;color:var(--text-soft);font-style:italic;font-size:12.5px;">N/A</div>` : ''}
                <input type="number" class="num-in" data-cit-amount-due="${inst.id}" value="${inst.amountDue||0}" style="width:120px;${inst.iqpNotApplicable?'margin-top:4px;':''}" title="${inst.iqpNotApplicable?'Not applicable under RRA\u2019s formula, since last year\u2019s tax paid was zero — enter a value here only if choosing to prepay voluntarily.':''}">
              </td>
              <td class="num-col num">${fmt(inst.amountPaid)}</td>
              <td>${inst.datePaid||'—'}</td>
              <td>${statusBadge(status)}</td>
              <td style="white-space:nowrap;">
                ${status!=='Paid'?`
                  <input type="number" class="num-in" step="0.01" min="0.01" value="${remaining>0?remaining:(inst.amountDue||0)}" data-cit-pay-amt="${inst.id}" style="width:100px;display:inline-block;">
                  <select data-cit-pay-account="${inst.id}" style="font-size:11px;padding:3px 4px;">
                    ${cashAccounts.map(a=>`<option value="${a.code}">${a.code} — ${esc(tAccountName(a.code,a.name))}</option>`).join('')}
                  </select>
                  <button class="btn btn-primary btn-sm" data-cit-pay="${inst.id}">Pay</button>
                `:''}
              </td>
            </tr>`;
          }).join('')}
          <tr class="total-row"><td colspan="4">Total</td><td class="num-col num">${fmt(totalDue)}</td><td class="num-col num">${fmt(totalPaid)}</td><td colspan="3"></td></tr>
        </tbody>
      </table>
      <div class="note">Rwanda requires three IQP (Impôt sur les Quotités Provisionnelles) instalments per fiscal year — due 30 June, 30 September, and 31 December — each covering the quarter just ended. There's no 4th instalment; the remaining liability is settled through the annual CIT return instead. Paying posts Dr CIT Prepayments (1350) / Cr your selected cash account.</div>
    </div>

    <div class="ledger-panel">
      <div class="section-label">Settle at Year-End</div>
      <p style="font-size:13px;color:var(--text-soft);margin:0 0 12px;">Once you know the final annual CIT liability from your filed return, recognize it and net it against what you've already prepaid.</p>
      <div class="field-row">
        <div class="field"><label>Final Annual CIT Liability</label><input type="number" class="num-in" id="citFinalLiability" placeholder="0"></div>
        <button class="btn btn-primary" id="citSettleBtn">Recognize &amp; Net Against Prepayments</button>
      </div>
      <div class="note">Posts Dr Income Tax Expense (5970) / Cr Corporate Income Tax Payable (2130) for the final liability, then Dr Corporate Income Tax Payable / Cr CIT Prepayments (1350) to net off what's already been paid. Any remaining balance in Corporate Income Tax Payable is what's still owed (or, if negative, an overpayment to carry forward) — settle it with a normal journal entry against Bank.</div>
    </div>
  `;
}
