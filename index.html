/* ============================================================
   MASTER EVENT WIRING
   ============================================================ */
function wireViewEvents(){
  // Generic tab-navigation links (e.g. Balance Sheet's Accounts
  // Receivable/Payable lines linking straight to their detail tabs)
  document.querySelectorAll('[data-goto-tab]').forEach(el=>{
    el.onclick = ()=>{ activeTab = el.getAttribute('data-goto-tab'); renderAll(); };
  });

  // Dashboard quick actions
  if(activeTab==='dashboard'){
    document.querySelectorAll('[data-quick]').forEach(btn=>{
      btn.onclick = ()=> quickAction(btn.getAttribute('data-quick'));
    });
    const dashRevApplyBtn = document.getElementById('dashRevApplyBtn');
    if(dashRevApplyBtn) dashRevApplyBtn.onclick = ()=>{
      dashRevFrom = document.getElementById('dashRevFromInput').value;
      dashRevTo = document.getElementById('dashRevToInput').value;
      renderMain();
    };
    const dashRevExportBtn = document.getElementById('dashRevExportBtn');
    if(dashRevExportBtn) dashRevExportBtn.onclick = ()=>{
      const from = dashRevFrom || (asOfDate.slice(0,8)+'01');
      const to = dashRevTo || asOfDate;
      const format = document.getElementById('dashRevFormatInput').value;
      if(format==='pdf') exportRevenueStreamsToPdf(from, to);
      else exportRevenueStreamsToExcel(from, to);
    };
  }

  // GL
  if(activeTab==='gl') wireGLEvents();

  if(activeTab==='aged'){
    const agedApplyBtn = document.getElementById('agedApplyBtn');
    if(agedApplyBtn) agedApplyBtn.onclick = ()=>{
      agedAsAtDate = document.getElementById('agedAsAtInput').value || todayISO();
      renderMain();
    };
    document.querySelectorAll('[data-aged-open-ar]').forEach(el=>{
      el.onclick = ()=>{ arSearchQuery = el.getAttribute('data-aged-open-ar'); arShowUnlinkedOnly = false; activeTab = 'ar'; renderMain(); };
    });
    document.querySelectorAll('[data-aged-open-ap]').forEach(el=>{
      el.onclick = ()=>{ apSearchQuery = el.getAttribute('data-aged-open-ap'); apShowUnlinkedOnly = false; activeTab = 'ap'; renderMain(); };
    });
    document.querySelectorAll('[data-aged-open-ar-unlinked]').forEach(el=>{
      el.onclick = ()=>{ arSearchQuery = ''; arShowUnlinkedOnly = true; activeTab = 'ar'; renderMain(); };
    });
    document.querySelectorAll('[data-aged-open-ap-unlinked]').forEach(el=>{
      el.onclick = ()=>{ apSearchQuery = ''; apShowUnlinkedOnly = true; activeTab = 'ap'; renderMain(); };
    });
    const agedSearchInput = document.getElementById('agedSearchInput');
    if(agedSearchInput){
      const applyAgedSearch = ()=>{ agedSearchQuery = agedSearchInput.value; renderMain(); };
      agedSearchInput.onchange = applyAgedSearch;
      agedSearchInput.onkeydown = (e)=>{ if(e.key==='Enter') applyAgedSearch(); };
    }
    const agedSortSelect = document.getElementById('agedSortSelect');
    if(agedSortSelect) agedSortSelect.onchange = ()=>{ agedSortBy = agedSortSelect.value; renderMain(); };
    const agedShowAllInput = document.getElementById('agedShowAllInput');
    if(agedShowAllInput) agedShowAllInput.onchange = ()=>{ agedShowAll = agedShowAllInput.checked; renderMain(); };
  }

  document.querySelectorAll('[data-open-gl-entry]').forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      activeTab = 'gl';
      glViewMode = 'list';
      startGLGroupEdit(el.getAttribute('data-open-gl-entry'));
    };
  });

  function applyRowSearch(query, unlinkedOnly){
    const q = (query||'').trim().toLowerCase();
    document.querySelectorAll('[data-row-search]').forEach(row=>{
      const isUnlinked = row.hasAttribute('data-no-link');
      const visible = unlinkedOnly ? isUnlinked : (!q || row.getAttribute('data-row-search').includes(q));
      row.style.display = visible ? '' : 'none';
    });
  }
  if(activeTab==='ar'){
    const arSearchInput = document.getElementById('arSearchInput');
    if(arSearchInput){
      applyRowSearch(arSearchQuery, arShowUnlinkedOnly);
      arSearchInput.oninput = ()=>{ arSearchQuery = arSearchInput.value; arShowUnlinkedOnly = false; applyRowSearch(arSearchQuery, false); };
    }
    const arClearUnlinkedBtn = document.getElementById('arClearUnlinkedBtn');
    if(arClearUnlinkedBtn) arClearUnlinkedBtn.onclick = ()=>{ arShowUnlinkedOnly = false; renderMain(); };
  }
  if(activeTab==='ap'){
    const apSearchInput = document.getElementById('apSearchInput');
    if(apSearchInput){
      applyRowSearch(apSearchQuery, apShowUnlinkedOnly);
      apSearchInput.oninput = ()=>{ apSearchQuery = apSearchInput.value; apShowUnlinkedOnly = false; applyRowSearch(apSearchQuery, false); };
    }
    const apClearUnlinkedBtn = document.getElementById('apClearUnlinkedBtn');
    if(apClearUnlinkedBtn) apClearUnlinkedBtn.onclick = ()=>{ apShowUnlinkedOnly = false; renderMain(); };
  }

  // Print / Save as PDF, and Export to Excel — shared across the financial statement tabs
  if(['pl','bs','tb','cashflow','gl','aged','collection'].includes(activeTab)){
    const glByAccountArgs = ()=>{
      const filtered = !!(glFrom || glTo);
      const rows = [...state.gl]
        .filter(l=> !filtered || inRange(l.date, glFrom||null, glTo||null))
        .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
      return [rows, glFrom, glTo, filtered];
    };
    const printBtn = document.getElementById('printReportBtn');
    if(printBtn) printBtn.onclick = ()=>{
      if(activeTab==='gl' && glViewMode==='byAccount') printGLByAccount(...glByAccountArgs());
      else printCurrentReport();
    };
    const excelBtn = document.getElementById('exportExcelBtn');
    if(excelBtn) excelBtn.onclick = ()=>{
      if(activeTab==='gl' && glViewMode==='byAccount') exportGLByAccountToExcel(...glByAccountArgs());
      else exportReportToExcel(excelBtn.getAttribute('data-report-title'));
    };
  }
  if(['pl','bs','tb','gl'].includes(activeTab)){
    const customizeBtn = document.getElementById('reportCustomizeBtn');
    if(customizeBtn) customizeBtn.onclick = openCustomizeModal;
  }

  // TB / PL / BS / GL / Cash Flow date filters and Report Period presets
  if(activeTab==='pl'){
    const presetSel = document.getElementById('plPeriodPreset');
    if(presetSel) presetSel.onchange = ()=>{
      reportPeriodPreset = presetSel.value;
      const range = getPresetRange(reportPeriodPreset);
      if(range){ periodFrom = range.from; periodTo = range.to; }
      renderMain();
    };
    const basisSel = document.getElementById('plBasis');
    if(basisSel) basisSel.onchange = ()=>{ reportCustomize.basis = basisSel.value; renderMain(); };

        targets[empId] = targets[empId] || {meal:0, transport:0};
        targets[empId].meal = parseFloat(inp.value)||0;
      });
      transportInputs.forEach(inp=>{
        const empId = inp.getAttribute('data-emp');
        targets[empId] = targets[empId] || {meal:0, transport:0};
        targets[empId].transport = parseFloat(inp.value)||0;
      });
      const withTargets = state.payroll.filter(e=> targets[e.id] && (targets[e.id].meal>0 || targets[e.id].transport>0));
      if(withTargets.length===0){ alert('Enter at least one Meal or Transport total first.'); return; }
      if(!confirm(`Randomly mark attendance for ${withTargets.length} employee(s) for ${monthLabel(payrollRunMonth+'-01')}, applying each person's own Meal/Transport totals exactly as entered? This overwrites their current attendance marks for this month.`)) return;
      withTargets.forEach(emp=>{
        autoFillAttendanceExact(emp, payrollRunMonth, targets[emp.id].meal, targets[emp.id].transport);
      });
      saveState(); renderMain();
      alert(`Done — ${withTargets.length} employee(s) now have attendance marked, with Food/Transport Reimb. matching exactly what you entered for each.`);
    };
    const attApplyBtn = document.getElementById('attApplyBtn');
    if(attApplyBtn) attApplyBtn.onclick = ()=>{
      if(!confirm(`Apply calculated Food/Transport reimbursement for ${state.payroll.length} employee(s) into their payroll records for ${monthLabel(payrollRunMonth+'-01')}? This overwrites their current Meal Reimb. and Transport Reimb. amounts.`)) return;
      state.payroll.forEach(emp=>{
        const calc = computeAttendanceForEmployee(emp, payrollRunMonth);
        emp.mealReimb = calc.foodReimb;
        emp.transportReimb = calc.transportReimb;
      });
      saveState(); renderMain();
      alert('Applied — Meal and Transport Reimb. amounts are updated for every employee above.');
    };
    const attExportFromInput = document.getElementById('attExportFromInput');
    if(attExportFromInput) attExportFromInput.onchange = ()=>{ attExportFrom = attExportFromInput.value; };
    const attExportToInput = document.getElementById('attExportToInput');
    if(attExportToInput) attExportToInput.onchange = ()=>{ attExportTo = attExportToInput.value; };
    const attExportFormatInput = document.getElementById('attExportFormatInput');
    if(attExportFormatInput) attExportFormatInput.onchange = ()=>{ attExportFormat = attExportFormatInput.value; };
    document.querySelectorAll('.att-range-preset').forEach(btn=>{
      btn.onclick = ()=>{
        attExportFrom = btn.getAttribute('data-from');
        attExportTo = btn.getAttribute('data-to');
        renderMain(); // refresh the date inputs to show the picked range immediately
      };
    });
    const attExportBtn = document.getElementById('attExportBtn');
    if(attExportBtn) attExportBtn.onclick = ()=>{
      const fromVal = (attExportFrom || payrollRunMonth+'-01');
      const toVal = (attExportTo || payrollRunMonth+'-01');
      if(fromVal > toVal){ alert('The "From" date must be on or before the "To" date.'); return; }
      const fromDay = parseInt(fromVal.slice(8,10), 10);
      const toDay = parseInt(toVal.slice(8,10), 10);
      if(attExportFormat==='pdf') exportAttendanceToPdf(payrollRunMonth, fromDay, toDay);
      else exportAttendanceToExcel(payrollRunMonth, fromDay, toDay);
    };
    const attPreparedBy = document.getElementById('attPreparedBy');
    if(attPreparedBy) attPreparedBy.onchange = ()=>{ getAttendanceMeta(payrollRunMonth).preparedBy = attPreparedBy.value; saveState(); };
    const attVerifiedBy = document.getElementById('attVerifiedBy');
    if(attVerifiedBy) attVerifiedBy.onchange = ()=>{ getAttendanceMeta(payrollRunMonth).verifiedBy = attVerifiedBy.value; saveState(); };
    const attApprovedBy = document.getElementById('attApprovedBy');
    if(attApprovedBy) attApprovedBy.onchange = ()=>{ getAttendanceMeta(payrollRunMonth).approvedBy = attApprovedBy.value; saveState(); };
    const attCloseBtn = document.getElementById('attCloseBtn');
    if(attCloseBtn) attCloseBtn.onclick = ()=>{
      // pick up whatever's currently typed even if the field hasn't blurred yet
      const meta = getAttendanceMeta(payrollRunMonth);
      const pb = document.getElementById('attPreparedBy'), vb = document.getElementById('attVerifiedBy'), ab = document.getElementById('attApprovedBy');
      if(pb) meta.preparedBy = pb.value;
      if(vb) meta.verifiedBy = vb.value;
      if(ab) meta.approvedBy = ab.value;
      if(!confirm(`Close ${monthLabel(payrollRunMonth+'-01')}'s attendance? No one will be able to edit any attendance mark for this month afterward. This does not affect any other month.`)) return;
      const result = closeAttendanceMonth(payrollRunMonth);
      if(!result.ok){ alert(result.msg); return; }
      saveState(); renderMain();
      alert(`${monthLabel(payrollRunMonth+'-01')}'s attendance is now closed and locked.`);
    };
    document.querySelectorAll('[data-transfer]').forEach(inp=>{
      inp.onchange = ()=>{
        const field = inp.getAttribute('data-transfer');
        if(!state.payrollTransfers) state.payrollTransfers = {};
        if(!state.payrollTransfers[payrollRunMonth]) state.payrollTransfers[payrollRunMonth] = {};
        state.payrollTransfers[payrollRunMonth][field] = (field==='status') ? inp.value : (parseFloat(inp.value)||0);
        if(field!=='status') syncPayrollTransferChargesInClient(state, payrollRunMonth);
        saveState(); renderMain();
      };
    });
    const exportExcelBtn = document.getElementById('pExportExcelBtn');
    if(exportExcelBtn) exportExcelBtn.onclick = exportPayrollToExcel;
    const payrollSearchInput = document.getElementById('payrollSearchInput');
    if(payrollSearchInput) payrollSearchInput.oninput = ()=>{
      const q = payrollSearchInput.value.trim().toLowerCase();
      const emptyMsg = document.getElementById('payrollSearchEmpty');
      let visibleCount = 0;
      document.querySelectorAll('#payrollTable tbody tr[data-employee-name]').forEach(tr=>{
        const match = !q || tr.getAttribute('data-employee-name').includes(q);
        tr.style.display = match ? '' : 'none';
        if(match) visibleCount++;
      });
      if(emptyMsg) emptyMsg.style.display = (q && visibleCount===0) ? 'block' : 'none';
    };
    const monthInput = document.getElementById('pRunMonth');
    if(monthInput) monthInput.onchange = ()=>{
      payrollRunMonth = monthInput.value || todayISO().slice(0,7);
      renderMain();
    };
    const runBtn = document.getElementById('pRunPayrollBtn');
    if(runBtn) runBtn.onclick = ()=>{
      const selectedMonth = (document.getElementById('pRunMonth').value) || payrollRunMonth || todayISO().slice(0,7);
      const monthDisplay = monthLabel(selectedMonth+'-01');
      const alreadyRun = (state.payrollRuns||[]).find(r=>r.month===selectedMonth);
      if(alreadyRun){
        if(!confirm(`Payroll for ${monthDisplay} was already run and saved (${alreadyRun.employeeCount} employees, ${fmt(alreadyRun.gross)} gross). Run it again and post a second entry?`)) return;
      } else {
        const ticked = state.payroll.filter(e=>e.workedThisMonth!==false);
        if(!confirm(`Run and save payroll for ${monthDisplay}? This posts ${ticked.length} ticked employee(s) to the ledger as expenses and payables — nothing is paid out yet.`)) return;
      }
      const result = runMonthlyPayroll(selectedMonth);
      if(!result.ok){ alert(result.msg); return; }
      renderMain();
      alert(`Payroll for ${monthLabel(result.month+'-01')} saved: ${result.employeeCount} employee(s), Gross ${fmt(result.totals.gross)}, posted to the ledger.`);
    };
    const importBtn = document.getElementById('pImportBtn');
    const importFile = document.getElementById('pImportFile');
    if(importBtn && importFile){
      importBtn.onclick = ()=> importFile.click();
      importFile.onchange = ()=>{
        if(importFile.files && importFile.files[0]) handlePayrollImportFile(importFile.files[0]);
        importFile.value = '';
      };
    }
  }

  // Customers / Vendors
  if(activeTab==='customers' || activeTab==='vendors'){
    const key = activeTab;
    const addBtn = document.querySelector(`[data-addledger="${key}"]`);
    if(addBtn) addBtn.onclick = ()=>{
      const name = document.getElementById(key+'Name').value.trim();
      if(!name){ alert('Enter a name.'); return; }
      const linkField = document.getElementById(key+'LinkedClient');
      state[key].push({
        id:uid(), name,
        contact: document.getElementById(key+'Contact').value,
        opening: parseFloat(document.getElementById(key+'Opening').value)||0,
        invoiced:0, paid:0,
        linkedClientId: linkField ? (linkField.value || null) : null
      });
      state[key].sort((a,b)=> (a.name||'').localeCompare(b.name||'')); // keep alphabetical order immediately, same as the Chart of Accounts
      saveState(); renderMain();
    };
    const mergeBtn = document.getElementById(key+'MergeBtn');
    if(mergeBtn) mergeBtn.onclick = ()=>{
      const keepId = document.getElementById(key+'MergeKeep').value;
      const removeId = document.getElementById(key+'MergeRemove').value;
      if(keepId===removeId){ alert('Choose two different records to merge.'); return; }
      const removeName = state[key].find(r=>r.id===removeId);
      if(!confirm(`Merge "${removeName?removeName.name:''}" into the other record? Every ${key==='customers'?'invoice':'bill'} referencing it will be reassigned, their Opening/Invoiced/Paid figures combined, and this duplicate removed. This cannot be undone.`)) return;
      const result = mergeCustomerOrVendor(key, keepId, removeId);
      if(!result.ok){ alert(result.msg); return; }
      renderMain();
      alert(`Merged "${result.removedName}" into "${result.keptName}" — ${result.count} ${key==='customers'?'invoice(s)':'bill(s)'} reassigned.`);
    };
    document.querySelectorAll('[data-del-crossdupe]').forEach(btn=>{
      btn.onclick = ()=>{
        const [k, id] = btn.getAttribute('data-del-crossdupe').split('|');
        const rec = state[k].find(r=>r.id===id);
        if(!rec) return;
        const noun = k==='customers' ? 'customer' : 'supplier';
        const txnWord = k==='customers' ? 'invoice(s)' : 'bill(s)';
        if(!confirm(`Permanently delete "${rec.name}" and every ${txnWord} tied to it from THIS company only? Its record in your other companies is untouched. This cannot be undone.`)) return;
        const result = k==='customers' ? deleteCustomerCompletely(id) : deleteVendorCompletely(id);
        if(!result.ok){ alert(`Could not delete that ${noun}.`); return; }
        renderMain();
        alert(`Deleted "${result.name}" and ${k==='customers'?result.invoiceCount:result.billCount} ${txnWord} from this company.`);
      };
    });
    const crossdupeSelectAll = document.getElementById(key+'CrossdupeSelectAll');
    if(crossdupeSelectAll) crossdupeSelectAll.onchange = ()=>{
      document.querySelectorAll('.'+key+'-crossdupe-check').forEach(cb=>{ cb.checked = crossdupeSelectAll.checked; });
    };
    const deleteAllCrossdupeBtn = document.getElementById(key+'DeleteAllCrossdupeBtn');
    if(deleteAllCrossdupeBtn) deleteAllCrossdupeBtn.onclick = ()=>{
      const checkedIds = [...document.querySelectorAll('.'+key+'-crossdupe-check:checked')].map(cb=>cb.value);
      if(checkedIds.length===0){ alert('Nothing is checked.'); return; }
      const names = checkedIds.map(id=>{ const r = state[key].find(x=>x.id===id); return r?r.name:''; }).filter(Boolean);
      const txnWord = key==='customers' ? 'invoices' : 'bills';
      if(!confirm(`Permanently delete ${checkedIds.length} ${key==='customers'?'customer(s)':'supplier(s)'} and every ${txnWord} tied to them, from THIS company only?\n\n${names.join(', ')}\n\nTheir records in your other companies are untouched. This cannot be undone.`)) return;
      const typed = prompt(`Type DELETE (all caps) to confirm removing ${checkedIds.length} record(s):`);
      if(typed !== 'DELETE'){ alert('Cancelled — nothing was deleted.'); return; }
      let totalTxns = 0;
      checkedIds.forEach(id=>{
        const result = key==='customers' ? deleteCustomerCompletely(id) : deleteVendorCompletely(id);
        if(result.ok) totalTxns += key==='customers' ? result.invoiceCount : result.billCount;
      });
      renderMain();
      alert(`Deleted ${checkedIds.length} record(s) and ${totalTxns} ${txnWord} from this company.`);
    };
    document.querySelectorAll('[data-ledgerfield]').forEach(inp=>{
      inp.onchange = ()=>{
        const [k,id,field] = inp.getAttribute('data-ledgerfield').split('|');
        const row = state[k].find(r=>r.id===id);
        if(row){ row[field] = parseFloat(inp.value)||0; saveState(); renderMain(); }
      };
    });
    document.querySelectorAll('[data-linkclient]').forEach(sel=>{
      sel.onchange = ()=>{
        const id = sel.getAttribute('data-linkclient');
        const row = state.customers.find(r=>r.id===id);
        if(row){ row.linkedClientId = sel.value || null; saveState(); }
      };
    });
    document.querySelectorAll('[data-del-ledger]').forEach(b=>{
      b.onclick = ()=>{
        const [k,id] = b.getAttribute('data-del-ledger').split('|');
        state[k] = state[k].filter(r=>r.id!==id);
        saveState(); renderMain();
      };
    });
    const clearBtn = document.querySelector(`[data-clearledger="${key}"]`);
    if(clearBtn) clearBtn.onclick = ()=>{
      if(confirm(`Delete all ${key}?`)){ state[key]=[]; saveState(); renderMain(); }
    };
  }

  // Chart of Accounts
  // Fixed Assets
  if(activeTab==='fixedassets'){
    const addBtn = document.getElementById('faAddBtn');
    if(addBtn) addBtn.onclick = ()=>{
      const name = document.getElementById('faName').value.trim();
      if(!name){ alert('Enter an asset name.'); return; }
      const payload = {
        name,
        category: document.getElementById('faCategory').value,
        purchaseDate: document.getElementById('faDate').value || todayISO(),
        cost: parseFloat(document.getElementById('faCost').value)||0,
        usefulLifeYears: parseFloat(document.getElementById('faLife').value)||1,
        salvage: parseFloat(document.getElementById('faSalvage').value)||0
      };
      if(faEditId){
        const a = state.fixedAssets.find(a=>a.id===faEditId);
        if(a) Object.assign(a, payload);
        faEditId = null;
      } else {
        state.fixedAssets.push(Object.assign({id:uid(), depreciationLog:[]}, payload));
      }
      saveState(); renderMain();
    };
    const cancelBtn = document.getElementById('faCancelBtn');
    if(cancelBtn) cancelBtn.onclick = ()=>{ faEditId=null; renderMain(); };
    document.querySelectorAll('[data-edit-fa]').forEach(b=>{
      b.onclick = ()=>{ faEditId = b.getAttribute('data-edit-fa'); renderMain(); };
    });
    document.querySelectorAll('[data-del-fa]').forEach(b=>{
      b.onclick = ()=>{
        if(!confirm('Delete this asset? Its depreciation history will be removed too (existing GL postings stay).')) return;
        state.fixedAssets = state.fixedAssets.filter(a=>a.id!==b.getAttribute('data-del-fa'));
        saveState(); renderMain();
      };
    });
    const runBtn = document.getElementById('faRunDeprBtn');
    if(runBtn) runBtn.onclick = ()=>{
      const label = todayISO().slice(0,7);
      const count = runDepreciationForPeriod(label);
      saveState(); renderMain();
      alert(count ? `Posted depreciation for ${count} asset(s) for ${label}.` : `No depreciation due — either already run for ${label}, or no assets have remaining value.`);
    };
  }

  // Inventory
  if(activeTab==='inventory'){
    const addItemBtn = document.getElementById('invAddItemBtn');
    if(addItemBtn) addItemBtn.onclick = ()=>{
      const name = document.getElementById('invName').value.trim();
      if(!name){ alert('Enter an item name.'); return; }
      state.inventory.push({
        id:uid(), name, sku: document.getElementById('invSku').value,
        qty: parseFloat(document.getElementById('invOpenQty').value)||0,
        avgCost: parseFloat(document.getElementById('invOpenCost').value)||0
      });
      saveState(); renderMain();
    };
    const receiveBtn = document.getElementById('invReceiveBtn');
    if(receiveBtn) receiveBtn.onclick = ()=>{
      const itemId = document.getElementById('invMoveItem').value;
      const qty = parseFloat(document.getElementById('invMoveQty').value)||0;
      const cost = parseFloat(document.getElementById('invMoveCost').value)||0;
      const payFrom = document.getElementById('invMovePayFrom').value;
      if(!itemId){ alert('Select an item first (add one above if the list is empty).'); return; }
      if(qty<=0){ alert('Enter a quantity greater than zero.'); return; }
      receiveStock(itemId, qty, cost, payFrom);
      saveState(); renderMain();
    };
    const issueBtn = document.getElementById('invIssueBtn');
    if(issueBtn) issueBtn.onclick = ()=>{
      const itemId = document.getElementById('invMoveItem').value;
      const qty = parseFloat(document.getElementById('invMoveQty').value)||0;
      if(!itemId){ alert('Select an item first.'); return; }
      if(qty<=0){ alert('Enter a quantity greater than zero.'); return; }
      const ok = issueStock(itemId, qty);
      if(!ok){ alert('Not enough stock on hand for that quantity.'); return; }
      saveState(); renderMain();
    };
    document.querySelectorAll('[data-del-inv]').forEach(b=>{
      b.onclick = ()=>{
        if(!confirm('Delete this inventory item? This does not reverse any past GL postings.')) return;
        state.inventory = state.inventory.filter(i=>i.id!==b.getAttribute('data-del-inv'));
        saveState(); renderMain();
      };
    });

    const posSaleBtn = document.getElementById('posSaleBtn');
    if(posSaleBtn) posSaleBtn.onclick = ()=>{
      const itemId = document.getElementById('posItem').value;
      const qty = document.getElementById('posQty').value;
      const price = document.getElementById('posPrice').value;
      const vatPct = document.getElementById('posVat').value;
      const cashAccount = document.getElementById('posCashAccount').value;
      if(!itemId){ alert('Add an inventory item first.'); return; }
      const result = recordPOSSale(itemId, qty, price, vatPct, cashAccount);
      if(!result.ok){ alert(result.msg); return; }
      renderMain();
    };

    const popPurchaseBtn = document.getElementById('popPurchaseBtn');
    if(popPurchaseBtn) popPurchaseBtn.onclick = ()=>{
      const itemId = document.getElementById('popItem').value;
      const qty = document.getElementById('popQty').value;
      const cost = document.getElementById('popCost').value;
      const vatPct = document.getElementById('popVat').value;
      const cashAccount = document.getElementById('popCashAccount').value;
      if(!itemId){ alert('Add an inventory item first.'); return; }
      const result = recordPOPPurchase(itemId, qty, cost, vatPct, cashAccount);
      if(!result.ok){ alert(result.msg); return; }
      renderMain();
    };

    document.querySelectorAll('[data-return-txn]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.getAttribute('data-return-txn');
        const txn = state.stockTransactions.find(tx=>tx.id===id);
        if(!txn) return;
        const qtyInput = document.querySelector(`[data-return-qty="${id}"]`);
        const returnQty = qtyInput ? parseFloat(qtyInput.value)||0 : stockTxnRemaining(txn);
        const label = txn.type==='sale' ? 'Return' : 'Return (to supplier)';
        if(!confirm(`${label} ${returnQty} x ${txn.itemName}? This reverses the cash, revenue/cost, and stock impact for that quantity.`)) return;
        const result = reverseStockTransaction(id, returnQty);
        if(!result.ok){ alert(result.msg); return; }
        renderMain();
      };
    });
  }

  // Recurring Transactions
  if(activeTab==='recurring'){
    const addBtn = document.getElementById('recAddBtn');
    if(addBtn) addBtn.onclick = ()=>{
      const description = document.getElementById('recDesc').value.trim();
      const amount = parseFloat(document.getElementById('recAmount').value)||0;
      if(!description){ alert('Enter a description.'); return; }
      if(amount<=0){ alert('Enter an amount greater than zero.'); return; }
      state.recurring.push({
        id:uid(), description,
        debitAccount: document.getElementById('recDebit').value,
        creditAccount: document.getElementById('recCredit').value,
        amount, active:true,
        nextRun: document.getElementById('recStart').value || todayISO(),
        lastRun: null
      });
      saveState(); renderMain();
    };
    document.querySelectorAll('[data-toggle-rec]').forEach(b=>{
      b.onclick = ()=>{
        const r = state.recurring.find(r=>r.id===b.getAttribute('data-toggle-rec'));
        if(r){ r.active = !r.active; saveState(); renderMain(); }
      };
    });
    document.querySelectorAll('[data-del-rec]').forEach(b=>{
      b.onclick = ()=>{
        if(!confirm('Delete this recurring template?')) return;
        state.recurring = state.recurring.filter(r=>r.id!==b.getAttribute('data-del-rec'));
        saveState(); renderMain();
      };
    });
    const runBtn = document.getElementById('recRunBtn');
    if(runBtn) runBtn.onclick = ()=>{
      const count = runDueRecurring();
      saveState(); renderMain();
      alert(count ? `Posted ${count} due recurring entr${count===1?'y':'ies'}.` : 'Nothing due right now.');
    };
  }

  // Bank Reconciliation
  if(activeTab==='bankrec'){
    const accountSel = document.getElementById('brAccount');
    if(accountSel) accountSel.onchange = ()=>{
      bankRecAccount = accountSel.value;
      bankStatementLines = [];
      brSelectedBankLine = null; brSelectedGlLine = null;
      renderMain();
    };
    const applyBtn = document.getElementById('brApplyBtn');
    if(applyBtn) applyBtn.onclick = ()=>{
      bankRecDate = document.getElementById('brDate').value || todayISO();
      bankRecStatementBalance = document.getElementById('brStatementBal').value;
      renderMain();
    };
    document.querySelectorAll('[data-restore-gl-entry]').forEach(btn=>{
      btn.onclick = ()=>{
        const entryRef = btn.getAttribute('data-restore-gl-entry');
        state.gl.forEach(l=>{ if(l.entry===entryRef) delete l.excludeFromRecon; });
        saveState(); renderMain();
      };
    });
    document.querySelectorAll('[data-hide-gl-entry]').forEach(btn=>{
      btn.onclick = ()=>{
        const entryRef = btn.getAttribute('data-hide-gl-entry');
        const linesInEntry = state.gl.filter(l=>l.entry===entryRef);
        if(!confirm(`Remove this transaction from the reconciliation view (entry ${entryRef}, ${linesInEntry.length} line(s))? It stays exactly as-is in the General Ledger and every report — this only stops it showing here.`)) return;
        state.gl.forEach(l=>{ if(l.entry===entryRef) l.excludeFromRecon = true; });
        saveState(); renderMain();
      };
    });
    const deleteAllGlBtn = document.getElementById('brDeleteAllGlBtn');
    if(deleteAllGlBtn) deleteAllGlBtn.onclick = ()=>{
      const shown = state.gl.filter(l=>l.account===bankRecAccount && (!bankRecDate || (l.date||'')<=bankRecDate) && !l.excludeFromRecon);
      const entryRefs = new Set(shown.map(l=>l.entry));
      if(entryRefs.size===0){ alert('Nothing to remove.'); return; }
      if(!confirm(`Remove ALL ${shown.length} record(s) currently shown (${entryRefs.size} transaction(s)) from this reconciliation view? They stay exactly as-is in the General Ledger and every report — this only stops them showing here.`)) return;
      state.gl.forEach(l=>{ if(entryRefs.has(l.entry)) l.excludeFromRecon = true; });
      saveState(); renderMain();
      alert(`Removed ${entryRefs.size} transaction(s) from this reconciliation view.`);
    };

    const uploadBtn = document.getElementById('brUploadBtn');
    const pdfFile = document.getElementById('brPdfFile');
    if(uploadBtn) uploadBtn.onclick = ()=> pdfFile.click();
    if(pdfFile) pdfFile.onchange = async (e)=>{
      const file = e.target.files[0];
      pdfFile.value = '';
      if(!file) return;
      const statusEl = document.getElementById('brUploadStatus');
      if(statusEl) statusEl.textContent = 'Reading statement…';
      try{
        const extracted = await extractBankStatementFromPDF(file);
        if(extracted.length===0){
          alert('No transactions could be recognized in that PDF. You can add lines manually instead — bank statement layouts vary and not all are auto-readable.');
        } else {
          bankStatementLines = bankStatementLines.concat(extracted);
          const matched = autoMatchBankStatement();
          alert(`Extracted ${extracted.length} transaction(s) from the statement. ${matched} auto-matched against your ledger.`);
        }
      }catch(err){
        console.error(err);
        alert(err.message || "Could not read that PDF. You can add lines manually instead.");
      }
      if(statusEl) statusEl.textContent = '';
      renderMain();
    };

    const autoMatchBtn = document.getElementById('brAutoMatchBtn');
    if(autoMatchBtn) autoMatchBtn.onclick = ()=>{
      const matched = autoMatchBankStatement();
      renderMain();
      alert(matched>0 ? `Matched ${matched} more transaction(s).` : 'No new matches found — remaining items may need manual matching or recording.');
    };

    const addManualLineBtn = document.getElementById('brAddManualLineBtn');
    if(addManualLineBtn) addManualLineBtn.onclick = ()=>{
      const date = prompt('Date (YYYY-MM-DD):', bankRecDate);
      if(date===null) return;
      const description = prompt('Description:', '');
      if(description===null) return;
      const amtStr = prompt('Amount (negative for money out, e.g. -15000):', '');
      if(amtStr===null) return;
      const amount = parseFloat(amtStr)||0;
      if(amount===0){ alert('Enter a non-zero amount.'); return; }

      alert(`Saved — ${bankImportCurrency} now defaults to ${rate} ${baseCurrencyCode()} for every future import, until you update it again.`);
    };

    const uploadBtn = document.getElementById('bankImportUploadBtn');
    const fileInput = document.getElementById('bankImportFile');
    if(uploadBtn && fileInput) uploadBtn.onclick = ()=> fileInput.click();
    if(fileInput) fileInput.onchange = ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      if(!bankImportAccount){ alert('Choose a Bank Account first.'); return; }
      if(bankImportCurrency && !(parseFloat(bankImportFxRate)>0)){ alert('Enter a default exchange rate for '+bankImportCurrency+' first.'); return; }
      {
        const selectedAcct = state.accounts.find(a=>a.code===bankImportAccount);
        if(selectedAcct && !accountMatchesCurrency(selectedAcct, bankImportCurrency)){
          const label = bankImportCurrency ? bankImportCurrency : baseCurrencyCode()+' (base currency)';
          const proceed = confirm(`You picked "${selectedAcct.name}" as the bank account, but the transaction currency is set to ${label} — these don't look like they match.\n\nContinue anyway, or press Cancel to fix the Bank Account / Currency selection first.`);
          if(!proceed){ fileInput.value=''; return; }
        }
      }

      // Shared by both the CSV/Excel and PDF paths below — tags every
      // staged row with the bank account and currency chosen for this
      // upload (kept per-row, not just per-import, so the review table
      // stays correct even if the selectors change before posting),
      // then saves and re-renders.
      const finishImport = async (result)=>{
        if(result.error){ alert(result.error); return; }
        if(!result.staged || result.staged.length===0){ alert('No transactions found in that file.'); return; }
        // Drop anything already posted to the ledger, or already waiting in
        // the review list, so re-uploading the same statement (or an
        // overlapping one) can never bring posted transactions back.
        {
          const found = result.staged.length;
          const probe = {gl: state.gl, bankStaging: result.staged};
          purgePostedBankStaging(probe);
          const waiting = {};
          (state.bankStaging||[]).forEach(r=>{ const k=bankTxKey(r.date,r.description,r.amount); waiting[k]=(waiting[k]||0)+1; });
          result.staged = probe.bankStaging.filter(r=>{ const k=bankTxKey(r.date,r.description,r.amount); if(waiting[k]>0){ waiting[k]--; return false; } return true; });
          const skipped = found - result.staged.length;
          if(result.staged.length===0){ alert('All '+found+' transaction(s) in this file are already posted to the ledger or already waiting for review, so nothing was added.'); return; }
          if(skipped>0) alert(skipped+' transaction(s) in this file were already posted or already in the review list and were skipped. '+result.staged.length+' new transaction(s) were added.');
        }
        let usedHistory = 0, usedFallback = 0;
        result.staged.forEach(s=>{
          s.bankAccountCode = bankImportAccount;
          s.currency = bankImportCurrency || null;
          if(bankImportCurrency){
            // Each transaction looks up the BNR average rate for its own
            // date first — the whole point of uploading a rate history —
            // and only falls back to the flat default rate (typed in
            // above) when no dated rate covers that far back.
            const dated = lookupExchangeRate(bankImportCurrency, s.date);
            if(dated!=null){ s.fxRate = dated; usedHistory++; }
            else { s.fxRate = parseFloat(bankImportFxRate); usedFallback++; }
          } else {
            s.fxRate = null;
          }
        });
        state.bankStaging = [...(state.bankStaging||[]), ...result.staged];
        // Render immediately, before the network wait — same reasoning
        // as the posting handler: the user sees the uploaded rows right
        // away regardless of how the cloud push below goes.
        renderMain();
        // Same reasoning as posting below — an uploaded statement is real
        // work the user shouldn't have to redo, so this pushes
        // immediately rather than risking the debounced save losing it
        // to a reload before it reaches the cloud.
        idbSet(APP_STORAGE_KEY, JSON.stringify(appData)).then(ok=>{ localStorageFull = !ok; });
        let uploadPushedOk = true;
        if(authUser) uploadPushedOk = await pushToCloudAuth(true);
        else if(syncConfig.enabled) uploadPushedOk = await pushToCloud(true);
        if(!uploadPushedOk){
          alert('This upload is saved on this device, but could not reach the cloud after two attempts — check your internet connection. Avoid closing this tab or signing out until the sync indicator shows "synced," or these transactions could disappear on next load.');
        } else if(bankImportCurrency && usedFallback>0 && usedHistory>0){
          alert(`${usedHistory} transaction(s) used the BNR rate for their own date; ${usedFallback} had no dated rate on file and used the flat default (${bankImportFxRate}) instead — worth uploading a rate history covering those dates for accuracy.`);
        }
      };

      const isPdf = /\.pdf$/i.test(file.name);
      if(isPdf){
        parseBankStatementPdf(file)
          .then(finishImport)
          .catch(err=> alert('Could not read that PDF: ' + (err.message||err)));
        fileInput.value = '';
        return;
      }

      if(typeof XLSX === 'undefined'){ alert('Import library did not load — check your internet connection and reload the page.'); return; }
      const reader = new FileReader();
      reader.onload = (e)=>{
        try{
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, {type:'array', raw:true});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
          if(rows.length===0){ alert('No rows found in that file.'); return; }
          const headerMap = buildHeaderMap(rows[0]);
          finishImport(parseBankStatementFile(rows, headerMap));
        }catch(err){
          alert('Could not read that file: ' + (err.message||err));
        }
      };
      reader.readAsArrayBuffer(file);
      fileInput.value = '';
    };

    document.querySelectorAll('[data-staging-acct]').forEach(sel=>{
      sel.onchange = ()=>{
        const id = sel.getAttribute('data-staging-acct');
        const row = (state.bankStaging||[]).find(s=>s.id===id);
        if(row) row.accountCode = sel.value || null;
        saveState();
      };
    });
    document.querySelectorAll('[data-staging-rate]').forEach(inp=>{
      inp.onchange = ()=>{
        const id = inp.getAttribute('data-staging-rate');
        const row = (state.bankStaging||[]).find(s=>s.id===id);
        if(row) row.fxRate = parseFloat(inp.value)||row.fxRate;
        saveState();
      };
    });
    document.querySelectorAll('[data-staging-discard]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.getAttribute('data-staging-discard');
        state.bankStaging = (state.bankStaging||[]).filter(s=>s.id!==id);
        saveState();
        renderMain();
      };

    document.querySelectorAll('[data-del-bankrule]').forEach(btn=>{

    const discardAllBtn = document.getElementById('bankImportDiscardAllBtn');
    if(discardAllBtn) discardAllBtn.onclick = ()=>{
      if(!confirm('Discard all '+(state.bankStaging||[]).length+' staged transactions? None of them have been posted, so this just clears the review list.')) return;
      state.bankStaging = [];

    };
    const postBtn = document.getElementById('bankImportPostBtn');
    if(postBtn) postBtn.onclick = async ()=>{
      const staging = state.bankStaging||[];
      const assigned = staging.filter(s=>s.accountCode);
      const unassigned = staging.length - assigned.length;
      if(assigned.length===0){ alert('Assign an account to at least one transaction before posting.'); return; }
      if(!confirm(`Post ${assigned.length} transaction(s) to the General Ledger?${unassigned ? ` ${unassigned} row(s) without an account assigned will stay here for later.` : ''}`)) return;
      let posted = 0;
      const postedIds = new Set();
      assigned.forEach(entry=>{
        // "Remember this" turns the correction into a reusable rule —
        // keyed on a short, distinctive piece of the description rather
        // than the whole thing, since bank descriptions often carry a
        // unique transaction ID that would never match again.
        const rememberBox = document.querySelector(`[data-staging-remember="${entry.id}"]`);
        if(rememberBox && rememberBox.checked){
          const keyword = entry.description.split(/\s+/).slice(0,3).join(' ').trim();
          if(keyword && !(state.bankRules||[]).some(r=>r.keyword.toLowerCase()===keyword.toLowerCase())){
            state.bankRules = [...(state.bankRules||[]), {id:uid(), keyword, accountCode:entry.accountCode}];
          }
        }
        if(postBankStagingEntry(entry)){ posted++; postedIds.add(entry.id); }
      });
      // Only rows that were really posted leave the list; anything that
      // could not be posted (e.g. its bank account was deleted) stays
      // visible instead of silently vanishing.
      state.bankStaging = staging.filter(s=>!postedIds.has(s.id));
      purgePostedBankStaging(state);
      // Render immediately, right after the local mutation, before any
      // network wait — the user sees the correct, posted state right
      // away no matter how long (or how it goes) the cloud push below
      // takes, rather than staring at the old list during that wait or
      // risking any timing issue showing stale data in between.
      renderMain();
      // Deliberately not the debounced saveState() here — posting moves
      // transactions out of staging and into the ledger, and that change
      // must actually reach the cloud before the user can navigate away,
      // or a reload within the debounce window pulls the old, pre-post
      // state back down and the staging list reappears exactly as if
      // nothing had ever been posted.
      idbSet(APP_STORAGE_KEY, JSON.stringify(appData)).then(ok=>{ localStorageFull = !ok; });
      let postPushedOk = true;
      if(authUser) postPushedOk = await pushToCloudAuth(true);
      else if(syncConfig.enabled) postPushedOk = await pushToCloud(true);
      if(!postPushedOk){
        alert(`Posted ${posted} transaction(s) locally, but could not reach the cloud after two attempts — check your internet connection and try posting again once it's back, or these could reappear here on next load. Do not close this tab or sign out until the sync indicator shows "synced."`);
      } else {
        alert(`Posted ${posted} transaction(s) to the ledger.`);
      }
    };
  }

      reader.onload = (e)=>{
        try{

          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
          if(rows.length===0){ alert('No rows found in that file.'); return; }
          const headerMap = buildHeaderMap(rows[0]);
          const result = parseExchangeRateHistoryFile(rows, headerMap, currency);

      };
    });

    const renameBtn = document.getElementById('setRenameEverywhereBtn');
    if(renameBtn) renameBtn.onclick = ()=>{
      const newName = document.getElementById('setRenameTarget').value.trim();
      if(!newName){ alert('Enter the new name first.'); return; }
      const oldName = state.settings.company.name;
      if(!confirm(`Rename "${oldName}" to "${newName}"? This updates it here, and any matching Supplier/Customer record in your other clients' books.`)) return;
      const result = renameCompanyEverywhere(newName);
      if(!result.ok){ alert(result.msg); return; }
      renderAll();
      alert(`Renamed to "${result.newName}". Updated ${result.updatedVendors} supplier record(s) and ${result.updatedCustomers} customer record(s) across your other clients.`);
    };

    const logoFile = document.getElementById('setLogoFile');
    if(logoFile) logoFile.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      if(file.size > 1024*1024){
        if(!confirm(`"${file.name}" is ${(file.size/1024/1024).toFixed(1)}MB — large logos slow the app down. Use it anyway?`)){ logoFile.value=''; return; }
      }
      const reader = new FileReader();
      reader.onload = (ev)=>{
        state.settings.company.logo = ev.target.result;
        saveState(); renderMain();
      };
      reader.onerror = ()=> alert('Could not read that image.');
      reader.readAsDataURL(file);
    };
    const removeLogoBtn = document.getElementById('setRemoveLogoBtn');
    if(removeLogoBtn) removeLogoBtn.onclick = ()=>{
      delete state.settings.company.logo;
      saveState(); renderMain();
    };

    const copyTeamCodeBtn = document.getElementById('copyTeamCodeBtn');
    if(copyTeamCodeBtn) copyTeamCodeBtn.onclick = ()=>{
      const el = document.getElementById('teamCodeDisplay');
      el.select();
      try{ document.execCommand('copy'); }catch(e){ /* ignore */ }
      copyTeamCodeBtn.textContent = 'Copied!';
      setTimeout(()=>{ copyTeamCodeBtn.textContent = 'Copy Code'; }, 1500);
    };
    document.querySelectorAll('[data-copy-code]').forEach(b=>{
      b.onclick = ()=>{
        const c = b.getAttribute('data-copy-code');
        try{ navigator.clipboard.writeText(c); }catch(e){ const t=document.createElement('textarea'); t.value=c; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
        b.textContent = 'Copied!'; setTimeout(()=>{ b.textContent = 'Copy'; }, 1500);
      };
    });
    document.querySelectorAll('[data-rotate-code]').forEach(b=>{
      b.onclick = async ()=>{
        const kind = b.getAttribute('data-rotate-code');
        if(!confirm('Make a new '+(kind==='viewer'?'view-only':'editor')+' invite code? The old code will stop working for anyone who has not joined yet.')) return;
        try{ await rotateInviteCode(kind); renderMain(); }catch(e){ alert(e.message||'Could not change the code.'); }
      };
    });
    document.querySelectorAll('[data-member-role]').forEach(sel=>{
      sel.onchange = async ()=>{
        try{ await setMemberRole(sel.getAttribute('data-member-role'), sel.value); renderMain(); }
        catch(e){ alert(e.message||'Could not change that role.'); teamMembersCache = null; renderMain(); }
      };
    });
    document.querySelectorAll('[data-remove-member]').forEach(b=>{
      b.onclick = async ()=>{
        const em = b.getAttribute('data-member-email')||'this person';
        if(!confirm('Remove '+em+' from the workspace? They will no longer be able to open these books.')) return;
        try{ await removeTeamMember(b.getAttribute('data-remove-member')); renderMain(); }
        catch(e){ alert(e.message||'Could not remove that member.'); }
      };
    });
    const openTeamSetupBtn = document.getElementById('openTeamSetupBtn');
    if(openTeamSetupBtn) openTeamSetupBtn.onclick = ()=>{
      teamSetupDismissed = false;
      teamSetupMode = 'choice';
      teamSetupError = '';
      renderAll();
    };
    const billingChooseBookkeeping = document.getElementById('billingChooseBookkeeping');
    const billingChooseStandard = document.getElementById('billingChooseStandard');
    const billingChooseFull = document.getElementById('billingChooseFull');
    const billingFormBk = document.getElementById('billingMomoFormBookkeeping');
    const billingFormStd = document.getElementById('billingMomoFormStandard');
    const billingFormFull = document.getElementById('billingMomoFormFull');
    if(billingChooseBookkeeping) billingChooseBookkeeping.onclick = ()=>{ billingFormBk.style.display = billingFormBk.style.display==='none' ? 'block' : 'none'; billingFormStd.style.display = 'none'; billingFormFull.style.display = 'none'; };
    if(billingChooseStandard) billingChooseStandard.onclick = ()=>{ billingFormStd.style.display = billingFormStd.style.display==='none' ? 'block' : 'none'; billingFormBk.style.display = 'none'; billingFormFull.style.display = 'none'; };
    if(billingChooseFull) billingChooseFull.onclick = ()=>{ billingFormFull.style.display = billingFormFull.style.display==='none' ? 'block' : 'none'; billingFormBk.style.display = 'none'; billingFormStd.style.display = 'none'; };
    const billingSubmitBk = document.getElementById('billingMomoSubmitBookkeeping');
    if(billingSubmitBk) billingSubmitBk.onclick = ()=> startMomoPayment('bookkeeping', document.getElementById('billingMomoPhoneBookkeeping').value);
    const billingSubmitStd = document.getElementById('billingMomoSubmitStandard');
    if(billingSubmitStd) billingSubmitStd.onclick = ()=> startMomoPayment('standard', document.getElementById('billingMomoPhoneStandard').value);
    const billingSubmitFull = document.getElementById('billingMomoSubmitFull');
    if(billingSubmitFull) billingSubmitFull.onclick = ()=> startMomoPayment('full', document.getElementById('billingMomoPhoneFull').value);
    document.querySelectorAll('.view-receipt-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const ref = btn.getAttribute('data-ref');
        const payment = (paymentHistoryCache||[]).find(p=> p.reference_id === ref);
        if(payment) showReceipt(payment);
      };
    });

    const saveBtn = document.getElementById('setSaveBtn');
    if(saveBtn) saveBtn.onclick = ()=>{
      const s = state.settings;
      s.company.name = document.getElementById('setCompanyName').value;
      s.company.tin = document.getElementById('setTin').value;
      s.company.address = document.getElementById('setAddress').value;
      s.company.fyEnd = document.getElementById('setFyEnd').value;
      s.cit = (parseFloat(document.getElementById('setCit').value)||0)/100;
      s.vat = (parseFloat(document.getElementById('setVat').value)||0)/100;
      s.tourismTax = (parseFloat(document.getElementById('setTourism').value)||0)/100;
      document.querySelectorAll('[data-payeband]').forEach(inp=>{
        const [idx, field] = inp.getAttribute('data-payeband').split('|');
        if(field==='upTo'){
          s.payeBands[idx].upTo = inp.value===''? null : parseFloat(inp.value);
        } else {
          s.payeBands[idx].rate = (parseFloat(inp.value)||0)/100;
        }
      });
      // sync taxTypes reference table to live settings
      state.taxTypes.forEach(t=>{
        if(t.name==='VAT') t.rate = s.vat;
        if(t.name==='CIT (Corporate Income Tax)') t.rate = s.cit;
        if(t.name==='Tourism Tax') t.rate = s.tourismTax;
      });
      saveState();
      alert('Settings saved.');
      renderMain();
    };
    const exportBtn = document.getElementById('exportBtn');
    if(exportBtn) exportBtn.onclick = ()=>{
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const safeName = (state.settings.company.name||'client').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
      a.href = url; a.download = `ishema-${safeName}-backup-${todayISO()}.json`;
      a.click(); URL.revokeObjectURL(url);
    };
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');
    if(importBtn) importBtn.onclick = ()=> importFile.click();
    if(importFile) importFile.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          if(confirm('This will replace all data for the CURRENT client with the imported file. Continue?')){
            const normalized = normalizeClient(data);
            appData.clients[appData.activeClientId] = normalized;
            state = normalized;
            saveState(); renderAll();
          }
        }catch(err){ alert('Could not read that file — is it a valid backup JSON?'); }
      };
      reader.readAsText(file);
    };
    const exportAllBtn = document.getElementById('exportAllBtn');
    if(exportAllBtn) exportAllBtn.onclick = ()=>{
      const blob = new Blob([JSON.stringify(appData, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `ishema-all-clients-backup-${todayISO()}.json`;
      a.click(); URL.revokeObjectURL(url);
    };
    const importAllBtn = document.getElementById('importAllBtn');
    const importAllFile = document.getElementById('importAllFile');
    if(importAllBtn) importAllBtn.onclick = ()=> importAllFile.click();
    if(importAllFile) importAllFile.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          if(!data.clients || !data.clientOrder){ alert('That file is not a full multi-client backup.'); return; }
          if(confirm('This will replace ALL clients and their data in this browser. Continue?')){
            const clients = {};
            Object.keys(data.clients).forEach(id=>{ clients[id] = normalizeClient(data.clients[id]); });
            appData = {clients, clientOrder: data.clientOrder.filter(id=>clients[id]), activeClientId: data.activeClientId};
            if(!appData.clients[appData.activeClientId]) appData.activeClientId = appData.clientOrder[0];
            state = appData.clients[appData.activeClientId];
            saveApp(); renderAll();
          }
        }catch(err){ alert('Could not read that file — is it a valid backup JSON?'); }
      };
      reader.readAsText(file);
    };
  }
}

    if(!requireActiveSubscription('print or save this as a PDF')) return;
    nativePrint();
  };
})();
