function saveExpense(){
  if(!requireActiveSubscription('add a new expense')) return;
  const t = expenseTotals();
  if(t.base<=0){ alert('Enter an amount greater than zero.'); return; }
  if(!expenseDraft.account){ alert('Select an expense account.'); return; }
  const entryRef = 'EXP-' + Date.now().toString().slice(-6);

  state.gl.push({id:uid(), date:expenseDraft.date, entry:entryRef, account:expenseDraft.account, memo:expenseDraft.description||'Expense', debit:t.base, credit:0});
  if(t.vat>0){
    state.gl.push({id:uid(), date:expenseDraft.date, entry:entryRef, account:'1300', memo:`${entryRef}: Input VAT`, debit:t.vat, credit:0});
  }
  if(t.wht>0){
    state.gl.push({id:uid(), date:expenseDraft.date, entry:entryRef, account:'2120', memo:`${entryRef}: WHT withheld`, debit:0, credit:t.wht});
  }
  state.gl.push({id:uid(), date:expenseDraft.date, entry:entryRef, account:expenseDraft.payFrom, memo:`${entryRef}: Payment`, debit:0, credit:t.netPay});

  if(expenseDraft.vendorId && expenseDraft.payFrom==='2000'){
    const vendor = state.vendors.find(v=>v.id===expenseDraft.vendorId);
    if(vendor) vendor.invoiced = (Number(vendor.invoiced)||0) + t.netPay;
  }

  state.bills = state.bills || [];
  state.bills.push({id:uid(), date:expenseDraft.date, vendorId:expenseDraft.vendorId, description:expenseDraft.description,
    account:expenseDraft.account, base:t.base, vat:t.vat, wht:t.wht, netPay:t.netPay, paid:0, payFrom:expenseDraft.payFrom, entryRef});

  saveState();
  expenseModalOpen = false;
  renderAll();
}

function computeAccountLedger(code, from, to){
  const acct = state.accounts.find(a=>a.code===code);
  if(!acct) return {acct:null, lines:[], totalDebit:0, totalCredit:0, netBalance:0, isDebitNormal:true};
  const isDebitNormal = acct.normal === 'Debit';
  const lines = state.gl
    .filter(l=>l.account===code && inRange(l.date, from||null, to||null))
    .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  let running = 0;
  const withRunning = lines.map(l=>{
    const debit = Number(l.debit)||0, credit = Number(l.credit)||0;
    running += isDebitNormal ? (debit-credit) : (credit-debit);
    return Object.assign({}, l, {debit, credit, running});
  });
  const totalDebit = lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
  const totalCredit = lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  const netBalance = isDebitNormal ? totalDebit-totalCredit : totalCredit-totalDebit;
  return {acct, lines: withRunning, totalDebit, totalCredit, netBalance, isDebitNormal};
}

// Cash-basis approximation: only recognizes a line if its Entry Ref also
// includes a line touching Cash/Bank — i.e. transactions recorded together
// with an actual cash movement (cash sales, cash expenses). Invoices/bills
// raised on credit and settled later via Record Payment are posted under a
// SEPARATE entry ref at payment time, so they aren't yet re-attributed back
// to the original revenue/expense account under this toggle — a clearly
// labeled limitation rather than a full general-ledger cash-basis engine.
function sumAccountCashBasis(code, from, to, side){
  const cashAccounts = ['1000','1010'];
  let debit=0, credit=0;
  state.gl.forEach(l=>{
    if(l.account!==code) return;
    if(!inRange(l.date, from, to)) return;
    const hasCashSibling = l.entry && state.gl.some(s=>s.entry===l.entry && cashAccounts.includes(s.account));
    if(!hasCashSibling) return;
    debit += Number(l.debit)||0;
    credit += Number(l.credit)||0;
  });
  if(side==='debit') return debit;
  if(side==='credit') return credit;
  return debit-credit;
}

// Pulls every GL line that shares one entry ref (e.g. a payroll posting
// that created Net Salary Payable + PAYE + Pension + Maternity + CBHI all
// at once) back into the journal entry builder as a single editable group,
// so changing one figure and re-saving reposts the whole set together
// instead of editing each line one at a time.
function startGLGroupEdit(entryRef){
  const lines = state.gl.filter(l=>l.entry===entryRef);
  if(!lines.length) return;
  const first = lines[0];
  const currency = first.currency || (state.currencies.find(c=>c.base)||{code:'RWF'}).code;
  const fxRate = first.fxRate || currencyRate(currency);
  glEntryDraft = {
    date: first.date,
    entry: entryRef,
    currency,
    fxRate,
    lines: lines.map(l=>({
      account: l.account,
      memo: l.memo || '',
      debit: l.originalDebit!=null ? l.originalDebit : (l.debit || ''),
      credit: l.originalCredit!=null ? l.originalCredit : (l.credit || '')
    }))
  };
  glGroupEditRef = entryRef;
  glEditId = null;
  renderMain();
}

function cancelGLGroupEdit(){
  glGroupEditRef = null;
  glEntryDraft = defaultGLEntryDraft();
  renderMain();
}

  `;
}

// Best-effort "Transaction Type" derived from the entry reference prefix
// — the app doesn't store a separate structured type field per line, so
// this reads the same conventions this app itself already uses when
// generating references (INV-, PC-, PAYROLL-, etc.) rather than
// guessing. Anything unrecognized falls back to "Journal Entry" rather
// than showing something potentially wrong.
function txnTypeForEntry(entryRef){
  const ref = String(entryRef||'');
  const rules = [
    [/-PMT$/, 'Payment'],
    [/^INV-/, 'Invoice'],
    [/^PC-/, 'Petty Cash'],
    [/^PAYROLL-/, 'Payroll'],
    [/^EBM-/, 'Sales Receipt'],
    [/^EXP-/, 'Expense'],
    [/^SALE-/, 'Sale'],
    [/^PUR-/, 'Purchase'],
    [/^REC-/, 'Recurring Transaction'],
    [/^CIT-SETTLE-/, 'CIT Settlement'],
    [/^CIT-/, 'CIT Prepayment'],
    [/^VAT-SETTLE-/, 'VAT Settlement'],
    [/^VAT-PAY-/, 'VAT Payment'],
    [/^VAT-REFUND-/, 'VAT Refund'],
    [/^VAT-WRITEOFF-/, 'VAT Write-Off'],
    [/^DEPR-/, 'Depreciation'],
    [/^STK-IN-/, 'Stock In'],
    [/^STK-OUT-/, 'Stock Out'],
    [/^BANKSTMT-/, 'Bank Adjustment'],
    [/^BILL/, 'Bill'],
    [/^PF-/, 'Professional Fees'],
    [/^JE-IMP-/, 'Imported Journal'],
    [/^JE-/, 'Journal Entry'],
  ];
  for(const [re,label] of rules){ if(re.test(ref)) return label; }
  return 'Journal Entry';
}

// Builds the General Ledger grouped by account — QuickBooks' own "General
// Ledger" report layout: one section per account, a running balance that
// carries a Beginning Balance forward, a Split column showing the other
// side of each transaction, and a Total row closing out each account.
// Only accounts with actual activity in the selected range are shown,
// matching how the reference report behaves.
function computeGLByAccount(rows, glFrom, glTo){
  // Index every line by its entry reference once, so finding "what else
  // is on this transaction" for the Split column is O(1) per line
  // instead of re-scanning the whole ledger for every single row.
  const byRef = {};
  state.gl.forEach(l=>{ (byRef[l.entry] = byRef[l.entry]||[]).push(l); });

  const accountsWithActivity = [...new Set(rows.map(l=>l.account))]
    .map(code => state.accounts.find(a=>a.code===code) || {code, name:acctName(code), normal:'Debit'})
    .sort((a,b)=> a.code.localeCompare(b.code));

  return accountsWithActivity.map(acct=>{
    const beginningBalance = glFrom ? sumAccount(acct.code, null, addDays(glFrom,-1), 'net') * (acct.normal==='Debit'?1:-1) : 0;
    const acctRows = rows.filter(l=>l.account===acct.code).sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));
    let running = beginningBalance;
    const lines = acctRows.map(l=>{
      const signedAmount = (acct.normal==='Debit' ? (Number(l.debit)||0)-(Number(l.credit)||0) : (Number(l.credit)||0)-(Number(l.debit)||0));
      running += signedAmount;
      const others = (byRef[l.entry]||[]).filter(x=>x.id!==l.id);
      const otherAccounts = [...new Set(others.map(x=>x.account))];
      const split = otherAccounts.length===0 ? '—'
        : otherAccounts.length===1 ? `${otherAccounts[0]} — ${acctName(otherAccounts[0])}`
        : '-Split-';
      return {line:l, type: txnTypeForEntry(l.entry), split, amount: signedAmount, balance: running};
    });
    return {account: acct, beginningBalance, lines, total: running};
  }).filter(g=> g.lines.length>0);
}

// The generic exporter (exportReportToExcel) turns every <table> on the
// page into its own sheet — fine for the old single-table list view, but
// the "By Account" view deliberately renders one table per account, which
// would otherwise scatter the whole ledger across dozens of tabs. This
// builds one continuous sheet instead, with each account's own header,
// rows, and subtotal stacked in sequence — matching what's on screen,
// just as a single tab rather than split apart.
function exportGLByAccountToExcel(rows, glFromVal, glToVal, filtered){
  if(!requireActiveSubscription('download this report')) return;
  if(typeof XLSX === 'undefined'){ alert('Export library did not load — check your internet connection and reload the page.'); return; }
  const c = state.settings.company;
  const groups = computeGLByAccount(rows, filtered ? glFromVal : null, glToVal);
  const aoa = [
    [c.name||'Company Name'],
    [`TIN: ${c.tin||'—'}${c.address ? '   •   '+c.address : ''}`],
    [`General Ledger${filtered ? ` — ${glFromVal||'…'} to ${glToVal||'…'}` : ' — All Time'}`],
  ];
  groups.forEach(g=>{
    aoa.push([]);
    aoa.push([`${g.account.code} — ${acctName(g.account.code)}`]);
    aoa.push(['Date','Type','Number','Description','Split','Amount','Balance']);
    if(filtered) aoa.push(['','','','Beginning Balance','','', g.beginningBalance]);
    g.lines.forEach(row=>{
      aoa.push([row.line.date||'', row.type, row.line.entry, row.line.memo, row.split, row.amount, row.balance]);
    });
    aoa.push(['','','',`Total for ${acctName(g.account.code)}`,'','', g.total]);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:11},{wch:16},{wch:14},{wch:32},{wch:28},{wch:13},{wch:13}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, excelSafeSheetName('General Ledger'));
  const companyName = (c.name||'Company').replace(/[^a-z0-9]+/gi,'-');
  XLSX.writeFile(wb, `${companyName}-General-Ledger.xlsx`);
}

// Same reasoning as the Excel version above, for print/PDF: the generic
// printCurrentReport() clones the whole page as-is, including the
// max-height/overflow scroll box these tables sit in for on-screen use
// (which would just clip most of the ledger when printed) and the entry
// form / import tools / tax reconciliation panel that don't belong in a
// printed ledger at all. This builds one clean, self-contained document
// instead — just the company header and every account's transactions in
// sequence — same own-window pattern as Attendance/Petty Cash/Revenue
// Streams, so colors and print-to-PDF work the same way here too.
function printGLByAccount(rows, glFromVal, glToVal, filtered){
  if(!requireActiveSubscription('download or print this report')) return;
  const c = state.settings.company;
  const groups = computeGLByAccount(rows, filtered ? glFromVal : null, glToVal);
  const rangeLabel = filtered ? `${glFromVal||'…'} to ${glToVal||'…'}` : 'All Time';

  const sections = groups.map(g=>`
    <table>
      <thead>
        <tr><th colspan="7" class="acct-head">${esc(g.account.code)} — ${esc(acctName(g.account.code))}</th></tr>
        <tr><th>Date</th><th>Type</th><th>Number</th><th>Description</th><th>Split</th><th class="num">Amount</th><th class="num">Balance</th></tr>
      </thead>
      <tbody>
        ${filtered ? `<tr class="opening"><td colspan="6">Beginning Balance</td><td class="num">${fmt(g.beginningBalance)}</td></tr>` : ''}
        ${g.lines.map(row=>`<tr><td>${row.line.date||''}</td><td>${esc(row.type)}</td><td class="mono">${esc(row.line.entry)}</td><td>${esc(row.line.memo)}</td><td>${esc(row.split)}</td><td class="num">${fmt(row.amount)}</td><td class="num">${fmt(row.balance)}</td></tr>`).join('')}
        <tr class="total"><td colspan="6">Total for ${esc(acctName(g.account.code))}</td><td class="num">${fmt(g.total)}</td></tr>
      </tbody>
    </table>
  `).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>General Ledger — ${esc(rangeLabel)}</title>
    <style>
      *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      body{font-family:'IBM Plex Sans',Arial,sans-serif;background:#F7F4EC;color:#241F16;margin:0;padding:32px;}
      h1{font-size:18px;margin:0 0 2px;font-family:'Fraunces',Georgia,serif;color:#16233D;}
      .sub{font-size:12px;color:#6B6455;margin:0 0 18px;}
      table{border-collapse:collapse;width:100%;font-size:11.5px;margin-bottom:22px;}
      td,th{padding:6px 7px;border-bottom:1px solid #EFEADC;text-align:left;}
      th{background:#234F3A;color:#fff;font-size:10px;text-transform:uppercase;}
      th.acct-head{background:#EFEADC;color:#16233D;font-size:12.5px;text-transform:none;font-weight:700;}
      td.num, th.num{text-align:right;}
      td.mono{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6B6455;}
      tr.opening td{font-style:italic;color:#6B6455;}
      tr.total td{background:#EFEADC;font-weight:700;border-top:1.5px solid #234F3A;}
      button{margin-bottom:18px;padding:10px 18px;background:#234F3A;color:#fff;border:none;border-radius:4px;font-size:13.5px;font-weight:600;cursor:pointer;}
      @media print{ button{display:none;} body{padding:0;} table{break-inside:auto;} tr{break-inside:avoid;} }
    </style></head><body>
    <button onclick="window.print()">🖨 Print / Save as PDF</button>
    <h1>${esc(c.name||'Company Name')}</h1>
    <p class="sub">TIN: ${esc(c.tin||'—')}${c.address?' • '+esc(c.address):''} — General Ledger: ${esc(rangeLabel)}</p>
    ${sections || '<p>No activity in this range.</p>'}
  </body></html>`;
  const win = window.open('', '_blank');
  if(!win){ alert('Your browser blocked the report popup — allow popups for this site and try again.'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
}

function parseImportedDate(raw){
  if(raw instanceof Date && !isNaN(raw)) return raw.toISOString().slice(0,10);
  if(typeof raw === 'number'){
    // Excel serial date number
    const d = new Date(Math.round((raw - 25569) * 86400 * 1000));
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  const str = String(raw==null?'':raw).trim();

  // Already ISO (YYYY-MM-DD) — unambiguous, use directly rather than letting
  // native Date parsing touch it.
  const isoMatch = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(isoMatch) return `${isoMatch[1]}-${String(isoMatch[2]).padStart(2,'0')}-${String(isoMatch[3]).padStart(2,'0')}`;

  // DD/MM/YYYY, DD-MM-YYYY, DD.MM.YYYY — the standard date order in Rwanda
  // (and most of the world) — e.g. "01/02/2026" means 1 February 2026, NOT
  // January 2nd. JavaScript's native Date() parser assumes US MM/DD/YYYY
  // for ambiguous strings like this, which silently swaps day and month —
  // so this is parsed explicitly first rather than falling through to it.
  const dmyMatch = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(dmyMatch){
    let day = parseInt(dmyMatch[1],10), month = parseInt(dmyMatch[2],10), year = parseInt(dmyMatch[3],10);
    if(year < 100) year += (year < 50 ? 2000 : 1900);
    // If the "month" position is > 12, it can't actually be a month — the
    // source data must be MM/DD/YYYY after all, so swap back.
    if(month > 12 && day <= 12){ const tmp = day; day = month; month = tmp; }
    if(month>=1 && month<=12 && day>=1 && day<=31){
      const iso = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      if(!isNaN(new Date(iso))) return iso;
    }
  }

  // DD-Mon-YY / DD-Mon-YYYY (e.g. "01-Apr-26") — BNR's own published rate
  // history uses this format. Unambiguous by construction (a text month
  // name can't be confused with a day), but parsed explicitly rather than
  // left to the browser's native Date() below, since non-ISO string
  // parsing there is implementation-defined and isn't guaranteed
  // consistent across browsers.
  const monMatch = str.match(/^(\d{1,2})[\-\s]([A-Za-z]{3,9})[\-\s](\d{2,4})$/);
  if(monMatch){
    const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    const day = parseInt(monMatch[1],10);
    const month = MONTHS[monMatch[2].slice(0,3).toLowerCase()];
    let year = parseInt(monMatch[3],10);
    if(year < 100) year += (year < 50 ? 2000 : 1900);
    if(month && day>=1 && day<=31){
      const iso = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      if(!isNaN(new Date(iso))) return iso;
    }
  }

  const parsed = new Date(raw);
  return isNaN(parsed) ? todayISO() : parsed.toISOString().slice(0,10);
}

function parseNum(raw){
  if(typeof raw === 'number') return raw;
  const cleaned = String(raw==null?'':raw).replace(/[, ]/g,'').trim();
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function buildHeaderMap(row){
  const map = {};
  Object.keys(row).forEach(h=>{ map[String(h).trim().toLowerCase()] = h; });
  return map;
}

// Infer a reasonable account Type/Normal for an account name we've never seen
// before, so imports from other systems don't get silently dropped just
// because their account naming differs from this Chart of Accounts.
// Returns '1300' or '2100' if this name clearly refers to Input or Output
// VAT under different wording, or null if it's not a VAT account at all, or
// too ambiguous to be sure (e.g. bare "VAT" with no input/output/payable/
// receivable qualifier) — in which case it's left alone rather than guessed.
function canonicalVatAccountCode(name){
  const n = String(name||'').toLowerCase();
  if(!/\bvat\b|\btax\b/.test(n)) return null;
  const isInput = /\binput\b|\breceivable\b/.test(n);
  const isOutput = /\boutput\b|\bpayable\b/.test(n);
  if(isInput && !isOutput) return '1300';
  if(isOutput && !isInput) return '2100';
  return null;
}
// Any account, anywhere in the current Chart of Accounts, that should
// really just be the existing 1300/2100 VAT account under a different
// name — the residue of an import whose account-name spelling didn't
// exact-match before this recognition existed.
function findDuplicateVatAccounts(){
  return state.accounts
    .filter(a=> a.code!=='1300' && a.code!=='2100' && !!canonicalVatAccountCode(a.name))
    .map(a=> ({...a, canonicalCode: canonicalVatAccountCode(a.name)}));
}
// One-time repair: moves every transaction on a duplicate VAT account onto
// the real 1300/2100 account it was always meant to be. The now-empty
// duplicate account definition is left in the Chart of Accounts (harmless,
// just unused) rather than deleted, so nothing else that might reference
// its code breaks.
function fixDuplicateVatAccounts(){
  const dupes = findDuplicateVatAccounts();
  const fixed = [];
  let totalMoved = 0;
  dupes.forEach(d=>{
    const stats = accountLineStats(d.code);
    if(stats.count===0) return;
    const moved = reassignAccountLines(d.code, d.canonicalCode);
    totalMoved += moved;
    fixed.push({code:d.code, name:d.name, canonicalCode:d.canonicalCode, moved});
  });
  return {fixed, totalMoved};
}

function inferAccountType(name){
  const n = name.toLowerCase();
  if(/fixed asset|equipment|vehicle|property|building|accumulated depreciation/.test(n)) return {type:'Asset', normal:'Debit', classification:'Non-Current'};
  if(/output\s*vat|vat\s*output|vat\s*payable/.test(n)) return {type:'Liability', normal:'Credit', classification:'Current'};
  if(/input\s*vat|vat\s*input|vat\s*receivable/.test(n)) return {type:'Asset', normal:'Debit', classification:'Current'};
  if(/payable|loan|liability/.test(n)) return {type:'Liability', normal:'Credit', classification:'Current'};
  if(/receivable/.test(n)) return {type:'Asset', normal:'Debit', classification:'Current'};
  if(/equity|capital|retained earnings/.test(n)) return {type:'Equity', normal:'Credit'};
  if(/revenue|income|sales/.test(n)) return {type:'Income', normal:'Credit'};
  if(/cash|bank|inventory/.test(n)) return {type:'Asset', normal:'Debit', classification:'Current'};
  return {type:'Expense', normal:'Debit'}; // safest default for wages/contributions/payments/etc.
}

function findOrCreateAccountInList(accountsList, name, createdList){
  const clean = String(name||'').trim();
  if(!clean) return null;
  let acct = accountsList.find(a=>a.name.toLowerCase()===clean.toLowerCase());
  if(acct) return acct;
  const vatCode = canonicalVatAccountCode(clean);
  if(vatCode){
    const vatAcct = accountsList.find(a=>a.code===vatCode);
    if(vatAcct) return vatAcct; // e.g. "Input VAT" / "output vat" / "VAT Payable" all resolve to the one real VAT account instead of splitting into a duplicate
  }
  const inferred = inferAccountType(clean);
  let code = 9000;
  while(accountsList.some(a=>a.code===String(code))) code++;
  acct = {code:String(code), name:clean, type:inferred.type, normal:inferred.normal};
  if(inferred.classification) acct.classification = inferred.classification;
  accountsList.push(acct);
  accountsList.sort((a,b)=> a.name.localeCompare(b.name)); // keep the same alphabetical-by-name order everything else relies on, even for accounts created on the fly
  if(createdList) createdList.push(acct);
  return acct;
}
function findOrCreateAccountByName(name, createdList){
  return findOrCreateAccountInList(state.accounts, name, createdList);
}
function findAccountsPayableInList(accountsList){
  return accountsList.find(a=>a.code==='2000') || findOrCreateAccountInList(accountsList, 'Accounts Payable');
}
function findOrCreateVendorInList(vendorsList, name, contact){
  const clean = String(name||'').trim();
  if(!clean) return null;
  let v = vendorsList.find(v=>v.name.toLowerCase()===clean.toLowerCase());
  if(v) return v;
  v = {id:uid(), name:clean, contact: contact||'', opening:0, invoiced:0, paid:0};
  vendorsList.push(v);
  return v;
}

function findOrCreateCustomerInList(customersList, name, contact){
  const clean = String(name||'').trim();
  if(!clean) return null;
  let c = customersList.find(c=>c.name.toLowerCase()===clean.toLowerCase());
  if(c) return c;
  c = {id:uid(), name:clean, contact: contact||'', opening:0, invoiced:0, paid:0};
  customersList.push(c);
  return c;
}

// DD/MM/YYYY display format, for report titles that need to show the
// date range plainly rather than the app's internal ISO (YYYY-MM-DD)
// form.
function dmy(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}
function addDays(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}

// Merges a duplicate account into the one you keep: every General Ledger
// line, invoice line, bill, and recurring template referencing the removed
// account is reassigned to the kept account, then the duplicate is deleted
// from this client's own Chart of Accounts. Only touches THIS client's data.
function mergeAccounts(keepCode, removeCode){
  if(keepCode===removeCode) return {ok:false, msg:'Choose two different accounts.'};
  const keepAcct = state.accounts.find(a=>a.code===keepCode);
  const removeAcct = state.accounts.find(a=>a.code===removeCode);
  if(!keepAcct || !removeAcct) return {ok:false, msg:'Account not found.'};

  let glCount = 0;
  state.gl.forEach(l=>{ if(l.account===removeCode){ l.account = keepCode; glCount++; } });
  (state.invoices||[]).forEach(inv=>{
    (inv.lines||[]).forEach(l=>{ if(l.account===removeCode) l.account = keepCode; });
  });
  (state.bills||[]).forEach(b=>{ if(b.account===removeCode) b.account = keepCode; });
  (state.recurring||[]).forEach(r=>{
    if(r.debitAccount===removeCode) r.debitAccount = keepCode;
    if(r.creditAccount===removeCode) r.creditAccount = keepCode;
  });

  state.accounts = state.accounts.filter(a=>a.code!==removeCode);
  saveState();
  return {ok:true, glCount, removedName: removeAcct.name, keptName: keepAcct.name};
}

// Merges a duplicate customer or supplier into the one you keep — every
// invoice or bill referencing the removed record is reassigned to the
// kept one (so all transaction history is preserved, nothing lost), the
// two ledger records' Opening/Invoiced/Paid figures are combined, and the
// duplicate is removed. This is what actually fixes a name like "FK
// Advocates" and "FK ADVOCATES Ltd" showing as two separate rows in the
// Aged report — they're two different records in the data even though
// they're clearly the same real supplier, and merging is the only way to
// correct that without losing either one's transaction history.
function mergeCustomerOrVendor(key, keepId, removeId){
  if(keepId===removeId) return {ok:false, msg:'Choose two different records.'};
  const list = state[key] || [];
  const keep = list.find(r=>r.id===keepId);
  const remove = list.find(r=>r.id===removeId);
  if(!keep || !remove) return {ok:false, msg:'Record not found.'};

  let count = 0;
  if(key==='customers'){
    (state.invoices||[]).forEach(inv=>{ if(inv.customerId===removeId){ inv.customerId = keepId; count++; } });
  } else {
    (state.bills||[]).forEach(b=>{ if(b.vendorId===removeId){ b.vendorId = keepId; count++; } });
  }
  keep.opening = (Number(keep.opening)||0) + (Number(remove.opening)||0);
  keep.invoiced = (Number(keep.invoiced)||0) + (Number(remove.invoiced)||0);
  keep.paid = (Number(keep.paid)||0) + (Number(remove.paid)||0);

  state[key] = list.filter(r=>r.id!==removeId);
  saveState();
  return {ok:true, count, removedName: remove.name, keptName: keep.name};
}

// Renames the current (active) company, and retroactively renames any
// matching Vendor record in ALL your other managed clients' own books —
// so a service-provider identity used in past Professional Fee bills (e.g.
// "Ishema Accounting Ltd" or the unnamed default "Your Company Ltd")
// gets updated everywhere it's referenced, not just going forward.
function renameCompanyEverywhere(newName){
  newName = String(newName||'').trim();
  if(!newName) return {ok:false, msg:'Enter a name.'};
  const oldName = (state.settings.company.name||'').trim();
  state.settings.company.name = newName;

  let updatedVendors = 0;
  let updatedCustomers = 0;
  appData.clientOrder.forEach(id=>{
    if(id===appData.activeClientId) return;
    const client = appData.clients[id];
    (client.vendors||[]).forEach(v=>{
      if(oldName && v.name && v.name.trim().toLowerCase()===oldName.toLowerCase()){
        v.name = newName;
        updatedVendors++;
      }
    });
    (client.customers||[]).forEach(c=>{
      if(oldName && c.name && c.name.trim().toLowerCase()===oldName.toLowerCase()){
        c.name = newName;
        updatedCustomers++;
      }
    });
  });

  saveState();
  return {ok:true, oldName, newName, updatedVendors, updatedCustomers};
}

// When a Customer is linked to another company you manage in this app,
// invoicing them also posts a matching expense into THAT company's own
// separate books (Dr Professional & Accounting Fees, Cr Accounts Payable),
// and records you as a vendor there. Returns the recipient company's name
// if mirroring happened, or null if the customer isn't linked to anything.
function mirrorInvoiceAsExpense(inv, total, customer){
  if(!customer || !customer.linkedClientId) return null;
  const recipient = appData.clients[customer.linkedClientId];
  if(!recipient) return null;
  const expenseAcct = findOrCreateAccountInList(recipient.accounts, 'Professional & Accounting Fees');
  const apAcct = findAccountsPayableInList(recipient.accounts);
  const vendor = findOrCreateVendorInList(recipient.vendors, state.settings.company.name || 'Service Provider');
  const entryRef = inv.invoiceNo + '-IN';
  recipient.gl.push({id:uid(), date:inv.date, entry:entryRef, account:expenseAcct.code, memo:`${state.settings.company.name}: ${inv.invoiceNo}`, debit:total, credit:0});
  recipient.gl.push({id:uid(), date:inv.date, entry:entryRef, account:apAcct.code, memo:`${state.settings.company.name}: ${inv.invoiceNo}`, debit:0, credit:total});
  vendor.invoiced = (Number(vendor.invoiced)||0) + total;
  return recipient.settings.company.name;
}

// Professional Fees tab, correct direction: records a fee THIS (currently
// active) company owes to a service provider (another company you manage —
// typically your own accounting firm). Posts the bill/expense here, and
// mirrors the matching revenue into the provider's own separate books.
function billPaymentTier(bill){
  const paid = Number(bill.paid)||0;
  const net = Number(bill.netPay)||0;
  if(paid<=0.005) return 'Unpaid';
  if(paid+0.005 >= net) return 'Fully Paid';
  return 'Partially Paid';
}

const PF_TAX_TYPES = {
  VAT: {label:'VAT', ratePath:'vat'},
  WHT: {label:'WHT', ratePath:'wht'},
  ORA: {label:'OR Tax A — Exempted', rate:0},
  ORC: {label:'OR Tax C', rate:0}
};
function pfTaxRate(taxType){
  const def = PF_TAX_TYPES[taxType] || PF_TAX_TYPES.VAT;
  return def.ratePath ? (Number(state.settings[def.ratePath])||0) : (def.rate||0);
}
function pfTaxLabel(taxType, ratePctOverride){
  const def = PF_TAX_TYPES[taxType] || PF_TAX_TYPES.VAT;
  const pct = ratePctOverride!=null ? ratePctOverride : pfTaxRate(taxType)*100;
  return taxType==='ORA' ? def.label : `${def.label} (${pct.toFixed(1).replace(/\.0$/,'')}%)`;
}

function recordOwedProfessionalFee(providerName, description, amount, taxType, date, dueDate){
  providerName = String(providerName||'').trim();
  if(!providerName) return {ok:false, msg:'Enter who provided this service.'};
  amount = Number(amount)||0;
  if(amount<=0) return {ok:false, msg:'Enter an amount greater than zero.'};
  taxType = PF_TAX_TYPES[taxType] ? taxType : 'VAT';
  const rate = pfTaxRate(taxType);

  // If the typed name matches one of your OTHER managed clients (case-insensitive),
  // mirror this as their revenue too, same as before. If it doesn't match anyone —
  // an external provider not tracked in this workspace — just record the bill here,
  // with nothing to mirror into.
  const matchedProviderId = appData.clientOrder.find(id=>
    id!==appData.activeClientId &&
    (appData.clients[id].settings.company.name||'').trim().toLowerCase() === providerName.toLowerCase()
  );
  const provider = matchedProviderId ? appData.clients[matchedProviderId] : null;

  const subtotal = amount;
  // VAT/OR-Tax types add on top of the base amount; WHT is withheld
  // from the payment instead, so it reduces what's actually paid out.
  const vat = (taxType==='VAT') ? subtotal * rate : 0;
  const wht = (taxType==='WHT') ? subtotal * rate : 0;
  const total = subtotal + vat - wht; // net amount payable to the provider
  const invoiceNo = 'PF-' + String((state.invoices||[]).length + (provider?(provider.invoices||[]).length:0) + 1).padStart(4,'0');
  const entryRef = invoiceNo;

  // --- This (active) company: record the bill as an expense ---
  const expenseAcct = findOrCreateAccountByName('Professional & Accounting Fees');
  const apAcct = state.accounts.find(a=>a.code==='2000') || findOrCreateAccountByName('Accounts Payable');
  const vendor = findOrCreateVendorInList(state.vendors, providerName);
  state.gl.push({id:uid(), date, entry:entryRef, account:expenseAcct.code, memo:`${entryRef}: ${description}`, debit:subtotal, credit:0});
  if(vat>0){
    const vatInAcct = state.accounts.find(a=>a.code==='1300') || findOrCreateAccountByName('VAT Input (Receivable)');
    state.gl.push({id:uid(), date, entry:entryRef, account:vatInAcct.code, memo:`${entryRef}: Input VAT`, debit:vat, credit:0});
  }
  if(wht>0){
    const whtAcct = state.accounts.find(a=>a.code==='2120') || findOrCreateAccountByName('WHT Payable');
    state.gl.push({id:uid(), date, entry:entryRef, account:whtAcct.code, memo:`${entryRef}: WHT withheld`, debit:0, credit:wht});
  }
  state.gl.push({id:uid(), date, entry:entryRef, account:apAcct.code, memo:`${entryRef}: ${vendor.name}`, debit:0, credit:total});
  vendor.invoiced = (Number(vendor.invoiced)||0) + total;

  // --- Track locally on this side, for listing/status/delete — always
  // created, whether or not this provider is one of your other clients ---
  state.bills = state.bills || [];
  const billRecord = {id:uid(), invoiceNo, date, dueDate, vendorId:vendor.id, description, account:expenseAcct.code,
    base:subtotal, vat, wht, netPay:total, paid:0, payFrom:'2000', entryRef, taxType,
    providerClientId: matchedProviderId||null, mirroredInvoiceId: null};
  state.bills.push(billRecord);

  if(!provider){
    // External provider — not one of your other managed clients, so
    // there's nothing to mirror. This side is fully recorded either way.
    saveState();
    return {ok:true, mirrored:false, providerName, billId: billRecord.id};
  }

  // --- Provider's own separate books: mirror as their revenue ---
  let providerCustomer = provider.customers.find(c=>c.linkedClientId===appData.activeClientId);
  if(!providerCustomer){
    providerCustomer = {id:uid(), name: state.settings.company.name||'Client', contact: state.settings.company.tin||'',
      opening:0, invoiced:0, paid:0, linkedClientId: appData.activeClientId};
    provider.customers.push(providerCustomer);
  }
  const provRevenueAcct = findOrCreateAccountInList(provider.accounts, 'Professional Fees Income');
  const provArAcct = provider.accounts.find(a=>a.code==='1100') || findOrCreateAccountInList(provider.accounts, 'Accounts Receivable');
  const mirrorRef = entryRef + '-IN';
  provider.gl.push({id:uid(), date, entry:mirrorRef, account:provArAcct.code, memo:`${entryRef}: ${description}`, debit:total, credit:0});
  provider.gl.push({id:uid(), date, entry:mirrorRef, account:provRevenueAcct.code, memo:`${entryRef}: ${description}`, debit:0, credit:subtotal});
  if(vat>0){
    const provVatOutAcct = provider.accounts.find(a=>a.code==='2100') || findOrCreateAccountInList(provider.accounts, 'VAT Output (Payable)');
    provider.gl.push({id:uid(), date, entry:mirrorRef, account:provVatOutAcct.code, memo:`${entryRef}: VAT`, debit:0, credit:vat});
  }
  if(wht>0){
    // From the provider's side, WHT withheld by the payer is a prepaid tax
    // credit they can claim against their own CIT — not a reduction of revenue.
    const provWhtRecAcct = findOrCreateAccountInList(provider.accounts, 'WHT Receivable (Tax Credit)');
    provider.gl.push({id:uid(), date, entry:mirrorRef, account:provWhtRecAcct.code, memo:`${entryRef}: WHT withheld by client`, debit:wht, credit:0});
    provider.gl.push({id:uid(), date, entry:mirrorRef, account:provArAcct.code, memo:`${entryRef}: WHT withheld`, debit:0, credit:wht});
  }
  providerCustomer.invoiced = (Number(providerCustomer.invoiced)||0) + total;

  const provInvoiceRecord = {id:uid(), invoiceNo, customerId:providerCustomer.id, date, dueDate,
    lines:[{description, qty:1, unitPrice:subtotal, account:provRevenueAcct.code}],
    subtotal, vat, total, paid:0, entryRef: mirrorRef};
  provider.invoices = provider.invoices || [];
  provider.invoices.push(provInvoiceRecord);
  billRecord.mirroredInvoiceId = provInvoiceRecord.id;

  saveState();
  return {ok:true, mirrored:true, providerName, billId: billRecord.id};
}

function deleteProfessionalFeeBill(billId){
  const bill = state.bills.find(b=>b.id===billId);
  if(!bill) return false;

  state.gl = state.gl.filter(l=>l.entry!==bill.entryRef);
  const vendor = state.vendors.find(v=>v.id===bill.vendorId);
  if(vendor) vendor.invoiced = Math.max(0, (Number(vendor.invoiced)||0) - (Number(bill.netPay)||0));

  if(bill.providerClientId && appData.clients[bill.providerClientId]){
    const provider = appData.clients[bill.providerClientId];
    const mirrorRef = bill.entryRef + '-IN';
    provider.gl = provider.gl.filter(l=>l.entry!==mirrorRef);
    const provInvoice = (provider.invoices||[]).find(i=>i.id===bill.mirroredInvoiceId);
    if(provInvoice){
      const provCustomer = provider.customers.find(c=>c.id===provInvoice.customerId);
      if(provCustomer) provCustomer.invoiced = Math.max(0, (Number(provCustomer.invoiced)||0) - (Number(provInvoice.total)||0));
      provider.invoices = provider.invoices.filter(i=>i.id!==bill.mirroredInvoiceId);
    }
  }

  state.bills = state.bills.filter(b=>b.id!==billId);
  saveState();
  return true;
}

// Fully removes a vendor/customer AND every bill/invoice tied to it from
// THIS company only — used for the exact situation just found: a
// supplier or customer that's actually a duplicate leaked in from another
// managed company, where the real, correct record lives elsewhere and
// this company's copy is pure contamination, not real data of its own.
function deleteVendorCompletely(vendorId){
  const vendor = state.vendors.find(v=>v.id===vendorId);
  if(!vendor) return {ok:false};
  const bills = (state.bills||[]).filter(b=>b.vendorId===vendorId);
  bills.forEach(b=> deleteProfessionalFeeBill(b.id));
  state.vendors = state.vendors.filter(v=>v.id!==vendorId);
  saveState();
  return {ok:true, billCount: bills.length, name: vendor.name};
}
function deleteCustomerCompletely(customerId){
  const customer = state.customers.find(c=>c.id===customerId);
  if(!customer) return {ok:false};
  const invoices = (state.invoices||[]).filter(i=>i.customerId===customerId);
  invoices.forEach(i=> deleteInvoiceEverywhere(i.id));
  state.customers = state.customers.filter(c=>c.id!==customerId);
  saveState();
  return {ok:true, invoiceCount: invoices.length, name: customer.name};
}

// Finds customers/suppliers in the CURRENT company that share a name with
// one in a DIFFERENT company you manage — flagged for review, never
// auto-deleted, since a supplier genuinely working with more than one of
// your companies is completely normal and not a bug. This is specifically
// for spotting the "same situation" pattern just found with Terrassa,
// Pamoja, and Fenly — not a substitute for your own judgment on each one.
function findCrossCompanyDuplicates(key){
  const mine = state[key] || [];
  const results = [];
  mine.forEach(rec=>{
    const nameLower = (rec.name||'').trim().toLowerCase();
    if(!nameLower) return;
    const matches = [];
    appData.clientOrder.forEach(cid=>{
      if(cid===appData.activeClientId) return;
      const other = appData.clients[cid];
      const found = (other[key]||[]).find(r=>(r.name||'').trim().toLowerCase()===nameLower);
      if(found) matches.push({clientId: cid, clientName: other.settings.company.name||'Unnamed Client'});
    });
    if(matches.length>0) results.push({record: rec, matches});
  });
  return results;
}

function findAccountByCodeOrName(raw){
  const clean = String(raw||'').trim();
  if(!clean) return null;
  const codeOnly = clean.split(' - ')[0].split(' ')[0].trim();
  return state.accounts.find(a=>a.code===codeOnly)
      || state.accounts.find(a=>a.code===clean)
      || state.accounts.find(a=>a.name.toLowerCase()===clean.toLowerCase())
      || null;
}

/* ---- Format A: plain journal (Date, Account, Memo, Debit, Credit, Entry —
   Name is also accepted and folded into Memo). Entry is optional: most
   hand-kept sheets don't have one, so when it's missing, each transaction's
   own boundary is detected from where its running debits and credits
   balance out (same technique as Format C below) rather than lumping every
   row in the file into one shared group. A blank-account row (a per-account
   subtotal line, or a blank spacer between entries) is simply skipped —
   totals are recomputed from the posted lines after saving, so the sheet's
   own printed subtotals never need to be read or trusted. Any account name
   not already in the Chart of Accounts is created automatically, on the
   assumption a hand-typed sheet will always have a few names that don't
   exactly match the existing chart yet. ---- */
function importFormatJournal(rows, headerMap){
  let imported=0, skipped=0, skippedBlank=0;
  const created=[];
  const skippedNoAmount=[]; // real account named, but no Debit/Credit at all — worth flagging, unlike a printed subtotal row
  const hasEntryCol = !!headerMap['entry'];
  const nameCol = headerMap['name'];
  const collected = [];
  rows.forEach((r,i)=>{
    const accountRaw = String(r[headerMap['account']]||'').trim();
    const memoRaw = headerMap['memo'] ? String(r[headerMap['memo']]||'').trim() : '';
    const nameRaw = nameCol ? String(r[nameCol]||'').trim() : '';
    const debit = parseNum(r[headerMap['debit']]);
    const credit = parseNum(r[headerMap['credit']]);
    if(!accountRaw || (!debit && !credit)){
      skipped++;
      if(!accountRaw) skippedBlank++; // a printed per-account subtotal row or a blank spacer between entries — expected, not a problem
      else skippedNoAmount.push({row:i+2, date:String(r[headerMap['date']]||'').trim(), account:accountRaw, name:nameRaw}); // +2: back to the file's own row number (1 = header)
      return;
    }
    const memo = nameRaw && memoRaw ? `${nameRaw} — ${memoRaw}` : (nameRaw || memoRaw);
    const dateStr = parseImportedDate(r[headerMap['date']]);
    const entry = hasEntryCol ? String(r[headerMap['entry']]||'').trim() : '';
    collected.push({date:dateStr, accountRaw, memo, debit, credit, entry});
  });

  function postLine(line, ref){
    const acct = findAccountByCodeOrName(line.accountRaw) || findOrCreateAccountByName(line.accountRaw, created);
    if(!acct){ skipped++; return; }
    state.gl.push({id:uid(), date:line.date, entry:ref, account:acct.code, memo:line.memo, debit:line.debit, credit:line.credit});
    imported++;
  }

  if(hasEntryCol){
    collected.forEach(line=> postLine(line, line.entry || ('JE-IMP-'+uid().slice(0,6))));
  } else {
    let groupNum = 0;
    splitIntoBalancedTransactions(collected).forEach(group=>{
      groupNum++;
      const ref = 'JE-IMP-'+groupNum;
      group.forEach(line=> postLine(line, ref));
    });
  }

  return {imported, skipped, skippedBlank, skippedNoAmount, created};
}

/* ---- Format B: purchase/receipt register (Supplier TIN, Supplier name,
   Nature of Goods, Receipt number, Receipt issue date, Amount without VAT, VAT) ---- */
function importFormatPurchaseReceipts(rows, headerMap){
  let imported=0, skipped=0;
  const supplierTinKey = findHeaderKey(headerMap, ["supplier tin","supplier's tin","tin"]);
  rows.forEach(r=>{
    const supplierName = String(r[headerMap['supplier name']]||'').trim();
    const amountNoVat = parseNum(r[headerMap['amount without vat']]);
    const vat = headerMap['vat'] ? parseNum(r[headerMap['vat']]) : 0;
    if(!supplierName || (!amountNoVat && !vat)){ skipped++; return; }
    const dateStr = parseImportedDate(r[headerMap['receipt issue date']]);
    const receiptNo = headerMap['receipt number'] ? String(r[headerMap['receipt number']]||'').trim() : '';
    const nature = headerMap['nature of goods'] ? String(r[headerMap['nature of goods']]||'').trim() : '';
    const supplierTin = supplierTinKey ? String(r[supplierTinKey]||'').trim() : '';
    const total = amountNoVat + vat;

    // Real Vendor + Bill records — not just raw GL lines — so this shows
    // up properly in Accounts Payable with Record Payment available,
    // exactly like a bill entered by hand.
    const vendor = findOrCreateVendorInList(state.vendors, supplierName, supplierTin);
    const invoiceNo = receiptNo || ('PUR-'+uid().slice(0,5));
    const entryRef = invoiceNo;
    const dueDate = addDays(dateStr, 30);

    // "Purchases" always post to Cost of Sales in the P&L, per how this import mode is defined.
    state.gl.push({id:uid(), date:dateStr, entry:entryRef, account:'5000', memo:`${supplierName}${nature?` — ${nature}`:''}${receiptNo?` (Receipt ${receiptNo})`:''}`, debit:amountNoVat, credit:0});
    if(vat>0){
      state.gl.push({id:uid(), date:dateStr, entry:entryRef, account:'1300', memo:`Input VAT — ${supplierName}`, debit:vat, credit:0});
    }
    state.gl.push({id:uid(), date:dateStr, entry:entryRef, account:'2000', memo:`Payable — ${supplierName}`, debit:0, credit:total});

    state.bills = state.bills || [];
    state.bills.push({
      id:uid(), invoiceNo, date:dateStr, dueDate, vendorId:vendor.id, description: nature||'Purchase',
      account:'5000', base:amountNoVat, vat, wht:0, netPay:total, paid:0, payFrom:'2000', entryRef
    });
    vendor.invoiced = (Number(vendor.invoiced)||0) + total;

    imported++;
  });
  return {imported, skipped, created:[]};
}

/* ---- Sales: mirror of Purchase Receipts, but for revenue. Every row posts
   Dr Accounts Receivable, Cr Service Revenue Income, Cr VAT Output. ---- */
function importFormatSalesReceipts(rows, headerMap){
  let imported=0, skipped=0;
  const created=[];
  const revenueAcct = findOrCreateAccountByName('Service Revenue', created);
  const customerTinKey = findHeaderKey(headerMap, ["customer tin","customer's tin","tin"]);
  rows.forEach(r=>{
    const customerName = String(r[headerMap['customer name']]||'').trim();
