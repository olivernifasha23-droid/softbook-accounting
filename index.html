    if(!code){ teamSetupError='Enter an invite code.'; renderTeamSetupScreen(); return; }
    joinSubmit.disabled = true; joinSubmit.textContent = 'Joining…';
    const res = await joinTeamByCode(code);
    if(!res.ok){ teamSetupError = res.msg; renderTeamSetupScreen(); return; }
    teamSetupMode = 'choice'; teamSetupError = '';
    renderAll();
  };
  const skipBtn = document.getElementById('tsSkipBtn');
  if(skipBtn) skipBtn.onclick = ()=>{ teamSetupDismissed = true; renderAll(); };
}


/* ============================================================
   VIEW-ONLY ENFORCEMENT (UI layer). The real protection is that
   nothing a viewer does is saved (saveApp / cloud push are off) and
   the database rejects every write from a viewer. This layer stops
   the buttons from doing anything so it is clear to the person why.
   ============================================================ */
function syncViewOnlyUi(){
  const on = isViewOnly();
  document.body.classList.toggle('view-only', on);
  let b = document.getElementById('voBanner');
  if(on && !b){
    b = document.createElement('div'); b.id = 'voBanner';
    b.textContent = 'View only — you can look at everything, but changes are turned off for your account.';
    document.body.insertBefore(b, document.body.firstChild);
  } else if(!on && b){ b.remove(); }
}
(function(){
  const ALLOW = /(print|export|download|pdf|excel|csv|preview|view|open|show|hide|filter|search|refresh|sign\s?out|log\s?out|close|cancel|back|next|previous|today|expand|collapse|copy|help|install|dismiss|language|theme|all transactions|by account|calculate|^\s*apply\s*$)/i;
  const BLOCK_TEXT = /\b(save|add|create|new|delete|remove|post|record|import|upload|restore|discard|merge|reconcile|approve|void|reverse|reset|submit|pay|send|edit|update|rename|confirm|attach|rotate)\b/i;
  const BLOCK_ATTR = /^data-(del|edit|save|add|create|pay|rm|remove|invrmline|jermline|clearledger|addledger|linkclient|transfer|invstatus-save|pf-status-save|pf-delete|return-qty|staging-discard)/;
  const BLOCK_CLASS = /(^|\s)(btn-primary|btn-danger|icon-x|dashed-btn)(\s|$)/;
  function shouldBlock(el){
    if(el.closest('#voBanner') || el.hasAttribute('data-ro-ok')) return false;
    const text = (el.textContent||'') + ' ' + (el.getAttribute('title')||'') + ' ' + (el.getAttribute('aria-label')||'');
    for(const a of el.attributes){ if(BLOCK_ATTR.test(a.name)) return true; }
    if(BLOCK_TEXT.test(text) && !/^\s*(print|export|download)/i.test(text)) return true;
    if(BLOCK_CLASS.test(el.className||'') && !ALLOW.test(text)) return true;
    return false;
  }
  document.addEventListener('click', function(e){
    if(!isViewOnly()) return;
    const el = e.target.closest && e.target.closest('button, .btn, [role="button"], .icon-x, .dashed-btn, label.btn');
    if(!el) return;
    if(el.id === 'voBanner' || el.closest('#voBanner')) return;
    if(shouldBlock(el)){ e.preventDefault(); e.stopImmediatePropagation(); voToast(VO_MSG); }
  }, true);
  document.addEventListener('change', function(e){
    if(!isViewOnly()) return;
    const t = e.target;
    if(t && t.type === 'file'){ e.preventDefault(); e.stopImmediatePropagation(); try{ t.value=''; }catch(_){} voToast(VO_MSG); }
  }, true);
  document.addEventListener('submit', function(e){
    if(!isViewOnly()) return;
    if(e.target && e.target.closest && e.target.closest('#app') && !e.target.hasAttribute('data-ro-ok')){
      e.preventDefault(); e.stopImmediatePropagation(); voToast(VO_MSG);
    }
  }, true);
})();

/* ---------- boot: load local data, then optionally sync with cloud ----------
   Deliberately NOT calling saveApp() here anymore (it used to be called immediately,
   before IndexedDB adoption or any cloud pull had a chance to run). saveApp() queues a
   debounced push using whatever appData currently is — on the old boot sequence that
   could be the fast-but-possibly-stale localStorage snapshot, racing a slower cloud
   pull that hadn't resolved yet. If the pull lost that race, the stale local snapshot
   would get pushed up and overwrite the real cloud copy. ---- */
let appData = loadApp();
let state = appData.clients[appData.activeClientId];

(async function boot(){
  // Always adopt whatever IndexedDB actually holds before deciding anything else — it's
  // the freshest on-device copy for EVERY user, cloud-synced ones included. The old code
  // skipped this step entirely for cloud users ("usesCloud" backed off), which meant a
  // pull could compare against the stale localStorage-only snapshot instead of the real
  // last-known-local state, including anything saved right before a crash or closed tab.
  // Only write the localStorage-sourced snapshot INTO IndexedDB when there's genuinely
  // nothing there yet (first run after this app moved its storage there) — never blindly
  // overwrite an existing IndexedDB copy with that first synchronous guess, or a newer
  // on-device save can get stomped by an older one before it's even read back.
  try{
    const raw = await idbGet(APP_STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const clients = {};
      Object.keys(parsed.clients||{}).forEach(id=>{ clients[id] = normalizeClient(parsed.clients[id]); });
      let clientOrder = Array.isArray(parsed.clientOrder) ? parsed.clientOrder.filter(id=>clients[id]) : Object.keys(clients);
      if(clientOrder.length){
        const activeClientId = clients[parsed.activeClientId] ? parsed.activeClientId : clientOrder[0];
        appData = ensureValidActiveClient({clients, clientOrder, activeClientId});
        state = appData.clients[appData.activeClientId];
        renderAll();
      }
    } else {
      await idbSet(APP_STORAGE_KEY, JSON.stringify(appData));
    }
  }catch(e){ console.error('IndexedDB data adoption failed:', e.message||e); }

  // Kick off an initial pull if legacy passphrase sync is already configured (returning user)
  if(!syncConfig.authMode && syncConfig.enabled && syncConfig.url && syncConfig.anonKey && syncConfig.syncKey){
    pullFromCloud(true);
  }
  // Or, if a Supabase project is connected at all, check for an existing email-auth session
  if(syncConfig.url && syncConfig.anonKey){
    initAuth();
  }
})();

// If the browser tells us we're back online, retry any unsent save right away instead of
// waiting for the user's next edit or the periodic poll — this is what actually resolves
// the "don't close this tab" warning once the connection genuinely comes back.
window.addEventListener('online', ()=>{
  if(authUser) pullFromCloudAuth(true);
  else if(syncConfig.enabled && syncConfig.syncKey) pullFromCloud(true);
});

/* ---------- number / date helpers ---------- */
function fmt(n){
  n = Number(n)||0;
  const neg = n < -0.004;
  const abs = Math.abs(n);
  const s = abs.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
  return neg ? `(${s})` : (abs < 0.5 ? '–' : s);
}
function fmtSigned(n){
  n = Number(n)||0;
  return (n<0? '−':'') + Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthLabel(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-US',{month:'short', year:'numeric'});
}

// Compact axis-label formatter — 1.2M / 450K style, for chart scales where
// full numbers would crowd the axis.
function fmtCompact(n){
  n = Number(n)||0;
  const abs = Math.abs(n);
  if(abs >= 1000000) return (n/1000000).toFixed(abs>=10000000?0:1)+'M';
  if(abs >= 1000) return (n/1000).toFixed(abs>=10000?0:1)+'K';
  return String(Math.round(n));
}

// Revenue / Expenses / Net Profit for each of the last N months, computed
// live from the actual ledger each time — always reflects whatever's been
// posted, never a stored/stale snapshot.
function computeMonthlyTrend(monthsBack){
  monthsBack = monthsBack || 6;
  const out = [];
  const anchor = new Date(asOfDate+'T00:00:00');
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(anchor.getFullYear(), anchor.getMonth()-i, 1);
    const y = d.getFullYear(), m = d.getMonth()+1;
    const from = `${y}-${String(m).padStart(2,'0')}-01`;
    const to = ymd(new Date(y, m, 0));
    const pl = computePL(from, to);
    const expenses = pl.cos + pl.totalOpex + pl.totalOtherExpense;
    out.push({month: from.slice(0,7), label: d.toLocaleDateString('en-US',{month:'short'}), revenue: pl.totalRevenue, expenses, net: pl.netAfterTax});
  }
  return out;
}

// A dependency-free grouped bar chart (Revenue vs Expenses) drawn as plain
// SVG — no charting library needed, stays on-brand, and is always "live"
// since it's built fresh from computeMonthlyTrend() on every render.
function renderRevenueExpenseChartSvg(trend){
  const W = 640, H = 230, padL = 46, padR = 12, padT = 14, padB = 30;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxVal = Math.max(1, ...trend.map(t=>Math.max(t.revenue, t.expenses)));
  const n = trend.length || 1;
  const groupW = chartW / n;
  const barW = Math.min(26, groupW * 0.32);
  let grid = '', bars = '';
  for(let g=0; g<=4; g++){
    const y = padT + chartH - (g/4)*chartH;
    grid += `<line x1="${padL}" y1="${y}" x2="${padL+chartW}" y2="${y}" stroke="rgba(22,35,61,0.08)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${y+3}" font-size="9.5" fill="var(--text-soft)" text-anchor="end" font-family="Inter">${fmtCompact(maxVal*g/4)}</text>`;
  }
  trend.forEach((t,i)=>{
    const gx = padL + i*groupW + groupW/2 - barW - 2;
    const revH = (t.revenue/maxVal)*chartH, expH = (t.expenses/maxVal)*chartH;
    bars += `<rect x="${gx}" y="${padT+chartH-revH}" width="${barW}" height="${Math.max(revH,0.5)}" fill="var(--ledger-green-dk)" rx="2"><title>${esc(t.label)} Revenue: ${fmt(t.revenue)}</title></rect>`;
    bars += `<rect x="${gx+barW+4}" y="${padT+chartH-expH}" width="${barW}" height="${Math.max(expH,0.5)}" fill="var(--ink-red)" rx="2"><title>${esc(t.label)} Expenses: ${fmt(t.expenses)}</title></rect>`;
    bars += `<text x="${gx+barW+2}" y="${padT+chartH+16}" font-size="10.5" fill="var(--text-soft)" text-anchor="middle" font-family="Inter">${esc(t.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:230px;">${grid}${bars}</svg>`;
}

// A simple single-series bar chart for Net Profit — green bars above the
// zero line for a profitable month, red below it for a loss.
function renderNetProfitChartSvg(trend){
  const W = 640, H = 200, padL = 46, padR = 12, padT = 10, padB = 26;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxAbs = Math.max(1, ...trend.map(t=>Math.abs(t.net)));
  const zeroY = padT + chartH/2;
  const n = trend.length || 1;
  const groupW = chartW / n;
  const barW = Math.min(34, groupW * 0.5);
  let grid = `<line x1="${padL}" y1="${zeroY}" x2="${padL+chartW}" y2="${zeroY}" stroke="rgba(22,35,61,0.25)" stroke-width="1"/>`;
  grid += `<text x="${padL-8}" y="${zeroY+3}" font-size="9.5" fill="var(--text-soft)" text-anchor="end" font-family="Inter">0</text>`;
  let bars = '';
  trend.forEach((t,i)=>{
    const gx = padL + i*groupW + groupW/2 - barW/2;
    const h = (Math.abs(t.net)/maxAbs) * (chartH/2);
    const y = t.net >= 0 ? zeroY - h : zeroY;
    bars += `<rect x="${gx}" y="${y}" width="${barW}" height="${Math.max(h,0.5)}" fill="${t.net>=0?'var(--ledger-green-dk)':'var(--ink-red)'}" rx="2"><title>${esc(t.label)} Net: ${fmt(t.net)}</title></rect>`;
    bars += `<text x="${gx+barW/2}" y="${padT+chartH+16}" font-size="10.5" fill="var(--text-soft)" text-anchor="middle" font-family="Inter">${esc(t.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:200px;">${grid}${bars}</svg>`;
}
function inRange(dateStr, from, to){
  if(!dateStr) return false;
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}

/* ============================================================
   REPORT PERIOD PRESETS — quick date-range selection, matching the
   "Report period" dropdown pattern used by QuickBooks/Xero. Two kinds:
   getPresetRange() for FROM/TO reports (P&L, Cash Flow, Trial Balance,
   General Ledger), and getPresetAsOf() for point-in-time reports
   (Balance Sheet), which only need a single "as of" date.
   ============================================================ */
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function getPresetRange(preset){
  const today = new Date(todayISO()+'T00:00:00');
  const y = today.getFullYear(), m = today.getMonth();
  switch(preset){
    case 'this_month': return {from: ymd(new Date(y,m,1)), to: todayISO()};
    case 'last_month': return {from: ymd(new Date(y,m-1,1)), to: ymd(new Date(y,m,0))};
    case 'this_quarter': { const q = Math.floor(m/3); return {from: ymd(new Date(y,q*3,1)), to: todayISO()}; }
    case 'last_quarter': { const q = Math.floor(m/3)-1; const yy = q<0?y-1:y; const qq=(q+4)%4; return {from: ymd(new Date(yy,qq*3,1)), to: ymd(new Date(yy,qq*3+3,0))}; }
    case 'this_year': return {from: ymd(new Date(y,0,1)), to: todayISO()};
    case 'last_year': return {from: ymd(new Date(y-1,0,1)), to: ymd(new Date(y-1,11,31))};
    case 'all_time': return {from:'', to:''};
    default: return null; // 'custom' — leave whatever the user already set
  }
}

function getPresetAsOf(preset){
  const today = new Date(todayISO()+'T00:00:00');
  const y = today.getFullYear(), m = today.getMonth();
  switch(preset){
    case 'today': return todayISO();
    case 'end_this_month': return ymd(new Date(y,m+1,0));
    case 'end_last_month': return ymd(new Date(y,m,0));
    case 'end_this_year': return ymd(new Date(y,11,31));
    case 'end_last_year': return ymd(new Date(y-1,11,31));
    default: return null; // 'custom'
  }
}

const REPORT_PERIOD_OPTIONS = [
  {value:'custom', label:'Custom'},

function acctName(code){
  const a = state.accounts.find(a=>a.code===code);
  return a ? tAccountName(a.code, a.name) : '';
}
function acctType(code){
  const a = state.accounts.find(a=>a.code===code);
  return a ? a.type : '';
}
// Classification per account Type:
//  - Asset / Liability: 'Current' or 'Non-Current' (drives Balance Sheet grouping)
//  - Expense: 'Cost of Sales' or 'Operating Expense' (drives P&L Gross Profit calc)
// Uses the explicit field if the account has one (set via Chart of Accounts);
// otherwise falls back to the old heuristics so accounts saved before this
// feature existed keep displaying exactly as they did before.
function getAccountClassification(a){
  if(!a) return 'Current';
  if(a.type==='Expense'){
    if(a.classification==='Cost of Sales' || a.classification==='Operating Expense' || a.classification==='Other Expense') return a.classification;
    return a.code==='5000' ? 'Cost of Sales' : 'Operating Expense';
  }
  if(a.classification==='Current' || a.classification==='Non-Current') return a.classification;
  if(a.type==='Asset') return a.code>='1400' ? 'Non-Current' : 'Current';
  return 'Current';
}
function classificationOptionsFor(type){
  if(type==='Expense') return ['Operating Expense','Cost of Sales','Other Expense'];
  if(type==='Asset' || type==='Liability') return ['Current','Non-Current'];
  return [];
}

/* ============================================================
   CALCULATION ENGINE
   ============================================================ */

function computeTrialBalance(from, to){
  return state.accounts.map(a=>{
    let debit=0, credit=0;
    state.gl.forEach(l=>{
      if(l.account!==a.code) return;
      if(from||to){ if(!inRange(l.date, from, to)) return; }
      debit += Number(l.debit)||0;
      credit += Number(l.credit)||0;
    });
    const net = debit-credit; // positive = net debit balance, negative = net credit balance
    // Standard Trial Balance presentation: each account's single NET
    // ending balance, shown as a plain positive number in whichever
    // column it actually falls on — never the raw cumulative debit and
    // credit activity for the period (which is what this used to show,
    // and isn't what a real trial balance is supposed to display), and
    // never a negative number. An account sitting the "wrong" way round
    // (e.g. an overdrawn bank account) still shows as a positive figure,
    // just in the other column — that's what keeps the two column totals
    // equal, which is the whole point of a trial balance.
    return {code:a.code, name:a.name, type:a.type, debit: net>0?net:0, credit: net<0?-net:0, net, hasActivity: (debit>0||credit>0)};
  });
}

function sumAccount(code, from, to, side){
  // side: 'debit' | 'credit' | 'net' (debit-credit)
  let debit=0, credit=0;
  state.gl.forEach(l=>{
    if(l.account!==code) return;
    if(!inRange(l.date, from, to)) return;
    debit += Number(l.debit)||0;
    credit += Number(l.credit)||0;
  });
  if(side==='debit') return debit;
  if(side==='credit') return credit;
  return debit-credit;
}

// For an account with any foreign-currency transactions on it (each GL
// line entered in a foreign currency keeps its own original amount and
// currency code alongside the converted RWF figure), reconstructs the
// running balance in that native currency — so a USD bank account (or a
// USD-denominated expense, like a bank charge billed in USD) can show its
// real foreign-currency amount in parentheses next to the RWF figure that
// actually drives every report total. Shared by the Balance Sheet and the
// Income Statement so both display this the same way.
function nativeCurrencyBalance(code, from, to){
  let byCurrency = {};
  state.gl.forEach(l=>{
    if(l.account!==code || !l.currency) return;
    if(to && !inRange(l.date, from, to)) return;
    byCurrency[l.currency] = (byCurrency[l.currency]||0) + (Number(l.originalDebit)||0) - (Number(l.originalCredit)||0);
  });
  const entries = Object.entries(byCurrency).filter(([,amt])=>Math.abs(amt)>=0.005);
  return entries.length ? entries : null;
}

// Renders a line's native-currency breakdown (if any) as "(103USD)", tight
// against the RWF figure it follows — e.g. "150,000(103USD)". Used by both
// the Income Statement and the Balance Sheet so foreign-currency-sourced
// figures always look the same wherever they appear. The RWF amount is
// always what drives the report's own totals; this is reference only.
function nativeText(line){
  return line.native ? line.native.map(([cur,amt])=> '(' + fmt(Math.abs(amt)) + cur + ')').join(' ') : '';
}

function computePL(from, to, basis){
  basis = basis || 'accrual';
  const sum = basis==='cash' ? sumAccountCashBasis : sumAccount;
  // Every line here is driven by what actually exists in THIS client's own
  // Chart of Accounts — delete an account there (e.g. Professional Fees
  // Income, if it doesn't apply to this business) and it disappears from
  // the P&L too, rather than always showing a fixed template of accounts
  // regardless of what this client actually uses.
  const revenueAccounts = state.accounts.filter(a=>a.type==='Income').sort((a,b)=>a.code.localeCompare(b.code));
  const revenueLines = revenueAccounts.map(a=>({code:a.code, name:a.name, amt: sum(a.code, from, to, 'credit') - sum(a.code, from, to, 'debit'), native: nativeCurrencyBalance(a.code, from, to)}));
  const totalRevenue = revenueLines.reduce((s,r)=>s+r.amt,0);

  const cosAccounts = state.accounts.filter(a=>a.type==='Expense' && getAccountClassification(a)==='Cost of Sales').sort((a,b)=>a.code.localeCompare(b.code));
  const cosLines = cosAccounts.map(a=>({code:a.code, name:a.name, amt: sum(a.code, from, to, 'debit') - sum(a.code, from, to, 'credit'), native: nativeCurrencyBalance(a.code, from, to)}));
  const hasCos = cosAccounts.length > 0;
  const cos = cosLines.reduce((s,c)=>s+c.amt,0);
  const grossProfit = totalRevenue - cos;

  const opex = state.accounts
    .filter(a=>a.type==='Expense' && getAccountClassification(a)==='Operating Expense')
    .sort((a,b)=>a.code.localeCompare(b.code))
    .map(a=>({code:a.code, name:a.name, amt: sum(a.code, from, to, 'debit') - sum(a.code, from, to,'credit'), native: nativeCurrencyBalance(a.code, from, to)}));
  const totalOpex = opex.reduce((s,o)=>s+o.amt,0);
  const operatingProfit = grossProfit - totalOpex;

  // Other Expenses (non-operating) — penalties, fines, and similar items
  // that aren't a cost of running the business, kept below Operating
  // Profit rather than mixed in with normal operating costs.
  const hasOtherExpense = state.accounts.some(a=>a.type==='Expense' && getAccountClassification(a)==='Other Expense');
  const otherExpenseLines = state.accounts
    .filter(a=>a.type==='Expense' && getAccountClassification(a)==='Other Expense')
    .sort((a,b)=>a.code.localeCompare(b.code))
    .map(a=>({code:a.code, name:a.name, amt: sum(a.code, from, to, 'debit') - sum(a.code, from, to,'credit'), native: nativeCurrencyBalance(a.code, from, to)}));
  const totalOtherExpense = otherExpenseLines.reduce((s,o)=>s+o.amt,0);

  const netBeforeTax = operatingProfit - totalOtherExpense;
  // CIT is intentionally NOT auto-deducted from Net Profit — it's an annual/
  // quarterly filing obligation, not a per-period accounting entry. This is
  // kept only as a rough planning estimate; record the actual provision via
  // a normal journal entry (Dr Income Tax Expense, Cr Taxes Payable) when
  // you file, if you want it reflected in the books.
  const estimatedCit = Math.max(netBeforeTax,0) * state.settings.cit;
  const netAfterTax = netBeforeTax; // no longer reduced automatically
  return {revenueLines, totalRevenue, hasCos, cos, cosLines, grossProfit, opex, totalOpex, operatingProfit,
    hasOtherExpense, otherExpenseLines, totalOtherExpense, netBeforeTax, estimatedCit, netAfterTax, basis};
}

function computeBalanceSheet(asOf){
  const from = null, to = asOf;
  const asset = (code)=> sumAccount(code, from, to, 'net');
  const liabEq = (code)=> -sumAccount(code, from, to, 'net');

  // Same principle as the P&L: built from whatever Asset/Liability/Equity
  // accounts actually exist in this client's own Chart of Accounts, not a
  // fixed template. Current vs Non-Current is driven by each account's own
  // Classification (set in Chart of Accounts) — falling back to the old
  // code-based heuristic for accounts saved before that field existed.
  //
  // Input VAT (1300), Output VAT (2100), VAT Claimed (1310), and VAT
  // Payable (2105) are deliberately excluded from the normal per-account
  // listing below and combined into two lines instead — the current
  // month's running Input VAT joins the settled VAT Claimed balance
  // (Asset), and the current month's running Output VAT joins the
  // settled VAT Payable balance (Liability). These are NOT netted
  // against each other — a settled, closed-month VAT Claimed position
  // and the current period's VAT Payable obligation are genuinely two
  // different things (a past claim against RRA vs. a current one owed to
  // RRA), so both can and do show at once when applicable, matching
  // vatClaimedBalance()/vatPayableBalance() on the VAT Report exactly.
  const VAT_BS_HIDDEN_CODES = ['1300','2100','1310','2105'];
  const assetAccounts = state.accounts.filter(a=>a.type==='Asset' && !VAT_BS_HIDDEN_CODES.includes(a.code)).sort((a,b)=>a.code.localeCompare(b.code));
  const currentAssets = assetAccounts.filter(a=>getAccountClassification(a)==='Current').map(a=>({code:a.code, name:a.name, amt:asset(a.code), native:nativeCurrencyBalance(a.code, from, to)}));
  const nonCurrentAssets = assetAccounts.filter(a=>getAccountClassification(a)==='Non-Current').map(a=>({code:a.code, name:a.name, amt:asset(a.code), native:nativeCurrencyBalance(a.code, from, to)}));

  const liabAccounts = state.accounts.filter(a=>a.type==='Liability' && !VAT_BS_HIDDEN_CODES.includes(a.code)).sort((a,b)=>a.code.localeCompare(b.code));
  const currentLiab = liabAccounts.filter(a=>getAccountClassification(a)==='Current').map(a=>({code:a.code, name:a.name, amt:liabEq(a.code), native:nativeCurrencyBalance(a.code, from, to)}));
  const nonCurrentLiab = liabAccounts.filter(a=>getAccountClassification(a)==='Non-Current').map(a=>({code:a.code, name:a.name, amt:liabEq(a.code), native:nativeCurrencyBalance(a.code, from, to)}));

  // VAT Claimed (Asset) stays conservative — only the settled, formally
  // closed-month amount (vatClaimedBalance, account 1310). An asset
  // shouldn't be recognized until it's actually confirmed through the
  // closing process.
  // VAT Payable (Liability) is the opposite: the settled amount (2105)
  // PLUS whatever the current, still-open month's own Output VAT (2100)
  // net of its own Input VAT (1300) already amounts to — a liability
  // gets recognized as it genuinely accrues, not held back until a
  // formal month-end closing confirms it. Since postVATSettlement always
  // zeroes out 1300/2100 the moment a month is closed, whatever's
  // currently sitting in them IS exactly the current, unclosed period's
  // own activity — nothing from an already-closed month leaks in here.
  const currentPeriodNet = liabEq('2100') - asset('1300');
  const vatClaimedAmt = vatClaimedBalance(to);
  const vatPayableAmt = vatPayableBalance(to) + Math.max(0, currentPeriodNet);
  if(vatClaimedAmt > 0.5) currentAssets.push({code:'VAT-CLAIMED', name:'VAT Claimed', amt: vatClaimedAmt});
  if(vatPayableAmt > 0.5) currentLiab.push({code:'VAT-PAYABLE', name:'VAT Payable', amt: vatPayableAmt});

  const totalCurrentAssets = currentAssets.reduce((s,a)=>s+a.amt,0);
  const totalNonCurrentAssets = nonCurrentAssets.reduce((s,a)=>s+a.amt,0);
  const totalAssets = totalCurrentAssets + totalNonCurrentAssets;

  const totalCurrentLiab = currentLiab.reduce((s,a)=>s+a.amt,0);
  const totalNonCurrentLiab = nonCurrentLiab.reduce((s,a)=>s+a.amt,0);
  const totalLiab = totalCurrentLiab + totalNonCurrentLiab;

  const pl = computePL(null, asOf);
  const equityAccounts = state.accounts.filter(a=>a.type==='Equity').sort((a,b)=>a.code.localeCompare(b.code));
  const equity = equityAccounts.map(a=>({code:a.code, name:a.name, amt:liabEq(a.code)}));
  equity.push({code:'CY', name:'Current Year Net Profit', amt: pl.netAfterTax});
  const totalEquity = equity.reduce((s,a)=>s+a.amt,0);
  const totalLiabEquity = totalLiab + totalEquity;

  return {currentAssets, totalCurrentAssets, nonCurrentAssets, totalNonCurrentAssets, totalAssets,
          currentLiab, totalCurrentLiab, nonCurrentLiab, totalNonCurrentLiab, totalLiab,
          equity, totalEquity, totalLiabEquity,
          balanced: Math.abs(totalAssets - totalLiabEquity) < 1};
}

function payeFor(gross){
  const bands = state.settings.payeBands;
  let remaining = gross, prevCap = 0, tax = 0;
  for(const b of bands){
    const cap = b.upTo===null ? Infinity : b.upTo;
    const bandAmt = Math.max(0, Math.min(gross, cap) - prevCap);
    tax += bandAmt * b.rate;
    prevCap = cap;
    if(gross <= cap) break;
  }
  return tax;
}

// --- Attendance-based reimbursement (Food/Transport per present day) -----
// Mirrors a simple day-marking sheet: each employee gets 'P' (present) or
// 'A' (absent) per calendar day of the month. Present days, capped at
// settings.reimbRates.maxDays, multiply by the per-day rates to produce
// Food and Transport reimbursement — the same two figures the Add/Edit
// Employee form already has as mealReimb/transportReimb, just computed
// here instead of typed in by hand.
function daysInMonth(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function attendanceMonthData(month){
  state.attendance = state.attendance || {};
  state.attendance[month] = state.attendance[month] || {};
  return state.attendance[month];
}
function getAttendanceMark(empId, month, day){
  const m = (state.attendance && state.attendance[month] && state.attendance[month][empId]) || {};
  return m[day] || '';
}
function setAttendanceMark(empId, month, day, mark){
  const monthData = attendanceMonthData(month);
  monthData[empId] = monthData[empId] || {};
  if(mark) monthData[empId][day] = mark;
  else delete monthData[empId][day];
  // Manually editing a day clears any bulk-set exact-match override for
  // this employee — otherwise a single click wouldn't visibly change
  // their total, which would look broken.
  delete monthData[empId].mealOverride;
  delete monthData[empId].transportOverride;
}
// Present days × the shared per-day rates, UNLESS this employee has an
// exact-match override set (via the bulk fill-by-total tool below) — in
// which case the override amount is used as-is, verbatim, since that's
// each person's own real known reimbursement figure, not something meant
// to be derived from a single company-wide rate two different people at
// two different distances from work were never going to share anyway.
function computeAttendanceForEmployee(emp, month){
  const empId = emp.id || emp; // accepts either the employee object or a bare id, for older call sites
  const rates = (state.settings.reimbRates) || {food:2000, transport:3000, maxDays:30};
  const maxDays = Math.min(daysInMonth(month), rates.maxDays||30);
  const monthEntry = (state.attendance && state.attendance[month] && state.attendance[month][empId]) || {};
  let presentDays = 0;
  for(let d=1; d<=maxDays; d++){ if(monthEntry[d]==='P') presentDays++; }
  const hasMealOverride = monthEntry.mealOverride!=null;
  const hasTransportOverride = monthEntry.transportOverride!=null;
  const foodReimb = hasMealOverride ? monthEntry.mealOverride : presentDays * (rates.food||0);
  const transportReimb = hasTransportOverride ? monthEntry.transportOverride : presentDays * (rates.transport||0);
  return {presentDays, foodReimb, transportReimb, totalReimb: foodReimb+transportReimb, maxDays, overridden: hasMealOverride||hasTransportOverride};
}

// Bulk, per-employee, exact-match fill: given THIS employee's own real
// Meal and Transport totals for the month, randomly marks a plausible
// number of present days for the visual calendar record, and stores the
// two totals as an exact override — so Food/Transport Reimb shown (and
// later applied to payroll) match precisely what was typed, with no
// rounding gap, regardless of what the shared per-day rates are set to.
function autoFillAttendanceExact(emp, month, mealTotal, transportTotal){
  const rates = state.settings.reimbRates || {food:2000, transport:3000, maxDays:30};
  const calcDays = Math.min(daysInMonth(month), rates.maxDays||30);
  let guessDays = rates.food>0 ? Math.round(mealTotal/rates.food)
    : rates.transport>0 ? Math.round(transportTotal/rates.transport)
    : Math.round(calcDays*(0.6+Math.random()*0.4));
  guessDays = Math.max(0, Math.min(calcDays, guessDays));
  const days = Array.from({length:calcDays}, (_,i)=>i+1);
  for(let i=days.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [days[i],days[j]]=[days[j],days[i]]; }
  const presentSet = new Set(days.slice(0, guessDays));
  const monthData = attendanceMonthData(month);
  monthData[emp.id] = {mealOverride: mealTotal, transportOverride: transportTotal};
  for(let d=1; d<=calcDays; d++){ monthData[emp.id][d] = presentSet.has(d) ? 'P' : 'A'; }
  return {presentDays: guessDays};
}

// --- Month close & signoff ------------------------------------------
// Each calendar month's attendance is closed independently — closing
// August never touches September's (or any other month's) data, since
// everything here is keyed by month already.
function getAttendanceMeta(month){
  state.attendanceMeta = state.attendanceMeta || {};
  state.attendanceMeta[month] = state.attendanceMeta[month] || {closed:false, closedAt:null, preparedBy:'', verifiedBy:'', approvedBy:''};
  return state.attendanceMeta[month];
}
function isAttendanceClosed(month){
  return !!(state.attendanceMeta && state.attendanceMeta[month] && state.attendanceMeta[month].closed);
}
function closeAttendanceMonth(month){
  const meta = getAttendanceMeta(month);
  if(meta.closed) return {ok:false, msg:`${monthLabel(month+'-01')}'s attendance is already closed.`};
  if(!meta.preparedBy.trim() || !meta.verifiedBy.trim() || !meta.approvedBy.trim()){
    return {ok:false, msg:'Enter Prepared By, Verified By, and Approved By before closing the month.'};
  }
  meta.closed = true;
  meta.closedAt = new Date().toISOString();
  return {ok:true};
}

// --- Weekly attendance export ----------------------------------------
// Week boundaries: 1–7, 8–15, 16–24, 25–end of month. The last week is
// naturally shorter in February (or any month under 31 days) since it
// just runs to whatever the real last day is, rather than forcing a
// 31st that doesn't exist.
function attendanceWeekRanges(month){
  const total = daysInMonth(month);
  return [
    {label:'Week 1', from:1, to:Math.min(7,total)},
    {label:'Week 2', from:8, to:Math.min(15,total)},
    {label:'Week 3', from:16, to:Math.min(24,total)},
    {label:'Week 4', from:25, to:total},
  ].filter(r=>r.from<=total);
}
// Present days and reimbursement for just a slice of the month (used by
// the ranged export below) — separate from computeAttendanceForEmployee,
// which always covers the full month up to the calculation-day cap for
// payroll purposes. This one deliberately ignores any exact-match
// override, since an override is a whole-month total and can't be
// meaningfully sliced into a partial date range.
function computeAttendanceRangeForEmployee(emp, month, fromDay, toDay){
  const rates = state.settings.reimbRates || {food:2000, transport:3000, maxDays:30};
  const marks = (state.attendance && state.attendance[month] && state.attendance[month][emp.id]) || {};
  let presentDays = 0;
  for(let d=fromDay; d<=toDay; d++){ if(marks[d]==='P') presentDays++; }
  const foodReimb = presentDays * (rates.food||0);
  const transportReimb = presentDays * (rates.transport||0);
  return {presentDays, foodReimb, transportReimb, totalReimb: foodReimb+transportReimb};
}
function exportAttendanceToExcel(month, fromDay, toDay){
  if(!requireActiveSubscription('download this report')) return;
  if(typeof XLSX === 'undefined'){ alert('Export library did not load — check your internet connection and reload the page.'); return; }

  const c = state.settings.company;
  const total = daysInMonth(month);
  fromDay = Math.max(1, Math.min(total, fromDay||1));
  toDay = Math.max(fromDay, Math.min(total, toDay||total));
  const weeks = attendanceWeekRanges(month)
    .map(w=>({label:w.label, from:Math.max(w.from,fromDay), to:Math.min(w.to,toDay)}))
    .filter(w=>w.from<=w.to);

  const weekHeaderRow = [''];
  weeks.forEach(w=>{ for(let d=w.from; d<=w.to; d++) weekHeaderRow.push(d===w.from ? w.label : ''); });
  weekHeaderRow.push('','','','',''); // spacer over the 5 summary columns

  const dayHeaderRow = ['Employee'];
  for(let d=fromDay; d<=toDay; d++){
    const dow = new Date(month+'-'+String(d).padStart(2,'0')+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'});
    dayHeaderRow.push(`${dow} ${d}`);
  }
  dayHeaderRow.push('Present Days','Food Reimb.','Transport Reimb.','Total Reimb.');

  const empRows = state.payroll.map(emp=>{

    const row = [emp.name];
    for(let d=fromDay; d<=toDay; d++) row.push(getAttendanceMark(emp.id, month, d) || '');
    row.push(calc.presentDays, calc.foodReimb, calc.transportReimb, calc.totalReimb);
    return row;
  });

  const rangeLabel = fromDay===1 && toDay===total
    ? monthLabel(month+'-01')
    : `${new Date(month+'-'+String(fromDay).padStart(2,'0')+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${new Date(month+'-'+String(toDay).padStart(2,'0')+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;

  const meta = getAttendanceMeta(month);
  const aoa = [
    [c.name||'Company Name'],
    [`TIN: ${c.tin||'—'}${c.address ? '   •   '+c.address : ''}`],
    [`Attendance & Reimbursement — ${rangeLabel}`],
    [],
    weekHeaderRow,
    dayHeaderRow,
    ...empRows,
    [],
    ['Status', meta.closed ? `Closed ${new Date(meta.closedAt).toLocaleDateString()}` : 'Not yet closed'],
    ['Prepared By', meta.preparedBy||''],
    ['Verified By', meta.verifiedBy||''],
    ['Approved By', meta.approvedBy||''],
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:22}, ...Array(toDay-fromDay+1).fill({wch:6}), {wch:11},{wch:11},{wch:13},{wch:11}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, excelSafeSheetName('Attendance'));
  const companyName = (c.name||'Company').replace(/[^a-z0-9]+/gi,'-');
  const fileSuffix = (fromDay===1 && toDay===total) ? month : `${month}-${String(fromDay).padStart(2,'0')}to${String(toDay).padStart(2,'0')}`;
  XLSX.writeFile(wb, `${companyName}-Attendance-${fileSuffix}.xlsx`);
}

function pettyCashRangeRows(fromDate, toDate){
  const openingBalance = pettyCashBalance(addDays(fromDate,-1));
  const entries = state.pettyCash.entries
    .filter(e=> e.date>=fromDate && e.date<=toDate)
    .sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));
  let running = openingBalance;
  let totalIn = 0, totalOut = 0;
  const rows = entries.map(e=>{
    const isIn = e.type==='replenishment' || e.type==='float_setup';
    running += isIn ? Number(e.amount) : -Number(e.amount);
    if(isIn) totalIn += Number(e.amount); else totalOut += Number(e.amount);
    const cat = e.categoryId ? state.pettyCash.categories.find(c=>c.id===e.categoryId) : null;
    const typeLabel = e.type==='float_setup' ? 'Float Setup' : e.type==='replenishment' ? 'Replenishment' : (cat?cat.name:'—');
    return {date:e.date, voucherNo:e.voucherNo, description:e.description, typeLabel, isIn, amount:e.amount, running};
  });
  return {openingBalance, rows, totalIn, totalOut, closingBalance: running};
}

  const companyName = (c.name||'Company').replace(/[^a-z0-9]+/gi,'-');
  XLSX.writeFile(wb, `${companyName}-PettyCash-${fromDate}_to_${toDate}.xlsx`);
}

// --- Petty Cash (imprest system) --------------------------------------
// A small cash float, topped up ("replenished") back to a fixed target
// amount as it gets spent down, with every disbursement categorized and
// posted to the ledger in real time — never a lump-sum guess at month end.
function ensurePettyCashAccount(){
  return findOrCreateAccountByName('Petty Cash').code;
}
function pettyCashCategoryAccountCode(categoryId){
  const cat = state.pettyCash.categories.find(c=>c.id===categoryId);
  const name = cat ? cat.name : 'Miscellaneous';
  return findOrCreateAccountByName(name).code;
}
function nextPettyCashVoucher(){
  const n = state.pettyCash.nextVoucherNo || 1;
  state.pettyCash.nextVoucherNo = n+1;
  return 'PC-'+String(n).padStart(4,'0');
}
// Live balance, straight from the ledger — always matches the GL, never a
// separately-maintained number that can drift out of sync with it.
function pettyCashBalance(asOf){
  return sumAccount(ensurePettyCashAccount(), null, asOf||asOfDate, 'net');
}
// Total spent since the last replenishment (or since the float was first
// set up, if it's never been topped up) — this is what a replenishment
// request should normally ask for, to restore the float back to target.
function pettyCashSinceLastReplenishment(){
  const entries = [...state.pettyCash.entries].sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));
  let sinceIdx = -1;
  entries.forEach((e,i)=>{ if(e.type==='replenishment' || e.type==='float_setup') sinceIdx = i; });
  const since = entries.slice(sinceIdx+1).filter(e=>e.type==='disbursement');
  const total = since.reduce((s,e)=> s+(Number(e.amount)||0), 0);
  return {total, count: since.length};
}
function recordPettyCashFloatSetup(date, amount, sourceAccountCode){
  const pcAcct = ensurePettyCashAccount();
  const entryRef = nextPettyCashVoucher();
  state.gl.push({id:uid(), date, entry:entryRef, account:pcAcct, memo:'Petty cash float established', debit:amount, credit:0});
  state.gl.push({id:uid(), date, entry:entryRef, account:sourceAccountCode, memo:'Petty cash float established', debit:0, credit:amount});
  state.pettyCash.entries.push({id:uid(), date, voucherNo:entryRef, type:'float_setup', description:'Float established', categoryId:null, amount, sourceAccountCode, entryRef});
  saveState();
}
function recordPettyCashDisbursement(date, description, categoryId, amount){
  const pcAcct = ensurePettyCashAccount();
  const expAcct = pettyCashCategoryAccountCode(categoryId);
  const entryRef = nextPettyCashVoucher();
  const cat = state.pettyCash.categories.find(c=>c.id===categoryId);
  const memo = `${cat?cat.name:'Miscellaneous'} — ${description}`;
  state.gl.push({id:uid(), date, entry:entryRef, account:expAcct, memo, debit:amount, credit:0});
  state.gl.push({id:uid(), date, entry:entryRef, account:pcAcct, memo, debit:0, credit:amount});
  state.pettyCash.entries.push({id:uid(), date, voucherNo:entryRef, type:'disbursement', description, categoryId, amount, entryRef});
  saveState();
}
function recordPettyCashReplenishment(date, amount, sourceAccountCode){
  const pcAcct = ensurePettyCashAccount();
  const entryRef = nextPettyCashVoucher();
  state.gl.push({id:uid(), date, entry:entryRef, account:pcAcct, memo:'Petty cash replenishment', debit:amount, credit:0});
  state.gl.push({id:uid(), date, entry:entryRef, account:sourceAccountCode, memo:'Petty cash replenishment', debit:0, credit:amount});
  state.pettyCash.entries.push({id:uid(), date, voucherNo:entryRef, type:'replenishment', description:'Replenishment', categoryId:null, amount, sourceAccountCode, entryRef});
  saveState();
}

// --- Month close & sign-off (same pattern as Attendance) ---------------
function getPettyCashMeta(month){
  state.pettyCashMeta = state.pettyCashMeta || {};
  state.pettyCashMeta[month] = state.pettyCashMeta[month] || {closed:false, closedAt:null, preparedBy:'', verifiedBy:'', approvedBy:''};
  return state.pettyCashMeta[month];
}
function isPettyCashClosed(month){
  return !!(state.pettyCashMeta && state.pettyCashMeta[month] && state.pettyCashMeta[month].closed);
}
function closePettyCashMonth(month){
  const meta = getPettyCashMeta(month);
  if(meta.closed) return {ok:false, msg:`${monthLabel(month+'-01')}'s petty cash log is already closed.`};
  if(!meta.preparedBy.trim() || !meta.verifiedBy.trim() || !meta.approvedBy.trim()){
    return {ok:false, msg:'Enter Prepared By, Verified By, and Approved By before closing the month.'};
  }
  meta.closed = true;
  meta.closedAt = new Date().toISOString();
  return {ok:true};
}

// --- Archiving old, already-closed months (frees up local storage) -----
// Never touches the General Ledger — the permanent accounting record is
// completely unaffected either way. This only trims the heavy, re-viewable
// DETAIL that sits alongside it: full per-employee payroll snapshots (bank
// account numbers, full breakdowns, kept for the printable disbursement
// sheet) and day-by-day attendance marks. Totals are always preserved.
function estimateStorageSize(){
  try{ return JSON.stringify(appData).length; }catch(e){ return 0; }
}
function fmtBytes(n){
  if(n > 1024*1024) return (n/(1024*1024)).toFixed(2)+' MB';
  if(n > 1024) return (n/1024).toFixed(1)+' KB';
  return n+' B';
}
// How many payroll runs / attendance months are eligible right now, without
// actually changing anything — used so the Settings screen can show "this
// will affect N months" before the user commits to archiving.
function countArchivableBefore(cutoffMonth){
  const payrollCount = (state.payrollRuns||[]).filter(r=> r.month<cutoffMonth && r.employees && r.employees.length && !r.archived).length;
  const attendanceCount = Object.keys(state.attendance||{}).filter(m=> m<cutoffMonth && isAttendanceClosed(m) && !getAttendanceMeta(m).archived).length;
  return {payrollCount, attendanceCount};
}
function archiveOldData(cutoffMonth){
  let archivedPayrollCount = 0, archivedAttendanceCount = 0;
  (state.payrollRuns||[]).forEach(run=>{
    if(run.month<cutoffMonth && run.employees && run.employees.length && !run.archived){
      run.employees = []; // the totals alongside this (gross, paye, net, reimbursements, etc.) are untouched
      run.archived = true;
      archivedPayrollCount++;
    }
  });
  Object.keys(state.attendance||{}).forEach(month=>{
    if(month<cutoffMonth && isAttendanceClosed(month)){
      const meta = getAttendanceMeta(month);
      if(meta.archived) return;
      const monthData = state.attendance[month];
      Object.keys(monthData).forEach(empId=>{
        const emp = state.payroll.find(e=>e.id===empId) || {id:empId};
        const calc = computeAttendanceForEmployee(emp, month);
        // Collapses potentially 31 day-by-day marks down to just the two
        // final totals — the same "exact override" shape already used
        // elsewhere in Attendance, so every existing view, export, and
        // calculation keeps working on archived months with no changes.
        monthData[empId] = {mealOverride: calc.foodReimb, transportOverride: calc.transportReimb};
      });
      meta.archived = true;
      archivedAttendanceCount++;
    }
  });
  saveState();
  return {archivedPayrollCount, archivedAttendanceCount};
}

function computePayrollRow(emp, forDate){
  const rates = getRssbRatesFor(forDate);
  // Every figure is rounded to the nearest whole Frw as it's computed (RWF
  // has no subunit anyway) — this is what keeps a summed total across many
  // employees landing on a clean number instead of drifting by a few Frw
  // from leftover fractional cents.
  const gross = Math.round((Number(emp.basic)||0)+(Number(emp.transport)||0)+(Number(emp.meal)||0));
  const paye = Math.round(payeFor(gross));
  const pension = Math.round((Number(emp.basic)||0) * rates.pensionEmp);
  const maternity = Math.round((Number(emp.basic)||0) * rates.maternityEmp);
  // CBHI is calculated on what's left of GROSS after PAYE, Pension (employee),
  // and Maternity (employee) have already been taken out — not on Basic
  // directly, per the actual RSSB/CBHI computation order.
  const cbhi = Math.round(Math.max(0, gross - paye - pension - maternity) * rates.cbhiEmp);
  const totalDed = paye+pension+maternity+cbhi;
  const net = gross - totalDed;
  const erPension = Math.round((Number(emp.basic)||0) * rates.pensionEr);
  const erMaternity = Math.round((Number(emp.basic)||0) * rates.maternityEr);
  const erOccHazard = Math.round((Number(emp.basic)||0) * rates.occHazardEr);
  const erTotal = erPension + erMaternity + erOccHazard;
  // Combined payables, matching how RSSB is actually remitted — Pension
  // Payable covers employee + employer pension PLUS Occupational Hazards
  // (all filed together, 14% of basic combined), and Maternity Payable
  // covers employee + employer maternity (0.6% of basic combined).
  const pensionPayable = pension + erPension + erOccHazard;
  const maternityPayable = maternity + erMaternity;
  // Reimbursements (meal/transport) are NOT part of gross salary and are not
  // taxed — they're a separate non-taxable payment on top of net take-home pay.
  const mealReimb = Math.round(Number(emp.mealReimb)||0);
  const transportReimb = Math.round(Number(emp.transportReimb)||0);
  const totalReimb = mealReimb + transportReimb;
  // Same treatment as the reimbursements above: not salary, not taxed, but
  // still real cash the employee needs paid out alongside their net pay.
  const consultFee = Math.round(Number(emp.consultFee)||0);
  const totalPaidUp = net + totalReimb + consultFee;
  return {gross, paye, pension, maternity, cbhi, totalDed, net, erPension, erMaternity, erOccHazard, erTotal, pensionPayable, maternityPayable, mealReimb, transportReimb, totalReimb, consultFee, totalPaidUp};
}

// Wraps computePayrollRow with one policy: an employee with no RSSB Number
// on file has nowhere for a Pension/Maternity/CBHI contribution to be
// remitted to, so none of it is actually owed or set aside for them —
// they're simply paid their full computed Net Pay, in cash, with no
// PAYE/Pension/Maternity/CBHI payable and no employer contribution
// attributed to them anywhere payroll totals are added up (the Payroll
// Accounts Recording and Payment/Transfer Summary cards, the Monthly
// Payroll list, the Excel export, and the actual GL postings when payroll
// is run). Net Pay itself never changes for anyone — this only removes the
// otherwise-theoretical statutory breakdown for someone who was never
// actually enrolled with RSSB, and its Gross also collapses to match Net
// so the books still balance without a phantom liability being recorded.
function effectivePayrollCalc(emp, forDate){
  const calc = computePayrollRow(emp, forDate);
  if(emp && String(emp.rssbNumber||'').trim()) return calc;
  return {
    ...calc,
    gross: calc.net, paye: 0, pension: 0, maternity: 0, cbhi: 0, totalDed: 0,
    erPension: 0, erMaternity: 0, erOccHazard: 0, erTotal: 0,
    pensionPayable: 0, maternityPayable: 0,
  };
}

// Posts the monthly payroll journal entry for whichever employees are
// currently ticked "Worked this month" — gross salary and the employer's
// own RSSB contribution both land as expenses, while PAYE, RSSB (employee
// + employer combined), and net pay all sit as payables until actually
// remitted/paid out.
function runMonthlyPayroll(month){
  month = month || todayISO().slice(0,7);
  const ticked = state.payroll.filter(e=>e.workedThisMonth!==false);
  if(ticked.length===0) return {ok:false, msg:'No employees are ticked as having worked this month.'};

  const totals = ticked.reduce((s,e)=>{
    const c = effectivePayrollCalc(e, month+'-01');
    return {
      gross: s.gross+c.gross, paye: s.paye+c.paye,
      pensionEmp: s.pensionEmp+c.pension, maternityEmp: s.maternityEmp+c.maternity, cbhi: s.cbhi+c.cbhi,
      net: s.net+c.net, erTotal: s.erTotal+c.erTotal,
      pensionPayable: s.pensionPayable+c.pensionPayable, maternityPayable: s.maternityPayable+c.maternityPayable,
      totalReimb: s.totalReimb+c.totalReimb, consultFee: s.consultFee+c.consultFee,
    };
  }, {gross:0, paye:0, pensionEmp:0, maternityEmp:0, cbhi:0, net:0, erTotal:0, pensionPayable:0, maternityPayable:0, totalReimb:0, consultFee:0});

  const entryRef = 'PAYROLL-'+month;
  // Dated to the last day of the selected payroll month — correct whether
  // you're running this on time, catching up a past month, or preparing
  // one slightly ahead.
  const [y, m] = month.split('-').map(Number);
  const date = ymd(new Date(y, m, 0));

  state.gl.push({id:uid(), date, entry:entryRef, account:'5100', memo:`Payroll ${month} — Gross Salary (${ticked.length} employees)`, debit:totals.gross, credit:0});
  if(totals.erTotal>0){
    state.gl.push({id:uid(), date, entry:entryRef, account:'5110', memo:`Payroll ${month} — Employer Contribution`, debit:totals.erTotal, credit:0});
  }
  if(totals.paye>0){
    state.gl.push({id:uid(), date, entry:entryRef, account:'2200', memo:`Payroll ${month} — PAYE Payable`, debit:0, credit:totals.paye});
  }
  if(totals.pensionPayable>0){
    state.gl.push({id:uid(), date, entry:entryRef, account:'2211', memo:`Payroll ${month} — Pension Payable (employee + employer + occupational hazards)`, debit:0, credit:totals.pensionPayable});
  }
  if(totals.maternityPayable>0){
    state.gl.push({id:uid(), date, entry:entryRef, account:'2212', memo:`Payroll ${month} — Maternity Payable (employee + employer)`, debit:0, credit:totals.maternityPayable});
  }
  if(totals.cbhi>0){
    state.gl.push({id:uid(), date, entry:entryRef, account:'2213', memo:`Payroll ${month} — CBHI Payable`, debit:0, credit:totals.cbhi});
  }
  state.gl.push({id:uid(), date, entry:entryRef, account:'2220', memo:`Payroll ${month} — Net Salary Payable`, debit:0, credit:totals.net});
  if(totals.totalReimb>0){
    // Non-taxable meal/transport reimbursements — recognized as an expense
    // and a payable, separate from gross salary and not subject to PAYE/RSSB.
    const reimbExpAcct = findOrCreateAccountByName('Transport & Meal Reimbursement Expense');
    const reimbPayAcct = findOrCreateAccountByName('Reimbursements Payable');
    state.gl.push({id:uid(), date, entry:entryRef, account:reimbExpAcct.code, memo:`Payroll ${month} — Transport & Meal Reimbursements`, debit:totals.totalReimb, credit:0});
    state.gl.push({id:uid(), date, entry:entryRef, account:reimbPayAcct.code, memo:`Payroll ${month} — Reimbursements Payable`, debit:0, credit:totals.totalReimb});
  }
  if(totals.consultFee>0){
    // Tax & accounting consultancy fee — same treatment as the reimbursements
    // above: real cash paid out alongside net pay, but not part of gross
    // salary and not subject to PAYE/RSSB.
    const consultExpAcct = findOrCreateAccountByName('Tax & Accounting Consultancy Fee Expense');
    const consultPayAcct = findOrCreateAccountByName('Consultancy Fees Payable');
    state.gl.push({id:uid(), date, entry:entryRef, account:consultExpAcct.code, memo:`Payroll ${month} — Tax & Accounting Consultancy Fee`, debit:totals.consultFee, credit:0});
    state.gl.push({id:uid(), date, entry:entryRef, account:consultPayAcct.code, memo:`Payroll ${month} — Consultancy Fees Payable`, debit:0, credit:totals.consultFee});
  }

  // The bank's own fee for making each of this month's transfers (Net
  // Salary, PAYE, Pension, Maternity, CBHI) — whatever's currently entered
  // in the Payment/Transfer Summary's "Transfer Charge" column — is real
  // money the company spends getting payroll paid out, so it belongs on
  // the Income Statement as a Bank Charges expense the same month, with
  // the amount owed sitting as a payable until settled, exactly like every
  // other cost above. It's posted through its own dedicated, self-syncing
  // entry (syncPayrollTransferChargesInClient) rather than folded into this
  // one, since in practice the transfer fee is usually only known AFTER
  // payroll has already been run and saved — that way, filling it in later
  // still gets recorded without needing to re-run (and risk duplicating)
  // this whole payroll entry.
  const tr = (state.payrollTransfers && state.payrollTransfers[month]) || {};
  const transferCharge = (parseFloat(tr.netCharge)||0) + (parseFloat(tr.payeCharge)||0) + (parseFloat(tr.pensionCharge)||0) + (parseFloat(tr.maternityCharge)||0) + (parseFloat(tr.cbhiCharge)||0);
  syncPayrollTransferChargesInClient(state, month);

  state.payrollRuns = state.payrollRuns || [];
  // Snapshot each ticked employee's full record + that month's calculated
  // pay, frozen at the moment payroll is run. Once a month has a snapshot,
  // the Payroll page shows THIS data for that month instead of recomputing
  // live from the current employee roster — so editing or deleting an
  // employee afterward never changes a month that's already been run.
  const employeeSnapshot = ticked.map(e=>({...e, calc: effectivePayrollCalc(e, month+'-01')}));
  state.payrollRuns.push({id:uid(), month, date, entryRef, employeeCount: ticked.length, employees: employeeSnapshot, ...totals});
  saveState();
  return {ok:true, month, totals, employeeCount: ticked.length, transferCharge};
}

// "Back method" / net-to-gross: given a target take-home Net Pay and any
// fixed Transport/Meal allowances, solve for the Basic Salary that produces
// that exact Net Pay after PAYE and RSSB deductions. Net Pay is monotonically
// increasing in Basic, so binary search converges reliably even though PAYE
// is a piecewise (banded) function of gross.
function solveBasicForTargetNet(targetNet, transport, meal, forDate){
  targetNet = Number(targetNet)||0;
  transport = Number(transport)||0;
  meal = Number(meal)||0;
  let lo = 0, hi = Math.max(targetNet*3, 1000000);
  for(let i=0;i<60;i++){
    const mid = (lo+hi)/2;
    const row = computePayrollRow({basic:mid, transport, meal}, forDate);
    if(row.net < targetNet) lo = mid; else hi = mid;
  }
  return Math.round((lo+hi)/2);
}

/* ============================================================
   PAYROLL IMPORT (bulk Employees + monthly salary from Excel/CSV)
   Expected columns (any order, case-insensitive): First Name, Last Name,
   Branch, ID Number, Account Number, RSSB Number, and one column named
   after the payroll month it covers (e.g. "September") holding each
   employee's take-home Net Pay for that month. "Branch" is read as the
   employee's bank (the sheets this maps use bank short codes like BK,
   GTCO, BPR, EQUITY) so it feeds the existing Bank Distribution report.
   Since the sheet gives take-home pay, not Basic Salary, each row's
   Basic Salary is back-solved with solveBasicForTargetNet() — the exact
   same math already used by the "Compute Basic Salary from Net Pay"
   button — so running payroll afterwards reproduces that exact Net Pay
   through the app's normal PAYE/RSSB calculation. Employees already in
   Payroll are matched by ID Number (falling back to RSSB Number) and
   updated in place rather than duplicated, so re-importing next month's
   sheet just refreshes salaries instead of piling up new records.
   ============================================================ */
const PAYROLL_MONTH_NAMES = ['january','february','march','april','may','june','july','august','september','october','november','december'];

function findPayrollSalaryColumn(headerMap, forMonth){
  const monthNum = forMonth ? Number(String(forMonth).slice(5,7)) : null;
  const preferredName = (monthNum>=1 && monthNum<=12) ? PAYROLL_MONTH_NAMES[monthNum-1] : null;
  const keys = Object.keys(headerMap);
  if(preferredName){
    const exact = keys.find(k=>k===preferredName);
    if(exact) return {key: headerMap[exact], monthName: preferredName};
    const contains = keys.find(k=>k.includes(preferredName));
    if(contains) return {key: headerMap[contains], monthName: preferredName};
  }
  // No exact match for the currently-selected payroll month — fall back to
  // whichever month name actually appears in the sheet's headers, so the
  // file still imports even if "Run payroll for" hasn't been set yet.
  for(const mn of PAYROLL_MONTH_NAMES){
    const found = keys.find(k=>k.includes(mn));
    if(found) return {key: headerMap[found], monthName: mn};
  }
  return null;
}

function importPayrollFromRows(rows, headerMap, forMonth){
  const missing = ['first name','last name'].filter(k=>!headerMap[k]);
  if(missing.length){
    return {error: 'Missing required column(s) for Payroll import: ' + missing.join(', ') + '.\n\n'
      + 'Expected columns (any order, case-insensitive): First Name, Last Name, Branch, ID Number, Account Number, RSSB Number, and a column named after the payroll month it covers (e.g. "September").'};
  }
  const salaryCol = findPayrollSalaryColumn(headerMap, forMonth);
  if(!salaryCol){
    return {error: 'Could not find a salary column — name one column after the month it covers (e.g. "September", "October").'};
  }
  const fallbackYear = Number(String(forMonth||todayISO()).slice(0,4)) || Number(todayISO().slice(0,4));
  const monthIndex = PAYROLL_MONTH_NAMES.indexOf(salaryCol.monthName);
  const forDate = `${fallbackYear}-${String(monthIndex+1).padStart(2,'0')}-01`;

  // Match only against employees that already existed BEFORE this import —
  // never against a record this same import just created. Otherwise two
  // different people who happen to share a mistyped ID/RSSB number in the
  // source sheet would silently collapse into one employee instead of
  // being flagged as the data problem they are.
  const existingSnapshot = state.payroll.slice();
  const seenIdsThisFile = new Map();

  let created = 0, updated = 0;
  const skipped = [];
  rows.forEach((r,i)=>{
    const first = String(r[headerMap['first name']]==null ? '' : r[headerMap['first name']]).trim();
    const last = String(r[headerMap['last name']]==null ? '' : r[headerMap['last name']]).trim();
    const name = (first+' '+last).trim();
    const idNumber = headerMap['id number'] ? String(r[headerMap['id number']]==null?'':r[headerMap['id number']]).trim() : '';
    const accountNumber = headerMap['account number'] ? String(r[headerMap['account number']]==null?'':r[headerMap['account number']]).trim() : '';
    const rssbNumber = headerMap['rssb number'] ? String(r[headerMap['rssb number']]==null?'':r[headerMap['rssb number']]).trim() : '';
    const bankName = headerMap['branch'] ? String(r[headerMap['branch']]==null?'':r[headerMap['branch']]).trim() : '';
    const targetNet = parseNum(r[salaryCol.key]);

    // A wholly blank row (subtotal/spacer rows, or a stray blank line at
    // the end of the sheet) is expected, not a problem — skip it silently.
    if(!name && !idNumber && !rssbNumber && targetNet<=0) return;

    if(!name){ skipped.push({row:i+2, name:'', reason:'no name given'}); return; }
    if(targetNet<=0){ skipped.push({row:i+2, name, reason:`no salary amount in the "${salaryCol.key}" column`}); return; }
    if(idNumber && seenIdsThisFile.has(idNumber)){
      skipped.push({row:i+2, name, reason:`ID Number ${idNumber} is also used by "${seenIdsThisFile.get(idNumber)}" earlier in this same file — fix the spreadsheet (each employee needs their own ID Number) and re-import this person once it's corrected`});
      return;
    }
    if(idNumber) seenIdsThisFile.set(idNumber, name);

    const basic = solveBasicForTargetNet(targetNet, 0, 0, forDate);
    const emp = (idNumber && existingSnapshot.find(e=>e.idNumber && e.idNumber===idNumber))
      || (rssbNumber && existingSnapshot.find(e=>e.rssbNumber && e.rssbNumber===rssbNumber));

    const fields = {
      name, familyName: last, otherNames: first,
      bankName, bankAccount: accountNumber, rssbNumber, idNumber,
      basic, workedThisMonth: true,
    };
    if(emp){
      Object.assign(emp, fields);
      updated++;
    } else {
      state.payroll.push(Object.assign({
        id: uid(), idType:'national_id', position:'', branch:'',
        transport:0, meal:0, transportReimb:0, mealReimb:0, consultFee:0, startDate:'',
      }, fields));
      created++;
    }
  });

  if(created>0 || updated>0) saveState();
  return {created, updated, skipped, monthUsed: salaryCol.monthName, forDate, salaryColumnHeader: salaryCol.key};
}

function handlePayrollImportFile(file){
  if(typeof XLSX === 'undefined'){ alert('Import library did not load — check your internet connection and reload the page.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', raw:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(rows.length===0){ alert('No rows found in that file.'); return; }
      const headerMap = buildHeaderMap(rows[0]);
      const forMonth = payrollRunMonth || todayISO().slice(0,7);
      const result = importPayrollFromRows(rows, headerMap, forMonth);
      if(result.error){ alert(result.error); return; }
      renderMain();
      let msg = `Imported payroll for ${monthLabelOf(result.forDate)} using the "${result.salaryColumnHeader}" column:\n\n`
        + `${result.created} new employee(s) added\n`
        + `${result.updated} existing employee(s) updated (matched by ID Number / RSSB Number)`;
      if(result.skipped.length){
        msg += `\n\n${result.skipped.length} row(s) skipped:\n` + result.skipped.slice(0,10).map(s=>`Row ${s.row}${s.name?' ('+s.name+')':''}: ${s.reason}`).join('\n');
        if(result.skipped.length>10) msg += `\n…and ${result.skipped.length-10} more.`;
      }
      const monthTitleCase = result.monthUsed.charAt(0).toUpperCase() + result.monthUsed.slice(1);
      msg += `\n\nEach person's Basic Salary was back-calculated from their ${monthTitleCase} take-home pay, so running payroll reproduces that same Net Pay after PAYE, Pension, Maternity and CBHI — check the Monthly Payroll table below.`;
      alert(msg);
    }catch(err){
      alert('Could not read that file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function computeVATReport(from, to){
  const outputVAT = sumAccount('2100', from, to, 'credit') - sumAccount('2100', from, to, 'debit');
  const inputVAT = sumAccount('1300', from, to, 'debit') - sumAccount('1300', from, to, 'credit');
  const net = outputVAT - inputVAT;
  return {outputVAT, inputVAT, net, payable: net>0, from, to};
}

// Human-readable label for a VAT period, shared by the Dashboard's VAT
// Position tile and anywhere else that needs to describe a VAT date range
// in the same words the Tax Management > VAT Report tab would use for it.
function vatPeriodLabel(from, to){
  const monthStartOfTo = (to||'').slice(0,8)+'01';
  if(from===monthStartOfTo && to===todayISO()) return 'Month to Date';
  if(from===monthStartOfTo && isLastDayOfMonth(to)) return monthLabelOf(to);
  const d1 = new Date(String(from)+'T00:00:00');
  const d2 = new Date(String(to)+'T00:00:00');
  if(isNaN(d1) || isNaN(d2)) return `${from} – ${to}`;
  const lang = (state && state.settings && state.settings.language==='fr') ? 'fr' : 'en';
  return `${d1.toLocaleDateString(lang,{month:'short',day:'numeric'})} – ${d2.toLocaleDateString(lang,{month:'short',day:'numeric',year:'numeric'})}`;
}

/* ============================================================
   MONTH-END VAT CLOSING
   Nets Output VAT (2100) and Input VAT (1300) for a filing period into
   whichever account actually applies: VAT Payable (2105, a Liability)
   when Output exceeds Input, or VAT Claimed (1310, an Asset) when Input
   exceeds Output — a refund owed by RRA is a receivable, not a negative
   liability, so it gets its own properly-typed account rather than one
   account that flips Balance Sheet sections depending on its balance.
   Each closing is tagged with a per-month entry ref so it can only be
   posted once per month, and payments/refunds against either balance
   are tracked separately so they can span multiple months if not
   settled right away.
   ============================================================ */
function monthKeyOf(dateStr){ return String(dateStr||'').slice(0,7); }

function lastDayOfMonthStr(dateStr){
  const d = new Date(String(dateStr)+'T00:00:00');
  if(isNaN(d)) return dateStr;
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return last.toISOString().slice(0,10);
}

function isLastDayOfMonth(dateStr){
  return dateStr === lastDayOfMonthStr(dateStr);
}

function monthLabelOf(dateStr){
  const d = new Date(String(dateStr)+'T00:00:00');
  if(isNaN(d)) return dateStr;
  const lang = (state && state.settings && state.settings.language==='fr') ? 'fr' : 'en';
  return d.toLocaleString(lang, {month:'long', year:'numeric'});
}

function vatSettlementEntryRef(periodTo){
  return 'VAT-SETTLE-'+monthKeyOf(periodTo);
}

// Returns the already-posted closing entry for the month containing
// periodTo, or null if that month hasn't been closed yet.
function getVatSettlementForPeriod(periodTo){
  const ref = vatSettlementEntryRef(periodTo);
  const lines = state.gl.filter(l=>l.entry===ref);
  if(!lines.length) return null;
  const payableLine = lines.find(l=>l.account==='2105');
  const claimedLine = lines.find(l=>l.account==='1310');
  const nonRecovLine = lines.find(l=>l.account==='5990');
  const outLine = lines.find(l=>l.account==='2100');
  const inLine = lines.find(l=>l.account==='1300');
  let net;
  if(payableLine) net = (Number(payableLine.credit)||0) - (Number(payableLine.debit)||0);
  else if(claimedLine) net = -(Number(claimedLine.debit)||0); // posted to the asset side = refundable
  else if(nonRecovLine) net = -(Number(nonRecovLine.debit)||0); // posted straight to expense = refundable, not claimed
  else net = 0;
  return {
    ref, date: lines[0].date,
    outputVAT: outLine ? (Number(outLine.debit)||0) : 0,
    inputVAT: inLine ? (Number(inLine.credit)||0) : 0,
    net,
    nonRecoverable: !!nonRecovLine
  };
}

// Posts the month-end closing entry: Dr Output VAT, Cr Input VAT, and the
// net difference to whichever account actually applies — VAT Payable
// (2105, a Liability) when Output exceeds Input, or VAT Claimed (1310, an
// Asset) when Input exceeds Output. These are deliberately two separate,
// permanently-typed accounts rather than one account whose Balance Sheet
// section depends on its sign: a VAT claim from RRA is a receivable, a VAT
// bill owed to RRA is a payable, and each should read as exactly that.
// Refuses to double-post for a month already closed.
//
// Always snaps to the FULL calendar month containing periodTo, regardless
// of whatever periodFrom/periodTo were actually passed in — this is a
// deliberate safety net. periodFrom/periodTo often come from whichever
// report tab's date pickers were last touched (they're shared across
// P&L, Cash Flow, VAT, and Tourism), so trusting them directly here would
// let a partial or cross-month range corrupt neighboring months' figures
// when closed. Closing "July" should always mean July 1–31, full stop.
function postVATSettlement(periodFrom, periodTo, treatRefundAsNonRecoverable){
  const safeFrom = String(periodTo||'').slice(0,8)+'01';
  const safeTo = lastDayOfMonthStr(periodTo);
  periodFrom = safeFrom;
  periodTo = safeTo;
  if(getVatSettlementForPeriod(periodTo)){
    return {ok:false, msg:`A VAT closing entry for ${monthLabelOf(periodTo)} has already been posted.`};
  }
  const v = computeVATReport(periodFrom, periodTo);
  if(v.outputVAT===0 && v.inputVAT===0){
    return {ok:false, msg:'No Output VAT or Input VAT posted for this period — nothing to close.'};
  }
  const ref = vatSettlementEntryRef(periodTo);
  const date = periodTo;
  state.gl.push({id:uid(), date, entry:ref, account:'2100', memo:`VAT closing ${monthLabelOf(periodTo)} — clear Output VAT`, debit:v.outputVAT, credit:0});
  state.gl.push({id:uid(), date, entry:ref, account:'1300', memo:`VAT closing ${monthLabelOf(periodTo)} — clear Input VAT`, debit:0, credit:v.inputVAT});
  if(v.net>=0){
    state.gl.push({id:uid(), date, entry:ref, account:'2105', memo:`VAT closing ${monthLabelOf(periodTo)} — net payable to RRA`, debit:0, credit:v.net});
  } else if(treatRefundAsNonRecoverable){
    // Known at closing time that this credit won't be claimed — skip the
    // VAT Claimed asset account entirely and take the expense straight
    // away, same period as the closing entry.
    state.gl.push({id:uid(), date, entry:ref, account:'5990', memo:`VAT closing ${monthLabelOf(periodTo)} — net refundable, not claimed (non-recoverable)`, debit:Math.abs(v.net), credit:0});
  } else {
    state.gl.push({id:uid(), date, entry:ref, account:'1310', memo:`VAT closing ${monthLabelOf(periodTo)} — net VAT claimed from RRA`, debit:Math.abs(v.net), credit:0});
  }
  saveState();
  return {ok:true, net:v.net, nonRecoverable:!!(v.net<0 && treatRefundAsNonRecoverable)};
}

// Running, settled balance of the VAT Payable control account (2105) —
// deliberately excludes the current, not-yet-closed month's Output VAT
// (2100), since that's a different thing: a real, but still-running
// figure that belongs on the VAT Report as this period's own Output VAT,
// not blended into what's actually been settled and owed to RRA. Uses
// inRange (not a plain date comparison) so a GL line with no date at all
// is correctly excluded here exactly as it is everywhere else in the
// app — that specific mismatch was the actual cause of this ever
// disagreeing with the Balance Sheet's own figure, which this must
// always equal.
function vatPayableBalance(asOfDate){
  let debit=0, credit=0;
  state.gl.forEach(l=>{
    if(l.account!=='2105') return;
    if(!inRange(l.date, null, asOfDate||null)) return;
    debit += Number(l.debit)||0;
    credit += Number(l.credit)||0;
  });
  return credit - debit;
}

// Running, settled balance of the VAT Claimed control account (1310) —
// same reasoning as vatPayableBalance above: deliberately excludes the
// current, not-yet-closed month's Input VAT (1300), which belongs on the
// VAT Report as this period's own Input VAT, not as part of what's
// actually been claimed.
function vatClaimedBalance(asOfDate){
  let debit=0, credit=0;
  state.gl.forEach(l=>{
    if(l.account!=='1310') return;
    if(!inRange(l.date, null, asOfDate||null)) return;
    debit += Number(l.debit)||0;
    credit += Number(l.credit)||0;
  });
  return debit - credit;
}

// One-time correction for VAT closing entries posted before this dual-
// account design existed (VAT Claimed as an Asset, VAT Payable as a
// Liability) — those older closings put a refundable position's debit
// straight into the Payable account instead, which is what shows up as
// a confusing negative liability on the Balance Sheet. This only retags
// GL lines that are unambiguously old CLOSING entries (entry ref starts
// with VAT-SETTLE-) debited to account 2105 — it never touches real RRA
// payments (VAT-PAY- refs) or refunds received (VAT-REFUND- refs),
// which are legitimate debits/credits and correct as they are.
function migrateLegacyVATClosingEntries(){
  let count = 0, total = 0;
  state.gl.forEach(l=>{
    if(l.account==='2105' && Number(l.debit)>0 && String(l.entry||'').startsWith('VAT-SETTLE-')){
      l.account = '1310';
      total += Number(l.debit);
      count++;
    }
  });
  if(count>0) saveState();
  return {count, total};
}

function recordVatPaymentToRRA(amount, date, cashAccount){
  amount = Number(amount)||0;
  if(amount<=0) return {ok:false, msg:'Enter a valid amount.'};
  if(!cashAccount) return {ok:false, msg:'Select an account to pay from.'};
  const ref = 'VAT-PAY-'+uid();
  state.gl.push({id:uid(), date, entry:ref, account:'2105', memo:'VAT payment to RRA', debit:amount, credit:0});
  state.gl.push({id:uid(), date, entry:ref, account:cashAccount, memo:'VAT payment to RRA', debit:0, credit:amount});
  saveState();
  return {ok:true};
}

function recordVatRefundFromRRA(amount, date, cashAccount){
  amount = Number(amount)||0;
  if(amount<=0) return {ok:false, msg:'Enter a valid amount.'};
  if(!cashAccount) return {ok:false, msg:'Select an account the refund landed in.'};
  const ref = 'VAT-REFUND-'+uid();
  state.gl.push({id:uid(), date, entry:ref, account:cashAccount, memo:'VAT refund received from RRA', debit:amount, credit:0});
  state.gl.push({id:uid(), date, entry:ref, account:'1310', memo:'VAT refund received from RRA', debit:0, credit:amount});
  saveState();
  return {ok:true};
}

// Running balance of Input VAT (1300) as of a given date — the unclaimed
// credit still sitting on the books (for periods not yet closed).
function inputVATBalance(asOfDate){
  return sumAccount('1300', '0001-01-01', asOfDate, 'net'); // debit - credit; positive = unclaimed credit
}

// Writes off a VAT credit that will never be recovered — either because
// it's being voluntarily left unclaimed, or RRA rejected it. Only valid
// against Input VAT (1300, before month-end closing) or VAT Claimed
// (1310, after closing) — both are asset-like receivable positions.
// Posts Dr Non-Recoverable VAT Expense (5990) / Cr the source account,
// clearing it down.
function writeOffVAT(account, amount, date, note){
  amount = Number(amount)||0;
  if(amount<=0) return {ok:false, msg:'Enter a valid amount.'};
  if(!['1300','1310'].includes(account)){
    return {ok:false, msg:'VAT can only be written off from Input VAT (unclaimed credit) or VAT Claimed (a refundable balance not yet received).'};
  }
  const ref = 'VAT-WRITEOFF-'+uid();
  const memo = note || 'VAT written off — not recoverable';
  state.gl.push({id:uid(), date, entry:ref, account:'5990', memo, debit:amount, credit:0});
  state.gl.push({id:uid(), date, entry:ref, account, memo, debit:0, credit:amount});
  saveState();
  return {ok:true};
}

// Tourism Tax only applies to hospitality/accommodation clients — scope
// the report to Ikoro House Ltd (its only client with tourism revenue)
// so it doesn't clutter Tax Management for clients it isn't relevant to.
function isTourismTaxClient(){
  const name = ((state.settings && state.settings.company && state.settings.company.name) || '').toLowerCase();
  return name.includes('ikoro');
}

function computeTourismTaxReport(from, to){
  const tourismRevenue = sumAccount('4050', from, to, 'credit') - sumAccount('4050', from, to, 'debit');
  // Same extraction logic as the EBM invoice posting itself — RRA treats
  // tourism revenue as already including the 3% tourism tax within it
  // (÷103), not as a base you add 3% on top of (÷100) — otherwise this
  // reconciliation would show a "variance" against correctly-posted
  // invoices purely because it was computing the expected figure wrong.
  const taxDue = tourismRevenue * state.settings.tourismTax / (1 + state.settings.tourismTax);
  const posted = sumAccount('2110', from, to, 'credit') - sumAccount('2110', from, to, 'debit');
  const variance = taxDue - posted;
  return {tourismRevenue, taxDue, posted, variance, from, to};
}

/* ---- EBM Sales Split: records each EBM invoice by splitting the VAT-
   inclusive receipt amount into Accommodation vs Restaurant/Room Service
   vs Other, backs out VAT-exclusive revenue (÷1.18), and posts Output VAT
   (18%) and Tourism Tax (3%, accommodation only, per Law nº 015/2025,
   effective 01/07/2025) straight to the General Ledger — so the Tourism
   Tax Report and VAT Report above both pick it up automatically. */
function computeEBMSplitSummary(from, to){
  const rows = (state.ebmSales||[]).filter(r=> (!from || r.date>=from) && (!to || r.date<=to));
  const sum = (key)=> rows.reduce((s,r)=> s+(Number(r[key])||0), 0);
  return {
    count: rows.length,
    accomExcl: sum('accomExcl'), restExcl: sum('restExcl'), otherExcl: sum('otherExcl'),
    vatAccom: sum('vatAccom'), vatRest: sum('vatRest'), vatOther: sum('vatOther'),
    vatTotal: sum('vatAccom')+sum('vatRest')+sum('vatOther'),
    tourismTax: sum('tourismTax'),
    total: sum('total')
  };
}

// Posts one EBM sale to the GL and the tracked register, given amounts that
// are ALREADY VAT-exclusive (accomExcl/restExcl/otherExcl). Shared by the
// manual entry form (which converts VAT-inclusive receipt amounts down to
// exclusive first) and the Excel importer (whose "(Excl.)" columns are
// already exclusive, matching the export format — no conversion needed).
function postEBMSaleFromExcl({invoiceNo, date, buyerTin, buyerName, roomNumber, accomExcl, restExcl, otherExcl, cashAccount}){
  accomExcl = Number(accomExcl)||0; restExcl = Number(restExcl)||0; otherExcl = Number(otherExcl)||0;
  const accomIncl = accomExcl*1.18, restIncl = restExcl*1.18;
  // "Other" is VAT-exempt — no 18% is extracted from it, but the full
  // amount still counts toward the invoice total below.
  const otherIncl = otherExcl;
  const vatAccom = accomIncl-accomExcl, vatRest = restIncl-restExcl, vatOther = 0;
  const vatTotal = vatAccom+vatRest+vatOther;
  // RRA's own formula extracts Tourism Tax FROM WITHIN the accommodation
  // figure (it treats accomExcl as already including the tourism tax,
  // the same way a VAT-inclusive price contains VAT within it) — it's
  // accomExcl × 3/103, not accomExcl × 3%. Charging 3% ON TOP of accomExcl
  // (÷100 instead of ÷103) overstates the tax due and won't reconcile
  // against RRA's own portal, which computes it as "L10 × 3/103".
  const tourismTax = accomExcl * state.settings.tourismTax / (1 + state.settings.tourismTax);
  const total = accomIncl+restIncl+otherIncl;
  const entryRef = 'EBM-'+uid().slice(0,6);
  const roomTag = roomNumber ? ` (Room ${roomNumber})` : '';
  const cashAcct = cashAccount || '1010';

  const restAcct = findOrCreateAccountByName('Restaurant & Room Service Revenue');

  state.gl.push({id:uid(), date, entry:entryRef, account:cashAcct, memo:`EBM ${invoiceNo}${buyerName?` — ${buyerName}`:''}${roomTag}`, debit:total, credit:0});
