  if(accomExcl>0) state.gl.push({id:uid(), date, entry:entryRef, account:'4050', memo:`EBM ${invoiceNo} — Accommodation${roomTag}`, debit:0, credit:accomExcl});
  if(restExcl>0) state.gl.push({id:uid(), date, entry:entryRef, account:restAcct.code, memo:`EBM ${invoiceNo} — Restaurant/Room Service`, debit:0, credit:restExcl});
  if(otherExcl>0) state.gl.push({id:uid(), date, entry:entryRef, account:'4100', memo:`EBM ${invoiceNo} — Other`, debit:0, credit:otherExcl});
  if(vatTotal>0.005) state.gl.push({id:uid(), date, entry:entryRef, account:'2100', memo:`Output VAT — EBM ${invoiceNo}`, debit:0, credit:vatTotal});
  if(tourismTax>0.005){
    state.gl.push({id:uid(), date, entry:entryRef, account:'5960', memo:`Tourism Tax accrual (3%) — EBM ${invoiceNo}${roomTag}`, debit:tourismTax, credit:0});
    state.gl.push({id:uid(), date, entry:entryRef, account:'2110', memo:`Tourism Tax Payable — EBM ${invoiceNo}${roomTag}`, debit:0, credit:tourismTax});
  }

  state.ebmSales = state.ebmSales || [];
  state.ebmSales.push({
    id:uid(), invoiceNo, date, buyerTin, buyerName, roomNumber,
    accomIncl, restIncl, otherIncl, accomExcl, restExcl, otherExcl,
    vatAccom, vatRest, vatOther, tourismTax, total, cashAccount:cashAcct, entryRef
  });
}

// One-time corrective tool: recalculates Tourism Tax for every EXISTING
// EBM sale using the correct RRA formula (accomExcl × rate/(1+rate)), for
// invoices recorded before that fix existed. Updates the sale record's
// own stored figure AND the matching 5960/2110 GL lines for that exact
// invoice (identified by entryRef) — nothing else about the invoice
// (VAT, revenue, total) changes, since only the tourism tax portion was
// ever wrong. Never touches invoices that are already correct.
function recalculateAllTourismTax(){
  const rate = state.settings.tourismTax;
  let fixedCount = 0, totalReduction = 0;
  (state.ebmSales||[]).forEach(sale=>{
    const accomExcl = Number(sale.accomExcl)||0;
    const correct = accomExcl * rate / (1+rate);
    const old = Number(sale.tourismTax)||0;
    if(Math.abs(correct-old) < 0.5) return; // already correct, nothing to do
    totalReduction += (old-correct);
    sale.tourismTax = correct;
    state.gl.forEach(l=>{
      if(l.entry!==sale.entryRef) return;
      if(l.account==='5960') l.debit = correct;
      if(l.account==='2110') l.credit = correct;
    });
    fixedCount++;
  });
  saveState();
  return {fixedCount, totalReduction};
}

function recordEBMSale(data){
  const accomIncl = Number(data.accomIncl)||0;
  const restIncl = Number(data.restIncl)||0;
  const otherAmount = Number(data.otherIncl)||0; // tax-exempt — this is the final amount directly, no VAT to divide out
  if(accomIncl<=0 && restIncl<=0 && otherAmount<=0) return {ok:false, msg:'Enter at least one amount greater than zero.'};
  if(!data.invoiceNo || !String(data.invoiceNo).trim()) return {ok:false, msg:'Enter the invoice number.'};
  if(!data.date) return {ok:false, msg:'Select the invoice date.'};

  postEBMSaleFromExcl({
    invoiceNo: String(data.invoiceNo).trim(),
    date: data.date,
    buyerTin: String(data.buyerTin||'').trim(),
    buyerName: String(data.buyerName||'').trim(),
    roomNumber: String(data.roomNumber||'').trim(),
    accomExcl: accomIncl/1.18,
    restExcl: restIncl/1.18,
    otherExcl: otherAmount,
    cashAccount: data.cashAccount || '1010'
  });
  saveState();
  return {ok:true};
}

// Bulk-imports EBM invoices from an Excel/CSV file, matching the exact
// column layout this tab's own "Export to Excel" produces — so a register
// exported from here (or built externally in the same shape) can be
// re-imported. Columns are matched by header name, case-insensitively, in
// any order — Invoice #, Date, Buyer, Room, Accommodation (Excl.),
// Restaurant (Excl.), Other (Excl.). VAT/Tourism Tax/Total columns are
// ignored on import since they're recalculated from the Excl. amounts.
function importEBMSalesFromRows(rows, headerMap){
  const invKey = findHeaderKey(headerMap, ['invoice #','invoice number','invoice no','invoiceno']);
  const dateKey = findHeaderKey(headerMap, ['date','invoice date']);
  const buyerKey = findHeaderKey(headerMap, ['buyer','buyer name','customer']);
  const roomKey = findHeaderKey(headerMap, ['room','room number','room #']);
  const accomKey = findHeaderKey(headerMap, ['accommodation (excl.)','accommodation excl','accommodation']);
  const restKey = findHeaderKey(headerMap, ['restaurant (excl.)','restaurant excl','restaurant / room service (excl.)','restaurant']);
  const otherKey = findHeaderKey(headerMap, ['other (excl.)','other excl','other']);

  const existingInvoiceNos = new Set((state.ebmSales||[]).map(r=>r.invoiceNo));
  const cashAcct = (cashBankAccounts()[0]||{}).code || '1010';
  let imported = 0, skipped = 0, duplicates = 0;

  rows.forEach(row=>{
    const invoiceNo = invKey ? String(row[invKey]||'').trim() : '';
    const dateRaw = dateKey ? row[dateKey] : '';
    if(!invoiceNo || !dateRaw){ skipped++; return; }
    if(existingInvoiceNos.has(invoiceNo)){ duplicates++; return; }
    const date = parseImportedDate(dateRaw);
    const accomExcl = accomKey ? parseNum(row[accomKey]) : 0;
    const restExcl = restKey ? parseNum(row[restKey]) : 0;
    const otherExcl = otherKey ? parseNum(row[otherKey]) : 0;
    if(accomExcl<=0 && restExcl<=0 && otherExcl<=0){ skipped++; return; }
    const buyerRaw = buyerKey ? String(row[buyerKey]||'').trim() : '';
    const roomRaw = roomKey ? String(row[roomKey]||'').trim() : '';

    postEBMSaleFromExcl({
      invoiceNo, date,
      buyerTin: '',
      buyerName: (buyerRaw==='—'||buyerRaw==='-') ? '' : buyerRaw,
      roomNumber: (roomRaw==='—'||roomRaw==='-') ? '' : roomRaw,
      accomExcl, restExcl, otherExcl,
      cashAccount: cashAcct
    });
    existingInvoiceNos.add(invoiceNo);
    imported++;
  });

  return {imported, skipped, duplicates};
}

function handleEBMImportFile(file){
  if(typeof XLSX === 'undefined'){ alert('Import library did not load — check your internet connection and reload the page.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', raw:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(rows.length===0){ alert('No rows found in that file.'); return; }

      const headerMap = buildHeaderMap(rows[0]);
      const hasInvoice = !!findHeaderKey(headerMap, ['invoice #','invoice number','invoice no']);
      const hasAccom = !!findHeaderKey(headerMap, ['accommodation (excl.)','accommodation excl','accommodation']);
      if(!hasInvoice || !hasAccom){
        alert('Could not recognize this file\'s columns.\n\nExpected columns (any order, case-insensitive), matching this register\'s own Export to Excel: Invoice #, Date, Buyer, Room, Accommodation (Excl.), Restaurant (Excl.), Other (Excl.).');
        return;
      }

      const result = importEBMSalesFromRows(rows, headerMap);
      saveState();
      renderMain();
      let msg = `Imported ${result.imported} EBM invoice(s).`;
      if(result.duplicates) msg += `\nSkipped ${result.duplicates} — invoice number already recorded in this register.`;
      if(result.skipped) msg += `\nSkipped ${result.skipped} row(s) — missing invoice number, date, or all three revenue amounts were zero.`;
      alert(msg);
    }catch(err){
      console.error(err);
      alert("Could not read that file. Make sure it's a valid CSV or Excel file matching this register's export format.");
    }
  };
  reader.onerror = ()=> alert('Could not read that file.');
  reader.readAsArrayBuffer(file);
}

function deleteEBMSale(id){
  state.ebmSales = state.ebmSales || [];
  const rec = state.ebmSales.find(r=>r.id===id);
  if(!rec) return false;
  state.gl = state.gl.filter(l=>l.entry!==rec.entryRef);
  state.ebmSales = state.ebmSales.filter(r=>r.id!==id);
  saveState();
  return true;
}

// A row in the EBM register is "validated" (posted) as long as at least one
// GL line still carries its entry ref. If the General Ledger was cleared
// separately (Clear All Entries, or a scoped date-range clear) the register
// row survives but its postings don't — so it stops showing up on the
// Balance Sheet / P&L even though it's still listed here. Validate reposts
// exactly the figures already on the row (not recalculated) under a fresh
// entry ref, so it's back in the ledger without changing any numbers.
function isEBMSaleValidated(sale){
  return state.gl.some(l=>l.entry===sale.entryRef);
}

function validateEBMSale(id){
  state.ebmSales = state.ebmSales || [];
  const sale = state.ebmSales.find(r=>r.id===id);
  if(!sale) return false;
  if(isEBMSaleValidated(sale)) return true; // already posted, nothing to do

  const entryRef = 'EBM-'+uid().slice(0,6);
  const roomTag = sale.roomNumber ? ` (Room ${sale.roomNumber})` : '';
  const restAcct = findOrCreateAccountByName('Restaurant & Room Service Revenue');
  const vatTotal = (Number(sale.vatAccom)||0) + (Number(sale.vatRest)||0) + (Number(sale.vatOther)||0);

  state.gl.push({id:uid(), date:sale.date, entry:entryRef, account:sale.cashAccount||'1010', memo:`EBM ${sale.invoiceNo}${sale.buyerName?` — ${sale.buyerName}`:''}${roomTag}`, debit:sale.total, credit:0});
  if(sale.accomExcl>0) state.gl.push({id:uid(), date:sale.date, entry:entryRef, account:'4050', memo:`EBM ${sale.invoiceNo} — Accommodation${roomTag}`, debit:0, credit:sale.accomExcl});
  if(sale.restExcl>0) state.gl.push({id:uid(), date:sale.date, entry:entryRef, account:restAcct.code, memo:`EBM ${sale.invoiceNo} — Restaurant/Room Service`, debit:0, credit:sale.restExcl});
  if(sale.otherExcl>0) state.gl.push({id:uid(), date:sale.date, entry:entryRef, account:'4100', memo:`EBM ${sale.invoiceNo} — Other`, debit:0, credit:sale.otherExcl});
  if(vatTotal>0.005) state.gl.push({id:uid(), date:sale.date, entry:entryRef, account:'2100', memo:`Output VAT — EBM ${sale.invoiceNo}`, debit:0, credit:vatTotal});
  if(sale.tourismTax>0.005){
    state.gl.push({id:uid(), date:sale.date, entry:entryRef, account:'5960', memo:`Tourism Tax accrual (3%) — EBM ${sale.invoiceNo}${roomTag}`, debit:sale.tourismTax, credit:0});
    state.gl.push({id:uid(), date:sale.date, entry:entryRef, account:'2110', memo:`Tourism Tax Payable — EBM ${sale.invoiceNo}${roomTag}`, debit:0, credit:sale.tourismTax});
  }

  sale.entryRef = entryRef;
  saveState();
  return true;
}

function validateAllEBMSales(from, to){
  const rows = (state.ebmSales||[]).filter(r=> (!from || r.date>=from) && (!to || r.date<=to));
  let validated = 0;
  rows.forEach(sale=>{
    if(!isEBMSaleValidated(sale)){ validateEBMSale(sale.id); validated++; }
  });
  return validated;
}

/* ============================================================
   CIT (CORPORATE INCOME TAX) QUARTERLY PREPAYMENTS (IQP) — Rwanda
   requires THREE instalments per fiscal year, each covering a real
   calendar quarter and due at the end of the FOLLOWING quarter:
     Q1: Jan–Mar, due 30 Jun     Q2: Apr–Jun, due 30 Sep
     Q3: Jul–Sep, due 31 Dec
   There is no 4th instalment — Oct–Dec and the final true-up are
   settled through the annual CIT return instead, not another IQP.
   Each instalment's amount uses RRA's own formula:
     IQP = (Tax Paid Previous Year ÷ Turnover Previous Year) × Current
           Quarter's Turnover
   "Current Quarter's Turnover" is computed live from the ledger (all
   Income-type accounts for that quarter's actual dates); "Tax Paid
   Previous Year" and "Turnover Previous Year" come from the prior
   year's filed return, entered once per fiscal year. The result is
   auto-filled but stays editable, since a business with no prior-year
   profit (or its first year) has to self-assess instead.
   ============================================================ */
let citFiscalYear = null;

function citInstalmentDueDates(fiscalYear){
  return [
    {quarter:'Q1', periodFrom:`${fiscalYear}-01-01`, periodTo:`${fiscalYear}-03-31`, dueDate:`${fiscalYear}-06-30`},
    {quarter:'Q2', periodFrom:`${fiscalYear}-04-01`, periodTo:`${fiscalYear}-06-30`, dueDate:`${fiscalYear}-09-30`},
    {quarter:'Q3', periodFrom:`${fiscalYear}-07-01`, periodTo:`${fiscalYear}-09-30`, dueDate:`${fiscalYear}-12-31`},
  ];
}

// Turnover for a specific quarter, computed live from every Income-type
// account in the Chart of Accounts — not a stored figure, so it's always
// current with whatever's actually been posted.
function computeQuarterTurnover(periodFrom, periodTo){
  const incomeAccounts = state.accounts.filter(a=>a.type==='Income');
  return incomeAccounts.reduce((s,a)=> s + (sumAccount(a.code, periodFrom, periodTo, 'credit') - sumAccount(a.code, periodFrom, periodTo, 'debit')), 0);
}

function getCitPriorYearRef(fiscalYear){
  state.settings.citPriorYear = state.settings.citPriorYear || {};
  return state.settings.citPriorYear[fiscalYear] || {tax:0, turnover:0};
}

// RRA's IQP formula. Returns null (not a number) when there's no prior-
// year reference yet, so the caller knows to fall back to a manual
// estimate rather than silently showing a confident-looking zero.
function computeIQPDue(fiscalYear, periodFrom, periodTo){
  const ref = getCitPriorYearRef(fiscalYear);
  // Zero or negative prior-year tax means there's no prior-year tax base
  // to project forward from — RRA's formula has nothing to work with, so
  // this year's instalments are genuinely null (not applicable), not a
  // calculated $0. A loss-making prior year lands here too, since tax
  // paid on a loss is zero. Turnover gets the same guard, since dividing
  // by zero or a negative figure would be meaningless either way.
  if(!ref.tax || ref.tax<=0 || !ref.turnover || ref.turnover<=0) return null;
  const quarterTurnover = computeQuarterTurnover(periodFrom, periodTo);
  return (ref.tax / ref.turnover) * quarterTurnover;
}

// Returns the 3 instalment records for a fiscal year, creating them in
// state if this is the first time that year has been viewed. Any stale
// Q4 record from before this correction simply won't be picked up here
// — it's harmless leftover data, not something that needs migrating.
function getCitInstalments(fiscalYear){
  state.citPrepayments = state.citPrepayments || [];
  const dates = citInstalmentDueDates(fiscalYear);
  dates.forEach(d=>{
    const existing = state.citPrepayments.find(p=>p.fiscalYear===fiscalYear && p.quarter===d.quarter);
    if(!existing){
      state.citPrepayments.push({id:uid(), fiscalYear, quarter:d.quarter, periodFrom:d.periodFrom, periodTo:d.periodTo, dueDate:d.dueDate, amountDue:0, amountPaid:0, datePaid:null, entryRef:null});
    } else if(existing.periodFrom!==d.periodFrom || existing.periodTo!==d.periodTo){
      // Backfill period dates for instalments created before this field existed
      existing.periodFrom = d.periodFrom; existing.periodTo = d.periodTo;
    }
  });
  return state.citPrepayments.filter(p=>p.fiscalYear===fiscalYear && ['Q1','Q2','Q3'].includes(p.quarter)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
}

function citInstalmentStatus(inst, asOf){
  if(inst.amountPaid >= inst.amountDue && inst.amountDue>0) return 'Paid';
  if(inst.amountPaid > 0) return 'Partially Paid';
  if(inst.dueDate < asOf) return 'Overdue';
  return 'Due';
}

// Full-fiscal-year estimated CIT, for comparison against what's been
// prepaid so far — same 28%-of-taxable-profit logic used elsewhere,
// just applied to the whole year instead of one period.
function computeAnnualEstimatedCIT(fiscalYear){
  const pl = computePL(`${fiscalYear}-01-01`, `${fiscalYear}-12-31`);
  return Math.max(pl.netBeforeTax,0) * state.settings.cit;
}

function recordCitPrepayment(instalmentId, amount, date, cashAccount){
  const inst = (state.citPrepayments||[]).find(p=>p.id===instalmentId);
  if(!inst) return {ok:false, msg:'Instalment not found.'};
  amount = Number(amount)||0;
  if(amount<=0) return {ok:false, msg:'Enter an amount greater than zero.'};
  const entryRef = 'CIT-'+inst.fiscalYear+'-'+inst.quarter;
  const cashAcct = cashAccount || '1010';
  state.gl.push({id:uid(), date, entry:entryRef, account:'1350', memo:`CIT prepayment — ${inst.quarter} ${inst.fiscalYear}`, debit:amount, credit:0});
  state.gl.push({id:uid(), date, entry:entryRef, account:cashAcct, memo:`CIT prepayment — ${inst.quarter} ${inst.fiscalYear}`, debit:0, credit:amount});
  inst.amountPaid = (Number(inst.amountPaid)||0) + amount;
  inst.datePaid = date;
  inst.entryRef = entryRef;
  saveState();
  return {ok:true};
}

/* ============================================================
   FIXED ASSETS — straight-line depreciation, posts to GL
   ============================================================ */
function monthlyDepreciation(asset){
  const cost = Number(asset.cost)||0;
  const salvage = Number(asset.salvage)||0;
  const lifeYears = Number(asset.usefulLifeYears)||1;
  const months = lifeYears * 12;
  if(months<=0) return 0;
  return Math.max(0, (cost - salvage) / months);
}
function assetAccumulatedDepr(asset){
  const monthly = monthlyDepreciation(asset);
  const runs = (asset.depreciationLog||[]).length;
  return Math.min(monthly * runs, (Number(asset.cost)||0) - (Number(asset.salvage)||0));
}
function assetNetBookValue(asset){
  return (Number(asset.cost)||0) - assetAccumulatedDepr(asset);
}
function runDepreciationForPeriod(periodLabel){
  let posted = 0;
  (state.fixedAssets||[]).forEach(asset=>{
    if(asset.disposed) return;
    if((asset.depreciationLog||[]).some(l=>l.period===periodLabel)) return; // already run this period
    const amt = monthlyDepreciation(asset);
    const nbv = assetNetBookValue(asset);
    if(amt<=0 || nbv<=0) return;
    const post = Math.min(amt, nbv);
    const entryRef = 'DEPR-'+periodLabel+'-'+asset.id.slice(0,4);
    state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'5500', memo:`Depreciation: ${asset.name} (${periodLabel})`, debit:post, credit:0});
    state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'1510', memo:`Depreciation: ${asset.name} (${periodLabel})`, debit:0, credit:post});
    asset.depreciationLog = asset.depreciationLog || [];
    asset.depreciationLog.push({period:periodLabel, amount:post, date:todayISO()});
    posted++;
  });
  return posted;
}

/* ============================================================
   INVENTORY — weighted-average costing, posts to GL
   ============================================================ */
function inventoryValue(item){ return (Number(item.qty)||0) * (Number(item.avgCost)||0); }
function totalInventoryValue(){ return (state.inventory||[]).reduce((s,i)=>s+inventoryValue(i),0); }

function receiveStock(itemId, qty, unitCost, payFrom){
  const item = state.inventory.find(i=>i.id===itemId);
  if(!item) return false;
  qty = Number(qty)||0; unitCost = Number(unitCost)||0;
  if(qty<=0) return false;
  const oldQty = Number(item.qty)||0, oldAvg = Number(item.avgCost)||0;
  const newQty = oldQty + qty;
  const newAvg = newQty>0 ? ((oldQty*oldAvg) + (qty*unitCost)) / newQty : 0;
  item.qty = newQty; item.avgCost = newAvg;
  const amt = qty*unitCost;
  const entryRef = 'STK-IN-'+Date.now().toString().slice(-6);
  state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'1200', memo:`Stock received: ${item.name} x${qty}`, debit:amt, credit:0});
  state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:payFrom||'2000', memo:`Stock received: ${item.name} x${qty}`, debit:0, credit:amt});
  return true;
}
function issueStock(itemId, qty, saleAccount){
  const item = state.inventory.find(i=>i.id===itemId);
  if(!item) return false;
  qty = Number(qty)||0;
  if(qty<=0 || qty>(Number(item.qty)||0)) return false;
  const cost = qty * (Number(item.avgCost)||0);
  item.qty = (Number(item.qty)||0) - qty;
  const entryRef = 'STK-OUT-'+Date.now().toString().slice(-6);
  state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'5000', memo:`Stock issued: ${item.name} x${qty}`, debit:cost, credit:0});
  state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'1200', memo:`Stock issued: ${item.name} x${qty}`, debit:0, credit:cost});
  return true;
}

/* ============================================================
   POINT OF SALE (POS) / POINT OF PURCHASE (POP) — a single action
   that keeps stock quantity, cost of sales, revenue, and cash all in
   sync automatically. Every POS/POP transaction is logged so it can
   be returned/voided later, which reverses the exact GL impact and
   restores stock (using the original cost it was sold/bought at,
   rather than trying to rewrite the weighted-average history).
   ============================================================ */
function recordPOSSale(itemId, qty, unitPrice, vatPct, cashAccount){
  const item = state.inventory.find(i=>i.id===itemId);
  if(!item) return {ok:false, msg:'Item not found.'};
  qty = Number(qty)||0; unitPrice = Number(unitPrice)||0;
  if(qty<=0) return {ok:false, msg:'Enter a quantity greater than zero.'};
  if(qty > (Number(item.qty)||0)) return {ok:false, msg:`Only ${fmt(item.qty||0)} in stock.`};

  const unitCostAtSale = Number(item.avgCost)||0;
  const cost = qty * unitCostAtSale;
  const subtotal = qty * unitPrice;
  const vat = subtotal * (Number(vatPct)||0)/100;
  const total = subtotal + vat;
  const entryRef = 'POS-'+uid().slice(0,6);
  const cashAcct = cashAccount || '1010';

  // Revenue side — cash in, sales recognized
  state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:cashAcct, memo:`POS sale: ${item.name} x${qty}`, debit:total, credit:0});
  state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'4000', memo:`POS sale: ${item.name} x${qty}`, debit:0, credit:subtotal});
  if(vat>0){
    state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'2100', memo:'Output VAT — POS sale', debit:0, credit:vat});
  }
  // Cost side — stock leaves, cost of sales recognized
  state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'5000', memo:`POS sale COGS: ${item.name} x${qty}`, debit:cost, credit:0});
  state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'1200', memo:`POS sale COGS: ${item.name} x${qty}`, debit:0, credit:cost});

  item.qty = (Number(item.qty)||0) - qty;

  state.stockTransactions = state.stockTransactions || [];
  const txn = {id:uid(), type:'sale', itemId, itemName:item.name, qty, unitPrice, unitCostAtSale,
    vatPct:Number(vatPct)||0, subtotal, vat, total, cost, date:todayISO(), entryRef, cashAccount:cashAcct, reversed:false};
  state.stockTransactions.push(txn);
  saveState();
  return {ok:true, txn};
}

function recordPOPPurchase(itemId, qty, unitCost, vatPct, cashAccount){
  const item = state.inventory.find(i=>i.id===itemId);
  if(!item) return {ok:false, msg:'Item not found.'};
  qty = Number(qty)||0; unitCost = Number(unitCost)||0;
  if(qty<=0) return {ok:false, msg:'Enter a quantity greater than zero.'};

  const subtotal = qty * unitCost;
  const vat = subtotal * (Number(vatPct)||0)/100;
  const total = subtotal + vat;
  const entryRef = 'POP-'+uid().slice(0,6);
  const cashAcct = cashAccount || '1010';

  state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'1200', memo:`POP purchase: ${item.name} x${qty}`, debit:subtotal, credit:0});
  if(vat>0){
    state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:'1300', memo:'Input VAT — POP purchase', debit:vat, credit:0});
  }
  state.gl.push({id:uid(), date:todayISO(), entry:entryRef, account:cashAcct, memo:`POP purchase: ${item.name} x${qty}`, debit:0, credit:total});

  const oldQty = Number(item.qty)||0, oldAvg = Number(item.avgCost)||0;
  const newQty = oldQty + qty;
  const newAvg = newQty>0 ? ((oldQty*oldAvg) + (qty*unitCost)) / newQty : 0;
  item.qty = newQty; item.avgCost = newAvg;

  state.stockTransactions = state.stockTransactions || [];
  const txn = {id:uid(), type:'purchase', itemId, itemName:item.name, qty, unitCost,
    vatPct:Number(vatPct)||0, subtotal, vat, total, date:todayISO(), entryRef, cashAccount:cashAcct, reversed:false};
  state.stockTransactions.push(txn);
  saveState();
  return {ok:true, txn};
}

// Returns/voids a POS sale or POP purchase: reverses the exact GL impact
// and restores stock. A returned SALE blends back in at the cost it was
// originally sold at (not today's average), matching how a real sales
// return works. A returned PURCHASE simply removes that quantity again.
function stockTxnRemaining(txn){ return (Number(txn.qty)||0) - (Number(txn.qtyReturned)||0); }

function reverseStockTransaction(txnId, returnQty){
  const txn = (state.stockTransactions||[]).find(tx=>tx.id===txnId);
  if(!txn) return {ok:false, msg:'Transaction not found.'};
  const remaining = stockTxnRemaining(txn);
  if(remaining<=0.0001) return {ok:false, msg:'Already fully returned/voided.'};
  returnQty = (returnQty===undefined || returnQty===null) ? remaining : Number(returnQty)||0;
  if(returnQty<=0) return {ok:false, msg:'Enter a quantity greater than zero.'};
  if(returnQty > remaining+0.0001) return {ok:false, msg:`Only ${fmt(remaining)} left to return on this transaction.`};

  const item = state.inventory.find(i=>i.id===txn.itemId);
  if(!item) return {ok:false, msg:'That item no longer exists.'};

  const date = todayISO();
  const alreadyReturned = Number(txn.qtyReturned)||0;
  const reverseRef = txn.entryRef + '-RET' + (alreadyReturned>0 ? '-'+uid().slice(0,4) : '');
  // What fraction of the ORIGINAL transaction is being returned right now —
  // scales every amount (subtotal, VAT, total, cost) proportionally, so a
  // partial return of e.g. 2 out of 5 units reverses exactly 2/5 of the
  // original financial impact.
  const portion = returnQty / txn.qty;

  if(txn.type==='sale'){
    const pSubtotal = txn.subtotal*portion, pVat = txn.vat*portion, pTotal = txn.total*portion, pCost = txn.cost*portion;
    state.gl.push({id:uid(), date, entry:reverseRef, account:txn.cashAccount, memo:`Return: ${txn.itemName} x${returnQty}`, debit:0, credit:pTotal});
    state.gl.push({id:uid(), date, entry:reverseRef, account:'4000', memo:`Return: ${txn.itemName} x${returnQty}`, debit:pSubtotal, credit:0});
    if(pVat>0){
      state.gl.push({id:uid(), date, entry:reverseRef, account:'2100', memo:'Return: VAT reversal', debit:pVat, credit:0});
    }
    state.gl.push({id:uid(), date, entry:reverseRef, account:'1200', memo:`Return: ${txn.itemName} x${returnQty} back to stock`, debit:pCost, credit:0});
    state.gl.push({id:uid(), date, entry:reverseRef, account:'5000', memo:`Return: ${txn.itemName} x${returnQty} COGS reversal`, debit:0, credit:pCost});

    const oldQty = Number(item.qty)||0, oldAvg = Number(item.avgCost)||0;
    const newQty = oldQty + returnQty;
    const newAvg = newQty>0 ? ((oldQty*oldAvg) + (returnQty*txn.unitCostAtSale)) / newQty : 0;
    item.qty = newQty; item.avgCost = newAvg;
  } else {
    if(returnQty > (Number(item.qty)||0)) return {ok:false, msg:'Cannot return more than is currently in stock.'};
    const pSubtotal = txn.subtotal*portion, pVat = txn.vat*portion, pTotal = txn.total*portion;
    state.gl.push({id:uid(), date, entry:reverseRef, account:'1200', memo:`Purchase return: ${txn.itemName} x${returnQty}`, debit:0, credit:pSubtotal});
    if(pVat>0){
      state.gl.push({id:uid(), date, entry:reverseRef, account:'1300', memo:'Purchase return: VAT reversal', debit:0, credit:pVat});
    }
    state.gl.push({id:uid(), date, entry:reverseRef, account:txn.cashAccount, memo:`Purchase return: ${txn.itemName} x${returnQty}`, debit:pTotal, credit:0});
    item.qty = (Number(item.qty)||0) - returnQty;
  }

  txn.qtyReturned = alreadyReturned + returnQty;
  if(stockTxnRemaining(txn) <= 0.0001) txn.reversed = true;
  saveState();
  return {ok:true};
}

/* ============================================================
   RECURRING TRANSACTIONS — templates that post to GL on schedule
   ============================================================ */
function addMonths(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}
function runDueRecurring(){
  let posted = 0;
  const today = todayISO();
  (state.recurring||[]).forEach(r=>{
    if(!r.active) return;
    let guard = 0;
    while(r.nextRun && r.nextRun<=today && guard<24){ // cap to avoid runaway loops on very old templates
      const entryRef = 'REC-'+r.id.slice(0,4)+'-'+r.nextRun;
      state.gl.push({id:uid(), date:r.nextRun, entry:entryRef, account:r.debitAccount, memo:r.description, debit:Number(r.amount)||0, credit:0});
      state.gl.push({id:uid(), date:r.nextRun, entry:entryRef, account:r.creditAccount, memo:r.description, debit:0, credit:Number(r.amount)||0});
      r.lastRun = r.nextRun;
      r.nextRun = addMonths(r.nextRun, 1);
      posted++;
      guard++;
    }
  });
  return posted;
}

/* ============================================================
   MULTI-CURRENCY — convert foreign-currency GL entries to base
   ============================================================ */
function currencyRate(code){
  const c = (state.currencies||[]).find(c=>c.code===code);
  return c ? Number(c.rate)||1 : 1;
}
function toBaseCurrency(amount, code){
  return (Number(amount)||0) * currencyRate(code);
}

/* ============================================================
   ACCOUNTS RECEIVABLE — open invoices, aging, payment recording
   ============================================================ */
function invoiceOutstanding(inv){ return (Number(inv.total)||0) - (Number(inv.paid)||0); }
function invoiceStatus(inv, asOf){
  const outstanding = invoiceOutstanding(inv);
  if(outstanding<=0.01) return 'Paid';
  if(inv.dueDate && inv.dueDate < asOf) return 'Overdue';
  return 'Open';
}
function recordInvoicePayment(invoiceId, amount, payTo, date){
  const inv = state.invoices.find(i=>i.id===invoiceId);
  if(!inv) return false;
  amount = Number(amount)||0;
  const outstanding = invoiceOutstanding(inv);
  if(amount<=0 || amount>outstanding+0.01) return false;
  inv.paid = (Number(inv.paid)||0) + amount;
  const payDate = date||todayISO();
  inv.payments = inv.payments || [];
  inv.payments.push({date: payDate, amount});
  const entryRef = inv.invoiceNo+'-PMT';
  state.gl.push({id:uid(), date:payDate, entry:entryRef, account:payTo||'1010', memo:`Payment received: ${inv.invoiceNo}`, debit:amount, credit:0});
  state.gl.push({id:uid(), date:payDate, entry:entryRef, account:'1100', memo:`Payment received: ${inv.invoiceNo}`, debit:0, credit:amount});
  const customer = state.customers.find(c=>c.id===inv.customerId);
  if(customer) customer.paid = (Number(customer.paid)||0) + amount;
  return true;
}
// One-time repair for the earlier bug where every recorded payment was
// dated "today" instead of the invoice's own date. Re-dates the GL lines
// posted under this invoice's payment entry, and its payments[] history,
// to match the invoice's own date — leaving anything already correct
// untouched.
function fixInvoicePaymentDatesToInvoiceDate(){
  let fixedInvoices = 0, fixedLines = 0;
  (state.invoices||[]).forEach(inv=>{
    if(!inv.date || !(Number(inv.paid)>0)) return;
    const entryRef = inv.invoiceNo+'-PMT';
    let touched = false;
    state.gl.forEach(l=>{
      if(l.entry===entryRef && l.date!==inv.date){ l.date = inv.date; fixedLines++; touched = true; }
    });
    if(Array.isArray(inv.payments)){
      inv.payments.forEach(p=>{ if(p.date!==inv.date){ p.date = inv.date; touched = true; } });
    }
    if(touched) fixedInvoices++;
  });
  if(fixedInvoices>0) saveState();
  return {fixedInvoices, fixedLines};
}
// Outstanding balance as of a specific date, not just today — used by the
// Aged Debtors & Creditors report. Invoices raised after asAtDate simply
// didn't exist yet, so they count as zero.
// For anything paid before this per-payment date tracking existed, there's
// no way to know exactly when an old payment landed. Assuming "today's
// balance applies to the past date too" would be actively wrong for a
// fully-paid old invoice — it would show as zero for every past date, even
// though it was obviously outstanding at some point before it was paid.
// So for a genuinely past date with no payment history, this assumes the
// invoice was still fully outstanding (its full total, not total-minus-
// paid) — erring toward showing a real historical receivable with a clear
// approximation flag, rather than silently hiding it. approx signals that
// case so the report can be honest about it rather than presenting a
// guess as fact.
function invoiceOutstandingAsAt(inv, asAtDate){
  if(inv.date && inv.date>asAtDate) return {amount:0, approx:false};
  // Today (or later) must always use the real, current, fully-trusted
  // figure — total minus paid — regardless of payments[]. Relying on
  // payments[] here was the actual bug: if that array doesn't fully
  // account for every payment ever made against this invoice (which can
  // happen if some were tracked before this feature existed and some
  // after), summing only what's in the array under-counts what's really
  // been paid — even for today, which should never be in question.
  if(asAtDate>=todayISO()) return {amount: invoiceOutstanding(inv), approx:false};
  if(Array.isArray(inv.payments) && inv.payments.length>0){
    const trackedTotal = inv.payments.reduce((s,p)=>s+(Number(p.amount)||0),0);
    // If what's tracked in payments[] doesn't add up to the real paid
    // total, the array is incomplete — trusting a date-filtered slice of
    // it would be worse than being honest that the exact split isn't
    // fully known, so this falls through to the same approximation used
    // for invoices with no payment history at all.
    if(Math.abs(trackedTotal-(Number(inv.paid)||0))<0.5){
      const paidByThen = inv.payments.filter(p=>p.date<=asAtDate).reduce((s,p)=>s+(Number(p.amount)||0),0);
      return {amount: (Number(inv.total)||0) - paidByThen, approx:false};
    }
  }
  if((Number(inv.paid)||0) > 0){
    return {amount: Number(inv.total)||0, approx:true};
  }
  return {amount: invoiceOutstanding(inv), approx:false};
}

/* ============================================================
   ACCOUNTS PAYABLE — open bills, aging, payment recording
   ============================================================ */
function billOutstanding(bill){ return (Number(bill.netPay)||0) - (Number(bill.paid)||0); }
function recordBillPayment(billId, amount, payFrom, date){
  const bill = state.bills.find(b=>b.id===billId);
  if(!bill) return false;
  amount = Number(amount)||0;
  const outstanding = billOutstanding(bill);
  if(amount<=0 || amount>outstanding+0.01) return false;
  bill.paid = (Number(bill.paid)||0) + amount;
  const payDate = date||todayISO();
  bill.payments = bill.payments || [];
  bill.payments.push({date: payDate, amount});
  const entryRef = (bill.entryRef||'BILL')+'-PMT';
  state.gl.push({id:uid(), date:payDate, entry:entryRef, account:'2000', memo:`Payment to supplier: ${bill.description||''}`, debit:amount, credit:0});
  state.gl.push({id:uid(), date:payDate, entry:entryRef, account:payFrom||'1010', memo:`Payment to supplier: ${bill.description||''}`, debit:0, credit:amount});
  const vendor = state.vendors.find(v=>v.id===bill.vendorId);
  if(vendor) vendor.paid = (Number(vendor.paid)||0) + amount;
  return true;
}
// Same reasoning as invoiceOutstandingAsAt — see that function's comment.
function billOutstandingAsAt(bill, asAtDate){
  if(bill.date && bill.date>asAtDate) return {amount:0, approx:false};
  if(asAtDate>=todayISO()) return {amount: billOutstanding(bill), approx:false};
  if(Array.isArray(bill.payments) && bill.payments.length>0){
    const trackedTotal = bill.payments.reduce((s,p)=>s+(Number(p.amount)||0),0);
    if(Math.abs(trackedTotal-(Number(bill.paid)||0))<0.5){
      const paidByThen = bill.payments.filter(p=>p.date<=asAtDate).reduce((s,p)=>s+(Number(p.amount)||0),0);
      return {amount: (Number(bill.netPay)||0) - paidByThen, approx:false};
    }
  }
  if((Number(bill.paid)||0) > 0){
    return {amount: Number(bill.netPay)||0, approx:true};
  }
  return {amount: billOutstanding(bill), approx:false};
}

// Same repair as fixInvoicePaymentDatesToInvoiceDate, for bills.
function fixBillPaymentDatesToBillDate(){
  let fixedBills = 0, fixedLines = 0;
  (state.bills||[]).forEach(bill=>{
    if(!bill.date || !(Number(bill.paid)>0)) return;
    const entryRef = (bill.entryRef||'BILL')+'-PMT';
    let touched = false;
    state.gl.forEach(l=>{
      if(l.entry===entryRef && l.date!==bill.date){ l.date = bill.date; fixedLines++; touched = true; }
    });
    if(Array.isArray(bill.payments)){
      bill.payments.forEach(p=>{ if(p.date!==bill.date){ p.date = bill.date; touched = true; } });
    }
    if(touched) fixedBills++;
  });
  if(fixedBills>0) saveState();
  return {fixedBills, fixedLines};
}

function accountLineStats(code){
  const lines = state.gl.filter(l=>l.account===code);
  const debit = lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
  const credit = lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  return {count: lines.length, debit, credit, net: debit-credit};
}
function reassignAccountLines(fromCode, toCode){
  let count = 0;
  state.gl.forEach(l=>{ if(l.account===fromCode){ l.account = toCode; count++; } });
  if(count>0) saveState();
  return count;
}

function daysBetween(fromDateStr, toDateStr){
  const a = new Date(fromDateStr+'T00:00:00'), b = new Date(toDateStr+'T00:00:00');
  return Math.round((b-a)/86400000);
}

// Groups a set of invoices or bills by customer/supplier into the
// standard aging matrix (Current, 1-30, 31-60, 61-90, 90+), each entity's
// balance as of asAtDate split across whichever bucket its overdue days
// fall into. approx propagates up from the underlying as-at calculation —
// see invoiceOutstandingAsAt/billOutstandingAsAt for what that means.
function computeAgedListing(records, entities, getEntityId, outstandingAsAtFn, asAtDate, showAll){
  const byEntity = {};
  if(showAll){
    entities.forEach(e=>{ byEntity[e.id] = {name:e.name, current:0, d1_30:0, d31_60:0, d61_90:0, d90plus:0, total:0, hasApprox:false, maxOverdueDays:-Infinity}; });
  }
  records.forEach(rec=>{
    const {amount, approx} = outstandingAsAtFn(rec, asAtDate);
    if(amount<=0.01) return;
    const entity = entities.find(e=>e.id===getEntityId(rec));
    const key = entity ? entity.id : '(none)';
    const name = entity ? entity.name : '(No customer/supplier on record)';
    const dueOrInvoiceDate = rec.dueDate || rec.date;
    const overdueDays = dueOrInvoiceDate ? daysBetween(dueOrInvoiceDate, asAtDate) : 0;
    let bucket = 'current';
    if(overdueDays>90) bucket='d90plus';
    else if(overdueDays>60) bucket='d61_90';
    else if(overdueDays>30) bucket='d31_60';
    else if(overdueDays>0) bucket='d1_30';
    if(!byEntity[key]) byEntity[key] = {name, current:0, d1_30:0, d31_60:0, d61_90:0, d90plus:0, total:0, hasApprox:false, maxOverdueDays:-Infinity};
    byEntity[key][bucket] += amount;
    byEntity[key].total += amount;
    if(approx) byEntity[key].hasApprox = true;
    if(overdueDays>byEntity[key].maxOverdueDays) byEntity[key].maxOverdueDays = overdueDays;
  });
  return Object.values(byEntity);
}

function sortAgedRows(rows, sortBy){
  const sorted = [...rows];
  if(sortBy==='alpha') sorted.sort((a,b)=> a.name.localeCompare(b.name));
  else if(sortBy==='oldest') sorted.sort((a,b)=> b.maxOverdueDays-a.maxOverdueDays);
  else sorted.sort((a,b)=> b.total-a.total); // total_desc, the default
  return sorted;
}

function renderAgedReport(){
  const asAt = agedAsAtDate || todayISO();
  const debtors = computeAgedListing(state.invoices||[], state.customers||[], i=>i.customerId, invoiceOutstandingAsAt, asAt, agedShowAll);
  const creditors = computeAgedListing((state.bills||[]).filter(b=>b.payFrom==='2000'), state.vendors||[], b=>b.vendorId, billOutstandingAsAt, asAt, agedShowAll);
  const sumCol = (rows, col)=> rows.reduce((s,r)=>s+r[col],0);
  const debtorsAgedTotal = sumCol(debtors, 'total');
  const creditorsAgedTotal = sumCol(creditors, 'total');

  // Ledger consistency check — NOT a comparison against the Aged report's
  // date-filtered total (that was the earlier, flawed version: the
  // Ledger's invoiced/paid fields are running totals of EVERYTHING ever
  // recorded, with no date attached, so comparing them against a
  // date-filtered Aged total for a past date was never really testing
  // for an error — the "difference" it showed for a past date was just
  // payments made between that date and today, not a real problem.
  // What actually IS testable, for any date, is whether the Ledger's own
  // cached invoiced/paid figures genuinely equal what they should —
  // the real sum of every invoice/bill's own total and paid amount.
  // Invoice/bill totals and paid amounts are always known, dated or not,
  // so this check is completely valid regardless of which "As At" date
  // is selected — it's checking the Ledger against its own source data,
  // not against the Aged report.
  function ledgerConsistency(entities, records, getEntityId, totalField){
    let totalInvoicedDiff = 0, totalPaidDiff = 0;
    const problems = [];
    entities.forEach(e=>{
      const own = records.filter(r=>getEntityId(r)===e.id);
      const expectedInvoiced = own.reduce((s,r)=>s+(Number(r[totalField])||0),0);
      const expectedPaid = own.reduce((s,r)=>s+(Number(r.paid)||0),0);
      const invoicedDiff = (Number(e.invoiced)||0) - expectedInvoiced;
      const paidDiff = (Number(e.paid)||0) - expectedPaid;
      totalInvoicedDiff += invoicedDiff;
      totalPaidDiff += paidDiff;
      if(Math.abs(invoicedDiff)>=1 || Math.abs(paidDiff)>=1) problems.push({name:e.name, invoicedDiff, paidDiff});
    });
    return {totalInvoicedDiff, totalPaidDiff, problems};
  }
  const debtorsConsistency = ledgerConsistency(state.customers||[], state.invoices||[], i=>i.customerId, 'total');
  const creditorsConsistency = ledgerConsistency(state.vendors||[], (state.bills||[]).filter(b=>b.payFrom==='2000'), b=>b.vendorId, 'netPay');
  const debtorsHasIssue = debtorsConsistency.problems.length>0;
  const creditorsHasIssue = creditorsConsistency.problems.length>0;

  // Unlinked invoices/bills — real transactions the Aged report counts,
  // but that have nowhere to land on the Ledger since no customer/
  // supplier record matches them. Always a real gap, at any date.
  const debtorsUnlinkedTotal = (state.invoices||[]).filter(i=> !state.customers.find(c=>c.id===i.customerId)).reduce((s,i)=> s+invoiceOutstandingAsAt(i, asAt).amount, 0);
  const creditorsUnlinkedTotal = (state.bills||[]).filter(b=>b.payFrom==='2000' && !state.vendors.find(v=>v.id===b.vendorId)).reduce((s,b)=> s+billOutstandingAsAt(b, asAt).amount, 0);

  // The headline Ageing Balance vs Ledger Balance comparison. Ledger
  // Balance here is computed the exact same date-aware way as the Aged
  // report itself — straight from each LINKED customer/supplier's own
  // invoices/bills as of the selected date — not from the Ledger page's
  // cached Invoiced/Paid fields, which have no date of their own and
  // can't be fairly compared against a past "As At" date. Because both
  // sides are built from the same underlying transactions, they land on
  // RWF 0 whenever everything is properly linked, for any date — and any
  // real difference is exactly the unlinked-transactions total below,
  // not a timing artifact.
  const debtorsLedgerBalance = debtorsAgedTotal - debtorsUnlinkedTotal;
  const creditorsLedgerBalance = creditorsAgedTotal - creditorsUnlinkedTotal;

  // Search and sort apply only to what's displayed — reconciliation above
  // always uses the full, unfiltered totals so a search never makes the
  // reconciliation check look wrong.
  const q = agedSearchQuery.trim().toLowerCase();
  const filterAndSort = (rows)=> sortAgedRows(q ? rows.filter(r=>r.name.toLowerCase().includes(q)) : rows, agedSortBy);
  const debtorsDisplay = filterAndSort(debtors);
  const creditorsDisplay = filterAndSort(creditors);

  const section = (title, rows, emptyLabel)=> { const isDebtor = title.includes('Debtor'); return `
    <div class="section-label">${title}</div>
    <div class="ledger-panel" style="margin-bottom:22px;">
      <table class="led">
        <thead><tr><th>${isDebtor?'Customer':'Supplier'}</th><th class="num-col">Current</th><th class="num-col">1–30 Days</th><th class="num-col">31–60 Days</th><th class="num-col">61–90 Days</th><th class="num-col">90+ Days</th><th class="num-col">Total</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr><td>${r.name==='(No customer/supplier on record)' ? `<a href="#" ${isDebtor?'data-aged-open-ar-unlinked="1"':'data-aged-open-ap-unlinked="1"'} title="See which ${isDebtor?'invoices aren\u2019t linked to a customer':'bills aren\u2019t linked to a supplier'}">${esc(r.name)}</a>` : `<a href="#" ${isDebtor?`data-aged-open-ar="${esc(r.name.toLowerCase())}"`:`data-aged-open-ap="${esc(r.name.toLowerCase())}"`} title="See this ${isDebtor?'customer':'supplier'}'s invoices/bills">${esc(r.name)}</a>`}${r.hasApprox?' <span title="Includes a balance paid before per-payment date tracking existed — this figure uses today\u2019s balance as the best available estimate for this past date." style="cursor:help;">≈</span>':''}</td>
            <td class="num-col num">${r.current?fmt(r.current):'–'}</td>
            <td class="num-col num">${r.d1_30?fmt(r.d1_30):'–'}</td>
            <td class="num-col num">${r.d31_60?fmt(r.d31_60):'–'}</td>
            <td class="num-col num">${r.d61_90?fmt(r.d61_90):'–'}</td>
            <td class="num-col num">${r.d90plus?fmt(r.d90plus):'–'}</td>
            <td class="num-col num" style="font-weight:700;">${fmt(r.total)}</td></tr>`).join('')}
          ${rows.length===0?`<tr><td colspan="7" style="text-align:center;color:var(--text-soft);padding:16px;">${emptyLabel}</td></tr>`:''}
          <tr class="total-row"><td>Total</td>
            <td class="num-col num">${fmt(sumCol(rows,'current'))}</td>
            <td class="num-col num">${fmt(sumCol(rows,'d1_30'))}</td>
            <td class="num-col num">${fmt(sumCol(rows,'d31_60'))}</td>
            <td class="num-col num">${fmt(sumCol(rows,'d61_90'))}</td>
            <td class="num-col num">${fmt(sumCol(rows,'d90plus'))}</td>
            <td class="num-col num">${fmt(sumCol(rows,'total'))}</td></tr>
        </tbody>
      </table>
    </div>
  `; };

  return `
    ${reportHeader(`Aged Debtors & Creditors (as of ${asAt})`, '')}

    <div class="field-row">
      <div class="field"><label>As At Date</label><input type="date" id="agedAsAtInput" value="${asAt}"></div>
      <button class="btn btn-ghost" id="agedApplyBtn">Apply</button>
      <button class="btn btn-ghost" id="printReportBtn">🖨 Print / Save as PDF</button>
      <button class="btn btn-ghost" id="exportExcelBtn" data-report-title="Aged Debtors and Creditors">📊 Export to Excel</button>
    </div>

    <div class="ledger-panel" style="margin-bottom:22px;">
      <div class="section-label" style="margin:0 0 10px;">Reconciliation</div>
      <table class="led" style="margin-bottom:14px;">
        <thead><tr><th>Report</th><th class="num-col">Ageing Balance</th><th class="num-col">Ledger Balance</th><th class="num-col">Difference</th><th>Status</th></tr></thead>
        <tbody>
          <tr>
            <td>Aged Debtors</td>
            <td class="num-col num">${fmt(debtorsAgedTotal)}</td>
            <td class="num-col num">${fmt(debtorsLedgerBalance)}</td>
            <td class="num-col num">${fmt(debtorsUnlinkedTotal)}</td>
            <td>${debtorsUnlinkedTotal<1 ? `<span class="badge ok">✓ Reconciled</span>` : `<a href="#" data-aged-open-ar="" title="Open Accounts Receivable to investigate"><span class="badge bad">⚠ Not Reconciled</span></a>`}</td>
          </tr>
          <tr>
            <td>Aged Creditors</td>
            <td class="num-col num">${fmt(creditorsAgedTotal)}</td>
            <td class="num-col num">${fmt(creditorsLedgerBalance)}</td>
            <td class="num-col num">${fmt(creditorsUnlinkedTotal)}</td>
            <td>${creditorsUnlinkedTotal<1 ? `<span class="badge ok">✓ Reconciled</span>` : `<a href="#" data-aged-open-ap="" title="Open Accounts Payable to investigate"><span class="badge bad">⚠ Not Reconciled</span></a>`}</td>
          </tr>
        </tbody>
      </table>
      <p class="no-print" style="font-size:12px;color:var(--text-soft);margin:0 0 10px;">Ledger Balance here is built the same date-aware way as the Aged report itself — straight from each linked customer/supplier's own invoices/bills as of the selected date, not from the Ledger page's cached figures, which have no date of their own to compare fairly against a past "As At" date. Any Difference above is exactly the value of invoices/bills with no customer/supplier linked to them — a real, fixable gap, valid for any date.</p>
      ${(debtorsHasIssue || creditorsHasIssue) ? `
      <div class="section-label" style="margin:14px 0 8px;font-size:13px;">Ledger Figures That Don't Match Their Own Invoices/Bills</div>
      <table class="led" style="margin-bottom:10px;">
        <thead><tr><th>Customer/Supplier</th><th class="num-col">Invoiced/Billed Off By</th><th class="num-col">Paid Off By</th></tr></thead>
        <tbody>
          ${debtorsConsistency.problems.map(p=>`<tr><td>${esc(p.name)}</td><td class="num-col num">${fmt(p.invoicedDiff)}</td><td class="num-col num">${fmt(p.paidDiff)}</td></tr>`).join('')}
          ${creditorsConsistency.problems.map(p=>`<tr><td>${esc(p.name)}</td><td class="num-col num">${fmt(p.invoicedDiff)}</td><td class="num-col num">${fmt(p.paidDiff)}</td></tr>`).join('')}
        </tbody>
      </table>
      <p style="font-size:12px;color:var(--text-soft);margin:0;">A non-zero figure here means that customer/supplier's Ledger page was edited by hand at some point, separately from their real invoices/bills — go there and correct it to match the real total. This is a separate issue from the Ageing/Ledger comparison above, which only checks linked vs. unlinked transactions.</p>

// Finds the exact date an invoice/bill actually reached zero balance, by
// walking its payment history in order and finding where the running
// total hits the full amount. Only possible for records with per-payment
// dates tracked — anything paid before that existed is honestly labeled
// as such rather than guessed at.
function collectionDateFor(record, totalField){
  if(!Array.isArray(record.payments) || record.payments.length===0) return null;
  const total = Number(record[totalField])||0;
  const sorted = [...record.payments].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let cum = 0;
  for(const p of sorted){
    cum += Number(p.amount)||0;
    if(cum >= total-0.01) return p.date;
  }
  return null;
}

function collectionTimingBucket(daysLate){
  if(daysLate===null) return null;
  if(daysLate<=0) return 'On Time';
  if(daysLate<=30) return '1–30 Days Late';
  if(daysLate<=60) return '31–60 Days Late';
  if(daysLate<=90) return '61–90 Days Late';
  return '90+ Days Late';
}

// Unlike the Aged report (which answers "what's still owed right now"),
// this answers "how long did it actually take to collect/pay this" —
// deliberately keeps showing paid records in whatever timing bucket they
// landed in, since that's the whole point here. This must never be
// confused with — or blended into — the Aged report's totals, since one
// is a current-exposure snapshot and the other is historical performance.
function computeCollectionHistory(records, entities, getEntityId, totalField){
  return records.map(rec=>{
    const entity = entities.find(e=>e.id===getEntityId(rec));
    const outstanding = totalField==='total' ? invoiceOutstanding(rec) : billOutstanding(rec);
    const isFullyPaid = outstanding<=0.01;
    let status, daysLate, paidDate;
    if(!isFullyPaid){
      status = 'outstanding';
      daysLate = rec.dueDate ? daysBetween(rec.dueDate, todayISO()) : null;
      paidDate = null;
    } else {
      paidDate = collectionDateFor(rec, totalField);
      if(paidDate){
        status = 'paid_known';
        daysLate = rec.dueDate ? daysBetween(rec.dueDate, paidDate) : null;
      } else {
        status = 'paid_unknown';
        daysLate = null;
      }
    }
    return {rec, entityName: entity ? entity.name : '(No customer/supplier on record)', status, daysLate, paidDate};
  }).sort((a,b)=> (b.rec.date||'').localeCompare(a.rec.date||''));
}

function renderCollectionHistory(){
  const receivables = computeCollectionHistory(state.invoices||[], state.customers||[], i=>i.customerId, 'total');
  const payables = computeCollectionHistory((state.bills||[]).filter(b=>b.payFrom==='2000'), state.vendors||[], b=>b.vendorId, 'netPay');

  const statusCell = (r)=>{
    if(r.status==='outstanding') return `<span class="badge ${r.daysLate>0?'bad':'pending'}">Still Outstanding${r.daysLate>0?` (${r.daysLate}d overdue)`:''}</span>`;
    if(r.status==='paid_known') return `<span class="badge ok">Paid ${r.paidDate}</span> <span class="badge ${r.daysLate<=0?'ok':'pending'}">${collectionTimingBucket(r.daysLate)}</span>`;
    return `<span class="badge ok">Paid</span> <span style="font-size:11px;color:var(--text-soft);" title="This was paid before per-payment date tracking existed, so the exact collection date isn't on record.">exact date unknown</span>`;
  };

  const table = (title, rows, nameLabel, refField, totalField, emptyLabel)=> `
    <div class="section-label">${title}</div>
    <div class="ledger-panel" style="margin-bottom:22px;">
      <table class="led">
        <thead><tr><th>${refField==='invoiceNo'?'Invoice #':'Description'}</th><th>${nameLabel}</th><th>Date</th><th>Due Date</th><th class="num-col">Total</th><th>Status</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr>
            <td>${r.rec.entryRef ? `<a href="#" data-open-gl-entry="${esc(r.rec.entryRef)}" title="See this transaction in the General Ledger">${esc(refField==='invoiceNo'?r.rec.invoiceNo:r.rec.description)}</a>` : esc(refField==='invoiceNo'?r.rec.invoiceNo:r.rec.description)}</td>
            <td>${esc(r.entityName)}</td>
            <td>${r.rec.date||''}</td><td>${r.rec.dueDate||''}</td>
            <td class="num-col num">${fmt(r.rec[totalField])}</td>
            <td>${statusCell(r)}</td>
          </tr>`).join('')}
          ${rows.length===0?`<tr><td colspan="6" style="text-align:center;color:var(--text-soft);padding:16px;">${emptyLabel}</td></tr>`:''}
        </tbody>
      </table>
    </div>
  `;

  return `
    ${reportHeader('Collection & Payment History', 'How long invoices actually took to collect, and bills actually took to pay — a history of timing, not a snapshot of what\u2019s currently owed. See the Aged Debtors & Creditors report for that.')}

    <div class="field-row">
      <button class="btn btn-ghost" id="printReportBtn">🖨 Print / Save as PDF</button>
      <button class="btn btn-ghost" id="exportExcelBtn" data-report-title="Collection and Payment History">📊 Export to Excel</button>
    </div>

    <div class="note no-print" style="margin-bottom:18px;">This report deliberately keeps showing paid invoices/bills in whatever timing bucket they landed in — that's the point, it's about how things went historically, not what's owed today. For current exposure, use the Aged Debtors & Creditors report instead; the two are never meant to show the same totals.</div>

    ${table('Receivables — Customer Collection Timing', receivables, 'Customer', 'invoiceNo', 'total', 'No invoices recorded yet.')}
    ${table('Payables — Supplier Payment Timing', payables, 'Supplier', 'description', 'netPay', 'No bills recorded yet.')}

    <div class="note no-print">"exact date unknown" means this was paid before per-payment date tracking existed — the timing bucket can't be shown honestly without a real date, so none is guessed. Anything paid from now on will show its real collection/payment timing.</div>
  `;
}

// The Balance Sheet's Accounts Payable figure reads the raw GL balance of
// account 2000 (every line ever posted there). The AP tab's own totals only
// look at tracked bills. The two normally agree, because every bill and its
// payment post matching, offsetting lines to 2000. When they don't agree,
// it's because something posted to 2000 outside the bills workflow — a
// manual journal entry, an import, or a mis-edited group. This groups every
// 2000 line by entry ref and flags the ones with no matching tracked bill,
// so the gap is visible and removable instead of just a mystery number.
function computeAPReconciliation(){
  const bills = (state.bills||[]).filter(b=>b.payFrom==='2000');
  const knownRefs = new Set();
  bills.forEach(b=>{
    if(b.entryRef){ knownRefs.add(b.entryRef); knownRefs.add(b.entryRef+'-PMT'); }
  });
  const apLines = state.gl.filter(l=>l.account==='2000');
  const glBalance = apLines.reduce((s,l)=> s+(Number(l.credit)||0)-(Number(l.debit)||0), 0);
  const groups = {};
  apLines.forEach(l=>{
    if(knownRefs.has(l.entry)) return;
    if(!groups[l.entry]) groups[l.entry] = {entry:l.entry, date:l.date, lines:[], net:0};
    groups[l.entry].lines.push(l);
    groups[l.entry].net += (Number(l.credit)||0)-(Number(l.debit)||0);
  });
  const unexplained = Object.values(groups).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const unexplainedTotal = unexplained.reduce((s,g)=>s+g.net,0);
  return {glBalance, unexplained, unexplainedTotal};
}

/* ============================================================
   CASH FLOW STATEMENT — direct method, categorized by the
   offsetting account(s) sharing the same Entry Ref.
   ============================================================ */
function computeCashFlow(from, to){
  const cashAccounts = ['1000','1010'];
  const investingAccounts = ['1500','1510'];
  const financingAccounts = ['2300','3000'];

  let operating=0, investing=0, financing=0;
  const cashLines = state.gl.filter(l=> cashAccounts.includes(l.account) && inRange(l.date, from, to));
  cashLines.forEach(l=>{
    const net = (Number(l.debit)||0) - (Number(l.credit)||0);
    const siblings = l.entry ? state.gl.filter(s=> s.entry===l.entry && s!==l && !cashAccounts.includes(s.account)) : [];
    let category = 'operating';
    if(siblings.some(s=>investingAccounts.includes(s.account))) category='investing';
    else if(siblings.some(s=>financingAccounts.includes(s.account))) category='financing';
    if(category==='investing') investing+=net;
    else if(category==='financing') financing+=net;
    else operating+=net;
  });

  let openingCash = 0;
  cashAccounts.forEach(code=>{
    state.gl.forEach(l=>{
      if(l.account===code && (!from || l.date<from)) openingCash += (Number(l.debit)||0)-(Number(l.credit)||0);
    });
  });
  const netChange = operating+investing+financing;
  const closingCash = openingCash + netChange;

  return {operating, investing, financing, netChange, openingCash, closingCash, from, to};
}

function t(key){
  const lang = (state && state.settings && state.settings.language) ? state.settings.language : 'en';
  const entry = TRANSLATIONS[key];
  if(!entry) return key;
  return entry[lang] || entry.en || key;
}

// Translate a Chart-of-Accounts Type/Normal Balance/Classification value
// wherever it's displayed — Trial Balance, Chart of Accounts, etc.
function tType(type){
  const map = {Asset:'type_asset', Liability:'type_liability', Equity:'type_equity', Income:'type_income', Expense:'type_expense'};
  return map[type] ? t(map[type]) : type;
}
function tNormal(normal){
  const map = {Debit:'balance_debit', Credit:'balance_credit'};
  return map[normal] ? t(map[normal]) : normal;
}
function tClassification(cls){
  const map = {'Current':'class_current', 'Non-Current':'class_noncurrent', 'Cost of Sales':'class_cos', 'Operating Expense':'class_opex', 'Other Expense':'class_otherexp'};
  return map[cls] ? t(map[cls]) : cls;
}

function tAccountName(codeOrAccount, maybeName){
  let code, name;
  if(typeof codeOrAccount==='object' && codeOrAccount!==null){ code = codeOrAccount.code; name = codeOrAccount.name; }
  else { code = codeOrAccount; name = maybeName; }
  const entry = ACCOUNT_NAME_TRANSLATIONS[code];
  if(!entry || name===undefined) return name;
  if(name !== entry.en) return name; // renamed by the user — show their custom name as-is
  const lang = (state && state.settings && state.settings.language) ? state.settings.language : 'en';
  return entry[lang] || entry.en;
}

  // click was doing (e.g. toggling the Add Client form).
  if(window._createMenuCloseListener){
    document.removeEventListener('click', window._createMenuCloseListener);
    window._createMenuCloseListener = null;
  }

/* ============================================================
   DASHBOARD INSIGHTS — short, automated notes explaining WHY a KPI
   looks the way it does, driven purely by the underlying numbers
   (no AI/guessing — plain threshold-based reasoning over real data).
   ============================================================ */
function cashInsight(cashBalance, totalAR, totalAP){
  if(cashBalance < 0){
    if(totalAR > Math.abs(cashBalance)*0.3 && totalAR>0) return 'Low — significant Accounts Receivable still outstanding';
    if(totalAP > 0) return 'Low — Accounts Payable obligations pending';
    return 'Low — expenses have exceeded cash inflows';
  }
  if(cashBalance===0) return '';
  if(totalAR > cashBalance && totalAR>0) return 'Positive, but a lot of value is tied up in receivables';
  return 'Healthy cash position';
}

function assetsInsight(bs){
  const buckets = [...bs.currentAssets, ...bs.nonCurrentAssets].filter(a=>a.amt>0);
  if(buckets.length===0 || bs.totalAssets<=0) return '';
  const top = buckets.reduce((a,b)=> a.amt>b.amt?a:b);
  const pct = Math.round((top.amt/bs.totalAssets)*100);
  if(pct>=50) return `Mostly ${top.name} (${pct}%)`;
  return '';
}

function liabilitiesInsight(bs){
  if(bs.totalLiab<=0) return '';
  if(bs.totalLiab > bs.totalAssets) return 'Liabilities exceed assets — review obligations';
  const buckets = [...bs.currentLiab, ...bs.nonCurrentLiab].filter(a=>a.amt>0);
  if(buckets.length===0) return '';
  const top = buckets.reduce((a,b)=> a.amt>b.amt?a:b);
  const pct = Math.round((top.amt/bs.totalLiab)*100);
  if(pct>=50) return `Mostly ${top.name} (${pct}%)`;
  return '';
}

function profitInsight(pl){
  if(pl.netBeforeTax < 0){
    if(pl.totalRevenue<=0) return 'Loss — no sales recorded yet this period';
    if(pl.hasCos && pl.cos > pl.totalRevenue*0.7) return 'Loss — cost of sales is high relative to revenue';
    return 'Loss — consider increasing sales or reducing expenses';
  }
  if(pl.netBeforeTax===0) return 'Breaking even this period';
  const margin = pl.totalRevenue>0 ? pl.netBeforeTax/pl.totalRevenue : 0;
  if(margin > 0.3) return 'Strong margin — consider restocking to meet demand';
  return 'Profitable this period';
}

let dashRevFrom = null; // date-range for the Monthly Revenue Streams table on the Dashboard
let dashRevTo = null;

// Revenue by stream (Accommodation, Restaurant & Bar), less Purchases,
// Payroll, and Accommodation (Tourism) Tax — a compact P&L slice specific
// to a hospitality business's core cost drivers, for any chosen date
// range. Reads straight from the ledger, same as every other report here.
function computeMonthlyRevenueStreams(from, to){
  // Shown gross — the actual amount guests paid, VAT and Tourism Tax
  // included. The ledger only stores the VAT-exclusive figure directly
  // (4050 / Restaurant revenue), since VAT itself posts to a separate
  // account — grossing up by the VAT rate here recovers the true
  // inclusive total. This is safe to do on the summed total rather than
  // per-invoice, since the VAT rate is a single constant multiplier
  // (summing then multiplying gives the identical result to multiplying
  // then summing). Tourism Tax needs no separate addition: RRA's formula
  // extracts it FROM WITHIN the exclusive accommodation figure rather
  // than adding it on top, so it's already embedded in this gross number.
  const vatFactor = 1 + (state.settings.vat||0.18);
  const accomRevenueExcl = sumAccount('4050', from, to, 'credit') - sumAccount('4050', from, to, 'debit');
  const accomRevenue = accomRevenueExcl * vatFactor;
  const restAcct = state.accounts.find(a=>a.name==='Restaurant & Room Service Revenue');
  const restRevenueExcl = restAcct ? (sumAccount(restAcct.code, from, to, 'credit') - sumAccount(restAcct.code, from, to, 'debit')) : 0;
  const restRevenue = restRevenueExcl * vatFactor;
  const totalRevenue = accomRevenue + restRevenue;

  const purchases = sumAccount('5000', from, to, 'debit') - sumAccount('5000', from, to, 'credit');
  // VAT tied specifically to the same purchase transactions (matched by
  // entry reference), not just any Input VAT posted in the period —
  // so this lines up exactly with what a supplier purchase report shows
  // as "VAT" against the same invoices, not a broader/looser total.
  const purchaseEntryRefs = new Set();
  state.gl.forEach(l=>{ if(l.account==='5000' && Number(l.debit)>0 && inRange(l.date, from, to)) purchaseEntryRefs.add(l.entry); });
  let purchasesVAT = 0;
  state.gl.forEach(l=>{ if(l.account==='1300' && Number(l.debit)>0 && purchaseEntryRefs.has(l.entry) && inRange(l.date, from, to)) purchasesVAT += Number(l.debit)||0; });
  const purchasesInclVAT = purchases + purchasesVAT;

  const payroll = (sumAccount('5100', from, to, 'debit') - sumAccount('5100', from, to, 'credit'))
                + (sumAccount('5110', from, to, 'debit') - sumAccount('5110', from, to, 'credit'));
  const accommodationTax = sumAccount('5960', from, to, 'debit') - sumAccount('5960', from, to, 'credit');
  // Same net VAT calculation the VAT Report page itself uses (Output VAT
  // minus Input VAT for this range) — the amount that must actually be
  // forwarded to RRA. Shown as its own line for the same reason Tourism
  // Tax is: full transparency on what gets collected vs what's actually
  // owed, even though the two gross figures above already embed it.
  const vatReport = computeVATReport(from, to);
  const vatDue = vatReport.net;
  const reimbAcct = state.accounts.find(a=>a.name==='Transport & Meal Reimbursement Expense');
  const reimbursements = reimbAcct ? (sumAccount(reimbAcct.code, from, to, 'debit') - sumAccount(reimbAcct.code, from, to, 'credit')) : 0;
  const consultAcct = state.accounts.find(a=>a.name==='Tax & Accounting Consultancy Fee Expense');
  const consultancyFee = consultAcct ? (sumAccount(consultAcct.code, from, to, 'debit') - sumAccount(consultAcct.code, from, to, 'credit')) : 0;
  // Purchases here is shown VAT-inclusive (what actually gets paid out) —
  // a deliberate, simpler "cash cost" view for this internal dashboard
  // table, not the formal accrual P&L (that page still correctly excludes
  // recoverable VAT from expenses, untouched by this). vatDue can be
  // negative (a refundable position) — that correctly reduces total
  // expenses rather than adding to them.
  const totalExpenses = purchasesInclVAT + payroll + accommodationTax + vatDue + reimbursements + consultancyFee;

  const netProfit = totalRevenue - totalExpenses;
  return {accomRevenue, restRevenue, totalRevenue, purchases, purchasesVAT, purchasesInclVAT, payroll, accommodationTax, vatDue, reimbursements, consultancyFee, totalExpenses, netProfit};
}

function exportRevenueStreamsToExcel(from, to){
  if(!requireActiveSubscription('download this report')) return;
  if(typeof XLSX === 'undefined'){ alert('Export library did not load — check your internet connection and reload the page.'); return; }
  const c = state.settings.company;
  const rs = computeMonthlyRevenueStreams(from, to);
  const aoa = [
    [c.name||'Company Name'],
    [`TIN: ${c.tin||'—'}${c.address ? '   •   '+c.address : ''}`],
    [`Monthly Revenue Streams — ${from} to ${to}`],
    [],
    ['Revenue (Gross — Incl. VAT & Tourism Tax)'],
    ['Accommodation Revenue', rs.accomRevenue],
    ['Restaurant & Bar Revenue', rs.restRevenue],
    ['Total Revenue', rs.totalRevenue],
    [],
    ['Less: Expenses'],
    ['Purchases (Incl. VAT)', rs.purchasesInclVAT],
    ['Payroll (Gross Salary + Employer Contribution)', rs.payroll],
    ['Reimbursement Expenses (Meal + Transport)', rs.reimbursements],
    ['Tax & Accounting Consultancy Fee', rs.consultancyFee],
    ['Accommodation Tax (Tourism Tax, 3%)', rs.accommodationTax],
    [rs.vatDue>=0?'VAT Due':'VAT Refundable', rs.vatDue>=0?rs.vatDue:Math.abs(rs.vatDue)],
    ['Total Expenses', rs.totalExpenses],
    [],
    [rs.netProfit<0?'NET LOSS':'NET PROFIT', Math.abs(rs.netProfit)],
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:44},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, excelSafeSheetName('Revenue Streams'));
  const companyName = (c.name||'Company').replace(/[^a-z0-9]+/gi,'-');
  XLSX.writeFile(wb, `${companyName}-Revenue-Streams-${from}_to_${to}.xlsx`);
}

function handleCreateAction(type){
  createMenuOpen = false;

  if(type==='journal' || type==='invoice' || type==='expense'){ quickAction(type==='invoice'?'invoice':(type==='expense'?'expense':'journal')); return; }
  if(type==='addclient'){
    renderAll();
    const btn = document.getElementById('addClientBtn');
    if(btn) btn.click();
    return;
  }
  // Everything else: navigate straight to the tab whose own page has
  // that create form already built in (Add Customer, Record Payment,
  // Point of Sale, etc.)
  const navMap = {ar:'ar', ap:'ap', customers:'customers', vendors:'vendors', pos:'inventory', pop:'inventory',
    profees:'profees', payroll:'payroll', bankrec:'bankrec', fixedassets:'fixedassets', inventory:'inventory',
    recurring:'recurring', coa:'coa'};
  if(navMap[type]){ activeTab = navMap[type]; renderAll(); }
}

function quickAction(type){
  glEditId = null;
  glGroupEditRef = null;
  if(type==='journal'){
    glEntryDraft = defaultGLEntryDraft();
    activeTab = 'gl';
    renderAll();
    setTimeout(()=>{ const el = document.querySelector('[data-jeline="0|memo"]'); if(el){ el.focus(); } }, 0);
    return;
  }
  if(type==='invoice'){ openInvoiceModal(); return; }
  if(type==='bill' || type==='expense'){ openExpenseModal(); return; }
  const navMap = {coa:'coa', pl:'pl', bs:'bs', bankrec:'bankrec'};
  if(navMap[type]){ activeTab = navMap[type]; renderAll(); }
}

/* ============================================================
   SALES INVOICE MODAL — line items, auto VAT, posts to GL and
   updates the customer's balance in one action.
   ============================================================ */
let invoiceModalOpen = false;
let invoiceDraft = null;

function newInvoiceLine(){
  const firstRevenue = (state.accounts.find(a=>a.type==='Income')||{}).code || '';
  return {description:'', qty:1, unitPrice:0, account:firstRevenue};
}

function openInvoiceModal(){
  invoiceDraft = {
    invoiceNo: 'INV-' + String((state.invoices||[]).length + 1).padStart(4,'0'),
    customerId: (state.customers[0]||{}).id || '',
    date: todayISO(),
    dueDate: todayISO(),
    vatPct: state.settings.vat*100,
    lines: [newInvoiceLine()]
  };
  invoiceModalOpen = true;
  renderModals();
}
function closeInvoiceModal(){ invoiceModalOpen = false; renderModals(); }

function invoiceTotals(){
  const subtotal = invoiceDraft.lines.reduce((s,l)=> s + (Number(l.qty)||0)*(Number(l.unitPrice)||0), 0);
  const vat = subtotal * (Number(invoiceDraft.vatPct)||0)/100;
  return {subtotal, vat, total: subtotal+vat};
}

function renderInvoiceModal(){
  if(!invoiceModalOpen || !invoiceDraft) return '';
  const t = invoiceTotals();
  const revenueAccounts = state.accounts.filter(a=>a.type==='Income');
  return `
    <div class="modal-overlay" id="invoiceModalOverlay">
      <div class="modal-box">
        <h2>New Sales Invoice</h2>
        <div class="field-row">
          <div class="field"><label>Invoice #</label><input type="text" id="invNo" value="${esc(invoiceDraft.invoiceNo)}"></div>
          <div class="field" style="min-width:200px;"><label>Customer</label>
            <select id="invCustomer">
              <option value="">— Select customer —</option>
              ${state.customers.map(c=>`<option value="${c.id}" ${invoiceDraft.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Date</label><input type="date" id="invDate" value="${invoiceDraft.date}"></div>
          <div class="field"><label>Due Date</label><input type="date" id="invDue" value="${invoiceDraft.dueDate}"></div>
          <div class="field"><label>VAT %</label><input type="number" step="0.1" class="num-in" id="invVat" value="${invoiceDraft.vatPct}"></div>
        </div>
        <table class="modal-line-table">
          <thead><tr><th>Description</th><th style="width:60px;">Qty</th><th style="width:110px;">Unit Price</th><th style="width:190px;">Revenue Account</th><th style="width:100px;text-align:right;">Amount</th><th></th></tr></thead>
          <tbody id="invLinesBody">
            ${invoiceDraft.lines.map((l,i)=>`
              <tr>
                <td><input type="text" data-invfield="${i}|description" value="${esc(l.description)}" placeholder="Item / service"></td>
                <td><input type="number" class="num-in" data-invfield="${i}|qty" value="${l.qty}"></td>
                <td><input type="number" class="num-in" data-invfield="${i}|unitPrice" value="${l.unitPrice}"></td>
                <td><select data-invfield="${i}|account">${revenueAccounts.map(a=>`<option value="${a.code}" ${l.account===a.code?'selected':''}>${a.code} - ${esc(tAccountName(a.code, a.name))}</option>`).join('')}</select></td>
                <td style="text-align:right;" class="num" id="invLineAmt-${i}">${fmt((Number(l.qty)||0)*(Number(l.unitPrice)||0))}</td>
                <td>${invoiceDraft.lines.length>1?`<button class="icon-x" data-invrmline="${i}">✕</button>`:''}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <button class="btn btn-ghost btn-sm" id="invAddLineBtn">+ Add Line</button>
        <div class="modal-totals">
          <div>Subtotal: <span class="num" id="invSubtotal">${fmt(t.subtotal)}</span></div>
          <div>VAT: <span class="num" id="invVatAmt">${fmt(t.vat)}</span></div>
          <div class="grand">Total: <span class="num" id="invGrandTotal">${fmt(t.total)}</span></div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="invCancelBtn">Cancel</button>

function recalcInvoiceLineDOM(i){
  const l = invoiceDraft.lines[i];
  const amt = (Number(l.qty)||0)*(Number(l.unitPrice)||0);
  const cell = document.getElementById('invLineAmt-'+i);
  if(cell) cell.textContent = fmt(amt);
  const t = invoiceTotals();
  const sub = document.getElementById('invSubtotal'); if(sub) sub.textContent = fmt(t.subtotal);
  const vatEl = document.getElementById('invVatAmt'); if(vatEl) vatEl.textContent = fmt(t.vat);
  const grand = document.getElementById('invGrandTotal'); if(grand) grand.textContent = fmt(t.total);
}

function wireInvoiceModal(){
  if(!invoiceModalOpen) return;
  document.getElementById('invNo').onchange = (e)=>{ invoiceDraft.invoiceNo = e.target.value; };
  document.getElementById('invCustomer').onchange = (e)=>{ invoiceDraft.customerId = e.target.value; };
  document.getElementById('invDate').onchange = (e)=>{ invoiceDraft.date = e.target.value; };
  document.getElementById('invDue').onchange = (e)=>{ invoiceDraft.dueDate = e.target.value; };
  document.getElementById('invVat').oninput = (e)=>{ invoiceDraft.vatPct = parseFloat(e.target.value)||0; recalcInvoiceLineDOM(0); };

  document.querySelectorAll('[data-invfield]').forEach(el=>{
    const [i, field] = el.getAttribute('data-invfield').split('|');
    const idx = parseInt(i,10);
    const handler = ()=>{
      if(field==='qty' || field==='unitPrice'){ invoiceDraft.lines[idx][field] = parseFloat(el.value)||0; recalcInvoiceLineDOM(idx); }
      else { invoiceDraft.lines[idx][field] = el.value; }
    };
    el.oninput = handler;
    el.onchange = handler;
  });
  document.querySelectorAll('[data-invrmline]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.getAttribute('data-invrmline'),10);
      invoiceDraft.lines.splice(idx,1);
      renderModals();
    };
  });
  const addLineBtn = document.getElementById('invAddLineBtn');
  if(addLineBtn) addLineBtn.onclick = ()=>{ invoiceDraft.lines.push(newInvoiceLine()); renderModals(); };
  const cancelBtn = document.getElementById('invCancelBtn');
  if(cancelBtn) cancelBtn.onclick = closeInvoiceModal;
  const saveBtn = document.getElementById('invSaveBtn');
  if(saveBtn) saveBtn.onclick = saveInvoice;
  const overlay = document.getElementById('invoiceModalOverlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target===overlay) closeInvoiceModal(); };
}

function saveInvoice(){
  if(!requireActiveSubscription('add a new invoice')) return;
  if(!invoiceDraft.customerId){ alert('Select a customer.'); return; }
  const validLines = invoiceDraft.lines.filter(l=> (Number(l.qty)||0)>0 && (Number(l.unitPrice)||0)>0 && l.account);
  if(validLines.length===0){ alert('Add at least one line with a quantity, unit price, and revenue account.'); return; }
  const t = invoiceTotals();
  const entryRef = invoiceDraft.invoiceNo;

  validLines.forEach(l=>{
    const amt = (Number(l.qty)||0)*(Number(l.unitPrice)||0);
    state.gl.push({id:uid(), date:invoiceDraft.date, entry:entryRef, account:l.account, memo:`${entryRef}: ${l.description||'Sale'}`, debit:0, credit:amt});
  });
  if(t.vat > 0){
    state.gl.push({id:uid(), date:invoiceDraft.date, entry:entryRef, account:'2100', memo:`${entryRef}: VAT on sale`, debit:0, credit:t.vat});
  }
  state.gl.push({id:uid(), date:invoiceDraft.date, entry:entryRef, account:'1100', memo:`${entryRef}: Accounts Receivable`, debit:t.total, credit:0});

  const customer = state.customers.find(c=>c.id===invoiceDraft.customerId);
  if(customer) customer.invoiced = (Number(customer.invoiced)||0) + t.total;

  state.invoices = state.invoices || [];
  const invRecord = {id:uid(), invoiceNo: invoiceDraft.invoiceNo, customerId: invoiceDraft.customerId,
    date: invoiceDraft.date, dueDate: invoiceDraft.dueDate, lines: validLines, subtotal:t.subtotal, vat:t.vat, total:t.total, paid:0, entryRef};
  state.invoices.push(invRecord);

  let mirroredTo = null;
  if(customer && customer.linkedClientId){
    mirroredTo = mirrorInvoiceAsExpense(invRecord, t.total, customer);
  }

  saveState(); // persists appData as a whole, including any mirrored client's data
  invoiceModalOpen = false;
  renderAll();
  if(mirroredTo) alert(`Invoice saved. Also recorded as an expense in ${mirroredTo}'s own books.`);
}
