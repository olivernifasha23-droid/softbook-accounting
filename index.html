<style>
  :root{
    --ink-navy: #16233D;
    --ink-navy-2: #1F3654;
    --parchment: #F7F4EC;
    --parchment-2: #EFEADC;
    --ledger-green: #2F6B4F;
    --ledger-green-dk: #234F3A;
    --amber: #C08A28;
    --rule: #D8D2C4;
    --rule-dk: #B9B0A0;
    --ink-red: #A23B2E;
    --text: #241F16;
    --text-soft: #6B6455;
    --white: #FFFFFF;
    --shadow: 0 1px 2px rgba(22,35,61,0.06), 0 4px 14px rgba(22,35,61,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--parchment);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--amber); color: var(--white); }

  .num{ font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ===== Ledger margin signature: a stitched red rule down the left of every panel ===== */
  .ledger-panel{
    position: relative;
    background: var(--white);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: var(--shadow);
    padding: 28px 28px 28px 52px;
  }
  .ledger-panel::before{
    content: "";
    position: absolute;
    left: 34px; top: 18px; bottom: 18px;
    width: 1px;
    background: repeating-linear-gradient(to bottom, var(--ink-red) 0 4px, transparent 4px 9px);
    opacity: 0.55;
  }

  /* ===== Top chrome ===== */
  header.topbar{
    background: var(--ink-navy);
    color: var(--parchment);
    padding: 18px 32px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom: 3px solid var(--amber);
  }
  header.topbar .brand{
    display:flex; align-items:baseline; gap:12px;
  }
  header.topbar .brand .mark{
    font-family:'Fraunces', serif; font-weight:600; font-size:23px; letter-spacing:0.2px;
  }
  header.topbar .brand .tag{
    font-size:11px; color: rgba(247,244,236,0.6); text-transform:uppercase; letter-spacing:1.5px;
  }
  header.topbar .asof{
    font-size:12px; color: rgba(247,244,236,0.75); display:flex; gap:14px; align-items:center;
  }
  header.topbar .asof input{
    background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); color:var(--parchment);
    border-radius:3px; padding:5px 8px; font-family:'IBM Plex Mono',monospace; font-size:12px;
  }
  .sync-badge{
    display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
    padding:5px 10px; border-radius:12px; background: rgba(255,255,255,0.08);
  }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:#8a8a8a; }
  .sync-badge.synced .sync-dot{ background:#4CA96A; box-shadow:0 0 6px rgba(76,169,106,0.7); }
  .sync-badge.syncing .sync-dot{ background: var(--amber); animation: pulse 1s infinite; }
  .sync-badge.error .sync-dot{ background: #E0574A; }
  .sync-badge.offline .sync-dot{ background:#8a8a8a; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .clientbar{
    background: var(--ink-navy-2);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    padding: 12px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .clientbar-select{ display:flex; align-items:center; gap:10px; }
  .clientbar .cb-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color: rgba(247,244,236,0.55); font-weight:700;
  }
  .clientbar select{
    background: var(--ink-navy); color:var(--parchment); border:1px solid rgba(255,255,255,0.2);
    border-radius:3px; padding:8px 12px; font-family:'Inter'; font-size:13.5px; font-weight:600; min-width:220px;
  }
  .clientbar-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  button.dashed-btn{
    background:transparent; border:1.5px dashed rgba(192,138,40,0.6); color: var(--amber);
    font-family:'Inter'; font-size:12px; font-weight:600; padding:8px 14px; border-radius:3px; cursor:pointer;
    transition: background .15s, border-color .15s;
  }
  button.dashed-btn:hover{ background: rgba(192,138,40,0.1); border-color: var(--amber); }
  button.dashed-btn.danger{ border-color: rgba(162,59,46,0.55); color:#E08A7C; }
  button.dashed-btn.danger:hover{ background: rgba(162,59,46,0.12); border-color:#E08A7C; }
  .addclient-form{
    background: var(--parchment-2); border-bottom: 1px solid var(--rule);
    padding: 14px 24px; display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap;
  }

  nav.tabs{
    background: var(--ink-navy-2);
    display:flex; overflow-x:auto;
    padding: 0 24px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  nav.tabs button{
    background:none; border:none; color: rgba(247,244,236,0.68);
    font-family:'Inter'; font-size:13.5px; font-weight:500;
    padding:13px 16px; cursor:pointer; white-space:nowrap;
    border-bottom: 3px solid transparent;
    transition: color .15s, border-color .15s;
  }
  nav.tabs button:hover{ color: var(--parchment); }
  nav.tabs button.active{
    color: var(--white);
    border-bottom-color: var(--amber);
  }

  main{ max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }
  .view{ display:none; }
  .view.active{ display:block; animation: fadein .18s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(2px);} to{opacity:1; transform:none;} }

  h1.page-title{
    font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin:0 0 4px;
    color: var(--ink-navy);
  }
  p.page-sub{ margin:0 0 22px; color: var(--text-soft); font-size:13.5px; }

  .section-label{
    font-family:'Fraunces', serif; font-weight:600; font-size:15px; color: var(--ledger-green-dk);
    margin: 26px 0 10px; padding-bottom:6px; border-bottom: 1px solid var(--rule);
    display:flex; align-items:center; gap:8px;
  }
  .section-label:first-child{ margin-top:0; }

  /* ===== Tables ===== */
  table.led{ width:100%; border-collapse:collapse; font-size:13px; }
  table.led thead th{
    text-align:left; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.6px;
    color: var(--white); background: var(--ledger-green-dk);
    padding:9px 10px; position: sticky; top:0;
  }
  table.led thead th.num-col, table.led td.num-col{ text-align:right; }
  table.led tbody td{ padding:8px 10px; border-bottom:1px solid var(--rule); vertical-align:middle; }
  table.led tbody tr:hover{ background: rgba(47,107,79,0.05); }
  table.led tbody tr.total-row td{ font-weight:700; border-top:2px solid var(--ink-navy); background: var(--parchment-2); }
  table.led input, table.led select{
    width:100%; border:1px solid var(--rule); border-radius:3px; padding:6px 7px;
    font-family:'Inter'; font-size:12.5px; background:var(--white); color:var(--text);
  }
  table.led input.num-in{ font-family:'IBM Plex Mono',monospace; text-align:right; }
  .neg{ color: var(--ink-red); }

  /* ===== Buttons ===== */
  button.btn{
    font-family:'Inter'; font-weight:600; font-size:12.5px; letter-spacing:0.2px;
    padding:9px 16px; border-radius:3px; border:1px solid transparent; cursor:pointer;
    transition: filter .15s, transform .05s;
  }
  button.btn:active{ transform: translateY(1px); }
  button.btn-primary{ background: var(--ledger-green); color:var(--white); }
  button.btn-primary:hover{ filter:brightness(1.08); }
  button.btn-ghost{ background:transparent; color:var(--ink-navy); border-color: var(--rule-dk); }
  button.btn-ghost:hover{ background: var(--parchment-2); }
  button.btn-danger{ background:transparent; color:var(--ink-red); border-color: rgba(162,59,46,0.35); }
  button.btn-danger:hover{ background: rgba(162,59,46,0.06); }
  button.btn-sm{ padding:5px 9px; font-size:11.5px; }
  button.icon-x{
    background:none;border:none;color:var(--text-soft); cursor:pointer; font-size:15px; line-height:1;
    padding:2px 6px; border-radius:3px;
  }
  button.icon-x:hover{ color:var(--ink-red); background:rgba(162,59,46,0.08); }

  /* ===== Dashboard tiles ===== */
  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
  .tile{
    background: var(--ink-navy); color: var(--parchment); border-radius:4px; padding:16px 18px;
    border-bottom:3px solid var(--amber);
  }
  .tile .t-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.8px; opacity:0.7; margin-bottom:8px; }
  .tile .t-val{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; }
  .tile.warn{ border-bottom-color: var(--ink-red); }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width: 860px){ .grid-2{grid-template-columns:1fr;} .tiles{grid-template-columns:repeat(2,1fr);} }

  .field-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:5px; min-width:160px; }
  .field label{ font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-soft); font-weight:600; }
  .field input, .field select{
    border:1px solid var(--rule-dk); border-radius:3px; padding:8px 10px; font-family:'Inter'; font-size:13px;
  }
  .field input.num-in{ font-family:'IBM Plex Mono',monospace; }

  .note{
    font-size:12px; color: var(--text-soft); font-style:italic; background: var(--parchment-2);
    border-left:3px solid var(--amber); padding:9px 12px; border-radius:2px; margin-top:10px;
  }
  .badge{
    display:inline-block; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:10px;
    text-transform:uppercase; letter-spacing:0.4px;
  }
  .badge.ok{ background: rgba(47,107,79,0.15); color: var(--ledger-green-dk); }
  .badge.bad{ background: rgba(162,59,46,0.14); color: var(--ink-red); }
  .badge.pending{ background: rgba(192,138,40,0.16); color:#8a611c; }

  .subnav{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .subnav button{
    background: var(--white); border:1px solid var(--rule-dk); color:var(--text);
    padding:7px 14px; font-size:12.5px; font-weight:600; border-radius:16px; cursor:pointer;
  }
  .subnav button.active{ background: var(--ledger-green); color:var(--white); border-color:var(--ledger-green); }

  .report-hero{
    display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap;
    background: var(--parchment-2); border:1px solid var(--rule); border-radius:4px; padding:18px 22px; margin-bottom:20px;
  }
  .report-hero .hero-num{ font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:600; color:var(--ink-navy); }
  .report-hero .hero-label{ font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-soft); }

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--rule-dk); border-radius:4px; }

  footer.app-footer{

// ---- Bank-import "post once, never come back" guard -------------------
// A posted statement line is recorded in the ledger with the reference
// BANKIMP-<first 8 chars of its staging id>. That ledger entry is the one
// source of truth: any staging row whose id (or date + description +
// amount) already exists as a posted BANKIMP entry is removed from the
// review list, every time data is loaded, pulled from the cloud, a
// statement is uploaded, or the Bank Import page is opened.
function bankTxKey(date, desc, amt){
  return [String(date||''), String(desc||'').trim().toLowerCase().replace(/\s+/g,' '), Math.round(Math.abs(Number(amt)||0)*100)].join('|');
}
function postedBankIndex(st){
  const ids = new Set(), counts = {}, seen = new Set();
  (st.gl||[]).forEach(l=>{
    if(!l || !l.entry || String(l.entry).indexOf('BANKIMP-')!==0) return;
    ids.add(l.entry);
    if(seen.has(l.entry)) return;
    seen.add(l.entry);
    const amt = l.originalDebit || l.originalCredit || l.debit || l.credit || 0;
    const k = bankTxKey(l.date, l.memo, amt);
    counts[k] = (counts[k]||0) + 1;
  });
  return {ids, counts};
}
function purgePostedBankStaging(st){
  if(!st || !Array.isArray(st.bankStaging) || st.bankStaging.length===0) return 0;
  const idx = postedBankIndex(st);
  const before = st.bankStaging.length;
  st.bankStaging = st.bankStaging.filter(r=>{
    if(idx.ids.has('BANKIMP-' + String(r.id||'').slice(0,8))) return false;
    const k = bankTxKey(r.date, r.description, r.amount);
    if(idx.counts[k] > 0){ idx.counts[k]--; return false; }
    return true;
  });
  return before - st.bankStaging.length;
}

// Keeps a given month's Payment/Transfer Summary "Transfer Charge" figures
// in sync with the ledger as a Bank Charges expense/payable — completely
// independent of whether that month's payroll has already been run. In
// practice the bank doesn't charge its transfer fee until the payment
// actually goes out, so the normal order of events is: run payroll first,
// then fill in the Transfer Charge afterward. This function is safe to
// call as often as needed (it removes its own prior lines and re-posts
// fresh ones each time under a dedicated 'PAYROLL-TRANSFER-<month>' entry
// reference, separate from the main payroll entry), so it never duplicates
// and never drifts out of sync — and it runs against a plain client object
// rather than only the live `state`, so it can also self-heal any client's
// saved data the moment it's loaded (see its call inside loadState below),
// which is what recovers already-entered transfer charges that were typed
// in after a month's payroll was run under an older version of this app
// that didn't yet know how to post them. Pass `onlyMonth` to sync just one
// month (used right after the user edits it); omit it to sweep every month
// on record (used at load time).
function syncPayrollTransferChargesInClient(client, onlyMonth){
  if(!client || !Array.isArray(client.gl) || !Array.isArray(client.accounts)) return;
  const transfers = client.payrollTransfers || {};
  const months = onlyMonth ? [onlyMonth] : Object.keys(transfers);
  months.forEach(month=>{
    const parts = /^(\d{4})-(\d{2})$/.exec(month);
    if(!parts) return;
    const tr = transfers[month] || {};
    const transferCharge = (parseFloat(tr.netCharge)||0) + (parseFloat(tr.payeCharge)||0) + (parseFloat(tr.pensionCharge)||0) + (parseFloat(tr.maternityCharge)||0) + (parseFloat(tr.cbhiCharge)||0);
    const entryRef = 'PAYROLL-TRANSFER-'+month;
    const existingLines = client.gl.filter(l=>l.entry===entryRef);
    const existingTotal = existingLines.reduce((s,l)=>s+(l.debit||0),0);
    // Already posted and matches what's currently entered — nothing to do,
    // so re-normalizing on every load doesn't touch the GL when nothing changed.
    if(Math.abs(existingTotal - transferCharge) < 0.5 && (existingLines.length>0) === (transferCharge>0.5)) return;
    // Otherwise clear out whatever was posted before and re-post fresh, so
    // editing a transfer charge (or clearing it back to zero) is always
    // reflected exactly, with no leftover or duplicate lines.
    client.gl = client.gl.filter(l=>l.entry!==entryRef);
    if(transferCharge>0.5){
      const y = Number(parts[1]), mo = Number(parts[2]);
      const date = ymd(new Date(y, mo, 0)); // same month-end date runMonthlyPayroll dates its own entry to
      const bankChargeExpAcct = client.accounts.find(a=>a.code==='5950') || findOrCreateAccountInList(client.accounts, 'Bank Charges');
      const bankChargePayAcct = findOrCreateAccountInList(client.accounts, 'Bank Charges Payable');
      client.gl.push({id:uid(), date, entry:entryRef, account:bankChargeExpAcct.code, memo:`Payroll ${month} — Bank Transfer Charges`, debit:transferCharge, credit:0});
      client.gl.push({id:uid(), date, entry:entryRef, account:bankChargePayAcct.code, memo:`Payroll ${month} — Bank Transfer Charges Payable`, debit:0, credit:transferCharge});
    }
  });
}

function loadState(){
  // normalizes any client-shaped object to survive schema additions between versions
  return function(parsed){
    const def = defaultState();
    parsed = parsed || {};
    const mergedRssb = Object.assign({}, def.settings.rssb, (parsed.settings&&parsed.settings.rssb)||{});
    // Existing saved data won't have rssbHistory yet — seed it from whatever
    // flat rssb rates were already saved, treated as having applied since
    // the beginning of time. This is the safest backward-compatible
    // assumption when we don't know when that rate actually took effect.
    let rssbHistory = (parsed.settings && Array.isArray(parsed.settings.rssbHistory) && parsed.settings.rssbHistory.length)
      ? parsed.settings.rssbHistory
      : [Object.assign({effectiveFrom:'2000-01-01'}, mergedRssb)];
    rssbHistory = [...rssbHistory].sort((a,b)=> (a.effectiveFrom||'').localeCompare(b.effectiveFrom||''));
    const latestRssb = rssbHistory[rssbHistory.length-1];
    // Existing saved data has its own accounts array (possibly renamed/
    // reordered/deleted by the user), so we can't just overwrite it with
    // defaultAccounts(). Instead, keep whatever's already saved and only
    // append any NEW default accounts (by code) that don't exist yet —
    // e.g. when a newer app version introduces an account like VAT
    // Payable to RRA (2105) that older saved data won't have.
    const existingAccounts = Array.isArray(parsed.accounts) ? parsed.accounts : def.accounts;
    // Rename 5990 forward if it's still carrying the old default label —
    // if the user has since renamed it themselves, leave their name alone.
    existingAccounts.forEach(a=>{
      if(a.code==='5990' && a.name==='VAT Written Off') a.name = 'Non-Recoverable VAT Expense';
      if(a.code==='2105' && a.name==='VAT Payable to RRA') a.name = 'VAT Payable';
    });
    const existingCodes = new Set(existingAccounts.map(a=>a.code));
    // Alphabetical by name, not by code — this is the order every account
    // dropdown throughout the app inherits by default (recording an
    // expense/sale/bill, Chart of Accounts, merging accounts), since none
    // of them impose their own sort. Financial statements (P&L, Balance
    // Sheet) and the General Ledger's "By Account" view are unaffected —
    // they each explicitly re-sort by code themselves regardless of this
    // array's order, since that's the correct convention for those.
    const mergedAccounts = existingAccounts.concat(def.accounts.filter(a=>!existingCodes.has(a.code)))
      .sort((a,b)=> a.name.localeCompare(b.name));
    // showRevenueStreams is new — for any client that's already recording
    // accommodation revenue (account 4050), default it ON so their
    // existing Dashboard table doesn't silently disappear; anyone without
    // that history (a non-hospitality client) defaults OFF, same as new
    // clients going forward. Either way it's a manual toggle in Settings
    // from here on, this is only a one-time migration default.
    const hasAccommodationHistory = Array.isArray(parsed.gl) && parsed.gl.some(l=>l.account==='4050');
    const showRevenueStreams = (parsed.settings && typeof parsed.settings.showRevenueStreams==='boolean')
      ? parsed.settings.showRevenueStreams
      : hasAccommodationHistory;
    // Same reasoning as accounts above — alphabetical by name at the one
    // place every client's data gets normalized, so every dropdown,
    // ledger page, and list that just iterates these arrays (Customer/
    // Supplier Ledger, Accounts Receivable/Payable, invoice and bill
    // forms, the merge tool) inherits alphabetical order automatically,
    // regardless of which order they were actually created in.
    const sortedCustomers = Array.isArray(parsed.customers) ? [...parsed.customers].sort((a,b)=> (a.name||'').localeCompare(b.name||'')) : (def.customers||[]);
    const sortedVendors = Array.isArray(parsed.vendors) ? [...parsed.vendors].sort((a,b)=> (a.name||'').localeCompare(b.name||'')) : (def.vendors||[]);
    const normalizedClient = Object.assign({}, def, parsed, {
      accounts: mergedAccounts,
      customers: sortedCustomers,
      vendors: sortedVendors,
      settings: Object.assign({}, def.settings, parsed.settings, {
        rssb: Object.assign({}, mergedRssb, latestRssb ? {pensionEmp:latestRssb.pensionEmp, pensionEr:latestRssb.pensionEr, maternityEmp:latestRssb.maternityEmp, maternityEr:latestRssb.maternityEr, occHazardEr:latestRssb.occHazardEr, cbhiEmp:latestRssb.cbhiEmp} : {}),
        rssbHistory,
        showRevenueStreams,
        company: Object.assign({}, def.settings.company, (parsed.settings&&parsed.settings.company)||{})
      })
    });
    purgePostedBankStaging(normalizedClient);
    // Self-heal: post (or re-sync) Bank Charges for every month that has a
    // Transfer Charge on record, no matter when it was entered relative to
    // that month's payroll run. This is what catches a month whose payroll
    // was already run and saved before this feature existed, and whose
    // transfer charges were only filled in afterward — the very next time
    // this client's data loads, those charges land on the books on their
    // own, with no need to re-run (and risk duplicating) that payroll.
    syncPayrollTransferChargesInClient(normalizedClient);
    return normalizedClient;
  };
}
const normalizeClient = loadState();

// Finds whichever RSSB rate version was actually in effect on a given date
// — the most recent version with an effective date on or before it. This
// is what makes past payroll runs automatically keep using the OLD rate
// even after you've since updated it in Settings for future months.
function getRssbRatesFor(dateStr){
  dateStr = dateStr || todayISO();
  const history = (state.settings.rssbHistory && state.settings.rssbHistory.length)
    ? state.settings.rssbHistory
    : [Object.assign({effectiveFrom:'2000-01-01'}, state.settings.rssb)];
  const sorted = [...history].sort((a,b)=> (a.effectiveFrom||'').localeCompare(b.effectiveFrom||''));
  let applicable = sorted[0];
  for(const v of sorted){
    if((v.effectiveFrom||'') <= dateStr) applicable = v;
    else break;
  }
  return applicable;
}

/* ---------- multi-client app data ---------- */
// --- IndexedDB-backed storage (replaces localStorage for anything large) ---
// localStorage caps out around 5–10MB per site in most browsers, and a
// full quota doesn't just fail quietly — it can block things far more
// basic than saving, like signing in (the Supabase SDK's own tiny
// session token failed to write once this app's own data had already
// used up the quota). IndexedDB has no such small fixed ceiling —
// practically it scales with available disk space, hundreds of MB to
// several GB — so both this app's own data and Supabase's own session
// storage move here instead. Every function below fails gracefully
// (returns null / false rather than throwing) so a browser without
// IndexedDB support, or one blocking it (some private-browsing modes),
// degrades instead of breaking the app outright.
const IDB_NAME = 'softbook_storage_v1';
const IDB_STORE = 'kv';
let idbOpenPromise = null;
function openIdb(){
  if(idbOpenPromise) return idbOpenPromise;
  idbOpenPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB not available in this browser')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return idbOpenPromise;
}
async function idbGet(key){
  try{
    const db = await openIdb();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = ()=> resolve(req.result===undefined ? null : req.result);
      req.onerror = ()=> reject(req.error);
    });
  }catch(e){ console.error('idbGet failed:', e.message||e); return null; }
}
async function idbSet(key, value){
  if(key === APP_STORAGE_KEY && typeof isViewOnly === 'function' && isViewOnly()) return true; // viewers never save books
  try{
    const db = await openIdb();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    return true;
  }catch(e){ console.error('idbSet failed:', e.message||e); return false; }
}
async function idbDelete(key){
  try{
    const db = await openIdb();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
    return true;
  }catch(e){ console.error('idbDelete failed:', e.message||e); return false; }
}
// Supabase's client accepts any storage object with these three methods
// (sync or Promise-returning — it's built to support async backends like
// React Native's AsyncStorage) — so the SDK's own session token moves
// off localStorage's small quota onto the same IndexedDB store.
const idbAuthStorageAdapter = {
  getItem: (key)=> idbGet(key),
  setItem: (key, value)=> idbSet(key, value),
  removeItem: (key)=> idbDelete(key),
};

const APP_STORAGE_KEY = 'ishema_multi_client_v1';
const LEGACY_STORAGE_KEY = 'ishema_ledger_v1';

function newClientState(name, tin){

function loadApp(){

  // right after boot, an async IndexedDB check runs and adopts the real
  // data if it's different (see the boot section below), and for
  // cloud-synced users the pull from Supabase supersedes this anyway.
  try{
    const raw = localStorage.getItem(APP_STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const clients = {};
      Object.keys(parsed.clients||{}).forEach(id=>{ clients[id] = normalizeClient(parsed.clients[id]); });
      let clientOrder = Array.isArray(parsed.clientOrder) ? parsed.clientOrder.filter(id=>clients[id]) : Object.keys(clients);
      if(clientOrder.length===0){

        clients[id] = newClientState('Your Company Ltd','');
        clientOrder = [id];
      }

// A single fresh, empty workspace — used for the initial "nothing saved
// yet" case above, and reused anywhere else the app needs to reset back
// to a genuinely clean slate (signing out, or seeding a brand-new team
// that's never synced before) rather than risk carrying over whatever
// happens to still be sitting in memory from a previous session.
function defaultAppData(){
  const id = uid();
  return {clients:{[id]: newClientState('Your Company Ltd','')}, clientOrder:[id], activeClientId:id};
}

// Defensive check for whatever comes in from a cloud pull — a partial or
// interrupted save elsewhere (this app's own, or any other client of the
// same data) could in principle leave clientOrder referencing a client
// that no longer exists in clients, or activeClientId pointing at
// nothing. Rather than let that crash the app the moment something tries
// to read state.settings off an undefined client, this repairs it to a
// safe, valid selection — falling back to a fresh default only if
// nothing usable is left at all.
function ensureValidActiveClient(data){
  data.clientOrder = (data.clientOrder||[]).filter(id=>data.clients && data.clients[id]);
  if(data.clientOrder.length===0){
    const fresh = defaultAppData();
    data.clients = fresh.clients;
    data.clientOrder = fresh.clientOrder;
    data.activeClientId = fresh.activeClientId;
  } else if(!data.clients[data.activeClientId]){
    data.activeClientId = data.clientOrder[0];
  }
  return data;
}

/* ---- cloud-sync safety: a pull may NEVER overwrite changes that have not reached the cloud yet ----
   (this is what made posted bank transactions "come back": the app re-downloaded an older copy
   from the cloud after the user had posted, replacing the posted state with the old one) */
let cloudReady = false;      // true once the first pull/seed of this session has finished
let localDirty = false;      // there are local changes not yet confirmed saved in the cloud
let saveSeq = 0;             // bumps on every local save
let pushInFlight = 0;        // pushes currently travelling to the cloud
let lastSyncedStamp = '';    // newest cloud timestamp this browser has pushed or pulled
async function waitForPushes(){
  for(let i=0; i<100 && (pushInFlight>0); i++) await new Promise(r=>setTimeout(r,100));
}
/* ---- durable "unsaved changes" marker — survives a reload or a closed tab, unlike the
   in-memory localDirty flag above. This is what closes the actual gap behind transactions
   "coming back": localDirty/cloudReady reset to false on every fresh page load, so without
   this, a reload right after a failed push had nothing to stop the next pull from quietly
   trusting the (older) cloud copy over the newer, unsent local one. ---- */
const PENDING_KEY = APP_STORAGE_KEY + '__pending';
function markPending(){ try{ idbSet(PENDING_KEY, '1'); }catch(e){} }
function clearPending(){ try{ idbSet(PENDING_KEY, '0'); }catch(e){} }
async function hasPending(){ try{ return (await idbGet(PENDING_KEY)) === '1'; }catch(e){ return false; } }
/* ---- durable "which account/team last synced real data on this device" marker. A cloud
   query that comes back with no row is NOT reliable proof a team/account is brand new — it
   can also happen from a transient database hiccup (timeout, brief instability) that returns
   an empty result instead of throwing. Treating "no row" as "definitely new" is what caused a
   real team's data to be silently replaced with a blank default and pushed over the real
   cloud copy during exactly this kind of hiccup. This marker lets that check tell the two
   cases apart: if we've synced this exact identity successfully before AND the local copy
   still looks like real data, a missing cloud row is treated as suspicious, not as proof of
   a fresh start. ---- */
const LAST_SYNCED_ID_KEY = APP_STORAGE_KEY + '__lastSyncedId';
function noteLastSyncedId(id){ try{ idbSet(LAST_SYNCED_ID_KEY, String(id)); }catch(e){} }
async function getLastSyncedId(){ try{ return await idbGet(LAST_SYNCED_ID_KEY); }catch(e){ return null; } }
function looksLikeRealData(data){
  try{
    const clients = data && data.clients ? Object.values(data.clients) : [];
    if(!clients.length) return false;
    return clients.some(c => (c.gl&&c.gl.length) || (c.bills&&c.bills.length) || (c.invoices&&c.invoices.length) ||
      (c.customers&&c.customers.length) || (c.payroll&&c.payroll.length) || (c.settings&&c.settings.company&&c.settings.company.name && c.settings.company.name !== 'Your Company Ltd'));
  }catch(e){ return false; }
}
let syncLastError = '';
function noteSyncError(e){ try{ syncLastError = ((e && (e.message||e.details)) || String(e)) + (e && e.code ? ' [' + e.code + ']' : ''); }catch(_){ syncLastError = 'unknown error'; } }

}

async function deleteActiveClient(){

  if(!confirm(`Delete "${state.settings.company.name}" and ALL of its data? This cannot be undone.`)) return;

  appData.clientOrder = appData.clientOrder.filter(cid=>cid!==id);

  // 700ms, and a deletion is exactly the kind of change that must never
  // be lost to a page reload or tab close in that window. Pushing

  // delete durable, not just locally-applied-and-hoped-for.
  idbSet(APP_STORAGE_KEY, JSON.stringify(appData)).then(ok=>{ localStorageFull = !ok; });

  if(authUser) pushedOk = await pushToCloudAuth(true);
  else if(syncConfig.enabled) pushedOk = await pushToCloud(true);

function updateSyncBadge(){

async function pullFromCloud(silent){
  const client = getSupabaseClient();
  if(!client || !syncConfig.syncKey) return false;
  syncStatus = 'syncing'; updateSyncBadge();
  try{
    await waitForPushes();
    // Unsent local changes always win over an older cloud copy: send them instead of replacing them.
    // The durable check (hasPending) covers the very first pull after a fresh page load/reopen —
    // cloudReady/localDirty are just in-memory flags and both start false again on every boot, so
    // without also consulting the durable marker, a reload right after a failed push would sail
    // straight past this guard and silently adopt the older cloud copy.
    if(cloudReady && localDirty){ return await pushToCloud(true); }
    if(!cloudReady && await hasPending()){ return await pushToCloud(true); }
    const {data, error} = await client.from(SYNC_TABLE).select('data,updated_at').eq('sync_key', syncConfig.syncKey).maybeSingle();
    if(error) throw error;
    // The cloud copy is not newer than what this browser already has: nothing to adopt.
    if(cloudReady && data && data.updated_at && lastSyncedStamp && String(data.updated_at) <= lastSyncedStamp){ syncStatus = 'synced'; updateSyncBadge(); return true; }
    if(data && data.data && data.data.clients){
      const clients = {};
      Object.keys(data.data.clients).forEach(id=>{ clients[id] = normalizeClient(data.data.clients[id]); });
      let clientOrder = Array.isArray(data.data.clientOrder) ? data.data.clientOrder.filter(id=>clients[id]) : Object.keys(clients);
      if(clientOrder.length===0){ const id=uid(); clients[id]=newClientState('Your Company Ltd',''); clientOrder=[id]; }
      const activeClientId = clients[data.data.activeClientId] ? data.data.activeClientId : clientOrder[0];
      appData = ensureValidActiveClient({clients, clientOrder, activeClientId});
      state = appData.clients[appData.activeClientId];
      idbSet(APP_STORAGE_KEY, JSON.stringify(appData)).then(ok=>{ localStorageFull = !ok; });
      cloudReady = true; localDirty = false; if(data.updated_at) lastSyncedStamp = String(data.updated_at);
      noteLastSyncedId(syncConfig.syncKey);
      syncStatus = 'synced'; updateSyncBadge();
      if(!silent) renderAll();
      return true;
    } else {
      // A missing cloud row usually means a sync key with no existing data yet — but it can
      // ALSO mean a transient database hiccup returned an empty result instead of a real
      // error. Only treat this as "genuinely new" when there's no evidence otherwise: if this
      // exact sync key already has real-looking data synced on this device before, refuse to
      // silently replace it with a blank default and push over whatever's really in the cloud.
      const lastId = await getLastSyncedId();
      if(lastId === syncConfig.syncKey && looksLikeRealData(appData)){
        console.error('Cloud pull found no row for a sync key that previously had real data — refusing to overwrite with a blank default.');
        noteSyncError('Could not find your existing data in the cloud just now. To protect your work, nothing was changed or overwritten. Please check your connection and try again shortly.');
        syncStatus = 'error'; updateSyncBadge();
        return false;
      }
      appData = defaultAppData();
      state = appData.clients[appData.activeClientId];
      cloudReady = true;
      await pushToCloud(true);
      noteLastSyncedId(syncConfig.syncKey);
      if(!silent) renderAll();
      return true;
    }
  }catch(e){
    console.error('Cloud pull failed:', e.message||e); noteSyncError(e);
    syncStatus = 'error'; updateSyncBadge();
    return false;
  }
}

function pushToCloud(immediate){
  const client = getSupabaseClient();
  if(!client || !syncConfig.syncKey) return Promise.resolve(true);
  markPending();
  clearTimeout(pushTimer);
  const attempt = async ()=>{
    const seq = saveSeq, stamp = new Date().toISOString();
    pushInFlight++;
    try{
      const {error} = await client.from(SYNC_TABLE).upsert(
        {sync_key: syncConfig.syncKey, data: appData, updated_at: stamp},
        {onConflict: 'sync_key'}
      );
      if(error) throw error;
      lastSyncedStamp = stamp;
      if(seq === saveSeq){ localDirty = false; clearPending(); } // nothing newer was saved while this was in flight
      noteLastSyncedId(syncConfig.syncKey);
    } finally { pushInFlight--; }
  };
  const doPush = async ()=>{
    syncStatus = 'syncing'; updateSyncBadge();
    try{
      await attempt();
      syncStatus = 'synced'; updateSyncBadge();
      return true;
    }catch(e){
      console.error('Cloud push failed, retrying once:', e.message||e); noteSyncError(e);
      // A single automatic retry after a short pause covers the common
      // case — a brief network blip — without needing the caller to know
      // or care that a retry happened; a caller checking the result only
      // ever needs to react to a genuine, persistent failure.
      await new Promise(r=>setTimeout(r, 1500));
      try{
        await attempt();
        syncStatus = 'synced'; updateSyncBadge();
        return true;
      }catch(e2){
        console.error('Cloud push failed after retry:', e2.message||e2); noteSyncError(e2);
        syncStatus = 'error'; updateSyncBadge();
        return false;
      }
    }
  };
  if(immediate){ return doPush(); }
  pushTimer = setTimeout(doPush, 700);
  return Promise.resolve(true);
}

/* ============================================================
   EMAIL AUTH (Supabase Auth) — optional, richer alternative to
   the shared Sync Key. Uses the same Supabase project connection
   (syncConfig.url/anonKey) but scopes data per signed-in user via
   a separate table + row-level security, instead of a passphrase.
   ============================================================ */
const SYNC_TABLE_AUTH = 'ishema_user_data';
let authUser = null;
let authScreenForced = false;
let authScreenDismissed = false;

/* ------------------------------------------------------------
   TEAM WORKSPACES — lets several people, each with their own
   email/password login, share one set of books. A "team" is a
   row in ishema_teams with a short invite code; ishema_team_members
   maps auth users to teams; ishema_team_data holds the shared
   appData JSON, scoped by team_id via RLS (see setup SQL).
   Falls back to the private per-user table above when someone
   chooses not to set up / join a workspace.
   ------------------------------------------------------------ */
const SYNC_TABLE_TEAMS = 'ishema_teams';
const SYNC_TABLE_TEAM_MEMBERS = 'ishema_team_members';
const SYNC_TABLE_TEAM_DATA = 'ishema_team_data';
let authTeam = null; // {id, name, joinCode}
// Role inside the shared workspace: 'editor' (full access) or 'viewer' (view only).
// The owner is the person who created the workspace. Viewers are blocked in the
// app AND by the database (see softbook_view_only_roles.sql).
let authRole = 'editor';
let authIsOwner = false;
let inviteCodesCache = null;
let inviteCodesLoading = false;
function isViewOnly(){ return !!(authUser && authTeam && authRole === 'viewer'); }
let teamMembersCache = null;
let teamMembersLoading = false;

function genJoinCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<8;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
// There used to be a persistTeamCache()/loadTeamCache() pair here, caching
// the signed-in team to localStorage as an "offline-ish" fallback. It's
// been removed entirely: that cache was never scoped to a particular
// user, so if identifying who was actually signed in ever failed, it
// could hand back a completely different customer's team. Removed
// rather than fixed, since there's no real need for this app to keep
// working with a team identity it can't currently verify — asking the
// user to retry is safe; guessing isn't.

async function resolveMyTeam(){
  const client = getSupabaseClient();
  if(!client || !authUser){ authTeam = null; return false; }
  try{
    let {data: mem, error} = await client.from(SYNC_TABLE_TEAM_MEMBERS).select('team_id,role').eq('user_id', authUser.id).limit(1).maybeSingle();
    if(error && /role/i.test(error.message||'')){
      // the view-only-roles SQL update has not been run yet — behave as before (everyone is an editor)
      ({data: mem, error} = await client.from(SYNC_TABLE_TEAM_MEMBERS).select('team_id').eq('user_id', authUser.id).limit(1).maybeSingle());
    }
    if(error) throw error;
    if(!mem){ authTeam = null; authRole = 'editor'; authIsOwner = false; return false; }
    const {data: team, error: tErr} = await client.from(SYNC_TABLE_TEAMS).select('id,name,join_code,created_by,subscription_status,paid_until,plan,paid_client_slots').eq('id', mem.team_id).maybeSingle();
    if(tErr) throw tErr;
    authTeam = team ? {id: team.id, name: team.name, joinCode: team.join_code, createdBy: team.created_by, subscriptionStatus: team.subscription_status, paidUntil: team.paid_until, plan: team.plan, paidClientSlots: team.paid_client_slots} : null;
    authIsOwner = !!(team && team.created_by === authUser.id);
    authRole = (authIsOwner || !mem.role || mem.role !== 'viewer') ? 'editor' : 'viewer';
    inviteCodesCache = null;
    teamMembersCache = null;
    paymentHistoryCache = null;
    
    if(authTeam){
      client.rpc('touch_team_member_last_seen', {p_team_id: authTeam.id})
        .then(({error: touchErr})=>{ if(touchErr) console.error('last-seen update failed:', touchErr.message||touchErr); });
    }
    return !!authTeam;
  }catch(e){
    console.error('resolveMyTeam failed:', e.message||e);
    // No safe fallback here — the old version of this fell back to
    // whatever team was last cached in this browser, but that cache
    // isn't scoped to any particular user. If checking who you actually
    // are hits an error, the only safe response is "no team," never a
    // guess — a guess here risks showing one customer's data to a
    // completely different person. Better to force a retry than to ever
    // get this wrong.
    authTeam = null;
    return false;
  }
}

async function createTeam(name){
  const client = getSupabaseClient();
  if(!client || !authUser) return {ok:false, msg:'Sign in first.'};
  try{
    // No free trial — a new workspace is unpaid until the first payment clears.
    const {data, error} = await client.from(SYNC_TABLE_TEAMS)
      .insert({name: name || 'My Workspace', join_code: genJoinCode(), created_by: authUser.id, subscription_status: 'unpaid', paid_until: null, plan: null})
      .select().single();
    if(error) throw error;
    const {error: memErr} = await client.from(SYNC_TABLE_TEAM_MEMBERS)
      .insert({team_id: data.id, user_id: authUser.id, email: authUser.email});
    if(memErr) throw memErr;
    authTeam = {id: data.id, name: data.name, joinCode: data.join_code, createdBy: authUser.id, subscriptionStatus: data.subscription_status, paidUntil: data.paid_until, plan: data.plan, paidClientSlots: data.paid_client_slots};
    authRole = 'editor'; authIsOwner = true; inviteCodesCache = null;
    teamMembersCache = null;
    paymentHistoryCache = null;
    // A genuinely new workspace must start empty — never seeded from
    // whatever happens to still be in memory, which could be leftover
    // data from a completely different workspace used earlier in this
    // same browser session. Same fix as the two related bugs already
    // found in the automatic pull path; this is the explicit "Create
    // Workspace" path, which had the identical mistake.
    appData = defaultAppData();
    state = appData.clients[appData.activeClientId];
    await pushToCloudAuth(true); // seed the shared row with this fresh, empty default
    return {ok:true};
  }catch(e){ return {ok:false, msg: e.message || 'Could not create the workspace.'}; }
}

async function joinTeamByCode(code){
  const client = getSupabaseClient();
  if(!client || !authUser) return {ok:false, msg:'Sign in first.'};
  try{
    // The database decides the role from WHICH code was used: the owner's
    // view-only code gives view-only access, the editor code gives full access.
    const {data: joined, error: jErr} = await client.rpc('join_team_with_code', {p_code: String(code||'').trim()});
    if(jErr){
      if(/could not find the function|schema cache/i.test(jErr.message||'')) return {ok:false, msg:'This workspace has not been updated for invite codes yet. Ask the administrator to run the "view-only roles" SQL update in Supabase.'};
      throw jErr;
    }
    const {data: team, error} = await client.from(SYNC_TABLE_TEAMS)
      .select('id,name,join_code,created_by,subscription_status,paid_until,plan,paid_client_slots').eq('id', joined.team_id).maybeSingle();
    if(error) throw error;
    if(!team) return {ok:false, msg:'No workspace found with that invite code.'};
    authTeam = {id: team.id, name: team.name, joinCode: team.join_code, createdBy: team.created_by, subscriptionStatus: team.subscription_status, paidUntil: team.paid_until, plan: team.plan, paidClientSlots: team.paid_client_slots};
    authIsOwner = team.created_by === authUser.id;
    authRole = (joined.role === 'viewer' && !authIsOwner) ? 'viewer' : 'editor';
    inviteCodesCache = null;
    teamMembersCache = null;
    paymentHistoryCache = null;
    await pullFromCloudAuth(true); // adopt the workspace's existing books
    return {ok:true};
  }catch(e){ return {ok:false, msg: e.message || 'Could not join that workspace.'}; }
}

   company workspace), billing does not apply.

   Payment method: MTN Mobile Money "Request to Pay" — the customer
   types their MoMo phone number, we ask MTN to push a payment prompt
   to their phone, they approve it on their device, and we poll for

function isSubscriptionActive(){
  if(!BILLING_ENABLED) return true; // billing is switched off entirely for now
  if(!authTeam) return true; // not part of a billed workspace
  const status = authTeam.subscriptionStatus;
  if(status !== 'active') return false;
  if(!authTeam.paidUntil) return false;
  return new Date(authTeam.paidUntil) > new Date();
}

function daysLeftInSubscription(){
  if(!authTeam || !authTeam.paidUntil) return null;
  return Math.ceil((new Date(authTeam.paidUntil) - new Date()) / 86400000);

// Is this specific nav tab available on the workspace's current plan?
// Unrelated to payment status — call isSubscriptionActive() for that.
function tabAllowedByPlan(tabId){
  if(!BILLING_ENABLED) return true; // billing is switched off entirely for now
  if(!authTeam) return true; // solo accounts aren't plan-restricted
  const plan = PLANS[authTeam.plan];
  if(!plan || !plan.tabs) return true; // no plan yet, or Full — nothing restricted
  return plan.tabs.includes(tabId);
}

// With 3 tiers now, a locked tab shouldn't always point at the most
// expensive plan — someone on Bookkeeping trying to reach Inventory only
// needs the middle tier, not All Access. Returns [planKey, planObject]
// for the lowest-priced plan that actually includes this tab.
function cheapestPlanForTab(tabId){
  const candidates = Object.entries(PLANS).filter(([k,p])=> !p.tabs || p.tabs.includes(tabId));
  candidates.sort((a,b)=> a[1].price - b[1].price);
  return candidates[0] || ['full', PLANS.full];
}

// Normalizes a locally-typed Rwandan number (07XXXXXXXX or +2507XXXXXXXX)
// to the 2507XXXXXXXX form. Optional in the code-based flow (nice for
// your own records) — not required the way it was for the automatic
// MTN API push, since payment itself happens outside the app now.
function normalizeRwandaMsisdn(raw){
  let digits = String(raw||'').replace(/[^0-9]/g, '');
  if(digits.startsWith('0')) digits = '250' + digits.slice(1);
  if(digits.startsWith('7')) digits = '250' + digits; // in case they omitted the leading 0
  return digits;
}

let momoPollTimer = null;
let pendingNewClientName = null; // set while an extra-client payment is in progress
let pendingNewClientTin = null;

// Reads an Edge Function response safely: a crashed function often returns
// plain text / HTML, which made resp.json() throw and looked like "no network".
async function readFunctionResponse(resp){
  const text = await resp.text();
  try{ return JSON.parse(text); }
  catch(e){ return {ok:false, msg:`Payment server error (HTTP ${resp.status}): ${String(text||resp.statusText||'no details').slice(0,160)}`}; }
}
function paymentNetworkErrorText(e){
  const m = String(e && e.message || e || '');
  return `Could not reach the payment server (${m||'network error'}). Check your internet connection; if it keeps happening, the "momo-create-code" function in Supabase → Edge Functions may be down.`;
}

function pollMomoPayment(referenceId, statusBox){
  const client = getSupabaseClient();
  clearInterval(momoPollTimer);
  let attempts = 0;
  const maxAttempts = 360; // ~30 minutes at 5s intervals — manual approval isn't instant like an API push
  momoPollTimer = setInterval(async ()=>{
    attempts++;
    try{
      const {data: sess} = await client.auth.getSession();
      const token = sess && sess.session ? sess.session.access_token : null;
      const resp = await fetch(`${syncConfig.url}/functions/v1/momo-verify`, {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'Authorization': `Bearer ${token}`, 'apikey': syncConfig.anonKey},
        body: JSON.stringify({reference_id: referenceId})
      });
      const result = await resp.json();
      if(result && result.ok && result.status === 'SUCCESSFUL'){
        clearInterval(momoPollTimer);

        if(result.payment_type === 'extra_client'){
          authTeam.paidClientSlots = result.paid_client_slots;
          
          if(statusBox) statusBox.innerHTML = `<p style="font-size:12px;color:#8fd6b0;font-weight:600;">Payment confirmed — you can now add "${esc(pendingNewClientName||'your new company')}".</p>`;
          const nameToAdd = pendingNewClientName, tinToAdd = pendingNewClientTin;
          pendingNewClientName = null; pendingNewClientTin = null;
          if(nameToAdd) setTimeout(()=> addClient(nameToAdd, tinToAdd||''), 1200);
          return;
        }

        authTeam.subscriptionStatus = result.subscription_status;
        authTeam.paidUntil = result.paid_until;
        authTeam.plan = result.plan;
        
        paymentHistoryCache = null; // force a refresh next time Billing renders
        const receiptPayment = {code: result.code, plan: authTeam.plan, amount: result.amount, created_at: result.created_at, approved_at: result.approved_at};
        if(statusBox){
          statusBox.innerHTML = `<p style="font-size:13px;color:var(--ledger-green-dk);font-weight:600;">Payment confirmed — "${esc(authTeam.name)}" is active until ${new Date(result.paid_until).toLocaleDateString()}.</p>`;
          const receiptBtn = document.createElement('button');
          receiptBtn.className = 'btn btn-ghost btn-sm';
          receiptBtn.textContent = 'View Receipt';
          receiptBtn.style.marginTop = '6px';
          receiptBtn.onclick = ()=> showReceipt(receiptPayment);
          statusBox.appendChild(receiptBtn);
        }
        setTimeout(renderAll, 2500);
        return;
      }
      if(result && result.status === 'FAILED'){
        clearInterval(momoPollTimer);
        if(statusBox) statusBox.innerHTML = `<p style="font-size:13px;color:var(--ink-red);">This payment was marked as not completed. Try again with a new code.</p>`;
        return;
      }
    }catch(e){ console.error('pollMomoPayment failed:', e.message||e); }
    if(attempts >= maxAttempts){
      clearInterval(momoPollTimer);
      if(statusBox) statusBox.insertAdjacentHTML('beforeend', `<p style="font-size:12.5px;color:var(--text-soft);margin-top:6px;">Still pending after a while — this page will stop auto-checking, but reloading Settings → Billing will show the latest status once it's approved.</p>`);
    }
  }, 5000);
}

// Opens a separate browser window/tab for the receipt so printing it
// isn't blocked by the app's own window.print() subscription guard —
// you should always be able to print a receipt for a payment you already
// made, even if a later period has since lapsed.
function showReceipt(payment){
  const planLabel = PLANS[payment.plan] ? PLANS[payment.plan].label : payment.plan;
  const paidDate = payment.approved_at ? new Date(payment.approved_at) : new Date(payment.created_at);
  // Payer TIN: a workspace can manage several client companies, each with
  // its own TIN, and there's no separate "workspace TIN" field — so this
  // shows whichever company is currently active. That's usually the
  // right one in practice, but worth knowing it reflects "right now,"
  // not necessarily whichever company was active at the moment this
  // payment was actually made, if that's since changed.
  const payerCompany = state.settings.company.name || '';
  const payerTin = state.settings.company.tin || '';
  const monthName = paidDate.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  const description = `${monthName} Software Subscription`;
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receipt — ${esc(payment.code)}</title>
    <style>
      @page{ margin:12mm; }
      body{font-family:'IBM Plex Sans',-apple-system,sans-serif;background:#F7F4EC;color:#241F16;margin:0;padding:40px;}
      .receipt{max-width:640px;margin:0 auto;background:#fff;border:1px solid #D8D2C4;border-radius:8px;padding:48px;}
      h1{font-size:26px;margin:0 0 6px;}
      .sub{font-size:15px;color:#6B6455;margin:0 0 30px;}
      .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #EFEADC;font-size:17px;}
      .row:last-of-type{border-bottom:none;}
      .label{color:#6B6455;}
      .stamp{display:inline-block;margin-top:22px;padding:9px 20px;background:rgba(47,107,79,0.12);color:#234F3A;font-weight:700;font-size:15px;border-radius:4px;letter-spacing:0.5px;}
      button{margin-top:28px;width:100%;padding:12px;background:#234F3A;color:#fff;border:none;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;}
      @media print{ button{display:none;} body{background:#fff;padding:0;} .receipt{border:none;max-width:100%;width:78%;margin:0 auto;padding:0;} }
    </style></head><body>
    <div class="receipt">
      <h1>SoftBook Accounting</h1>
      <p class="sub">Payment Receipt</p>
      <div class="row"><span class="label">Workspace</span><span>${esc(authTeam ? authTeam.name : '')}</span></div>
      ${payerCompany ? `<div class="row"><span class="label">Company</span><span>${esc(payerCompany)}</span></div>` : ''}
      ${payerTin ? `<div class="row"><span class="label">TIN</span><span>${esc(payerTin)}</span></div>` : ''}
      <div class="row"><span class="label">Description</span><span>${esc(description)}</span></div>
      <div class="row"><span class="label">Plan</span><span>${esc(planLabel)}</span></div>
      <div class="row"><span class="label">Amount</span><span>${Number(payment.amount).toLocaleString()} RWF</span></div>
      <div class="row"><span class="label">Reference Code</span><span>${esc(payment.code)}</span></div>
      <div class="row"><span class="label">Date Paid</span><span>${paidDate.toLocaleString()}</span></div>
      <div class="stamp">PAID</div>
      <button onclick="window.print()">Print / Save as PDF</button>
    </div>
  </body></html>`;
  const win = window.open('', '_blank');
  if(!win){ alert('Your browser blocked the receipt popup — allow popups for this site and try again.'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
}



async function pullFromCloudAuth(silent){
  const client = getSupabaseClient();
  if(!client || !authUser) return false;
  const table = authTeam ? SYNC_TABLE_TEAM_DATA : SYNC_TABLE_AUTH;
  const keyCol = authTeam ? 'team_id' : 'user_id';
  const keyVal = authTeam ? authTeam.id : authUser.id;
  syncStatus = 'syncing'; updateSyncBadge();
  try{
    await waitForPushes();
    // Unsent local changes always win over an older cloud copy: send them instead of replacing them.
    // See the matching comment in pullFromCloud() above — the durable marker is what makes this
    // guard survive a reload, not just an in-session pull triggered mid-use.
    if(cloudReady && localDirty && !isViewOnly()){ return await pushToCloudAuth(true); }
    if(!cloudReady && !isViewOnly() && await hasPending()){ return await pushToCloudAuth(true); }
    const {data, error} = await client.from(table).select('data,updated_at').eq(keyCol, keyVal).maybeSingle();
    if(error) throw error;
    // The cloud copy is not newer than what this browser already has: nothing to adopt.
    if(cloudReady && data && data.updated_at && lastSyncedStamp && String(data.updated_at) <= lastSyncedStamp){ syncStatus = 'synced'; updateSyncBadge(); return true; }
    if(data && data.data && data.data.clients){
      const clients = {};
      Object.keys(data.data.clients).forEach(id=>{ clients[id] = normalizeClient(data.data.clients[id]); });
      let clientOrder = Array.isArray(data.data.clientOrder) ? data.data.clientOrder.filter(id=>clients[id]) : Object.keys(clients);
      if(clientOrder.length===0){ const id=uid(); clients[id]=newClientState('Your Company Ltd',''); clientOrder=[id]; }
      const activeClientId = clients[data.data.activeClientId] ? data.data.activeClientId : clientOrder[0];
      appData = ensureValidActiveClient({clients, clientOrder, activeClientId});
      state = appData.clients[appData.activeClientId];
      idbSet(APP_STORAGE_KEY, JSON.stringify(appData)).then(ok=>{ localStorageFull = !ok; });
      cloudReady = true; localDirty = false; if(data.updated_at) lastSyncedStamp = String(data.updated_at);
      noteLastSyncedId(keyVal);
      syncStatus = 'synced'; updateSyncBadge();
      if(!silent) renderAll();
      return true;
    } else {
      // No cloud row can mean a genuinely new team — or it can mean a transient database
      // hiccup returned an empty result instead of a real error (exactly what happened during
      // an earlier outage, which silently replaced a month-old team's real data with a blank
      // default). Only treat this as "genuinely new" when there's no evidence otherwise: if
      // this exact team/user id already had real-looking data synced successfully on this
      // device before, refuse to overwrite it with a blank default.
      const lastId = await getLastSyncedId();
      if(lastId === keyVal && looksLikeRealData(appData)){
        console.error('Cloud pull found no row for a team/user that previously had real data — refusing to overwrite with a blank default.');
        noteSyncError('Could not find your existing data in the cloud just now. To protect your work, nothing was changed or overwritten. Please check your connection and try again shortly.');
        syncStatus = 'error'; updateSyncBadge();
        return false;
      }
      // Otherwise this really does look like a fresh team/browser combination — reset to a
      // clean, single default company before seeding it, rather than pushing up whatever
      // happens to already be sitting in memory. That "current local data" could be leftover
      // from a previous session on this same browser (a different team entirely) — pushing it
      // here would seed a brand-new workspace with another workspace's companies, a real
      // cross-tenant leak. A genuinely brand-new team should always start from a blank slate,
      // never from ambient state left behind by whoever used this browser before.
      appData = defaultAppData();
      state = appData.clients[appData.activeClientId];
      cloudReady = true;
      await pushToCloudAuth(true);
      noteLastSyncedId(keyVal);
      if(!silent) renderAll();
      return true;
    }
  }catch(e){
    console.error('Auth cloud pull failed:', e.message||e); noteSyncError(e);
    syncStatus = 'error'; updateSyncBadge();
    return false;
  }
}

function pushToCloudAuth(immediate){
  const client = getSupabaseClient();
  if(!client || !authUser) return Promise.resolve(true);
  if(isViewOnly()) return Promise.resolve(true); // viewers never write
  markPending();
  clearTimeout(pushAuthTimer);
  const attempt = async ()=>{
    const seq = saveSeq, stamp = new Date().toISOString();
    const row = authTeam
      ? {team_id: authTeam.id, data: appData, updated_at: stamp, updated_by: authUser.email}
      : {user_id: authUser.id, data: appData, updated_at: stamp};
    pushInFlight++;
    let upErr;
    try{
      const res = await client.from(authTeam ? SYNC_TABLE_TEAM_DATA : SYNC_TABLE_AUTH).upsert(
        row, {onConflict: authTeam ? 'team_id' : 'user_id'}
      );
      upErr = res.error;
    } finally { pushInFlight--; }
    const error = upErr;
    if(error) throw error;
    lastSyncedStamp = stamp;
    if(seq === saveSeq){ localDirty = false; clearPending(); } // nothing newer was saved while this was in flight
    noteLastSyncedId(authTeam ? authTeam.id : authUser.id);
    if(authTeam){
      // keep a lightweight index of company name+TIN per workspace, so the
      // owner console can list "which company, which TIN" without reading
      // every workspace's full ledger JSON. Goes through a narrow RPC
      // (not a raw table update) so this is the only column a member can
      // touch on ishema_teams — subscription fields stay server-only.
      const clientsSummary = appData.clientOrder.map(id=>({
        id, name: appData.clients[id].settings.company.name || '', tin: appData.clients[id].settings.company.tin || ''
      }));
      client.rpc('update_team_clients_summary', {p_team_id: authTeam.id, p_summary: clientsSummary})
        .then(({error: idxErr})=>{ if(idxErr) console.error('team index update failed:', idxErr.message||idxErr); });
    }
  };
  const doPush = async ()=>{
    syncStatus = 'syncing'; updateSyncBadge();
    try{
      await attempt();
      syncStatus = 'synced'; updateSyncBadge();
      return true;
    }catch(e){
      console.error('Auth cloud push failed, retrying once:', e.message||e); noteSyncError(e);
      // A single automatic retry after a short pause covers the common
      // case — a brief network blip — without needing the caller to know
      // or care that a retry happened; a caller checking the result only
      // ever needs to react to a genuine, persistent failure.
      await new Promise(r=>setTimeout(r, 1500));
      try{
        await attempt();
        syncStatus = 'synced'; updateSyncBadge();
        return true;
      }catch(e2){
        console.error('Auth cloud push failed after retry:', e2.message||e2); noteSyncError(e2);
        syncStatus = 'error'; updateSyncBadge();
        return false;
      }
    }
  };
  if(immediate){ return doPush(); }
  pushAuthTimer = setTimeout(doPush, 700);
  return Promise.resolve(true);
}

async function doSignIn(email, password){
  const client = getSupabaseClient();
  if(!client){ authError = 'Connect to Supabase first.'; renderAuthScreen(); return; }
  authError = '';
  try{
    const {data, error} = await client.auth.signInWithPassword({email, password});
    if(error) throw error;
    authUser = data.user;
    authScreenForced = false;
    authScreenDismissed = false;
    syncConfig.authMode = true;
    saveSyncConfig();
    await resolveMyTeam();
    await pullFromCloudAuth(true);
    renderAll();
  }catch(e){
    authError = e.message || 'Sign in failed.';
    renderAuthScreen();
  }
}

async function doSignUp(email, password){
  const client = getSupabaseClient();
  if(!client){ authError = 'Connect to Supabase first.'; renderAuthScreen(); return; }
  authError = '';
  try{
    const {data, error} = await client.auth.signUp({email, password});
    if(error) throw error;
    if(data.user && !data.session){
      authError = 'Account created. Check your email to confirm it, then sign in.';
      authFormMode = 'signin';
      renderAuthScreen();
      return;
    }
    authUser = data.user;
    authScreenForced = false;
    authScreenDismissed = false;
    syncConfig.authMode = true;
    saveSyncConfig();
    await resolveMyTeam(); // a fresh signup has no team yet unless invited separately
    // No push here — a fresh signup has nothing worth saving yet, and
    // pushing at this point would write whatever's currently in memory
    // (possibly leftover from a previous session on this browser) into
    // this user's cloud slot before they've even set up a workspace. The
    // subsequent Create/Join Workspace step is what correctly seeds or
    // loads their real data.
    renderAll();
  }catch(e){
    authError = e.message || 'Sign up failed.';
    renderAuthScreen();
  }
}

async function doSignOut(){
  if(authUser){
    // flush any pending debounced changes before we lose the session
    await pushToCloudAuth(true);
  }
  const client = getSupabaseClient();
  if(client && client.auth && client.auth.signOut) await client.auth.signOut();
  authUser = null;
  authTeam = null;
  cloudReady = false; localDirty = false; lastSyncedStamp = '';
  teamMembersCache = null;
  paymentHistoryCache = null;
  
  // Critical: reset the actual company data too, not just the session —
  // otherwise whoever signs in next (a genuinely different person, on
  // this same browser) would see the previous user's client companies
  // still sitting in memory until their own data happened to load over
  // it. Worse, if THEIR workspace has never synced before, the seeding
  // logic would push this leftover data into their cloud row as their
  // own — a real cross-tenant leak, not just a display glitch.
  appData = defaultAppData();
  state = appData.clients[appData.activeClientId];
  idbSet(APP_STORAGE_KEY, JSON.stringify(appData)).then(ok=>{ localStorageFull = !ok; });
  renderAll();
}

async function initAuth(){
  const client = getSupabaseClient();
  if(!client || !client.auth) return;
  try{
    const {data} = await client.auth.getSession();
    if(data && data.session){
      authUser = data.session.user;
      syncConfig.authMode = true; saveSyncConfig();
      await resolveMyTeam();
      await pullFromCloudAuth(true);
      renderAll();
    }
  }catch(e){ console.error('initAuth failed:', e.message||e); }
  try{
    client.auth.onAuthStateChange((event, session)=>{
      const prevUserId = authUser ? authUser.id : null;
      authUser = session ? session.user : null;
      // Supabase fires this listener on every auth event — including
      // periodic background token refreshes (TOKEN_REFRESHED) that happen
      // automatically every so often, and also when the tab regains focus
      // — not just genuine sign-in/sign-out. Previously this pulled fresh
      // data from the cloud and re-rendered the whole app on ANY of those
      // events, which meant a routine token refresh a few seconds into
      // using the app could silently overwrite an in-progress client
      // switch or an unsaved form with whatever was last saved to the
      // cloud. Only react to an actual sign-in or sign-out; a token
      // refresh just needs authUser kept current, nothing more.
      if(event === 'SIGNED_IN'){
        // The browser also reports SIGNED_IN every time the tab regains focus. That is NOT a new
        // sign-in: re-downloading the cloud copy then could replace the books on screen with an
        // older copy (posted bank transactions reappeared this way). Only a genuinely different /
        // first sign-in reloads from the cloud.
        if(cloudReady && session && prevUserId === session.user.id) return;
        resolveMyTeam().then(()=>pullFromCloudAuth(true)).then(()=>renderAll());
      } else if(event === 'SIGNED_OUT'){
        authTeam=null; cloudReady=false; localDirty=false; lastSyncedStamp=''; renderAll();
      }
    });
  }catch(e){ /* mock/older clients may not implement this */ }
}
